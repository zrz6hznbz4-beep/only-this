    if (res.problems && res.problems.length) {
      return { bad: true, text: "ServiceM8 refused part of it — " + res.problems.join("; ") };
    }
    if (res.added > 0) {
      return {
        text: res.added + (res.added === 1 ? " new thing" : " new things") +
          " to look at, waiting on the plan.",
        // Held back on purpose — worth saying, or it looks like things went missing.
        why: res.held > 0
          ? res.held + " more are waiting their turn. Only a few arrive at a time so a " +
            "big ServiceM8 list cannot bury your plan — the rest come with the next checks."
          : null,
      };
    }
    if (res.waiting > 0) {
      return { text: "Nothing new. " + res.waiting +
        (res.waiting === 1 ? " offer is" : " offers are") + " already waiting on the plan." };
    }
    if (res.found > 0) {
      return { text: "Found " + res.found + ", but you have already seen " +
        (res.found === 1 ? "it" : "them all") + ". Nothing gets offered twice." };
    }
    return {
      text: "Connected fine, nothing to offer.",
      why: sm8WhyNothing(res.report),
      // Actual records, so you can hold them up against ServiceM8 rather than take
      // my word for what it says.
      rows: sm8Sample(res.report),
    };
  }

  /* Ask ServiceM8 the same question several ways and show what each returns.

     For when the app's account of itself has stopped being believable. It is the
     honest way to hand the raw data to somebody helping: the counts and records come
     back, the API key stays on the server and is never part of the reply. */
  function sm8RunProbe() {
    if (!syncCode || sm8Probing) return;
    sm8Probing = true; sm8Probe = null; sm8ProbeCopied = false; render();
    fetch(SM8_ENDPOINT, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ code: syncCode, action: "probe" }),
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        sm8Probing = false;
        if (!res || !res.ok) { sm8Error = (res && res.error) || "Could not read ServiceM8."; }
        else sm8Probe = res.probe;
        render();
      })
      .catch(function () {
        sm8Probing = false;
        sm8Error = "Could not reach the server.";
        render();
      });
  }

  function sm8ProbeText() {
    if (!sm8Probe) return "";
    return "ServiceM8 probe — " + sm8Probe.takenAt + "\n\n" + JSON.stringify(sm8Probe, null, 2);
  }

  function sm8CopyProbe() {
    copyToClipboard(sm8ProbeText(), function () {
      sm8ProbeCopied = true;
      render();
      setTimeout(function () { sm8ProbeCopied = false; render(); }, 3000);
    });
  }

  /* What it can actually see. If these names match your list in ServiceM8 but the
     owner is wrong, the reading is wrong; if the names are unfamiliar, it is looking
     at a different set of tasks than the one you are. Either way you know which. */
  function sm8Sample(report) {
    var sample = report && report.tasks && report.tasks.sample;
    if (!sample || !sample.length) return null;
    return sample.map(function (s) { return s.title + " — " + s.owner; });
  }

  /* Nothing found is the answer that needs the most explaining, because it has several
     causes that look identical from outside. The run reports where things dropped out;
     this turns that into the one sentence that tells you what to change. */
  function sm8WhyNothing(report) {
    var t = report && report.tasks;
    // A number from an older or half-deployed server may simply not be there. Saying
    // "undefined open" would undermine the one thing this text exists to do.
    function num(v) { return typeof v === "number" && isFinite(v) ? v : null; }

    if (t && typeof t === "object" && num(t.kept) !== null) {
      var kept = num(t.kept);        // open tasks of mine, straight from ServiceM8
      var open = num(t.open);        // open tasks belonging to anybody — only looked up on a miss
      var owners = Array.isArray(t.byOwner) ? t.byOwner : [];
      var staffCount = num(t.staffCount);

      /* The query was refused, so this fell back to reading everything it could — which
         on a big account is a slice rather than the lot. Say so, because an answer from
         a partial read should not be trusted the way a filtered one can be. */
      var caveat = t.filterRejected
        ? " ServiceM8 would not accept the narrowed query, so this read what it could and " +
          "the answer may be incomplete."
        : "";

      if (kept > 0) {
        return kept + (kept === 1 ? " open task is" : " open tasks are") + " yours, but " +
          (kept === 1 ? "it was" : "they were") + " last changed more than two days ago." + caveat;
      }

      if (open === 0) {
        return "Nothing is open in ServiceM8 at the moment — not for you, and not for " +
          "anybody else either." + caveat;
      }

      if (open !== null) {
        /* The saved UUID is not a staff member at all. Worth its own sentence, because
           no amount of reassigning work in ServiceM8 would ever make it match. */
        if (!t.you && staffCount) {
          return open + " open " + (open === 1 ? "task" : "tasks") + " in ServiceM8, none " +
            "assigned to you — and the staff member saved here is not in ServiceM8's list " +
            "of " + staffCount + " people at all. Pick yourself again in step 2." + caveat;
        }
        var s = open + " open " + (open === 1 ? "task" : "tasks") + " in ServiceM8, none " +
          "assigned to you.";
        if (t.you) s += " You are set as " + t.you + ".";
        if (owners.length) {
          s += " They belong to " +
            listWords(owners.map(function (o) { return o.name + " (" + o.count + ")"; })) + ".";
        }
        return s + caveat;
      }

      return "Nothing of yours is open in ServiceM8 right now." + caveat;
    }

    var n = report && report.notes;
    if (n && n.noNames) return "Notes are being watched, but no names have been set to look for.";
    return "Only things changed in ServiceM8 in the last two days count.";
  }

  // "Dave", "Dave and Sam", "Dave, Sam and Jo"
  function listWords(items) {
    if (!items || !items.length) return "";   // an empty list is nothing, not " and undefined"
    if (items.length === 1) return items[0];
    return items.slice(0, -1).join(", ") + " and " + items[items.length - 1];
  }

  function sm8CheckNow() {
    if (!syncCode || sm8Checking) return;
    sm8Checking = true; sm8RunNote = null; sm8Error = null; render();
    fetch(SM8_ENDPOINT, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ code: syncCode, action: "run" }),
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        sm8Checking = false;
        sm8RunNote = sm8RunResult(res);
        if (res && res.hasKey !== undefined) sm8Status = res;
        render();
        // Pull the queue straight away, so anything found is on the plan by the time
        // you close the menu rather than up to a minute later.
        if (res && res.added > 0) fetchInbox();
      })
      .catch(function () {
        sm8Checking = false;
        sm8RunNote = { bad: true, text: "Could not reach the server. Check you are online." };
        render();
      });
  }

  // ---- Suggestions from ServiceM8 ----
  // Nothing is ever added to your list without being offered first, and offers only
  // appear on the plan — never over the top of a focus card. Anything that arrives
  // while you are working simply waits.
  var INBOX_ENDPOINT = "/api/inbox";

  function fetchInbox() {
    // Whether offers happen at all is decided on the server, per sync code. If nothing
    // is set up there, this simply comes back empty — no second switch needed here.
    if (!syncCode) return;
    if (inboxBusy) return;
    inboxBusy = true;
    fetch(INBOX_ENDPOINT + "?code=" + encodeURIComponent(syncCode))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        inboxBusy = false;
        if (!data || !Array.isArray(data.pending)) return;
        var before = inboxPending.length;
        inboxPending = data.pending;
        // Only redraw if something actually changed, and never mid-focus.
        if (inboxPending.length !== before && view === "plan" && !isTypingNow()) render();
      })
      .catch(function () { inboxBusy = false; });
  }

  function currentSuggestion() {
    return inboxPending.length ? inboxPending[0] : null;
  }

  function resolveSuggestion(id) {
    inboxPending = inboxPending.filter(function (s) { return s.id !== id; });
    suggestPriority = 3;
    suggestSkipped = {};
    if (!syncCode) return;
    fetch(INBOX_ENDPOINT, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ code: syncCode, id: id }),
    }).catch(function () {});
  }

  function acceptSuggestion() {
    var s = currentSuggestion();
    if (!s) return;
    var steps = (s.subtasks || []).filter(function (_, i) { return !suggestSkipped[i]; });
    var t = {
      id: uid(),
      text: s.title,
      priority: suggestPriority,
      date: todayStr(),
      status: "pending",
      snoozedUntil: null,
      order: nextOrder(),
      quick: false,
      repeat: null,
      // The link back to the job goes in the notes, so it is one tap away later.
      notes: [s.context, s.url].filter(Boolean).join("\n"),
      subtasks: steps.map(function (text) {
        return { id: uid(), text: text, priority: 3, quick: false, status: "pending" };
      }),
      fromSource: s.source || null,
    };
    tasks.push(t);
    resolveSuggestion(s.id);
    save();
    render();
  }

  function dismissSuggestion() {
    var s = currentSuggestion();
    if (s) resolveSuggestion(s.id);
    render();
  }

  function renderSuggestion() {
    var s = currentSuggestion();
    if (!s || planDate !== todayStr()) return "";

    var steps = s.subtasks || [];
    var more = inboxPending.length - 1;

    return '<div class="suggest">' +
      '<div class="suggest-head">' +
      '<span class="suggest-kind">' + escapeHtml(s.kindLabel || "From ServiceM8") + '</span>' +
      (more > 0 ? '<span class="suggest-more">' + more + ' more waiting</span>' : '') +
      '</div>' +
      '<div class="suggest-title">' + escapeHtml(s.title) + '</div>' +
      (s.context ? '<div class="suggest-context">' + escapeHtml(s.context) + '</div>' : '') +
      (steps.length
        ? '<div class="suggest-steps"><div class="suggest-steps-label">Suggested steps</div>' +
          steps.map(function (text, i) {
            var on = !suggestSkipped[i];
            return '<button class="suggest-step" data-action="toggle-suggest-step" data-p="' + i + '">' +
              '<span class="ss-box' + (on ? ' on' : '') + '">' + (on ? '✓' : '') + '</span>' +
              '<span class="ss-text' + (on ? '' : ' off') + '">' + escapeHtml(text) + '</span></button>';
          }).join('') + '</div>'
        : '') +
      '<div class="suggest-priority"><span class="priority-label">Priority</span>' +
      [1, 2, 3, 4, 5].map(function (p) {
        var active = suggestPriority === p;
        var style = active ? ('background:' + PRIORITY_COLORS[p] + ';border-color:' + PRIORITY_COLORS[p]) : '';
        return '<button class="p-dot ' + (active ? 'active' : '') + '" style="' + style +
          '" data-action="set-suggest-priority" data-p="' + p + '">' + p + '</button>';
      }).join('') + '</div>' +
      '<div class="action-pair">' +
      '<button class="btn-set-wide" data-action="accept-suggestion">Add to my list</button>' +
      '<button class="btn-secondary" data-action="dismiss-suggestion">No thanks</button>' +
      '</div>' +
      '</div>';
  }

  // ---- Notifications ----
  // Preferences are per device rather than per profile: one phone, one set of alerts.
  function defaultPush() {
    return {
      enabled: false,
      lists: "both",
      types: { morning: true, unplanned: false, quick: false, evening: true, endofday: false, weekly: false, snoozed: false, holding: true },
    };
  }
  function loadPush() {
    var base = defaultPush();
    try {
      var raw = localStorage.getItem(PUSH_KEY);
      if (!raw) return base;
      var saved = JSON.parse(raw) || {};
      if (typeof saved.enabled === "boolean") base.enabled = saved.enabled;
      if (["work", "personal", "both"].indexOf(saved.lists) !== -1) base.lists = saved.lists;
      if (saved.types) {
        NOTIFY_TYPES.forEach(function (t) {
          if (typeof saved.types[t.id] === "boolean") base.types[t.id] = saved.types[t.id];
        });
      }
      return base;
    } catch (e) { return base; }
  }
  function savePush() {
    try { localStorage.setItem(PUSH_KEY, JSON.stringify(push)); } catch (e) {}
  }

  function pushSupported() {
    try {
      return !!(window.navigator && navigator.serviceWorker && window.PushManager && window.Notification);
    } catch (e) { return false; }
  }
  // iOS only allows web push once the app has been added to the Home Screen.
  function isIOS() {
    try { return /iPad|iPhone|iPod/.test(navigator.userAgent || ""); } catch (e) { return false; }
  }
  function isStandalone() {
    try {
      if (navigator.standalone) return true;
      return !!(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    } catch (e) { return false; }
  }
  function pushBlockedReason() {
    if (!pushSupported()) return "unsupported";
    if (isIOS() && !isStandalone()) return "needs-install";
    if (!syncCode) return "needs-sync";
    try { if (Notification.permission === "denied") return "denied"; } catch (e) {}
    return null;
  }

  function urlBase64ToUint8Array(base64String) {
    var padding = "=".repeat((4 - (base64String.length % 4)) % 4);
    var base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
    var raw = atob(base64);
    var out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  function timezone() {
    try { return Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; } catch (e) { return "UTC"; }
  }

  // Send the current preferences up so the scheduled sender knows what to do.
  function syncPushPrefs() {
    if (!pushSub) return Promise.resolve();
    return fetch(PUSH_ENDPOINT, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        subscription: pushSub,
        code: syncCode,
        tz: timezone(),
        prefs: { lists: push.lists, types: push.types, holdDays: holdThreshold() },
      }),
    }).catch(function () {});
  }

  function enableNotifications() {
    var reason = pushBlockedReason();
    if (reason) { pushError = reason; render(); return; }
    pushBusy = true; pushError = null; render();

    Notification.requestPermission().then(function (permission) {
      if (permission !== "granted") throw new Error("denied");
      return navigator.serviceWorker.register("/sw.js");
    }).then(function (reg) {
      return navigator.serviceWorker.ready.then(function () { return reg; });
    }).then(function (reg) {
      return fetch(PUSH_ENDPOINT).then(function (r) { return r.json(); }).then(function (data) {
        if (!data.publicKey) throw new Error("no key");
        return reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(data.publicKey),
        });
      });
    }).then(function (sub) {
      pushSub = sub.toJSON ? sub.toJSON() : sub;
      push.enabled = true;
      savePush();
      pushBusy = false;
      return syncPushPrefs();
    }).then(function () {
      render();
    }).catch(function (err) {
      pushBusy = false;
      pushError = (err && err.message === "denied") ? "denied" : "failed";
      render();
    });
  }

  function disableNotifications() {
    push.enabled = false;
    savePush();
    var endpoint = pushSub && pushSub.endpoint;
    pushSub = null;
    render();
    try {
      navigator.serviceWorker.ready.then(function (reg) {
        return reg.pushManager.getSubscription();
      }).then(function (sub) { if (sub) return sub.unsubscribe(); }).catch(function () {});
    } catch (e) {}
    if (endpoint) {
      fetch(PUSH_ENDPOINT, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ action: "unsubscribe", endpoint: endpoint }),
      }).catch(function () {});
    }
  }

  function toggleNotifyType(id) {
    push.types[id] = !push.types[id];
    savePush();
    syncPushPrefs();
    render();
  }
  function setNotifyLists(which) {
    push.lists = which;
    savePush();
    syncPushPrefs();
    render();
  }

  // On load, pick up an existing subscription so the menu shows the true state.
  function restorePushSubscription() {
    if (!push.enabled || !pushSupported()) return;
    try {
      navigator.serviceWorker.register("/sw.js").then(function () {
        return navigator.serviceWorker.ready;
      }).then(function (reg) {
        return reg.pushManager.getSubscription();
      }).then(function (sub) {
        if (!sub) { push.enabled = false; savePush(); render(); return; }
        pushSub = sub.toJSON ? sub.toJSON() : sub;
        syncPushPrefs(); // refresh timezone and sync code in case either changed
      }).catch(function () {});
    } catch (e) {}
  }

  function applyTheme() {
    var name = settings.theme || "original";
    try {
      document.documentElement.setAttribute("data-theme", name);
    } catch (e) {}
    try {
      // Keep the phone's status bar in step with the theme.
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta && THEME_BG[name]) meta.setAttribute("content", THEME_BG[name]);
    } catch (e) {}
  }
  function randomMidPriority() {
    var opts = [2, 3, 4];
    return opts[Math.floor(Math.random() * opts.length)];
  }
  // Tasks now carry an explicit `order` so "send to the back of the list" means something.
  // Older saved tasks predate it, so backfill from array position on load.
  function migrateTasks(list) {
    return (list || []).map(function (t, i) {
      if (typeof t.order !== "number") needsMigrationSave = true;
      var o = typeof t.order === "number" ? t.order : (i + 1);
      return Object.assign({}, t, { order: o });
    });
  }
  function load() {
    try {
      var raw = localStorage.getItem(storageKey());
      if (!raw) return { tasks: [], completions: [], people: [], deleted: [] };
      var parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) {
        // legacy format: plain task array, no completions log yet — derive one from completed tasks
        var comps = parsed
          .filter(function (t) { return t.status === "done" && t.completedAt; })
          .map(function (t) { return { id: uid(), text: t.text, ts: t.completedAt }; });
        return { tasks: migrateTasks(parsed), completions: comps, people: [], deleted: [] };
      }
      return {
        tasks: migrateTasks(parsed.tasks),
        completions: parsed.completions || [],
        people: parsed.people || [],
        deleted: parsed.deleted || [],
      };
    } catch (e) {
      return { tasks: [], completions: [], people: [], deleted: [] };
    }
  }
  function nextOrder() {
    var max = 0;
    tasks.forEach(function (t) { if (typeof t.order === "number" && t.order > max) max = t.order; });
    return max + 1;
  }
  /* Every task carries the moment it last changed, because that is what lets two people
     share a list without overwriting each other.

     The stamping happens here rather than at each place a task is edited. There are
     dozens of those, they are added to all the time, and one forgotten call would mean
     an edit that silently loses to somebody else's older copy — a bug that shows up as
     "I'm sure I did that" a week later. So instead: remember what each task looked like
     when it was last stamped, and stamp anything that no longer matches. It cannot be
     forgotten, because nothing is saved without going through here. */
  var taskPrints = {};

  function fingerprint(t) {
    var keys = Object.keys(t).sort();
    var out = "";
    for (var i = 0; i < keys.length; i++) {
      if (keys[i] === "updatedAt") continue;   // or it would never settle
      out += keys[i] + "=" + JSON.stringify(t[keys[i]]) + ";";
    }
    return out;
  }

  // After loading or receiving a list, note how things look without touching the times.
  function seedPrints() {
    taskPrints = {};
    for (var i = 0; i < tasks.length; i++) taskPrints[tasks[i].id] = fingerprint(tasks[i]);
  }

  function stampChanges() {
    var now = Date.now();
    for (var i = 0; i < tasks.length; i++) {
      var t = tasks[i];
      var print = fingerprint(t);
      if (taskPrints[t.id] !== print || !t.updatedAt) {
        t.updatedAt = now;
        taskPrints[t.id] = print;
      }
    }
  }

  function save() {
    stampChanges();
    try {
      localStorage.setItem(storageKey(), JSON.stringify({
        tasks: tasks, completions: completions, people: people, deleted: deleted,
      }));
    } catch (e) {}
    scheduleSyncPush();
  }
  /* `by` is only ever set on the team list, where two people share the log and "who
     did that one" is a real question. Everywhere else it stays undefined and nothing
     about the record changes. */
  function recordCompletion(text, type, parentText, by) {
    completions.push({
      id: uid(), text: text, ts: Date.now(), type: type || "task",
      parentText: parentText || null, by: by || null,
    });
  }

  // ---- Cross-device sync ----
  var EMPTY_LIST = { tasks: [], completions: [], people: [], deleted: [] };
  /* The Team list is a third list, switched on when it is wanted and absent until
     then. It syncs with your own devices under your own code exactly like the other
     two — what it does not have is a code of its own to hand round, because it was
     never meant to leave the device it is used on. */
  var PROFILES = ["work", "personal", "team"];
  var TEAM_KEY = "onlyThisTeamList";
  function teamListOn() {
    try { return localStorage.getItem(TEAM_KEY) === "1"; } catch (e) { return false; }
  }
  function setTeamListOn(on) {
    try {
      if (on) localStorage.setItem(TEAM_KEY, "1");
      else localStorage.removeItem(TEAM_KEY);
    } catch (e) {}
  }
  function profileName(p) {
    return p === "work" ? "Work" : p === "personal" ? "Personal" : "Team";
  }

  function rawList(p) {
    try { return JSON.parse(localStorage.getItem("onlyThisTasks_" + p) || "null") || EMPTY_LIST; }
    catch (e) { return EMPTY_LIST; }
  }
  function writeList(p, data) {
    try { localStorage.setItem("onlyThisTasks_" + p, JSON.stringify(data || EMPTY_LIST)); } catch (e) {}
  }

  // Only the profiles that are NOT shared. This is what goes to your own code.
  function collectSyncPayload() {
    var out = { updatedAt: Date.now() };
    PROFILES.forEach(function (p) {
      out[p] = rawList(p);
    });
    return out;
  }
  function refreshFromStorage() {
    var fresh = load();
    tasks = fresh.tasks;
    completions = fresh.completions;
    people = fresh.people;
    deleted = fresh.deleted;
    /* Note how everything looks WITHOUT restamping it. Marking the whole list as
       changed on arrival would make this device's copy beat everyone else's on the
       next push, which is exactly the overwriting the merge exists to prevent. */
    seedPrints();
    // Synced data can be a day or more stale — bring it forward before it hits the screen.
    rolloverOverdue();
  }

  function applySyncPayload(data) {
    if (!data) return;
    // Only touch the profiles this payload actually carries; a shared one is not in here.
    PROFILES.forEach(function (p) {
      if (data[p]) writeList(p, data[p]);
    });
    try { localStorage.setItem("onlyThisLastSyncedAt", String(data.updatedAt || Date.now())); } catch (e) {}
    refreshFromStorage();
  }

  function markLocalChanged() {
    try { localStorage.setItem("onlyThisLocalChangedAt", String(Date.now())); } catch (e) {}
  }
  function localChangedSinceSync() {
    var lastSynced = Number(localStorage.getItem("onlyThisLastSyncedAt") || 0);
    var lastChanged = Number(localStorage.getItem("onlyThisLocalChangedAt") || 0);
    return lastChanged > lastSynced;
  }
  // Every render replaces the whole DOM, which throws away the field you are typing in —
  // on a phone that closes the keyboard. Anything triggered by a timer or the network
  // must therefore hold off while a text field has focus.
  var TEXT_INPUT_IDS = ["taskInput", "notesTextarea", "subtaskInput", "syncCodeInput", "focusAddInput", "importBox", "exportBox", "holdInput", "sm8Key", "sm8Names", "sm8ProbeBox", "personInput"];
  function isTypingNow() {
    try {
      var a = document.activeElement;
      return !!(a && a.id && TEXT_INPUT_IDS.indexOf(a.id) !== -1);

    render();
  }

  // Back onto the list, dated today and at the back of its priority.
  function releaseTask(id) {
    tasks = tasks.map(function (t) {
      return t.id === id
        ? Object.assign({}, t, {
            heldSince: null, chaseOn: null, wasChased: null,
            date: todayStr(), order: nextOrder(),
          })
        : t;
    });
    save(); render();
  }

  // Commit the completion and tell the next render to pop the counter.
  function finishCompletion(id) {
    bumpCompleted = true;
    completeTaskFromList(id);
    setTimeout(function () { bumpCompleted = false; }, 800);
  }

  // Tapping the circle: the check pops and sparks, the row strikes through and fades,
  // and a ghost of the task swoops down into the Completed drawer as the count ticks up.
  function completeWithFlourish(id, row) {
    if (celebrating) return; // already mid-animation, ignore the double tap
    var task = tasks.find(function (t) { return t.id === id; });
    if (!celebrateRow(row) || prefersReducedMotion()) { finishCompletion(id); return; }
    celebrating = id;
    var flew = flyToCompleted(row, task ? task.text : "");
    setTimeout(function () { if (row.classList) row.classList.add("leaving"); }, 150);
    setTimeout(function () {
      celebrating = null;
      finishCompletion(id);
    }, flew ? 560 : 430);
  }

  // ---- Subtasks ----
  function pendingSubtasks(task) {
    return (task.subtasks || []).filter(function (s) { return s.status !== "done"; });
  }
  function enterSubtaskMode() {
    var parent = tasks.find(function (t) { return t.id === currentTaskId; });
    if (!parent) return;
    var pending = pendingSubtasks(parent);
    var picked = pickByPriority(pending);
    if (!picked) return;
    currentSubtaskId = picked.id;
    inSubtaskMode = true;
    subtaskJustDone = false;
    render();
  }
  function backToMainTask() {
    inSubtaskMode = false;
    currentSubtaskId = null;
    subtaskJustDone = false;
    render();
  }
  function subtaskDone() {
    var parent = tasks.find(function (t) { return t.id === currentTaskId; });
    if (!parent) return;
    var sub = (parent.subtasks || []).find(function (s) { return s.id === currentSubtaskId; });
    if (sub) recordCompletion(sub.text, "step", parent.text);
    tasks = tasks.map(function (t) {
      if (t.id !== parent.id) return t;
      var newSubs = (t.subtasks || []).map(function (s) { return s.id === currentSubtaskId ? Object.assign({}, s, { status: "done" }) : s; });
      return Object.assign({}, t, { subtasks: newSubs });
    });
    subtaskJustDone = true;
    save(); render();
  }
  function nextSubtask() {
    var parent = tasks.find(function (t) { return t.id === currentTaskId; });
    if (!parent) { backToMainTask(); return; }
    var pending = pendingSubtasks(parent);
    var picked = pickByPriority(pending);
    if (!picked) { backToMainTask(); return; }
    currentSubtaskId = picked.id;
    subtaskJustDone = false;
    render();
  }
  function markParentDoneFromSubtasks() {
    markDone();
  }
  function addSubtask() {
    var parent = tasks.find(function (t) { return t.id === notesTaskId; });
    if (!parent) return;
    var text = (draftSubtaskText || "").trim();
    if (!text) return;
    var newSub = { id: uid(), text: text, priority: draftSubtaskPriority, quick: draftSubtaskQuick, status: "pending" };
    tasks = tasks.map(function (t) { return t.id === parent.id ? Object.assign({}, t, { subtasks: (t.subtasks || []).concat([newSub]) }) : t; });
    draftSubtaskText = "";
    draftSubtaskQuick = false;
    refocusSubtask = true; // keep the keyboard up so you can add several in a row
    save(); render();
  }
  function toggleSubtaskStatus(parentId, subId) {
    tasks = tasks.map(function (t) {
      if (t.id !== parentId) return t;
      var newSubs = (t.subtasks || []).map(function (s) {
        if (s.id !== subId) return s;
        var nowDone = s.status !== "done";
        if (nowDone) recordCompletion(s.text, "step", t.text);
        return Object.assign({}, s, { status: nowDone ? "done" : "pending" });
      });
      return Object.assign({}, t, { subtasks: newSubs });
    });
    save(); render();
  }
  function changeSubtaskPriority(parentId, subId, p) {
    tasks = tasks.map(function (t) {
      if (t.id !== parentId) return t;
      var newSubs = (t.subtasks || []).map(function (s) { return s.id === subId ? Object.assign({}, s, { priority: p }) : s; });
      return Object.assign({}, t, { subtasks: newSubs });
    });
    save(); render();
  }
  function toggleSubtaskQuick(parentId, subId) {
    tasks = tasks.map(function (t) {
      if (t.id !== parentId) return t;
      var newSubs = (t.subtasks || []).map(function (s) { return s.id === subId ? Object.assign({}, s, { quick: !s.quick }) : s; });
      return Object.assign({}, t, { subtasks: newSubs });
    });
    save(); render();
  }
  function removeSubtask(parentId, subId) {
    tasks = tasks.map(function (t) {
      if (t.id !== parentId) return t;
      return Object.assign({}, t, { subtasks: (t.subtasks || []).filter(function (s) { return s.id !== subId; }) });
    });
    save(); render();
  }
  function cycleDraftSubtaskPriority(p) { draftSubtaskPriority = p; render(); }
  function toggleDraftSubtaskQuick() { draftSubtaskQuick = !draftSubtaskQuick; render(); }

  function openSnooze() {
    var cur = tasks.find(function (t) { return t.id === currentTaskId; });
    if (!cur) return;
    snoozePriority = cur.priority;
    snoozeExhausted = false;
    snoozeOpen = true;
    render();
  }
  function closeSnooze() { snoozeOpen = false; snoozeExhausted = false; render(); }

  // Time-based snooze: hide the task until a chosen moment.
  function confirmSnoozeAt(ts) {
    if (!ts || isNaN(ts)) return;
    tasks = tasks.map(function (t) {
      return t.id === currentTaskId
        ? Object.assign({}, t, { priority: snoozePriority, snoozedUntil: ts, date: dateStrOf(ts) })
        : t;
    });
    focusFront = focusFront.filter(function (id) { return id !== currentTaskId; });
    currentTaskId = null;
    snoozeOpen = false;
    snoozeExhausted = false;
    save(); render();
  }

  // "Not now" sends the task to the back of a priority list rather than hiding it for a while.
  // If nothing else sits at the chosen priority, it drops down a level so you don't just see it
  // again immediately. If there is genuinely nothing else due, we offer to end focus instead.
  function backOfQueueTarget(cur, wantedP) {
    var others = eligibleTasks().filter(function (t) { return t.id !== cur.id; });
    if (others.length === 0) return null;
    var p = Math.min(5, Math.max(1, wantedP));
    while (p < 5 && !others.some(function (t) { return t.priority === p; })) p++;
    return p;
  }
  function confirmSnooze() {
    var cur = tasks.find(function (t) { return t.id === currentTaskId; });
    if (!cur) { snoozeOpen = false; render(); return; }
    var target = backOfQueueTarget(cur, snoozePriority);
    if (target === null) {
      // Last one standing — nothing to fall behind.
      snoozeExhausted = true;
      render();
      return;
    }
    var backOrder = nextOrder();
    tasks = tasks.map(function (t) {
      return t.id === cur.id
        ? Object.assign({}, t, { priority: target, order: backOrder, snoozedUntil: null })
        : t;
    });
    // Remember it was pushed away, so a later reshuffle doesn't drag it back to the middle.
    focusFront = focusFront.filter(function (id) { return id !== cur.id; });
    if (focusSnoozed.indexOf(cur.id) === -1) focusSnoozed.push(cur.id);
    currentTaskId = null;
    snoozeOpen = false;
    snoozeExhausted = false;
    save(); render();
  }

  function enterQuick() {
    var pool = quickEligibleTasks();
    quickQueue = pool.map(function (t) { return t.id; }).sort(function () { return Math.random() - 0.5; });
    view = "quick"; render();
  }
  function quickDone() {
    var id = quickQueue[0];
    var cur = tasks.find(function (t) { return t.id === id; });
    if (cur) recordCompletion(cur.text);
    tasks = tasks.map(function (t) { return t.id === id ? Object.assign({}, t, { status: "done" }) : t; });
    quickQueue = quickQueue.slice(1);
    save(); render();
  }
  function quickSkip() {
    if (quickQueue.length > 1) quickQueue = quickQueue.slice(1).concat([quickQueue[0]]);
    render();
  }

  function enterDailies() {
    var pool = dailyEligibleTasks();
    dailyQueue = pool.map(function (t) { return t.id; }).sort(function () { return Math.random() - 0.5; });
    view = "dailies"; render();
  }
  function dailyDone() {
    var id = dailyQueue[0];
    var cur = tasks.find(function (t) { return t.id === id; });
    if (cur) {
      recordCompletion(cur.text);
      var nextDate = addDaysStr(cur.repeat === "daily" ? 1 : 7);
      tasks = tasks.map(function (t) {
        return t.id === cur.id
          ? Object.assign({}, t, { date: nextDate, priority: randomMidPriority(), snoozedUntil: null, status: "pending" })
          : t;
      });
    }
    dailyQueue = dailyQueue.slice(1);
    save(); render();
  }
  function dailySkip() {
    if (dailyQueue.length > 1) dailyQueue = dailyQueue.slice(1).concat([dailyQueue[0]]);
    render();
  }

  function backToPlan() {
    view = "plan";
    render();
    fetchInbox(); // anything that arrived while you were working shows up now
  }

  function openNotes(id) {
    notesTaskId = id;
    draftSubtaskText = "";
    draftSubtaskPriority = 3;
    draftSubtaskQuick = false;
    render();
  }
  function closeNotes() {
    notesTaskId = null;
    flushPendingSyncPush();
    render();
  }

  // ---- Render: pieces ----
  function greeting() {
    var h = new Date().getHours();
    if (h < ROLLOVER_HOUR) return "Still up";
    if (h < 5) return "Early start";
    if (h < 12) return "Good morning";
    if (h < 18) return "Good afternoon";
    return "Good evening";
  }

  // A line that actually tells you something, rather than restating the rules.
  function planSubtitle() {
    var today = todayStr();
    if (planDate !== today) {
      var ahead = tasks.filter(function (t) { return t.date === planDate && t.status !== "done"; }).length;
      var when = fmtDate(planDate).toLowerCase();
      if (ahead === 0) return "Nothing lined up for " + when + " yet.";
      return ahead + (ahead === 1 ? " task" : " tasks") + " lined up for " + when + ".";
    }

    var left = eligibleTasks().length;
    var done = completedOnDate(today).length;
    var carried = rolledOverToday().length;
    var hello = greeting();

    var waiting = settings.holds ? heldTasks().length : 0;
    var waitNote = waiting ? " " + waiting + " on hold." : "";

    /* On a shared list the counts are about you, so say so — "9 to go" meaning nine of
       yours out of thirty on the board is a different fact and worth not confusing.
       Work nobody has claimed is named separately, because it belongs to no count and
       would otherwise be invisible until somebody went looking. */
    /* On the team board the interesting numbers are per person and what nobody has
       taken — "9 to go" says nothing about whether one of them is buried. */
    if (sharing()) {
      var spare = unassignedTasks().length;
      var spareNote = spare ? " " + spare + " for anyone." : "";
      var each = pair().map(function (p) {
        return firstNameOf(p.name) + " " + tasksFor(p.id).length;
      }).join(", ");
      if (left === 0 && done === 0) return hello + ". Nothing on the board yet." + spareNote;
      if (left === 0) return hello + ". Board clear — " + done + " done today." + waitNote;
      return hello + ". " + each + "." + spareNote + waitNote;
    }

    // Held work is mentioned wherever there is any, so "all clear" is never a lie.
    if (left === 0 && done === 0) return hello + ". Nothing planned yet." + waitNote;
    if (left === 0) return hello + ". All clear — " + done + " done today." + waitNote;
    if (done === 0 && carried > 0) return hello + ". " + carried + " carried over, " + left + " to go." + waitNote;
    if (done === 0) return hello + ". " + left + (left === 1 ? " task to go." : " tasks to go.") + waitNote;
    return hello + ". " + done + " done, " + left + " to go." + waitNote;
  }

  function focusSubtitle() {
    if (sharing()) return "One each. Tap a card to see its notes.";
    return "One task. Nothing else on screen.";
  }

  function renderHeader() {
    var subtitle = view === "plan" ? planSubtitle()
      : view === "focus" ? focusSubtitle()
      : view === "quick" ? "A quick sweep through the small stuff."
      : view === "dailies" ? "Knocking out the repeats."
      : "Where yesterday left off.";

    // Equal-width slots either side keep the title optically centred.
    return '<header class="header">' +
      '<div class="header-slot left"></div>' +
      '<div class="header-center"><div class="logo">Only This</div><div class="subtitle">' + subtitle + '</div></div>' +
      '<div class="header-slot right">' +
      '<button class="burger" data-action="open-menu" aria-label="Menu"><span></span><span></span><span></span></button>' +
      '</div>' +
      '</header>';
  }

  function priorityDots(selected, actionName, idAttr) {
    var out = '<div class="priority-picker">';
    for (var p = 1; p <= 5; p++) {
      var active = selected === p;
      var style = active ? ('background:' + PRIORITY_COLORS[p] + ';border-color:' + PRIORITY_COLORS[p]) : '';
      out += '<button class="p-dot ' + (active ? 'active' : '') + '" style="' + style + '" data-action="' + actionName + '" ' + (idAttr ? 'data-id="' + idAttr + '" ' : '') + 'data-p="' + p + '">' + p + '</button>';
    }
    out += '</div>';
    return out;
  }

  function hasNotesOrSubs(t) {
    return (t.notes && t.notes.trim()) || (t.subtasks && t.subtasks.length > 0);
  }
  function stepsTag(t) {
    var pending = (t.subtasks || []).filter(function (s) { return s.status !== "done"; }).length;
    return pending > 0 ? '<span class="steps-tag">' + pending + (pending === 1 ? ' step' : ' steps') + '</span>' : '';
  }

  function checkBtn(t) {
    if (!settings.completeFromPlan) return '';
    return '<button class="task-check" data-action="complete-task" data-id="' + t.id + '" title="Mark done">○</button>';
  }

  function snoozedTag(t) {
    return (t.snoozedUntil && t.snoozedUntil > Date.now())
      ? '<span class="snoozed-tag">⏰ ' + fmtWhen(t.snoozedUntil) + '</span>' : '';
  }

  /* Who has this one. Unassigned work gets a visibly empty chip rather than nothing at
     all — on a shared list "nobody has picked this up" is a state worth seeing, not an
     absence to overlook. */
  function assigneeChip(t) {
    if (!sharing()) return '';
    var p = personById(t.assignee);
    return '<button class="who-chip' + (p ? ' has' : ' none') + '" ' +
      'data-action="open-assign" data-id="' + t.id + '" ' +
      'title="' + (p ? escapeHtml(p.name) : "Nobody yet") + '" ' +
      'aria-label="' + (p ? 'Assigned to ' + escapeHtml(p.name) : 'Not assigned') + '">' +
      (p ? escapeHtml(initialsOf(p.name)) : '+') + '</button>';
  }

  function renderAssignSheet() {
    if (!assignFor) return '';
    var t = tasks.filter(function (x) { return x.id === assignFor; })[0];
    if (!t) return '';
    var list = roster();
    return '<div class="overlay" data-action="close-assign">' +
      '<div class="sheet" data-stop="1">' +
      '<div class="sheet-title">Who is doing this?</div>' +
      '<div class="sheet-task">' + escapeHtml(t.text) + '</div>' +
      '<div class="sm8-staff">' +
      list.map(function (p) {
        return '<button class="sm8-person' + (t.assignee === p.id ? ' on' : '') + '" ' +
          'data-action="assign-to" data-key="' + p.id + '">' + escapeHtml(p.name) +
          '</button>';
      }).join('') +
      '</div>' +
      '<button class="btn-secondary" data-action="assign-to" data-key="none">Leave it unassigned</button>' +
      '<button class="btn-plain" data-action="close-assign">Cancel</button>' +
      '</div></div>';
  }

  /* Who a task is for, asked at the moment it is written.

     Deliberately at the point of adding rather than afterwards. Sorting out who does
     what later means a pile of unassigned work and somebody having to go through it;
     asked here it is one tap while the job is still in your head. The choice sticks
     for the next task, because work arrives in runs for the same person. */
  /* Work taken off the board is accounted for, never just gone.

     A row disappearing with no explanation is how you end up not trusting a list. One
     line naming who has what costs nothing and means the board always adds up. */
  function inHandHtml(ids) {
    if (!ids || !ids.length) return '';
    var who = roster().filter(function (p) {
      return teamCurrent[p.id] && ids.indexOf(teamCurrent[p.id]) !== -1;
    }).map(function (p) {
      var t = tasks.filter(function (x) { return x.id === teamCurrent[p.id]; })[0];
      return firstNameOf(p.name) + ' is on “' + tidyText(t ? t.text : "", 34) + '”';
    });
    if (!who.length) return '';
    return '<p class="in-hand">' + escapeHtml(who.join('. ')) + '.</p>';
  }

  // Short enough to sit on one line without wrapping the whole plan.
  function tidyText(text, max) {
    var clean = String(text == null ? "" : text).trim();
    return clean.length <= max ? clean : clean.slice(0, max - 1).replace(/\s+\S*$/, "") + "…";
  }

  function whoRowHtml() {
    if (!sharing()) return '';
    var people = pair();
    return '<div class="who-row"><span class="who-label">For</span>' +
      people.map(function (p) {
        return '<button class="who-pick' + (draftAssignee === p.id ? ' on' : '') + '" ' +
          'data-action="set-draft-assignee" data-key="' + p.id + '">' +
          escapeHtml(firstNameOf(p.name)) + '</button>';
      }).join('') +
      '<button class="who-pick' + (!draftAssignee ? ' on' : '') + '" ' +
      'data-action="set-draft-assignee" data-key="anyone">Anyone</button>' +
      '</div>';
  }

  function renderTaskRow(t) {
    if (editingPriorityId === t.id) {
      return '<div class="task-row" data-task-row="' + t.id + '">' +
        '<span class="task-text">' + escapeHtml(t.text) + '</span>' + snoozedTag(t) +
        priorityDots(t.priority, "set-priority", t.id) +
        '</div>';
    }
    return '<div class="task-row" data-task-row="' + t.id + '">' +
      checkBtn(t) +
      '<span class="task-text">' + escapeHtml(t.text) + '</span>' + snoozedTag(t) + stepsTag(t) +
      assigneeChip(t) +
      '<button class="icon-btn ' + (t.quick ? 'lit' : '') + '" data-action="toggle-quick" data-id="' + t.id + '" title="Under a few minutes">⚡</button>' +
      '<button class="icon-btn ' + (hasNotesOrSubs(t) ? 'lit' : '') + '" data-action="open-notes" data-id="' + t.id + '" title="Notes">🗒</button>' +
      '<button class="p-badge" style="background:' + PRIORITY_COLORS[t.priority] + ';border-color:' + PRIORITY_COLORS[t.priority] + '" data-action="edit-priority" data-id="' + t.id + '">' + t.priority + '</button>' +
      '<button class="icon-btn danger" data-action="remove-task" data-id="' + t.id + '">×</button>' +
      '</div>';
  }

  function renderRepeatingRow(t) {
    var label = t.repeat === "daily" ? "Daily" : "Weekly";
    return '<div class="task-row" data-task-row="' + t.id + '">' +
      checkBtn(t) +
      '<span class="task-text">' + escapeHtml(t.text) + '</span>' + stepsTag(t) +
      assigneeChip(t) +
      '<button class="icon-btn ' + (hasNotesOrSubs(t) ? 'lit' : '') + '" data-action="open-notes" data-id="' + t.id + '" title="Notes">🗒</button>' +
      '<button class="repeat-tag" data-action="cycle-task-repeat" data-id="' + t.id + '" title="Change repeat">🔁 ' + label + '</button>' +
      '<button class="icon-btn danger" data-action="remove-task" data-id="' + t.id + '">×</button>' +
      '</div>';
  }

  // ---- Folded priority groups ----
  function firstNonEmptyPriority(list) {
    for (var p = 1; p <= 5; p++) {
      if (list.some(function (t) { return t.priority === p; })) return p;
    }
    return null;
  }
  function groupIsOpen(key, isDefault) {
    if (expandedGroups === null) return isDefault;
    return !!expandedGroups[key];
  }
  function toggleGroup(key) {
    if (expandedGroups === null) {
      // First interaction: keep whatever was already showing, then apply the tap.
      expandedGroups = {};
      var today = todayStr();
      var planTasks = tasks.filter(function (t) { return t.date === planDate && t.status !== "done"; });
      var auto = firstNonEmptyPriority(settings.repeats ? planTasks.filter(function (t) { return !t.repeat; }) : planTasks);
      if (auto) expandedGroups["p" + auto] = true;
    }
    expandedGroups[key] = !expandedGroups[key];
    render();
  }

  function foldedGroup(key, name, colour, items, renderRow, openByDefault) {
    var open = groupIsOpen(key, openByDefault);
    // Collapsed groups show a glimpse of what is inside, so the page still tells you something.
    var peek = open ? '<span class="g-count">' + items.length + '</span>'
      : '<span class="g-peek">' + escapeHtml(items[0].text) +
        (items.length > 1 ? ' +' + (items.length - 1) : '') + '</span>';
    return '<div class="group folded">' +
      '<button class="group-toggle" data-action="toggle-group" data-group="' + key + '" aria-expanded="' + open + '">' +
      '<span class="g-chev">' + (open ? '▾' : '▸') + '</span>' +
      '<span class="g-dot" style="background:' + colour + '"></span>' +
      '<span class="g-name" style="color:' + colour + '">' + name + '</span>' +
      peek +
      '</button>' +
      (open ? '<div class="group-body">' + items.map(renderRow).join('') + '</div>' : '') +
      '</div>';
  }

  function renderPlan() {
    var today = todayStr(), tomorrow = addDaysStr(1);
    var repeatsOn = !!settings.repeats;
    /* The plan is the shared picture of the day, so it shows everybody's work.

       Except whatever somebody is holding right now. A task on a focus card is being
       done this minute, and leaving it on the board is an invitation for the other
       person to start it too. It comes back the moment they finish or move on — and
       the count below says how many are out, so nothing appears to have gone missing. */
    var inHand = sharing() ? inProgressIds() : [];
    var elig = eligibleForAnyone().filter(function (t) { return inHand.indexOf(t.id) === -1; });
    var quickElig = quickEligibleTasks();
    var dailyElig = repeatsOn ? dailyEligibleTasks() : [];
    var planTasksAll = tasks.filter(function (t) {
      return t.date === planDate && t.status !== "done" && !isHeld(t) &&
        inHand.indexOf(t.id) === -1;
    });
    var planTasks = repeatsOn ? planTasksAll.filter(function (t) { return !t.repeat; }) : planTasksAll;
    var repeatingTasks = repeatsOn ? planTasksAll.filter(function (t) { return !!t.repeat; }) : [];
    var nowTs = Date.now();
    var later = tasks.filter(function (t) {
      return t.status !== "done" && !isHeld(t) && (t.date > today || (t.snoozedUntil && t.snoozedUntil > nowTs));
    }).sort(function (a, b) {
      var aKey = a.snoozedUntil || 0, bKey = b.snoozedUntil || 0;
      if (aKey !== bKey) return aKey - bKey;
      return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
    });
    var anySnoozed = later.some(function (t) { return t.snoozedUntil && t.snoozedUntil > nowTs; });

    var grouped = !!settings.groupedPlan;
    var firstOpen = firstNonEmptyPriority(planTasks);

    var groupsHtml = "", anyTasks = false;
    for (var p = 1; p <= 5; p++) {
      var group = planTasks.filter(function (t) { return t.priority === p; }).sort(byPriorityThenOrder);
      if (group.length === 0) continue;
      anyTasks = true;
      groupsHtml += grouped
        ? foldedGroup("p" + p, "Priority " + p, PRIORITY_COLORS[p], group, renderTaskRow, firstOpen === p)
        : '<div class="group"><div class="group-label" style="color:' + PRIORITY_COLORS[p] + '">Priority ' + p + '</div>' +
          group.map(renderTaskRow).join('') + '</div>';
    }

    var repeatingHtml = "";
    if (repeatingTasks.length > 0) {
      anyTasks = true;
      repeatingHtml = grouped
        ? foldedGroup("rep", "🔁 Repeating", "var(--text-dim)", repeatingTasks, renderRepeatingRow, false)
        : '<div class="group"><div class="group-label" style="color:var(--text-dim)">🔁 Repeating</div>' +
          repeatingTasks.map(renderRepeatingRow).join('') + '</div>';
    }

    if (!anyTasks) {
      groupsHtml = '<div class="empty-state">Nothing scheduled for ' + fmtDate(planDate).toLowerCase() + ' yet.</div>';
    }

    var laterHtml = "";
    if (later.length > 0) {
      laterHtml = '<div class="later-section">' +
        '<button class="later-toggle" data-action="toggle-later">' + (showLater ? '▾' : '▸') + ' ' +
        (anySnoozed ? 'Scheduled &amp; snoozed' : 'Scheduled for later') + ' (' + later.length + ')</button>';
      if (showLater) {
        laterHtml += '<div class="later-list">' + later.map(function (t) {
          return '<div class="later-row"><span class="later-text">' + escapeHtml(t.text) + '</span><span>' +
            (t.snoozedUntil && t.snoozedUntil > nowTs ? 'back ' + fmtWhen(t.snoozedUntil) : fmtDate(t.date)) + '</span></div>';
        }).join('') + '</div>';
      }
      laterHtml += '</div>';
    }

    // On hold — things waiting on somebody else. Same drawer shape as the others.
    var held = settings.holds ? heldTasks() : [];
    var heldHtml = "";
    if (held.length > 0) {
      var stale = held.filter(function (t) { return heldDays(t) >= holdThreshold(); }).length;
      heldHtml = '<div class="later-section">' +
        '<button class="later-toggle" data-action="toggle-held">' + (showHeld ? '▾' : '▸') +
        ' On hold (' + held.length + ')' +
        (stale ? '<span class="stale-pip">' + stale + ' to chase</span>' : '') + '</button>';
      if (showHeld) {
        heldHtml += '<div class="later-list">' + held.map(function (t) {
          var days = heldDays(t);
          var old = days >= holdThreshold();
          var meta = t.waitingOn ? escapeHtml(t.waitingOn) : "no note";
          var age = days === 0 ? "today" : days === 1 ? "1 day" : days + " days";
          return '<div class="held-row' + (old ? ' stale' : '') + '">' +
            '<div class="held-main"><span class="held-text">' + escapeHtml(t.text) + '</span>' +
            '<span class="held-meta">' + meta + ' · held ' + age +
            (t.chaseOn ? ' · chase ' + fmtDate(t.chaseOn) : '') + '</span></div>' +
            '<button class="held-release" data-action="release-task" data-id="' + t.id + '">Release</button>' +
            '</div>';
        }).join('') + '</div>';
      }
      heldHtml += '</div>';
    }

    // Anything whose chase date came round this morning, so it does not look like magic.
    var chased = settings.holds ? chasedToday() : [];
    var chasedHtml = chased.length > 0
      ? '<div class="chased-note">↩ ' + chased.length + (chased.length === 1 ? ' task is' : ' tasks are') +
        ' back off hold today — time to chase' + (chased.length === 1 ? '' : ' these') + '.</div>'
      : '';

    // Completed drawer — same shape as "Scheduled for later", and the landing spot
    // for the swoop animation when a task is checked off.
    var doneList = completedOnDate(planDate);
    var completedHtml = "";
    if (doneList.length > 0) {
      var whenLabel = planDate === today ? "today" : fmtDate(planDate).toLowerCase();
      completedHtml = '<div class="later-section completed-section">' +
        '<button class="later-toggle" id="completedToggle" data-action="toggle-completed">' +
        (showCompleted ? '▾' : '▸') + ' Completed ' + whenLabel + ' (' +
        '<span class="done-count' + (bumpCompleted ? ' bump' : '') + '">' + doneList.length + '</span>)</button>';
      if (showCompleted) {
        completedHtml += '<div class="later-list">' + doneList.map(function (c) {
          var who = c.by && personName(c.by);
          return '<div class="later-row"><span class="done-check">✓</span>' +
            '<span class="later-text strike">' + escapeHtml(c.text) + '</span>' +
            (who ? '<span class="done-by">' + escapeHtml(initialsOf(who)) + '</span>' : '') +
            '<span>' + fmtTime(c.ts) + '</span></div>';
        }).join('') + '</div>';
      }
      completedHtml += '</div>';
    }

    var quickBtnHtml = quickElig.length > 0
      ? '<button class="btn-quick-clear" data-action="enter-quick">⚡ Clear the small stuff (' + quickElig.length + ')</button>'
      : '';
    var dailyBtnHtml = (repeatsOn && dailyElig.length > 0)
      ? '<button class="btn-quick-clear" data-action="enter-dailies">🔁 Complete the dailies (' + dailyElig.length + ')</button>'
      : '';


    var repeatPillHtml = "";
    var normalControlsHtml = "";
    if (repeatsOn) {
      var repeatLabel = draftRepeat === "daily" ? "🔁 Daily" : draftRepeat === "weekly" ? "🔁 Weekly" : "🔁 Repeat";
      repeatPillHtml = '<button class="repeat-toggle ' + (draftRepeat ? 'active' : '') + '" data-action="cycle-draft-repeat">' + repeatLabel + '</button>';
    }
    if (!draftRepeat) {
      normalControlsHtml = '<div class="priority-picker"><span class="priority-label">Priority</span>' +
        [1, 2, 3, 4, 5].map(function (p) {
          var active = draftPriority === p;
          var style = active ? ('background:' + PRIORITY_COLORS[p] + ';border-color:' + PRIORITY_COLORS[p]) : '';
          return '<button class="p-dot ' + (active ? 'active' : '') + '" style="' + style + '" data-action="select-draft-priority" data-p="' + p + '">' + p + '</button>';
        }).join('') +
        '</div>' +
        '<button class="quick-toggle ' + (draftQuick ? 'active' : '') + '" data-action="toggle-draft-quick">⚡ Quick</button>';
    }

    return '<div class="date-row">' +
      '<button class="date-pill ' + (planDate === today ? 'active' : '') + '" data-action="set-plan-date" data-date="' + today + '">Today</button>' +
      '<button class="date-pill ' + (planDate === tomorrow ? 'active' : '') + '" data-action="set-plan-date" data-date="' + tomorrow + '">Tomorrow</button>' +
      '<input type="date" id="planDateCustom" class="date-input" value="' + planDate + '" />' +
      '</div>' +
      '<div class="add-box">' +
      '<input id="taskInput" class="task-input" placeholder="Add a task for ' + fmtDate(planDate) + '" value="' + escapeHtml(draftText) + '" />' +
      '<div class="add-row">' +
      normalControlsHtml + repeatPillHtml +
      '<button class="btn-add" data-action="add-task">Add</button>' +
      '</div>' + whoRowHtml() +
      '</div>' + inHandHtml(inHand) +
      (anyTasks && settings.completeFromPlan ? '<p class="swipe-hint">Tap ○ or swipe a task right to complete it.</p>' : '') +
      renderSuggestion() + chasedHtml + groupsHtml + repeatingHtml + laterHtml + heldHtml +
      completedHtml + quickBtnHtml + dailyBtnHtml +
      '<button class="btn-begin" data-action="begin-focus" ' + (elig.length === 0 ? 'disabled' : '') + '>' +
      (elig.length === 0 ? 'Nothing due right now' : 'Begin — ' + elig.length + ' due now') +
      '</button>';
  }

  // Both "not now" panels end the same way: if the real answer is that you cannot do
  // it at all, there is a way straight across to putting it on hold.
  function holdEscape() {
    var out = '';
    if (settings.holds) {
      out += '<div class="panel-or">or</div>' +
        '<button class="btn-secondary" data-action="open-hold">⏸ Place on hold</button>';
    }
    /* Being dealt something you cannot do needs a way out from right here. Without it
       the only route is back to the plan to find the task and reassign it, which is
       enough friction that people would simply skip it instead. */
    if (sharing()) {
      out += '<div class="panel-or">or</div>' +
        '<button class="btn-secondary" data-action="hand-back">↩ Not mine — put it back</button>';
    }
    return out;
  }

  // The original behaviour: pick a time and the task disappears until then.
  function renderSnoozeTimePanel() {
    var now = Date.now();
    var inHour = now + 60 * 60 * 1000;
    var threeHours = now + 3 * 60 * 60 * 1000;
    var fivePM = new Date(); fivePM.setHours(17, 0, 0, 0);
    var fivePMts = fivePM.getTime() > now ? fivePM.getTime() : fivePM.getTime() + 24 * 60 * 60 * 1000;
    var tmrwMorning = new Date(); tmrwMorning.setDate(tmrwMorning.getDate() + 1); tmrwMorning.setHours(8, 0, 0, 0);

    return '<div class="snooze-panel">' +
      '<div class="snooze-label">Priority when it comes back</div>' +
      priorityDots(snoozePriority, "select-snooze-priority") +
      '<div class="snooze-label">Show it again</div>' +
      '<div class="snooze-options">' +
      '<button class="snooze-opt" data-action="confirm-snooze-at" data-ts="' + inHour + '">In 1 hour</button>' +
      '<button class="snooze-opt" data-action="confirm-snooze-at" data-ts="' + threeHours + '">In 3 hours</button>' +
      '<button class="snooze-opt" data-action="confirm-snooze-at" data-ts="' + fivePMts + '">5pm today</button>' +
      '<button class="snooze-opt" data-action="confirm-snooze-at" data-ts="' + tmrwMorning.getTime() + '">Tomorrow morning</button>' +
      '</div>' +
      '<div class="snooze-custom-row">' +
      '<input type="datetime-local" id="snoozeCustomDT" class="dt-input" />' +
      '<button class="btn-set" data-action="confirm-snooze-at" data-custom="1">Set</button>' +
      '</div>' +
      holdEscape() +
      '<button class="cancel-link" data-action="close-snooze">Cancel</button>' +
      '</div>';
  }

  function renderSnoozePanel() {
    if (settings.snoozeMode === "time") return renderSnoozeTimePanel();
    if (snoozeExhausted) {
      return '<div class="snooze-panel">' +
        '<div class="snooze-label">Nothing else is due.</div>' +
        '<p class="snooze-note">This is the only task left, so there is nothing for it to fall behind. ' +
        'You can call it here and come back to it later.</p>' +
        '<button class="btn-set-wide" data-action="back-to-plan">End focus →</button>' +
        holdEscape() +
        '<button class="cancel-link" data-action="close-snooze">Stay on this task</button>' +
        '</div>';
    }

    var cur = tasks.find(function (t) { return t.id === currentTaskId; });
    var target = cur ? backOfQueueTarget(cur, snoozePriority) : null;
    var note = target === null
      ? 'Nothing else is due right now.'
      : (target !== snoozePriority
          ? 'Nothing else sits at priority ' + snoozePriority + ', so this drops to the back of priority ' + target + '.'
          : 'Goes to the back of priority ' + target + ' — you will see the rest of that list first.');

    return '<div class="snooze-panel">' +
      '<div class="snooze-label">Send it to the back of which list?</div>' +
      priorityDots(snoozePriority, "select-snooze-priority") +
      '<p class="snooze-note">' + note + '</p>' +
      '<button class="btn-set-wide" data-action="confirm-snooze">Send to the back</button>' +
      holdEscape() +
      '<button class="cancel-link" data-action="close-snooze">Cancel</button>' +
      '</div>';
  }

  function renderHoldPanel() {
    var cur = tasks.find(function (t) { return t.id === currentTaskId; });
    return '<div class="snooze-panel add-panel">' +
      '<div class="snooze-label">Waiting on what?</div>' +
      '<input id="holdInput" class="task-input" placeholder="e.g. Dave — the measurements" value="' +
      escapeHtml(holdText) + '" />' +
      '<p class="snooze-note">Optional, but it is what makes the On hold list worth reading later.</p>' +
      '<div class="snooze-label">Chase it on a set day?</div>' +
      '<div class="snooze-custom-row">' +
      '<input type="date" id="holdChaseDate" class="dt-input" value="' + escapeHtml(holdChase) + '" />' +
      (holdChase ? '<button class="btn-set" data-action="clear-chase">Clear</button>' : '') +
      '</div>' +
      '<p class="snooze-note last">' + (holdChase
        ? 'It comes back by itself on ' + fmtDate(holdChase) + '.'
        : 'Leave this empty and it waits until you release it.') + '</p>' +
      '<button class="btn-set-wide" data-action="confirm-hold">Put it on hold</button>' +
      '<button class="cancel-link" data-action="close-hold">Cancel</button>' +
      '</div>';
  }

  function renderFocusAddPanel() {
    var current = tasks.find(function (t) { return t.id === currentTaskId; });
    var nowPriority = inheritedPriority();
    var nowNote = 'Straight to the front. Takes priority ' + nowPriority +
      (current ? ', same as the one you are on.' : '.');
    var laterNote = current
      ? 'Keeps you on "' + escapeHtml(current.text) + '" and deals the rest again.'
      : 'Deals the queue again with this in it.';
    return '<div class="snooze-panel add-panel">' +
      '<div class="snooze-label">What just came up?</div>' +
      '<input id="focusAddInput" class="task-input" placeholder="Add a task" value="' + escapeHtml(addText) + '" />' +
      '<button class="btn-set-wide" data-action="add-focus-now">Do this one now</button>' +
      '<p class="snooze-note">' + nowNote + '</p>' +
      '<div class="sync-divider">or</div>' +
      '<div class="snooze-label">Slot it in at priority</div>' +
      priorityDots(addPriority, "select-add-priority") +
      '<button class="btn-secondary" data-action="add-focus-later">Do it later</button>' +
      '<p class="snooze-note last">' + laterNote + '</p>' +
      '<button class="cancel-link" data-action="close-focus-add">Cancel</button>' +
      '</div>';
  }

  /* Two people, one screen.

     Each column runs its own queue and its own buttons, so one person finishing does
     not move the other's card out from under them — which on a shared screen would be
     the difference between useful and infuriating.

     Beneath them sits a band holding the next task nobody has taken, with a button per
     side. It is separate on purpose: shown inside both columns it would read as two
     tasks, and both of them would start it. */

  // Which card each side is on. Session-only — a card is not a thing to persist.
  var teamCurrent = {};

  /* Each person works the way they prefer, at the same time as the other.

     Focus is the app choosing: one card, priority order, nothing else on that side.
     List is the person choosing: their own tasks, in whatever order they fancy, ticked
     off as they go. Neither is the right way — one suits somebody who wants the
     decision taken away, the other suits somebody who would rather look at everything
     and pick. There is no reason two people at one screen should have to agree. */
  function modeKey(personId) { return "onlyThisMode_" + profile + "_" + personId; }
  function modeFor(personId) {
    try { return localStorage.getItem(modeKey(personId)) === "list" ? "list" : "focus"; }
    catch (e) { return "focus"; }
  }
  function setMode(personId, mode) {
    try { localStorage.setItem(modeKey(personId), mode); } catch (e) {}
    // A card only belongs to somebody while they are in focus.
    if (mode !== "focus") delete teamCurrent[personId];
  }

  /* The one task somebody is actually holding.

     Only a card in focus counts. A list is a list — she is looking at all of hers, not
     committed to any one of them — so nothing there is taken out of anybody's way. */
  function inProgressIds() {
    var out = [];
    roster().forEach(function (p) {
      if (modeFor(p.id) === "focus" && teamCurrent[p.id]) out.push(teamCurrent[p.id]);
    });
    return out;
  }
  function isInProgress(t) {
    return sharing() && inProgressIds().indexOf(t.id) !== -1;
  }

  function currentFor(personId) {
    var queue = tasksFor(personId);
    if (!queue.length) { delete teamCurrent[personId]; return null; }
    var held = teamCurrent[personId];
    var still = held && queue.filter(function (t) { return t.id === held; })[0];
    if (still) return still;
    teamCurrent[personId] = queue[0].id;
    return queue[0];
  }

  /* A list of her own, ticked off in whatever order suits her.

     Deliberately not sorted into the app's queue order. The point of this side is that
     the person picks, so the list stays in the order the tasks were written, with the
     priority shown but not deciding anything. */
  function renderTeamList(person, queue) {
    if (!queue.length) {
      return '<div class="card team-card empty"><p class="empty-title small">All clear.</p>' +
        '<p class="empty-sub">Nothing left for ' + escapeHtml(firstNameOf(person.name)) +
        '.</p></div>';
    }
    return '<div class="team-list">' + queue.map(function (t) {
      var pending = pendingSubtasks(t).length;
      return '<div class="team-list-row">' +
        '<button class="task-check" data-action="team-tick" data-key="' + person.id +
        '" data-id="' + t.id + '" title="Mark done">○</button>' +
        '<button class="team-list-text" data-action="open-notes" data-id="' + t.id + '">' +
        escapeHtml(t.text) +
        (pending ? '<span class="team-chip">' + pending +
          (pending === 1 ? ' step' : ' steps') + '</span>' : '') +
        '</button>' +
        '<span class="p-badge small" style="background:' + PRIORITY_COLORS[t.priority] +
        ';border-color:' + PRIORITY_COLORS[t.priority] + '">' + t.priority + '</span>' +
        '</div>';
    }).join('') + '</div>';
  }

  function renderTeamColumn(person) {
    var mode = modeFor(person.id);
    // A card held by the other side is out of this person's way entirely.
    var busy = inProgressIds();
    var queue = tasksFor(person.id).filter(function (t) {
      return t.id === teamCurrent[person.id] || busy.indexOf(t.id) === -1;
    });
    var task = mode === "focus" ? currentFor(person.id) : null;

    var head = '<div class="col-head"><span class="col-dot">' +
      escapeHtml(initialsOf(person.name)) + '</span>' +
      '<span class="col-name">' + escapeHtml(firstNameOf(person.name)) + '</span>' +
      '<button class="col-mode" data-action="set-team-mode" data-key="' + person.id +
      '" data-mode="' + (mode === "focus" ? "list" : "focus") + '" ' +
      'title="' + (mode === "focus" ? "Switch to a list" : "Switch to one at a time") + '">' +
      (mode === "focus" ? "☰ List" : "◎ Focus") + '</button>' +
      '<span class="col-left">' + queue.length + '</span></div>';

    if (mode === "list") {
      return '<div class="team-col">' + head + renderTeamList(person, queue) + '</div>';
    }

    if (!task) {
      return '<div class="team-col">' + head +
        '<div class="card team-card empty"><p class="empty-title small">All clear.</p>' +
        '<p class="empty-sub">Nothing left for ' + escapeHtml(firstNameOf(person.name)) +
        '.</p></div></div>';
    }

    var pending = pendingSubtasks(task);
    var chips = (pending.length ? '<span class="team-chip">' + pending.length +
        (pending.length === 1 ? ' step' : ' steps') + '</span>' : '') +
      ((task.notes && task.notes.trim()) ? '<span class="team-chip">Notes</span>' : '');

    return '<div class="team-col">' + head +
      '<button class="card team-card" data-action="open-notes" data-id="' + task.id + '">' +
      '<span class="priority-tag" style="color:' + PRIORITY_COLORS[task.priority] + '">Priority ' +
      task.priority + '</span>' +
      '<span class="team-text">' + escapeHtml(task.text) + '</span>' +
      (chips ? '<span class="team-chips">' + chips + '</span>' : '') +
      '</button>' +
      '<button class="btn-primary team-done" data-action="team-done" data-key="' + person.id +
      '" data-id="' + task.id + '">Done</button>' +
      '<div class="team-minor">' +
      (queue.length > 1
        ? '<button class="btn-plain" data-action="team-skip" data-key="' + person.id +
          '" data-id="' + task.id + '">Not this one</button>'
        : '') +
      '<button class="btn-plain" data-action="hand-back" data-id="' + task.id + '">Put it back</button>' +
      '</div></div>';
  }

  function renderTeamBand() {
    // Something already in somebody's hands is not going in the up-for-grabs band.
    var busy = inProgressIds();
    var spare = unassignedTasks().filter(function (t) { return busy.indexOf(t.id) === -1; });
    if (!spare.length) return '';
    var next = spare[0];
    var people = pair();
    return '<div class="team-band">' +
      '<div class="band-label">For anyone' +
      (spare.length > 1 ? ' · ' + spare.length + ' waiting' : '') + '</div>' +
      '<div class="band-text">' + escapeHtml(next.text) + '</div>' +
      '<div class="band-actions">' +
      /* Two buttons that both just finish it. Claiming was a step that bought nothing:
         on a shared screen, whoever is free does the job and taps their own side. The
         only reason to know which of them it was is the day's record. */
      people.map(function (p) {
        return '<button class="btn-secondary band-btn" data-action="team-did" ' +
          'data-key="' + p.id + '" data-id="' + next.id + '">' +
          escapeHtml(firstNameOf(p.name)) + ' did it</button>';
      }).join('') +
      '</div></div>';
  }

  function renderTeamFocus() {
    var people = pair();
    var backBtn = '<button class="back-link" data-action="back-to-plan">← Back to plan</button>';
    var band = renderTeamBand();

    if (!eligibleTasks().length) {
      return '<div class="center-col">' + backBtn +
        '<div class="card empty-card"><p class="empty-title">Board clear.</p>' +
        '<p class="empty-sub">Nothing left for either of you today.</p></div>' +
        '<button class="btn-primary" data-action="back-to-plan">Back to plan</button></div>';
    }

    return '<div class="team-wrap">' + backBtn +
      '<div class="team-split">' +
      people.map(renderTeamColumn).join('') +
      '</div>' + band + '</div>';
  }

  function renderFocus() {
    if (sharing() && pair().length === 2) return renderTeamFocus();
    pickCurrentFocus();
    var elig = eligibleTasks();
    var current = tasks.find(function (t) { return t.id === currentTaskId; });
    var backBtn = '<button class="back-link" data-action="back-to-plan">← Back to plan</button>';

    if (!current) {
      var nowT = Date.now();

      var laterList = tasks.filter(function (t) {
        return t.status !== "done" &&
          (t.date > todayStr() || (t.snoozedUntil && t.snoozedUntil > nowT));
      }).sort(function (a, b) { return (a.snoozedUntil || 0) - (b.snoozedUntil || 0); });
      var next = laterList[0];
      return '<div class="center-col">' + backBtn +
        '<div class="card empty-card"><p class="empty-title">Nothing due right now.</p>' +
        (next ? '<p class="empty-sub">Next up: ' + escapeHtml(next.text) + ' — ' +
          (next.snoozedUntil && next.snoozedUntil > nowT ? fmtWhen(next.snoozedUntil) : fmtDate(next.date)) + '</p>' : '') +
        '</div>' +
        (addOpen ? renderFocusAddPanel()
          : '<button class="btn-primary" data-action="back-to-plan">Back to plan</button>' +
            '<button class="subtask-link" data-action="open-focus-add">+ Something just came up</button>') +
        '</div>';
    }

    if (inSubtaskMode) return renderSubtaskFocus(current, backBtn);

    var remainingBehind = Math.max(0, elig.length - 1);
    var stackLayers = Math.min(remainingBehind, 3);
    var stackHtml = "";
    for (var i = 0; i < stackLayers; i++) {
      stackHtml += '<div class="stack-layer" style="top:' + (-(i + 1) * 7) + 'px;left:' + ((i + 1) * 6) + 'px;right:' + (-(i + 1) * 6) + 'px;background:' + (i === stackLayers - 1 ? 'var(--paper-dim2)' : 'var(--paper-dim1)') + ';z-index:' + (-1 - i) + '"></div>';
    }

    var pending = pendingSubtasks(current);

    /* Two decisions below the card, not five buttons. Things that belong to the task —
       its steps and its notes — live on the card itself. Everything that means "not
       this, as it stands" sits behind one secondary button. */
    var actionsHtml = snoozeOpen ? renderSnoozePanel()
      : addOpen ? renderFocusAddPanel()
      : holdOpen ? renderHoldPanel()
      : '<button class="btn-primary" data-action="mark-done">Done — next one</button>' +
        '<div class="action-pair">' +
        '<button class="btn-secondary" data-action="open-snooze">Not this one</button>' +
        '<button class="btn-secondary" data-action="open-focus-add">+ Something came up</button>' +
        '</div>';

    var hasNotes = current.notes && current.notes.trim();
    var chips = '<div class="card-chips">' +
      (pending.length > 0
        ? '<button class="card-chip" data-action="enter-subtask-mode">' +
          pending.length + (pending.length === 1 ? ' step' : ' steps') + '</button>'
        : '') +
      '<button class="card-chip ' + (hasNotes ? 'lit' : '') + '" data-action="open-notes" data-id="' + current.id + '">' +
      (hasNotes ? 'Notes ·' : 'Notes') + '</button>' +
      '</div>';

    return '<div class="center-col">' + backBtn +
      '<div class="stack-wrap">' + stackHtml +
      '<div class="card focus-card">' +
      '<span class="priority-tag" style="color:' + PRIORITY_COLORS[current.priority] + '">Priority ' + current.priority + '</span>' +
      '<p class="task-display">' + escapeHtml(current.text) + '</p>' +
      chips +
      '</div></div>' +
      '<div class="due-count">' + elig.length + ' due now</div>' +
      actionsHtml + '</div>';
  }

  function renderSubtaskFocus(parent, backBtn) {
    var pending = pendingSubtasks(parent);

    if (subtaskJustDone) {
      var allClear = pending.length === 0;
      return '<div class="center-col">' + backBtn +
        '<div class="card empty-card">' +
        '<p class="empty-title">Step done.</p>' +
        (allClear ? '<p class="empty-sub">That was the last step for this one.</p>' : '<p class="empty-sub">' + pending.length + (pending.length === 1 ? ' step left.' : ' steps left.') + '</p>') +
        '</div>' +
        (pending.length > 0 ? '<button class="btn-primary" data-action="next-subtask">Next step →</button>' : '') +
        (allClear ? '<button class="btn-primary" data-action="mark-parent-from-subtasks">Mark "' + escapeHtml(parent.text) + '" done too →</button>' : '') +
        '<button class="btn-secondary" data-action="back-to-main-task">Back to main tasks →</button>' +
        '</div>';
    }

    var sub = (parent.subtasks || []).find(function (s) { return s.id === currentSubtaskId; });
    if (!sub) {
      inSubtaskMode = false;
      currentSubtaskId = null;
      return '<div class="center-col">' + backBtn +
        '<div class="card empty-card"><p class="empty-title">That step is gone.</p></div>' +
        '<button class="btn-primary" data-action="back-to-main-task">Back to main task</button></div>';
    }

    return '<div class="center-col">' + backBtn +
      '<div class="breadcrumb">Within: ' + escapeHtml(parent.text) + '</div>' +
      '<div class="card subtask-card">' +
      (sub.quick ? '<span class="quick-tag">⚡ Quick step</span>' : '<span class="priority-tag" style="color:' + PRIORITY_COLORS[sub.priority] + '">Priority ' + sub.priority + '</span>') +
      '<p class="task-display small">' + escapeHtml(sub.text) + '</p>' +
      '</div>' +
      '<button class="btn-primary" data-action="subtask-done">Done — this step</button>' +
      '<button class="btn-secondary" data-action="back-to-main-task">← Back to main task</button>' +
      '</div>';
  }

  function renderQuick() {
    var current = tasks.find(function (t) { return t.id === quickQueue[0]; });
    var backBtn = '<button class="back-link" data-action="back-to-plan">← Back to plan</button>';
    if (!current) {
      return '<div class="center-col"><div class="card empty-card"><p class="empty-title">Small stuff cleared.</p></div>' +
        '<button class="btn-primary" data-action="back-to-plan">Back to plan</button></div>';
    }
    return '<div class="center-col">' + backBtn +
      '<div class="card quick-card"><span class="quick-tag">⚡ Quick</span>' +
      '<p class="task-display small">' + escapeHtml(current.text) + '</p></div>' +
      '<div class="due-count">' + quickQueue.length + ' left in this sweep</div>' +
      '<button class="btn-primary" data-action="quick-done">Done — next one</button>' +
      '<button class="btn-secondary" data-action="quick-skip" ' + (quickQueue.length <= 1 ? 'disabled' : '') + '>Not now — send to the back</button>' +
      '</div>';
  }

  function renderDailies() {
    var current = tasks.find(function (t) { return t.id === dailyQueue[0]; });
    var backBtn = '<button class="back-link" data-action="back-to-plan">← Back to plan</button>';

      return '<div class="center-col"><div class="card empty-card"><p class="empty-title">Dailies cleared for today.</p></div>' +

    }
    var label = current.repeat === "daily" ? "🔁 Daily" : "🔁 Weekly";
    return '<div class="center-col">' + backBtn +
      '<div class="card quick-card"><span class="quick-tag">' + label + '</span>' +
      '<p class="task-display small">' + escapeHtml(current.text) + '</p></div>' +
      '<div class="due-count">' + dailyQueue.length + ' left in this sweep</div>' +
      '<button class="btn-primary" data-action="daily-done">Done — next one</button>' +
      '<button class="btn-secondary" data-action="daily-skip" ' + (dailyQueue.length <= 1 ? 'disabled' : '') + '>Not now — send to the back</button>' +
      '</div>';
