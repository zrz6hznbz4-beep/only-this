    if (later.length > 0) {
      laterHtml = '<div class="later-section">' +
        '<button class="later-toggle" data-action="toggle-later">' + (showLater ? '▾' : '▸') + ' ' +
        (anySnoozed ? 'Scheduled &amp; snoozed' : 'Scheduled for later') + ' (' + later.length + ')</button>';
      if (showLater) {
        laterHtml += '<div class="later-list">' + later.map(function (t) {
          return '<div class="later-row"><span class="later-text">' + escapeHtml(t.text) + '</span><span>' +
            (t.snoozedUntil && t.snoozedUntil > nowTs ? 'back ' + fmtWhen(t.snoozedUntil) : fmtDate(t.date)) + '</span></div>';
        }).join('') + '</div>';
      }
      laterHtml += '</div>';
    }

    // On hold — things waiting on somebody else. Same drawer shape as the others.
    var held = settings.holds ? heldTasks() : [];
    var heldHtml = "";
    if (held.length > 0) {
      var stale = held.filter(function (t) { return heldDays(t) >= holdThreshold(); }).length;
      heldHtml = '<div class="later-section">' +
        '<button class="later-toggle" data-action="toggle-held">' + (showHeld ? '▾' : '▸') +
        ' On hold (' + held.length + ')' +
        (stale ? '<span class="stale-pip">' + stale + ' to chase</span>' : '') + '</button>';
      if (showHeld) {
        heldHtml += '<div class="later-list">' + held.map(function (t) {
          var days = heldDays(t);
          var old = days >= holdThreshold();
          var meta = t.waitingOn ? escapeHtml(t.waitingOn) : "no note";
          var age = days === 0 ? "today" : days === 1 ? "1 day" : days + " days";
          return '<div class="held-row' + (old ? ' stale' : '') + '">' +
            '<div class="held-main"><span class="held-text">' + escapeHtml(t.text) + '</span>' +
            '<span class="held-meta">' + meta + ' · held ' + age +
            (t.chaseOn ? ' · chase ' + fmtDate(t.chaseOn) : '') + '</span></div>' +
            '<button class="held-release" data-action="release-task" data-id="' + t.id + '">Release</button>' +
            '</div>';
        }).join('') + '</div>';
      }
      heldHtml += '</div>';
    }

    // Anything whose chase date came round this morning, so it does not look like magic.
    var chased = settings.holds ? chasedToday() : [];
    var chasedHtml = chased.length > 0
      ? '<div class="chased-note">↩ ' + chased.length + (chased.length === 1 ? ' task is' : ' tasks are') +
        ' back off hold today — time to chase' + (chased.length === 1 ? '' : ' these') + '.</div>'
      : '';

    // Completed drawer — same shape as "Scheduled for later", and the landing spot
    // for the swoop animation when a task is checked off.
    var doneList = completedOnDate(planDate);
    var completedHtml = "";
    if (doneList.length > 0) {
      var whenLabel = planDate === today ? "today" : fmtDate(planDate).toLowerCase();
      completedHtml = '<div class="later-section completed-section">' +
        '<button class="later-toggle" id="completedToggle" data-action="toggle-completed">' +
        (showCompleted ? '▾' : '▸') + ' Completed ' + whenLabel + ' (' +
        '<span class="done-count' + (bumpCompleted ? ' bump' : '') + '">' + doneList.length + '</span>)</button>';
      if (showCompleted) {
        completedHtml += '<div class="later-list">' + doneList.map(function (c) {
          var who = c.by && personName(c.by);
          return '<div class="later-row"><span class="done-check">✓</span>' +
            '<span class="later-text strike">' + escapeHtml(c.text) + '</span>' +
            (who ? '<span class="done-by">' + escapeHtml(initialsOf(who)) + '</span>' : '') +
            '<span>' + fmtTime(c.ts) + '</span></div>';
        }).join('') + '</div>';
      }
      completedHtml += '</div>';
    }

    /* Standing — customers and jobs with nothing outstanding today. They are not work,
       so they are not on the plan; but they are where you go to add something, or to
       find the number, so they are one drawer away rather than gone. */
    var standingHtml = "";
    if (containersOn()) {
      var standing = standingContainers(planTasks);
      if (standing.length > 0) {
        standingHtml = '<div class="later-section">' +
          '<button class="later-toggle" data-action="toggle-standing">' + (showStanding ? '▾' : '▸') +
          ' Standing (' + standing.length + ')</button>';
        if (showStanding) {
          standingHtml += '<div class="standing-list">' + standing.map(function (c) {
            return '<button class="standing-name" data-action="open-container" data-id="' + c.id + '">' +
              escapeHtml(c.text) + '</button>';
          }).join('') + '</div>';
        }
        standingHtml += '</div>';
      }
    }

    /* One basket, not three phone calls. This is the morning where kit for three
       different customers all comes from the same distributor. */
    var supplierBatchHtml = supplierBatches(planTasks).map(function (b) {
      return '<button class="btn-quick-clear supplier-batch" data-action="enter-supplier-batch" ' +
        'data-id="' + b.supplier.id + '">📦 ' + escapeHtml(b.supplier.name) +
        ' — ' + b.list.length + ' to order together</button>';
    }).join('');

    var quickBtnHtml = quickElig.length > 0
      ? '<button class="btn-quick-clear" data-action="enter-quick">⚡ Clear the small stuff (' + quickElig.length + ')</button>'
      : '';
    var dailyBtnHtml = (repeatsOn && dailyElig.length > 0)
      ? '<button class="btn-quick-clear" data-action="enter-dailies">🔁 Complete the dailies (' + dailyElig.length + ')</button>'
      : '';


    var repeatPillHtml = "";
    var normalControlsHtml = "";
    if (repeatsOn) {
      var repeatLabel = draftRepeat === "daily" ? "🔁 Daily" : draftRepeat === "weekly" ? "🔁 Weekly" : "🔁 Repeat";
      repeatPillHtml = '<button class="repeat-toggle ' + (draftRepeat ? 'active' : '') + '" data-action="cycle-draft-repeat">' + repeatLabel + '</button>';
    }
    if (!draftRepeat) {
      normalControlsHtml = '<div class="priority-picker"><span class="priority-label">Priority</span>' +
        [1, 2, 3, 4, 5].map(function (p) {
          var active = draftPriority === p;
          var style = active ? ('background:' + PRIORITY_COLORS[p] + ';border-color:' + PRIORITY_COLORS[p]) : '';
          return '<button class="p-dot ' + (active ? 'active' : '') + '" style="' + style + '" data-action="select-draft-priority" data-p="' + p + '">' + p + '</button>';
        }).join('') +
        '</div>' +
        '<button class="quick-toggle ' + (draftQuick ? 'active' : '') + '" data-action="toggle-draft-quick">⚡ Quick</button>';
    }

    return {
      dates: '<div class="date-row">' +
        '<button class="date-pill ' + (planDate === today ? 'active' : '') + '" data-action="set-plan-date" data-date="' + today + '">Today</button>' +
        '<button class="date-pill ' + (planDate === tomorrow ? 'active' : '') + '" data-action="set-plan-date" data-date="' + tomorrow + '">Tomorrow</button>' +
        '<input type="date" id="planDateCustom" class="date-input" value="' + planDate + '" />' +
        '</div>',
      addBox: planAddBox(normalControlsHtml, repeatPillHtml),
      hint: (anyTasks && settings.completeFromPlan
        ? '<p class="swipe-hint">Tap ○ or swipe a task right to complete it.</p>' : ''),
      suggestion: renderSuggestion(),
      chased: chasedHtml,
      groups: groupsHtml,
      repeating: repeatingHtml,
      drawers: standingHtml + laterHtml + heldHtml + completedHtml,
      sweeps: supplierBatchHtml + quickBtnHtml + dailyBtnHtml,
      begin: '<button class="btn-begin" data-action="begin-focus" ' + (elig.length === 0 ? 'disabled' : '') + '>' +
        (elig.length === 0 ? 'Nothing due right now' : 'Begin — ' + elig.length + ' due now') +
        '</button>',
      anyTasks: anyTasks,
      elig: elig,
    };
  }

  function renderPlan() {
    var v = planParts();
    return v.dates + v.addBox + v.hint + v.suggestion + v.chased +
      v.groups + v.repeating + v.drawers + v.sweeps + v.begin;
  }

  // Both "not now" panels end the same way: if the real answer is that you cannot do
  // it at all, there is a way straight across to putting it on hold.
  function holdEscape() {
    var out = '';
    if (settings.holds) {
      out += '<div class="panel-or">or</div>' +
        '<button class="btn-secondary" data-action="open-hold">⏸ Place on hold</button>';
    }
    /* Being dealt something you cannot do needs a way out from right here. Without it
       the only route is back to the plan to find the task and reassign it, which is
       enough friction that people would simply skip it instead. */
    if (sharing()) {
      out += '<div class="panel-or">or</div>' +
        '<button class="btn-secondary" data-action="hand-back">↩ Not mine — put it back</button>';
    }
    return out;
  }

  // The original behaviour: pick a time and the task disappears until then.
  function renderSnoozeTimePanel() {
    var now = Date.now();
    var inHour = now + 60 * 60 * 1000;
    var threeHours = now + 3 * 60 * 60 * 1000;
    var fivePM = new Date(); fivePM.setHours(17, 0, 0, 0);
    var fivePMts = fivePM.getTime() > now ? fivePM.getTime() : fivePM.getTime() + 24 * 60 * 60 * 1000;
    var tmrwMorning = new Date(); tmrwMorning.setDate(tmrwMorning.getDate() + 1); tmrwMorning.setHours(8, 0, 0, 0);

    return '<div class="snooze-panel">' +
      '<div class="snooze-label">Priority when it comes back</div>' +
      priorityDots(S.snoozePriority, "select-snooze-priority") +
      '<div class="snooze-label">Show it again</div>' +
      '<div class="snooze-options">' +
      '<button class="snooze-opt" data-action="confirm-snooze-at" data-ts="' + inHour + '">In 1 hour</button>' +
      '<button class="snooze-opt" data-action="confirm-snooze-at" data-ts="' + threeHours + '">In 3 hours</button>' +
      '<button class="snooze-opt" data-action="confirm-snooze-at" data-ts="' + fivePMts + '">5pm today</button>' +
      '<button class="snooze-opt" data-action="confirm-snooze-at" data-ts="' + tmrwMorning.getTime() + '">Tomorrow morning</button>' +
      '</div>' +
      '<div class="snooze-custom-row">' +
      '<input type="datetime-local" id="snoozeCustomDT" class="dt-input" />' +
      '<button class="btn-set" data-action="confirm-snooze-at" data-custom="1">Set</button>' +
      '</div>' +
      holdEscape() +
      '<button class="cancel-link" data-action="close-snooze">Cancel</button>' +
      '</div>';
  }

  function renderSnoozePanel() {
    if (settings.snoozeMode === "time") return renderSnoozeTimePanel();
    if (S.snoozeExhausted) {
      return '<div class="snooze-panel">' +
        '<div class="snooze-label">Nothing else is due.</div>' +
        '<p class="snooze-note">This is the only task left, so there is nothing for it to fall behind. ' +
        'You can call it here and come back to it later.</p>' +
        '<button class="btn-set-wide" data-action="back-to-plan">End focus →</button>' +
        holdEscape() +
        '<button class="cancel-link" data-action="close-snooze">Stay on this task</button>' +
        '</div>';
    }

    var cur = tasks.find(function (t) { return t.id === S.currentTaskId; });
    var target = cur ? backOfQueueTarget(cur, S.snoozePriority) : null;
    var note = target === null
      ? 'Nothing else is due right now.'
      : (target !== S.snoozePriority
          ? 'Nothing else sits at priority ' + S.snoozePriority + ', so this drops to the back of priority ' + target + '.'
          : 'Goes to the back of priority ' + target + ' — you will see the rest of that list first.');

    return '<div class="snooze-panel">' +
      '<div class="snooze-label">Send it to the back of which list?</div>' +
      priorityDots(S.snoozePriority, "select-snooze-priority") +
      '<p class="snooze-note">' + note + '</p>' +
      '<button class="btn-set-wide" data-action="confirm-snooze">Send to the back</button>' +
      holdEscape() +
      '<button class="cancel-link" data-action="close-snooze">Cancel</button>' +
      '</div>';
  }

  function renderHoldPanel() {
    var cur = tasks.find(function (t) { return t.id === S.currentTaskId; });
    return '<div class="snooze-panel add-panel">' +
      '<div class="snooze-label">Waiting on what?</div>' +
      '<input id="holdInput" class="task-input" placeholder="e.g. Dave — the measurements" value="' +
      escapeHtml(S.holdText) + '" />' +
      '<p class="snooze-note">Optional, but it is what makes the On hold list worth reading later.</p>' +
      '<div class="snooze-label">Chase it on a set day?</div>' +
      '<div class="snooze-custom-row">' +
      '<input type="date" id="holdChaseDate" class="dt-input" value="' + escapeHtml(S.holdChase) + '" />' +
      (S.holdChase ? '<button class="btn-set" data-action="clear-chase">Clear</button>' : '') +
      '</div>' +
      '<p class="snooze-note last">' + (S.holdChase
        ? 'It comes back by itself on ' + fmtDate(S.holdChase) + '.'
        : 'Leave this empty and it waits until you release it.') + '</p>' +
      '<button class="btn-set-wide" data-action="confirm-hold">Put it on hold</button>' +
      '<button class="cancel-link" data-action="close-hold">Cancel</button>' +
      '</div>';
  }

  function renderFocusAddPanel() {
    var current = tasks.find(function (t) { return t.id === S.currentTaskId; });
    var nowPriority = inheritedPriority();
    var nowNote = 'Straight to the front. Takes priority ' + nowPriority +
      (current ? ', same as the one you are on.' : '.');
    var laterNote = current
      ? 'Keeps you on "' + escapeHtml(current.text) + '" and deals the rest again.'
      : 'Deals the queue again with this in it.';
    return '<div class="snooze-panel add-panel">' +
      '<div class="snooze-label">What just came up?</div>' +
      '<input id="focusAddInput" class="task-input" placeholder="Add a task" value="' + escapeHtml(S.addText) + '" />' +
      '<button class="btn-set-wide" data-action="add-focus-now">Do this one now</button>' +
      '<p class="snooze-note">' + nowNote + '</p>' +
      '<div class="sync-divider">or</div>' +
      '<div class="snooze-label">Slot it in at priority</div>' +
      priorityDots(S.addPriority, "select-add-priority") +
      '<button class="btn-secondary" data-action="add-focus-later">Do it later</button>' +
      '<p class="snooze-note last">' + laterNote + '</p>' +
      '<button class="cancel-link" data-action="close-focus-add">Cancel</button>' +
      '</div>';
  }

  /* Two people, one screen.

     Each column runs its own queue and its own buttons, so one person finishing does
     not move the other's card out from under them — which on a shared screen would be
     the difference between useful and infuriating.

     Beneath them sits a band holding the next task nobody has taken, with a button per
     side. It is separate on purpose: shown inside both columns it would read as two
     tasks, and both of them would start it. */

  // The card a given person is on, without creating a session just by asking.
  function cardIdFor(personId) {
    return sessions[personId] ? sessions[personId].currentTaskId : null;
  }

  /* Each person works the way they prefer, at the same time as the other.

     Focus is the app choosing: one card, priority order, nothing else on that side.
     List is the person choosing: their own tasks, in whatever order they fancy, ticked
     off as they go. Neither is the right way — one suits somebody who wants the
     decision taken away, the other suits somebody who would rather look at everything
     and pick. There is no reason two people at one screen should have to agree. */
  function modeKey(personId) { return "onlyThisMode_" + profile + "_" + personId; }
  var MODES = ["focus", "list", "sweep"];
  function modeFor(personId) {
    try {
      var m = localStorage.getItem(modeKey(personId));
      return MODES.indexOf(m) !== -1 ? m : "focus";
    } catch (e) { return "focus"; }
  }
  function setMode(personId, mode) {
    try { localStorage.setItem(modeKey(personId), mode); } catch (e) {}
    // A card only belongs to somebody while they are in focus.
    if (mode !== "focus" && sessions[personId]) sessions[personId].currentTaskId = null;
  }

  /* The one task somebody is actually holding.

     Only a card in focus counts. A list is a list — she is looking at all of hers, not
     committed to any one of them — so nothing there is taken out of anybody's way. */
  function inProgressIds() {
    var out = [];
    roster().concat([anyonePerson()]).forEach(function (p) {
      if (modeFor(p.id) === "focus" && cardIdFor(p.id)) out.push(cardIdFor(p.id));
    });
    return out;
  }
  function isInProgress(t) {
    return sharing() && inProgressIds().indexOf(t.id) !== -1;
  }

  function currentFor(personId) {
    var queue = tasksFor(personId);
    if (!queue.length) { useSession(personId).currentTaskId = null; return null; }
    var held = cardIdFor(personId);
    var still = held && queue.filter(function (t) { return t.id === held; })[0];
    if (still) return still;
    useSession(personId).currentTaskId = queue[0].id;
    return queue[0];
  }

  /* A list of her own, worked through however she likes.

     These are the plan's own rows — the same drawers, the same quick and notes
     buttons, the same tick and swipe — because they are drawn by the plan's own
     functions. The group keys are prefixed per person so the two columns fold and
     unfold independently. */
  function renderTeamList(person, queue) {
    if (!queue.length) {
      return '<div class="card team-card empty"><p class="empty-title small">All clear.</p>' +
        '<p class="empty-sub">' + (isAnyone(person.id)
          ? 'Nothing spare at the moment.'
          : 'Nothing left for ' + escapeHtml(firstNameOf(person.name)) + '.') +
        '</p></div>';
    }
    var grouped = !!settings.groupedPlan;
    var repeatsOn = !!settings.repeats;
    var plain = repeatsOn ? queue.filter(function (t) { return !t.repeat; }) : queue;
    var repeats = repeatsOn ? queue.filter(function (t) { return !!t.repeat; }) : [];
    var firstOpen = firstNonEmptyPriority(plain);
    var out = '';
    for (var p = 1; p <= 5; p++) {
      var group = plain.filter(function (t) { return t.priority === p; }).sort(byPriorityThenOrder);
      if (!group.length) continue;
      out += grouped
        ? foldedGroup(person.id + "-p" + p, "Priority " + p, PRIORITY_COLORS[p],
            group, renderTaskRow, firstOpen === p)
        : '<div class="group"><div class="group-label" style="color:' + PRIORITY_COLORS[p] +
          '">Priority ' + p + '</div>' + group.map(renderTaskRow).join('') + '</div>';
    }
    if (repeats.length) {
      out += grouped
        ? foldedGroup(person.id + "-rep", "🔁 Repeating", "var(--text-dim)",
            repeats, renderRepeatingRow, false)
        : '<div class="group"><div class="group-label" style="color:var(--text-dim)">🔁 Repeating</div>' +
          repeats.map(renderRepeatingRow).join('') + '</div>';
    }
    return '<div class="team-list">' + out + '</div>';
  }

  /* What this person can switch between. Sweep is only offered when there is something
     to sweep, so the control does not advertise a mode that would open on nothing. */
  function modesFor(personId) {
    useSession(personId);
    var out = [{ id: "focus", label: "◎ Focus" }, { id: "list", label: "☰ List" }];
    if (quickEligibleTasks().length ||
        (settings.repeats && dailyEligibleTasks().length)) {
      out.push({ id: "sweep", label: "⚡ Sweep" });
    }
    return out;
  }

  function renderTeamColumn(person) {
    useSession(person.id);
    var mode = modeFor(person.id);
    var available = modesFor(person.id);
    if (!available.some(function (m) { return m.id === mode; })) mode = "focus";

    var queue = eligibleTasks();
    var anyone = isAnyone(person.id);
    var head = '<div class="col-head"><span class="col-dot' + (anyone ? ' open' : '') + '">' +
      (anyone ? '·' : escapeHtml(initialsOf(person.name))) + '</span>' +
      '<span class="col-name">' + escapeHtml(firstNameOf(person.name)) + '</span>' +
      '<span class="col-mode">' +
      available.map(function (m) {
        return '<button class="cm ' + (mode === m.id ? "on" : "") + '" ' +
          'data-action="set-team-mode" data-key="' + person.id + '" data-mode="' + m.id + '" ' +
          'aria-pressed="' + (mode === m.id) + '">' + m.label + '</button>';
      }).join('') +
      '</span>' +
      '<span class="col-left">' + queue.length + '</span></div>';

    var body;
    if (mode === "list") {
      body = renderTeamList(person, queue);
    } else if (mode === "sweep") {
      useSession(person.id);
      if (!S.quickQueue.length && !S.dailyQueue.length) startSweepFor(person.id);
      body = S.quickQueue.length
        ? renderQuickBody("col-inner", "")
        : renderDailiesBody("col-inner", "");
    } else {
      // The real focus card, drawn by the real focus code.
      useSession(person.id);
      body = renderFocusBody("col-inner", "");
    }
    return '<div class="team-col' + (anyone ? ' anyone' : '') +
      '" data-side="' + person.id + '">' + head + body + '</div>';
  }

  /* Unclaimed work, on its own row under the two people.

     It was a band with one task on it and a button each. That could show you what was
     next but not let you work through it — no list, no sweep, no snooze, none of the
     things a column has. Now it is a column, so it has all of them, and the only thing
     that differs is that finishing something asks which of you did it. */
  function renderAnyoneRow() {
    if (!tasksFor(ANYONE).length && !cardIdFor(ANYONE)) return '';
    return '<div class="anyone-row">' + renderTeamColumn(anyonePerson()) + '</div>';
  }

  function renderCoop() {
    var people = pair();
    /* Settle each column's card before anything else is drawn.

       The board asks what is in hand so it can take those tasks off itself, but a
       column only decides which card it is on when it renders — which happens after.
       Priming them here means the answer is right on the first render rather than one
       render late, which is the difference between a task briefly appearing in two
       places and never doing so. */
    people.concat([anyonePerson()]).forEach(function (p) {
      if (modeFor(p.id) === "focus") currentFor(p.id);
    });
    useSession("solo");   // the parts below are the whole board, not one person's

    var v = planParts();
    var columns = '<div class="team-split">' + people.map(renderTeamColumn).join('') + '</div>';
    return v.dates + v.addBox + v.suggestion + v.chased +
      columns + renderAnyoneRow() + v.drawers;
  }

  function renderFocus() {
    useSession("solo");
    return renderFocusBody("center-col",
      '<button class="back-link" data-action="back-to-plan">← Back to plan</button>');
  }

  /* The one focus card, wherever it appears.

     Solo it fills the screen; in a column it is one of two. Same markup, same buttons,
     same behaviour — because it is the same function, not a copy of it. A second
     implementation would have drifted from this one within a week. */
  function renderFocusBody(wrapClass, backBtn) {
    pickCurrentFocus();
    var elig = eligibleTasks();
    var current = tasks.find(function (t) { return t.id === S.currentTaskId; });

    if (!current) {
      var nowT = Date.now();

      var laterList = tasks.filter(function (t) {
        return t.status !== "done" &&
          (t.date > todayStr() || (t.snoozedUntil && t.snoozedUntil > nowT));
      }).sort(function (a, b) { return (a.snoozedUntil || 0) - (b.snoozedUntil || 0); });
      var next = laterList[0];
      return '<div class="' + wrapClass + '">' + backBtn +
        '<div class="card empty-card"><p class="empty-title">Nothing due right now.</p>' +
        (next ? '<p class="empty-sub">Next up: ' + escapeHtml(next.text) + ' — ' +
          (next.snoozedUntil && next.snoozedUntil > nowT ? fmtWhen(next.snoozedUntil) : fmtDate(next.date)) + '</p>' : '') +
        '</div>' +
        (S.addOpen ? renderFocusAddPanel()
          : '<button class="btn-primary" data-action="back-to-plan">Back to plan</button>' +
            '<button class="subtask-link" data-action="open-focus-add">+ Something just came up</button>') +
        '</div>';
    }

    if (S.inSubtaskMode) return renderSubtaskFocus(current, backBtn, wrapClass);

    var remainingBehind = Math.max(0, elig.length - 1);
    var stackLayers = Math.min(remainingBehind, 3);
    var stackHtml = "";
    for (var i = 0; i < stackLayers; i++) {
      stackHtml += '<div class="stack-layer" style="top:' + (-(i + 1) * 7) + 'px;left:' + ((i + 1) * 6) + 'px;right:' + (-(i + 1) * 6) + 'px;background:' + (i === stackLayers - 1 ? 'var(--paper-dim2)' : 'var(--paper-dim1)') + ';z-index:' + (-1 - i) + '"></div>';
    }

    var pending = pendingSubtasks(current);

    /* Two decisions below the card, not five buttons. Things that belong to the task —
       its steps and its notes — live on the card itself. Everything that means "not
       this, as it stands" sits behind one secondary button. */
    var donePrimary = (sharing() && isAnyone(activeSide))
      ? '<div class="action-pair">' + pair().map(function (person) {
          return '<button class="btn-primary did-btn" data-action="team-did" data-key="' +
            person.id + '" data-id="' + current.id + '">' +
            escapeHtml(firstNameOf(person.name)) + ' did it</button>';
        }).join('') + '</div>'
      : '<button class="btn-primary" data-action="mark-done">Done — next one</button>';

    var actionsHtml = S.snoozeOpen ? renderSnoozePanel()
      : S.addOpen ? renderFocusAddPanel()
      : S.holdOpen ? renderHoldPanel()
      : donePrimary +
        '<div class="action-pair">' +
        '<button class="btn-secondary" data-action="open-snooze">Not this one</button>' +
        '<button class="btn-secondary" data-action="open-focus-add">+ Something came up</button>' +
        '</div>';

    var hasNotes = current.notes && current.notes.trim();
    var chips = '<div class="card-chips">' +
      (pending.length > 0
        ? '<button class="card-chip" data-action="enter-subtask-mode">' +
          pending.length + (pending.length === 1 ? ' step' : ' steps') + '</button>'
        : '') +
      '<button class="card-chip ' + (hasNotes ? 'lit' : '') + '" data-action="open-notes" data-id="' + current.id + '">' +
      (hasNotes ? 'Notes ·' : 'Notes') + '</button>' +
      '</div>';

    /* The customer's name above the task, where the task alone would not be enough.
       "Order the cartridge" needs to say whose. */
    var kicker = containersOn() && current.containerId
      ? '<span class="card-kicker">' + escapeHtml(containerName(current.containerId) || '') + '</span>'
      : '';

    /* And the supplier below it — the one moment you actually need the account number
       and the phone line is when the order is the thing in front of you. */
    var supplierMatch = supplierFor(current);

    return '<div class="' + wrapClass + '">' + backBtn +
      '<div class="stack-wrap">' + stackHtml +
      '<div class="card focus-card">' +
      '<span class="priority-tag" style="color:' + PRIORITY_COLORS[current.priority] + '">Priority ' + current.priority + '</span>' +
      kicker +
      '<p class="task-display">' + escapeHtml(current.text) + '</p>' +
      chips +
      '</div></div>' +
      (supplierMatch ? supplierStripHtml(supplierMatch) : '') +
      '<div class="due-count">' + elig.length + ' due now</div>' +
      actionsHtml + '</div>';
  }

  function renderSubtaskFocus(parent, backBtn, wrapClass) {
    var pending = pendingSubtasks(parent);

    if (S.subtaskJustDone) {
      var allClear = pending.length === 0;
      return '<div class="' + wrapClass + '">' + backBtn +
        '<div class="card empty-card">' +
        '<p class="empty-title">Step done.</p>' +
        (allClear ? '<p class="empty-sub">That was the last step for this one.</p>' : '<p class="empty-sub">' + pending.length + (pending.length === 1 ? ' step left.' : ' steps left.') + '</p>') +
        '</div>' +
        (pending.length > 0 ? '<button class="btn-primary" data-action="next-subtask">Next step →</button>' : '') +
        (allClear ? '<button class="btn-primary" data-action="mark-parent-from-subtasks">Mark "' + escapeHtml(parent.text) + '" done too →</button>' : '') +
        '<button class="btn-secondary" data-action="back-to-main-task">Back to main tasks →</button>' +
        '</div>';
    }

    var sub = (parent.subtasks || []).find(function (s) { return s.id === S.currentSubtaskId; });
    if (!sub) {
      S.inSubtaskMode = false;
      S.currentSubtaskId = null;
      return '<div class="' + wrapClass + '">' + backBtn +
        '<div class="card empty-card"><p class="empty-title">That step is gone.</p></div>' +
        '<button class="btn-primary" data-action="back-to-main-task">Back to main task</button></div>';
    }

    return '<div class="' + wrapClass + '">' + backBtn +
      '<div class="breadcrumb">Within: ' + escapeHtml(parent.text) + '</div>' +
      '<div class="card subtask-card">' +
      (sub.quick ? '<span class="quick-tag">⚡ Quick step</span>' : '<span class="priority-tag" style="color:' + PRIORITY_COLORS[sub.priority] + '">Priority ' + sub.priority + '</span>') +
      '<p class="task-display small">' + escapeHtml(sub.text) + '</p>' +
      '</div>' +
      '<button class="btn-primary" data-action="subtask-done">Done — this step</button>' +
      '<button class="btn-secondary" data-action="back-to-main-task">← Back to main task</button>' +
      '</div>';
  }

  function renderQuick() {
    useSession("solo");
    return renderQuickBody("center-col",
      '<button class="back-link" data-action="back-to-plan">← Back to plan</button>', true);
  }
  /* `standalone` is the difference between filling the screen and sitting in a column.
     On its own it needs a way back when the sweep runs out; in a column the rest of the
     screen is right there, so a button would be in the way. */
  function renderQuickBody(wrapClass, backBtn, standalone) {
    var current = tasks.find(function (t) { return t.id === S.quickQueue[0]; });
    if (!current) {
      return '<div class="' + wrapClass + '"><div class="card empty-card">' +
        '<p class="empty-title' + (standalone ? '' : ' small') + '">Small stuff cleared.</p></div>' +
        (standalone ? '<button class="btn-primary" data-action="back-to-plan">Back to plan</button>' : '') +
        '</div>';
    }
    return '<div class="' + wrapClass + '">' + backBtn +
      '<div class="card quick-card"><span class="quick-tag">⚡ Quick</span>' +
      '<p class="task-display small">' + escapeHtml(current.text) + '</p></div>' +
      '<div class="due-count">' + S.quickQueue.length + ' left in this sweep</div>' +
      '<button class="btn-primary" data-action="quick-done">Done — next one</button>' +
      '<button class="btn-secondary" data-action="quick-skip" ' + (S.quickQueue.length <= 1 ? 'disabled' : '') + '>Not now — send to the back</button>' +
      '</div>';
  }

  function renderDailies() {
    useSession("solo");
    return renderDailiesBody("center-col",
      '<button class="back-link" data-action="back-to-plan">← Back to plan</button>', true);
  }
  function renderDailiesBody(wrapClass, backBtn, standalone) {
    var current = tasks.find(function (t) { return t.id === S.dailyQueue[0]; });
    if (!current) {
      return '<div class="' + wrapClass + '"><div class="card empty-card">' +
        '<p class="empty-title' + (standalone ? '' : ' small') + '">Dailies cleared for today.</p></div>' +
        (standalone ? '<button class="btn-primary" data-action="back-to-plan">Back to plan</button>' : '') +
        '</div>';
    }
    var label = current.repeat === "daily" ? "🔁 Daily" : "🔁 Weekly";
    return '<div class="' + wrapClass + '">' + backBtn +
      '<div class="card quick-card"><span class="quick-tag">' + label + '</span>' +
      '<p class="task-display small">' + escapeHtml(current.text) + '</p></div>' +
      '<div class="due-count">' + S.dailyQueue.length + ' left in this sweep</div>' +
      '<button class="btn-primary" data-action="daily-done">Done — next one</button>' +
      '<button class="btn-secondary" data-action="daily-skip" ' + (S.dailyQueue.length <= 1 ? 'disabled' : '') + '>Not now — send to the back</button>' +
      '</div>';
  }

  function reflectionLine(count) {
    if (count === 0) return "A quiet one — that's alright too.";
    if (count <= 2) return "A couple of things off your plate.";
    if (count <= 5) return "Nice work today.";
    if (count <= 9) return "That's a proper day's work.";
    return "That's a lot cleared today — well done.";
  }

  // Shown once on the first open of a new day: what you finished yesterday,
  // and what rolled forward automatically overnight.
  function renderRecap() {
    var yesterday = addDaysStr(-1);
    var doneYesterday = completionsOn(yesterday).filter(function (c) { return c.type !== "step"; });
    var stepsYesterday = completionsOn(yesterday).filter(function (c) { return c.type === "step"; });
    var carried = rolledOverToday();

    var listHtml = doneYesterday.length > 0
      ? '<ul class="wrap-list">' + doneYesterday.map(function (t) {
          return '<li class="wrap-list-item"><span class="wrap-check">✓</span><span class="wrap-strike">' + escapeHtml(t.text) + '</span></li>';
        }).join('') + '</ul>'
      : '';

    var stepsHtml = "";
    if (stepsYesterday.length > 0) {
      stepsHtml = '<div class="steps-wrap-box">' +
        '<div class="steps-wrap-header">🔹 ' + stepsYesterday.length + (stepsYesterday.length === 1 ? ' step chipped away' : ' steps chipped away') + '</div>' +
        '<ul class="wrap-list steps">' + stepsYesterday.map(function (c) {
          return '<li class="wrap-list-item"><span class="wrap-check">✓</span>' +
            '<span class="wrap-step-text-wrap"><span class="wrap-strike">' + escapeHtml(c.text) + '</span>' +
            (c.parentText ? '<span class="wrap-step-parent">within ' + escapeHtml(c.parentText) + '</span>' : '') +
            '</span></li>';
        }).join('') + '</ul>' +
        '</div>';
    }

    var carriedHtml = "";
    if (carried.length > 0) {
      carriedHtml = '<div class="moving-box rolled">' +
        '<div class="moving-label">Carried over to today (' + carried.length + ')</div>' +
        carried.map(function (t) {
          return '<div class="moving-row"><span class="moving-dot" style="background:' + PRIORITY_COLORS[t.priority] + '"></span>' +
            '<span class="moving-text">' + escapeHtml(t.text) + '</span></div>';
        }).join('') + '</div>';
    }

    return '<div class="center-col">' +
      '<div class="recap-kicker">Yesterday — ' + fmtDate(yesterday) + '</div>' +
      '<div class="card wrap-card">' +
      '<div class="wrap-stat-block">' +
      '<div class="wrap-stat-num">' + doneYesterday.length + '</div>' +
      '<div class="wrap-stat-label">' + (doneYesterday.length === 1 ? "task done yesterday" : "tasks done yesterday") + '</div>' +
      '<div class="wrap-reflection">' + reflectionLine(doneYesterday.length) + '</div>' +
      '</div>' + listHtml +
      '</div>' +
      stepsHtml +
      carriedHtml +
      '<button class="btn-primary" data-action="dismiss-recap">Start today →</button>' +
      '</div>';
  }

  function renderSubtaskRow(parentId, s) {
    var done = s.status === "done";
    return '<div class="subtask-row ' + (done ? 'done' : '') + '">' +
      '<button class="subtask-check" data-action="toggle-subtask" data-parent="' + parentId + '" data-id="' + s.id + '">' + (done ? '✓' : '○') + '</button>' +
      '<span class="subtask-text ' + (done ? 'strike' : '') + '">' + escapeHtml(s.text) + '</span>' +
      (!done ? priorityDotsSub(s.priority, parentId, s.id) : '') +
      (!done ? '<button class="icon-btn ' + (s.quick ? 'lit' : '') + '" data-action="toggle-subtask-quick" data-parent="' + parentId + '" data-id="' + s.id + '" title="Under a few minutes">⚡</button>' : '') +
      '<button class="icon-btn danger" data-action="remove-subtask" data-parent="' + parentId + '" data-id="' + s.id + '">×</button>' +
      '</div>';
  }

  function priorityDotsSub(selected, parentId, subId) {
    var out = '<div class="priority-picker sub">';
    for (var p = 1; p <= 5; p++) {
      var active = selected === p;
      var style = active ? ('background:' + PRIORITY_COLORS[p] + ';border-color:' + PRIORITY_COLORS[p]) : '';
      out += '<button class="p-dot mini ' + (active ? 'active' : '') + '" style="' + style + '" data-action="set-subtask-priority" data-parent="' + parentId + '" data-id="' + subId + '" data-p="' + p + '">' + p + '</button>';
    }
    out += '</div>';
    return out;
  }

  function renderNotesOverlay() {
    var task = tasks.find(function (t) { return t.id === notesTaskId; });
    if (!task) return '';
    var subs = task.subtasks || [];
    var pending = subs.filter(function (s) { return s.status !== "done"; });
    var done = subs.filter(function (s) { return s.status === "done"; });

    var subtasksHtml = '<div class="subtasks-section">' +
      '<div class="subtasks-label">Steps' + (subs.length > 0 ? ' (' + pending.length + ' left)' : '') + '</div>' +
      (pending.length + done.length > 0 ? '<div class="subtasks-list">' + pending.map(function (s) { return renderSubtaskRow(task.id, s); }).join('') + done.map(function (s) { return renderSubtaskRow(task.id, s); }).join('') + '</div>' : '') +
      '<div class="add-subtask-row">' +
      '<input id="subtaskInput" class="subtask-input" placeholder="Add a smaller step" value="' + escapeHtml(draftSubtaskText) + '" />' +
      priorityDotsDraftSub() +
      '<button class="quick-toggle ' + (draftSubtaskQuick ? 'active' : '') + '" data-action="toggle-draft-subtask-quick">⚡</button>' +
      '<button class="btn-add" data-action="add-subtask">Add</button>' +
      '</div></div>';

    /* Priority and who it is for live here as well as on the row.

       On the shared list the rows sit inside a column headed with a name, grouped under
       a heading naming the priority — so a chip repeating the name and a badge
       repeating the number are saying what is already said twice above them. They can
       come off the row, but only once the things they DO are somewhere else, which is
       here. Taking a control away and calling it tidying is just losing a feature. */
    var detailHtml = '<div class="detail-row">' +
      '<span class="detail-label">Priority</span>' +
      '<span class="priority-picker sub">' +
      [1, 2, 3, 4, 5].map(function (n) {
        var on = task.priority === n;
        return '<button class="p-dot mini ' + (on ? 'active' : '') + '" style="' +
          (on ? 'background:' + PRIORITY_COLORS[n] + ';border-color:' + PRIORITY_COLORS[n] : '') +
          '" data-action="set-priority" data-id="' + task.id + '" data-p="' + n + '">' + n + '</button>';
      }).join('') + '</span></div>';

    if (sharing()) {
      detailHtml += '<div class="detail-row"><span class="detail-label">For</span>' +
        '<span class="who-row inline">' +
        pair().map(function (person) {
          return '<button class="who-pick' + (task.assignee === person.id ? ' on' : '') + '" ' +
            'data-action="assign-task" data-id="' + task.id + '" data-key="' + person.id + '">' +
            escapeHtml(firstNameOf(person.name)) + '</button>';
        }).join('') +
        '<button class="who-pick' + (!task.assignee ? ' on' : '') + '" ' +
        'data-action="assign-task" data-id="' + task.id + '" data-key="anyone">Anyone</button>' +
        '</span></div>';
    }

    detailHtml += insideRowHtml(task) + supplierSectionHtml(task);

    var titleHtml = editingNameId === task.id
      ? '<input id="renameInput" class="rename-input" data-id="' + task.id + '" value="' + escapeHtml(task.text) + '" />'
      : '<div class="overlay-title renameable" data-rename="' + task.id + '" title="Double-click to rename">' +
        escapeHtml(task.text) + '</div>';

    return '<div class="overlay"><div class="overlay-inner">' +
      '<div class="overlay-header"><div class="overlay-heading"><div class="overlay-kicker">Notes</div>' +
      titleHtml + '</div>' +
      '<button class="close-circle" data-action="close-notes">×</button></div>' +
      '<div class="overlay-scroll">' +
      detailHtml + subtasksHtml +
      '<textarea id="notesTextarea" data-id="' + task.id + '" class="notes-textarea" placeholder="Anything worth jotting down for this one — links, context, next steps…">' + escapeHtml(task.notes || "") + '</textarea>' +
      '<button class="btn-primary" data-action="close-notes">Done</button>' +
      '</div></div></div>';
  }

  /* Filing is rare and the list of customers only grows, so this is a value you tap
     rather than every option laid out at once. Twenty customers would otherwise be
     twenty pills sitting on a screen you opened to change a priority. */
  function insideRowHtml(task) {
    if (!containersOn()) return '';
    if (!insidePickerOpen) {
      var name = task.containerId ? containerName(task.containerId) : null;
      return '<div class="detail-row"><span class="detail-label">Inside</span>' +
        '<button class="value-btn" data-action="open-inside-picker">' +
        (name ? escapeHtml(name) : '<span class="faint">On its own</span>') +
        ' <span class="faint">›</span></button></div>';
    }
    var q = insideSearch.trim().toLowerCase();
    var list = containers.filter(function (c) {
      return !q || c.text.toLowerCase().indexOf(q) !== -1;
    }).slice(0, 8);
    return '<div class="detail-row wrap"><span class="detail-label">Inside</span>' +
      '<div class="inside-picker">' +
      '<input id="insideSearch" class="field-input" placeholder="Which customer or job?" value="' +
      escapeHtml(insideSearch) + '" />' +
      '<div class="pill-row">' +
      '<button class="who-pick' + (!task.containerId ? ' on' : '') + '" data-action="set-task-container" ' +
      'data-id="' + task.id + '" data-container="">On its own</button>' +
      list.map(function (c) {
        return '<button class="who-pick' + (task.containerId === c.id ? ' on' : '') +
          '" data-action="set-task-container" data-id="' + task.id + '" data-container="' + c.id + '">' +
          escapeHtml(c.text) + '</button>';
      }).join('') +
      (list.length === 0 && q ? '<span class="setting-desc">Nothing by that name yet.</span>' : '') +
      '</div></div></div>';
  }

  /* The supplier, on the task's own sheet. Three states: matched by brand (shown, with
     a quiet way to correct it), matched because you said so, or not an order at all —
     in which case nothing, because a supplier on a repair job is just noise. */
  function supplierSectionHtml(task) {
    if (!suppliersOn()) return '';
    var m = supplierFor(task);
    if (!m && !isOrderish(task) && !task.supplierOff) return '';

    var h = '<div class="subtasks-label" style="margin-top:18px">Where from</div>';

    if (supplierPickerFor === task.id) {
      return h + '<div class="pill-row">' +
        '<button class="who-pick' + (task.supplierOff ? ' on' : '') + '" data-action="set-task-supplier" ' +
        'data-id="' + task.id + '" data-supplier="">None</button>' +
        suppliersByName().map(function (s) {
          return '<button class="who-pick' + (task.supplierId === s.id ? ' on' : '') +
            '" data-action="set-task-supplier" data-id="' + task.id + '" data-supplier="' + s.id + '">' +
            escapeHtml(s.name || "Unnamed") + '</button>';
        }).join('') +
        (suppliers().length === 0 ? '<span class="setting-desc">No suppliers yet — add them from the menu.</span>' : '') +
        '</div>';
    }

    if (!m) {
      return h + '<button class="inside-suggest" data-action="open-supplier-picker" data-id="' + task.id + '">' +
        (task.supplierOff ? 'Not linked to a supplier' : 'No supplier recognised') +
        ' — <strong>pick one</strong></button>';
    }

    h += supplierStripHtml(m);
    h += '<button class="link-btn" data-action="open-supplier-picker" data-id="' + task.id + '">' +
      (m.via ? 'Wrong one? Change it' : 'Change or unlink') + '</button>';

    if (!m.via && task.supplierId) {
      var guess = guessBrand(task, m.supplier);
      if (guess) {
        h += '<div class="field-row"><span class="detail-label">Remember</span>' +
          '<input id="brandInput" class="field-input" value="' + escapeHtml(guess) + '" />' +
          '<button class="btn-add" data-action="remember-brand" data-id="' + task.id + '">Always ' +
          escapeHtml(m.supplier.name) + '</button></div>';
      }
    }
    return h;
  }

  /* One strip, drawn under the focus card and inside the task sheet. Both sit on the
     dark background, so it never needs a second version of itself. */
  function supplierStripHtml(m) {
    var s = m.supplier;
    var meta = [];
    if (s.account) meta.push("acct " + s.account);
    if (s.method === "portal" && s.username) meta.push("user " + s.username);
    if (s.note) meta.push(s.note);

    var acts = [];
    if (s.url) {
      var href = /^https?:/i.test(s.url) ? s.url : "https://" + s.url;
      acts.push('<a class="pill-link" href="' + escapeHtml(href) + '" target="_blank" rel="noopener">Open portal</a>');
    }
    if (s.phone) acts.push('<a class="pill-link" href="tel:' + escapeHtml(s.phone.replace(/\s+/g, '')) +
      '">Call ' + escapeHtml(s.phone) + '</a>');
    if (s.email) acts.push('<a class="pill-link" href="mailto:' + escapeHtml(s.email) + '">Email</a>');

    return '<div class="supplier-strip"><div class="supplier-line"><strong>' + escapeHtml(s.name) + '</strong>' +
      (m.via ? '<span class="via">via ' + escapeHtml(m.via) + '</span>' : '') +
      (s.method ? '<span class="steps-tag">' + escapeHtml(SUPPLIER_METHODS[s.method] || s.method) + '</span>' : '') +
      '</div>' +
      (meta.length ? '<div class="supplier-meta">' + escapeHtml(meta.join(' · ')) + '</div>' : '') +
      (acts.length ? '<div class="pill-row">' + acts.join('') + '</div>' : '') +
      '</div>';
  }

  /* ---- The container page ----

     Everything under one customer or job, on one screen. This is the view the app had
     by accident when a customer was a task and the work was its steps — and losing
     that was the thing that made a flat list feel worse rather than better. Here it is
     on purpose, and it reads the same whether the name is a person or a running job. */
  function renderContainerOverlay() {
    var c = containerById(openContainerId);
    if (!c) return '';
    var all = tasksIn(c.id);
    var open = all.filter(function (t) { return t.status !== "done"; }).sort(byPriorityThenOrder);
    var done = all.filter(function (t) { return t.status === "done"; });
    var notes = notesOf(c);
    var who = shortLabel(c.text);

    var head = editingNameId === c.id
      ? '<input id="renameInput" class="rename-input" data-id="' + c.id + '" value="' + escapeHtml(c.text) + '" />'
      : '<div class="overlay-title renameable" data-rename="' + c.id + '" title="Double-click to rename">' +
        escapeHtml(c.text) + '</div>';

    var sub = (open.length
      ? open.length + (open.length === 1 ? ' thing outstanding' : ' things outstanding')
      : 'Nothing outstanding') +
      (done.length ? ' · ' + done.length + ' done' : '') +
      (notes.length ? ' · last update ' + noteWhen(notes[0].ts).toLowerCase() : '');

    var body = '<div class="c-sub">' + escapeHtml(sub) + '</div>' + containerDetailsHtml(c);

    body += '<div class="subtasks-label" style="margin-top:22px">Outstanding</div>';
    body += open.length
      ? open.map(renderContainerTaskRow).join('')
      : '<div class="empty-state">Nothing right now. This one waits in Standing until something comes up.</div>';

    body += containerAddHtml(c, who);

    /* Nothing at all until there is something. A box announcing that it is empty is
       furniture — and on Original the writing box is up there with the tasks now, so
       there is nothing left down here to introduce. */
    if (notes.length) {
      body += '<div class="subtasks-label" style="margin-top:28px">Updates (' + notes.length + ')</div>' +
        notes.map(function (n) {
          return '<div class="note"><div class="note-meta">' + escapeHtml(noteWhen(n.ts)) +
            '<button class="icon-btn danger note-x" data-action="remove-container-note" ' +
            'data-id="' + c.id + '" data-note="' + n.id + '">×</button></div>' +
            '<div class="note-text">' + escapeHtml(n.text) + '</div></div>';
        }).join('');
    }

    if (done.length) {
      body += '<div class="subtasks-label" style="margin-top:26px">Done</div>' +
        done.map(function (t) {
          return '<div class="subtask-row done"><span class="subtask-check">✓</span>' +
            '<span class="subtask-text strike">' + escapeHtml(t.text) + '</span></div>';
        }).join('');
    }

    body += '<div class="c-foot"><button class="btn-secondary danger-text" data-action="delete-container" ' +
      'data-id="' + c.id + '">Delete this one</button>' +
      '<span class="setting-desc">' + (open.length
        ? 'Anything inside comes back out as a task of its own.'
        : 'Nothing inside, so nothing to lose.') + '</span></div>';

    return '<div class="overlay"><div class="overlay-inner">' +
      '<div class="overlay-header">' +
      '<button class="back-circle" data-action="close-container" aria-label="Back">‹</button>' +
      '<div class="overlay-heading"><div class="overlay-kicker">Customer or job</div>' + head + '</div>' +
      '<button class="close-circle" data-action="close-container" aria-label="Close">×</button></div>' +
      '<div class="overlay-scroll">' + body + '</div>' +
      '</div></div>';
  }

  /* One bar on the customer's page too, in whichever shape you chose.

     Everything typed here already belongs to this customer, so the only question is
     whether it is something to do or something that happened — and you know which
     before you start typing. Original keeps the two boxes it had; the other two ask
     with one word or one button rather than a second field. */
  function containerAddHtml(c, who) {
    var style = addStyle();
    var place = 'Add something' + (who ? ' for ' + escapeHtml(who) : '');
    var d = draftParts();

    if (style === "original") {
      return '<div class="add-subtask-row" style="margin-top:10px">' +
        '<input id="containerTaskInput" class="subtask-input" placeholder="' + place + '" value="" />' +
        '<button class="btn-add" data-action="add-container-task" data-id="' + c.id + '">Add</button></div>' +
        '<div class="subtasks-label" style="margin-top:28px">Updates</div>' +
        '<textarea id="containerNoteInput" class="note-input" rows="2" placeholder="What happened?">' +
        escapeHtml(containerNoteDraft) + '</textarea>' +
        '<div class="note-row"><span class="setting-desc">Dated automatically.</span>' +
        '<button class="btn-add" data-action="add-container-note" data-id="' + c.id + '">Add update</button></div>';
    }

    if (style === "sentence") {
      return '<div class="add-box sentence-box" style="margin-top:10px">' +
        addFieldHtml(place, true) +
        (d.title
          ? sentenceHtml(true).replace('data-action="add-task"',
              'data-action="' + (draftIsContainer ? 'add-container-note' : 'add-container-task') +
              '" data-id="' + c.id + '"')
          : '') + '</div>';
    }

    // Reveal: two buttons rather than a mode. You know which one you just typed.
    var h = '<div class="add-box" style="margin-top:10px">' + addFieldHtml(place, false);
    if (!d.title) return h + '</div>';
    return h + '<div class="add-row">' +
      '<button class="btn-secondary small" data-action="add-container-note" data-id="' + c.id + '">Add update</button>' +
      '<span class="add-spacer"></span>' +
      '<div class="priority-picker"><span class="priority-label">Priority</span>' +
      draftPriorityDots("select-draft-priority") + '</div>' +
      '<button class="btn-add" data-action="add-container-task" data-id="' + c.id + '">Add task</button>' +
      '</div></div>';
  }

  // Inside a customer, a task is a line you tick, nudge or open — not a plan row.
  function renderContainerTaskRow(t) {
    return '<div class="subtask-row">' +
      '<button class="subtask-check" data-action="complete-task" data-id="' + t.id + '">○</button>' +
      '<span class="subtask-text">' + escapeHtml(t.text) + '</span>' + stepsTag(t) +
      '<button class="p-dot mini" style="background:' + PRIORITY_COLORS[t.priority] +
      ';border-color:' + PRIORITY_COLORS[t.priority] + '" data-action="open-notes" data-id="' + t.id + '">' +
      t.priority + '</button>' +
      '<button class="icon-btn" data-action="open-notes" data-id="' + t.id + '" title="Open">›</button>' +
      '</div>';
  }

  /* The details.

     A number and an email are things you need about twice a job and never want to go
     looking for — but they are also the same three lines on every customer, so left
     open they would push the actual work down the screen every single time. So they
     are a line you tap, and that line carries the part you most often want (the
     number) rather than just the word "Details". */
  function containerDetailsHtml(c) {
    var people = contactsOf(c);
    var bits = [];
    if (c.phone) bits.push(c.phone);
    if (c.email) bits.push(c.email);
    if (!bits.length && c.about) bits.push(c.about);
    if (people.length) bits.push(people.length + (people.length === 1 ? " other person" : " others"));

    var h = '<button class="details-bar" data-action="toggle-container-details">' +
      '<span>' + (showDetails ? '▾' : '▸') + ' Details</span>' +
      (showDetails ? '' : '<span class="details-hint">' +
        escapeHtml(bits.length ? bits.join(' · ') : 'Nothing yet') + '</span>') + '</button>';
    if (!showDetails) return h;

    h += '<div class="details-box">' +
      detailField(c.id, "Phone", "phone", c.phone, "Mobile or landline", false) +
      detailField(c.id, "Email", "email", c.email, "Where you write to them", false) +
      detailField(c.id, "About", "about", c.about, "What this is, and anything to remember", true);

    var acts = [];
    if (c.phone) acts.push('<a class="pill-link" href="tel:' + escapeHtml(String(c.phone).replace(/\s+/g, '')) +
      '">Call ' + escapeHtml(c.phone) + '</a>');
    if (c.email) acts.push('<a class="pill-link" href="mailto:' + escapeHtml(c.email) + '">Email</a>');
    if (acts.length) h += '<div class="pill-row">' + acts.join('') + '</div>';

    h += '<div class="subtasks-label" style="margin-top:16px">Other people</div>';
    h += people.length
      ? people.map(function (p) { return contactHtml(c.id, p); }).join('')
      : '<div class="empty-state small">Nobody else yet.</div>';
    h += '<button class="link-btn" data-action="add-container-contact" data-id="' + c.id + '">+ Add a person</button>';

    return h + '</div>';
  }

  function detailField(cid, label, field, value, placeholder, multi) {
    var attrs = 'class="field-input" placeholder="' + escapeHtml(placeholder) + '" ' +
      'data-field="' + field + '" data-container="' + cid + '"';
    return '<div class="field-row"><span class="detail-label">' + label + '</span>' +
      (multi
        ? '<textarea ' + attrs + ' rows="2">' + escapeHtml(value || '') + '</textarea>'
        : '<input ' + attrs + ' value="' + escapeHtml(value || '') + '" />') + '</div>';
  }

  function contactHtml(cid, p) {
    var isOpen = openContactId === p.id;
    var title = (p.name || "Unnamed") + (p.role ? " · " + p.role : "");
    var h = '<div class="contact-line">' +
      '<button class="contact-name" data-action="toggle-contact" data-id="' + p.id + '">' +
      escapeHtml(title) + ' <span class="c-more">' + (isOpen ? '▾' : '✎') + '</span></button>';
    if (p.phone) h += '<a class="pill-link" href="tel:' + escapeHtml(String(p.phone).replace(/\s+/g, '')) + '">Call</a>';
    if (p.email) h += '<a class="pill-link" href="mailto:' + escapeHtml(p.email) + '">Email</a>';
    h += '</div>';
    if (isOpen) {
      h += '<div class="contact-fields">' +
        contactField(cid, p, "Name", "name", "Who they are") +
        contactField(cid, p, "Role", "role", "Sparky, builder, partner, site manager") +
        contactField(cid, p, "Phone", "phone", "Mobile") +
        contactField(cid, p, "Email", "email", "Email") +
        '<button class="link-btn" data-action="remove-container-contact" data-id="' + cid +
        '" data-contact="' + p.id + '">Remove this person</button></div>';
    }
    return h;
  }

  function contactField(cid, p, label, field, placeholder) {
    return '<div class="field-row"><span class="detail-label">' + label + '</span>' +
      '<input class="field-input" placeholder="' + escapeHtml(placeholder) + '" ' +
      'value="' + escapeHtml(p[field] || '') + '" data-field="' + field + '" ' +
      'data-container="' + cid + '" data-contact="' + p.id + '" /></div>';
  }

  function priorityDotsDraftSub() {
    var out = '<div class="priority-picker sub">';
    for (var p = 1; p <= 5; p++) {
      var active = draftSubtaskPriority === p;
      var style = active ? ('background:' + PRIORITY_COLORS[p] + ';border-color:' + PRIORITY_COLORS[p]) : '';
      out += '<button class="p-dot mini ' + (active ? 'active' : '') + '" style="' + style + '" data-action="select-draft-subtask-priority" data-p="' + p + '">' + p + '</button>';
    }
    out += '</div>';
    return out;
  }

  function switchRow(name, desc, key) {
    var on = !!settings[key];
    return '<div class="setting-row">' +
      '<div class="setting-text"><div class="setting-name">' + name + '</div>' +
      '<div class="setting-desc">' + desc + '</div></div>' +
      '<button class="switch ' + (on ? 'on' : '') + '" data-action="toggle-setting" data-key="' + key + '" ' +
      'role="switch" aria-checked="' + on + '" aria-label="' + name + '"><span class="knob"></span></button>' +
      '</div>';
  }

  /* Where kit comes from. Tucked in the menu because it is set up on a wet Tuesday and
     then never opened again — the payoff shows up on the focus card, not here. */
  function renderMenuSuppliers() {
    var shown = findSuppliers(supplierSearch);
    var h = '<p class="sync-desc">Order tasks find these on their own, by brand. ' +
      'Type “Ortofon” into a task and whoever sells Ortofon comes with it.</p>';

    h += '<input id="supplierSearch" class="task-input" style="margin:16px 0 14px" ' +
      'placeholder="Search a supplier or a brand" value="' + escapeHtml(supplierSearch) + '" />';

    h += shown.map(function (s) {
      var isOpen = openSupplierId === s.id;
      var c = '<div class="supplier-card"><button class="supplier-head" data-action="toggle-supplier" data-id="' + s.id + '">' +
        '<span class="supplier-name">' + escapeHtml(s.name || "Unnamed") +
        '<span class="supplier-brands">' +
        ((s.brands || []).length ? escapeHtml(s.brands.join(' · ')) : 'No brands yet — it will never match') +
        '</span></span>' +
        (s.method ? '<span class="steps-tag">' + escapeHtml(SUPPLIER_METHODS[s.method] || s.method) + '</span>' : '') +
        '<span class="chev">' + (isOpen ? '▾' : '▸') + '</span></button>';

      if (isOpen) {
        c += '<div class="supplier-body">' +
          supplierField(s, "Name", "name", "Who you order from", false) +
          supplierField(s, "Brands", "brands", "Ortofon, Pro-Ject, Goldring — comma separated", true) +
          '<div class="field-row"><span class="detail-label">How</span><span class="segmented small">' +
          ["phone", "email", "portal"].map(function (k) {
            return '<button class="' + (s.method === k ? "active" : "") + '" data-action="set-supplier-method" ' +
              'data-id="' + s.id + '" data-method="' + k + '">' + SUPPLIER_METHODS[k] + '</button>';
          }).join('') + '</span></div>' +
          supplierField(s, "Phone", "phone", "Trade line", false) +
          supplierField(s, "Email", "email", "Orders inbox", false) +
          supplierField(s, "Website", "url", "trade.example.co.uk", false) +
          supplierField(s, "Username", "username", "Your login — not the password", false) +
          supplierField(s, "Account", "account", "Account number", false) +
          supplierField(s, "Note", "note", "Cut-off times, who to ask for, anything fiddly", true) +
          '<div class="note-row"><span class="setting-desc">Passwords stay in your phone’s ' +
          'keychain, never in here.</span>' +
          '<button class="link-btn" data-action="remove-supplier" data-id="' + s.id + '">Remove</button></div>' +
          '</div>';
      }
      return c + '</div>';
    }).join('');

    if (!suppliers().length) h += '<div class="empty-state">No suppliers yet.</div>';
    else if (!shown.length) {
      h += '<div class="empty-state">Nothing matches “' + escapeHtml(supplierSearch.trim()) +
        '”. If it is a brand you buy, add it to whoever sells it.</div>';
    }

    return h + '<button class="btn-primary" style="margin-top:16px" data-action="add-supplier">Add a supplier</button>';
  }

  function supplierField(s, label, field, placeholder, multi) {
    var value = field === "brands" ? (s.brands || []).join(", ") : (s[field] || "");
    var attrs = 'class="field-input" placeholder="' + escapeHtml(placeholder) + '" ' +
      'data-supplier-field="' + field + '" data-id="' + s.id + '"';
    return '<div class="field-row"><span class="detail-label">' + label + '</span>' +
      (multi
        ? '<textarea ' + attrs + ' rows="2">' + escapeHtml(value) + '</textarea>'
        : '<input ' + attrs + ' value="' + escapeHtml(value) + '" />') + '</div>';
  }

  function supplierSummary() {
    var n = suppliers().length;
    return n === 0 ? "None yet" : n + (n === 1 ? " supplier" : " suppliers");
  }

  function renderMenuRoot() {
    var themeName = (THEMES.filter(function (t) { return t.id === settings.theme; })[0] || THEMES[2]).name;
    return '<div class="menu-section-label">Viewing</div>' +
      '<div class="segmented">' +
      ["work", "personal"].concat(teamListOn() ? ["team"] : []).map(function (p) {
        return '<button class="' + (profile === p ? "active" : "") +
          '" data-action="switch-profile" data-profile="' + p + '">' + profileName(p) + '</button>';
      }).join('') +
      '</div>' +
      '<div class="menu-divider"></div>' +
      '<div class="menu-section-label">' + profileName(profile) + ' settings</div>' +
      '<div class="menu-list">' +
      menuItem("Task settings", "What this view can do", "tasks") +
      (isTeam() ? menuItem("Who works from this", rosterSummary(), "coworkers") : "") +
      menuItem("Appearance", themeName, "appearance") +
      '</div>' +
      '<div class="menu-divider"></div>' +
      '<div class="setting-row" style="border:none">' +
      '<div class="setting-text"><div class="setting-name">Team list</div>' +
      '<div class="setting-desc">A third list two people work from on one device, ' +
      'with a card each in focus mode.</div></div>' +
      '<button class="switch ' + (teamListOn() ? 'on' : '') + '" data-action="toggle-team-list" ' +
      'role="switch" aria-checked="' + teamListOn() + '" aria-label="Team list">' +
      '<span class="knob"></span></button></div>' +
      '<div class="setting-row" style="border:none">' +
      '<div class="setting-text"><div class="setting-name">Suppliers</div>' +
      '<div class="setting-desc">Where kit comes from. Tasks that mention a brand you buy ' +
      'bring the account number and the way to order straight to the card.</div></div>' +
      '<button class="switch ' + (suppliersOn() ? 'on' : '') + '" data-action="toggle-suppliers" ' +
      'role="switch" aria-checked="' + suppliersOn() + '" aria-label="Suppliers">' +
      '<span class="knob"></span></button></div>' +
      (suppliersOn() ? '<div class="menu-list">' + menuItem("Suppliers", supplierSummary(), "suppliers") + '</div>' : '') +
      '<div class="menu-divider"></div>' +
      '<div class="menu-section-label">This device</div>' +
      '<div class="menu-list">' +
      menuItem("Notifications", notifySummary(), "notifications") +
      menuItem("Sync between devices", syncCode ? "Linked — code " + syncCode : "Not set up", "sync") +
      menuItem("Copy or move your data", "Move everything to another device", "data") +
      '</div>' +
      '<div class="menu-divider"></div>' +
      '<div class="menu-list">' +
      menuItem("Advanced setup", advancedSummary(), "advanced") +
      menuItem("How this works", "A quick tour of the app", "tutorial") +
      '</div>';
  }

  function notifySummary() {
    if (pushBlockedReason() === "needs-install") return "Add to Home Screen first";
    if (pushBlockedReason() === "needs-sync") return "Needs sync set up";
    if (!push.enabled) return "Off";
    var on = NOTIFY_TYPES.filter(function (t) { return push.types[t.id]; }).length;
    return on === 0 ? "On, none selected" : on + (on === 1 ? " type" : " types") + " on";
  }

  function menuItem(label, sub, page) {
    return '<button class="menu-item" data-action="menu-page" data-page="' + page + '">' +
      '<span class="menu-item-label"><span>' + label + '</span><span class="menu-sub">' + escapeHtml(sub) + '</span></span>' +
      '<span class="chev">›</span></button>';
  }

  function renderMenuTasks() {
    var scope = profileName(profile).toLowerCase();
    return '<p class="sync-desc">These apply to your <strong>' + scope + '</strong> list only. ' +
      'The other one keeps its own settings.</p>' +
      '<div style="margin-top:18px">' +
      switchRow("Customers and jobs", "Group tasks under the customer or job they belong to. The plan shows one line each with the next thing to do, and each one gets a page with its details, its updates and everything outstanding.", "containers") +
      switchRow("Repeating tasks", "Adds a repeat option when creating a task, and a sweep for knocking out the day’s repeats.", "repeats") +
      switchRow("Complete from the plan", "Tap the circle or swipe a task right to finish it without entering focus.", "completeFromPlan") +
      switchRow("Fold priorities away", "Show each priority as a drawer you open, instead of every task at once. Keeps the plan short.", "groupedPlan") +
      switchRow("Start today page", "The morning summary of yesterday. Tasks roll over to the next day either way — this only decides whether you see the page.", "morningRecap") +
      switchRow("Put tasks on hold", "For anything blocked on someone else — waiting on a price, a measurement, a call back. Held tasks leave your queue and wait in their own drawer.", "holds") +
      '</div>' +
      (settings.holds
        ? '<div class="menu-divider"></div>' +
          '<div class="menu-section-label">Chase a held task after</div>' +
          '<div class="segmented">' +
          [[1, "1 day"], [3, "3 days"], [7, "A week"]].map(function (o) {
            return '<button class="' + (holdThreshold() === o[0] ? "active" : "") +
              '" data-action="set-hold-days" data-mode="' + o[0] + '">' + o[1] + '</button>';
          }).join('') +
          '</div>' +
          '<p class="setting-desc" style="margin-top:10px">Anything held longer than this is flagged in the ' +
          'drawer, and is what the daily chase reminder talks about.</p>'
        : '') +
      '<div class="menu-divider"></div>' +
      '<div class="menu-section-label">How you add things</div>' +
      '<div class="segmented">' +
      [["original", "Original"], ["reveal", "Reveal"], ["sentence", "Sentence"]].map(function (o) {
        return '<button class="' + (addStyle() === o[0] ? "active" : "") +
          '" data-action="set-add-style" data-mode="' + o[0] + '">' + o[1] + '</button>';
      }).join('') +
      '</div>' +
      '<p class="setting-desc" style="margin-top:10px">' +
      (addStyle() === "original"
        ? "Every control on show, all the time."
        : addStyle() === "reveal"
          ? "One bar when there is nothing in it. The controls appear as soon as you start typing, and go again when you stop."
          : "One line you read rather than operate — “adding a task, priority 3”. Tap any part to change it, or type ‘!1’ and ‘!!’ straight into the bar. The ? on the bar explains.") +
      '</p>' +
      '<div class="menu-divider"></div>' +
      '<div class="menu-section-label">When you tap “Not now”</div>' +
      '<div class="segmented">' +
      '<button class="' + (settings.snoozeMode === "queue" ? "active" : "") + '" data-action="set-snooze-mode" data-mode="queue">Send to the back</button>' +
      '<button class="' + (settings.snoozeMode === "time" ? "active" : "") + '" data-action="set-snooze-mode" data-mode="time">Come back later</button>' +

  /* The whole path to working notifications, with your position on it marked.
     Showing every step at every stage means you always know how much is left,
     rather than clearing one hurdle only to be shown another. */
  function setupChecklist(reason) {
    var steps = [];
    if (isIOS()) {
      steps.push({
        name: "Add Only This to your Home Screen",
        note: "Tap the Share button in Safari, choose <strong>Add to Home Screen</strong>, then open the app from the new icon. Safari will not allow notifications in an ordinary tab.",
        done: isStandalone(),
      });
    }
    steps.push({
      name: "Turn on sync",
      note: "The reminders are put together on the server, so it needs to be able to see your list.",
      done: !!syncCode,
    });
    steps.push({
      name: "Allow notifications",
      note: "Your phone will ask for permission. You then choose which reminders you actually want.",
      done: !!push.enabled && reason !== "denied",
    });

    var firstOpen = -1;
    for (var i = 0; i < steps.length; i++) { if (!steps[i].done) { firstOpen = i; break; } }

    return '<ol class="setup-steps">' + steps.map(function (s, i) {
      var state = s.done ? "done" : (i === firstOpen ? "current" : "");
      return '<li class="setup-step ' + state + '">' +
        '<span class="step-mark">' + (s.done ? "✓" : (i + 1)) + '</span>' +
        '<span class="step-body"><span class="step-name">' + s.name + '</span>' +
        (state === "current" ? '<span class="step-note">' + s.note + '</span>' : '') +
        '</span></li>';
    }).join('') + '</ol>';
  }

    if (st.hasKey) {

      out += '<p class="setting-desc" style="margin:0 0 10px">In ServiceM8, go to ' +

        'value="' + escapeHtml(sm8KeyDraft) + '" autocomplete="off" spellcheck="false" />' +
        '<button class="btn-set-wide" data-action="sm8-save-key" ' + (sm8Busy ? 'disabled' : '') + '>' +
        (sm8Busy ? 'Checking…' : 'Save and check it') + '</button>';
    }
    if (sm8Error) out += '<p class="sync-warning">' + escapeHtml(sm8Error) + '</p>';

    // --- step 2: who you are ---
    if (st.hasKey) {
      out += '<div class="menu-divider"></div>' +
        '<div class="menu-section-label" style="margin-left:2px">2 · Which staff member you are</div>';
      if (sm8Staff && sm8Staff.length) {
        out += '<p class="setting-desc" style="margin:0 0 10px">Pick yourself. This is what ' +
          '“assigned to me” means.</p><div class="sm8-staff">' +
          sm8Staff.map(function (p) {
            return '<button class="sm8-person' + (st.staffUuid === p.uuid ? ' on' : '') + '" ' +
              'data-action="sm8-pick-staff" data-key="' + escapeHtml(p.uuid) + '">' +
              escapeHtml(p.name) + '</button>';
          }).join('') + '</div>';
      } else if (st.staffUuid) {
        out += '<div class="sm8-set"><span class="sm8-tick">✓</span><span>Set. ' +
          '<button class="demo-reset" data-action="sm8-test" style="padding:0">Change it</button></span></div>';
      } else {
        out += '<button class="btn-secondary" data-action="sm8-test">Fetch the staff list</button>';
      }

        '<div style="margin-bottom:4px">' +
        [["tasks", "Tasks assigned to me", "Work put on you in ServiceM8."],
         ["notes", "Notes that mention me", "Matched on your name — set the names below."],
         ["emails", "Replies to emails I sent", "Inbound email on a job."]].map(function (r) {

      out += '<div class="menu-divider"></div>' +
        '<div class="setting-row" style="border:none">' +
        '<div class="setting-text"><div class="setting-name">Offers turned on</div>' +

          if (sm8RunNote.why) {
            out += '<p class="sm8-run-why">' + escapeHtml(sm8RunNote.why) + '</p>';
          }
          if (sm8RunNote.rows && sm8RunNote.rows.length) {

              sm8RunNote.rows.map(function (r) {

      out += '<div class="menu-divider"></div>' +

        '<button class="btn-secondary" data-action="sm8-probe" ' + (sm8Probing ? 'disabled' : '') + '>' +

          escapeHtml(sm8ProbeText()) + '</textarea>';

      if (st.lastRun) {
        out += '<p class="setting-desc" style="margin-top:10px">Last checked ' +

      } else if (st.enabled) {
        out += '<p class="setting-desc" style="margin-top:10px">Waiting for the first check.</p>';
      }

         sitting untouched in ServiceM8 and never appearing here reads as a fault. */
      out += '<div class="tut-note" style="margin-top:14px"><strong>It looks back two days.</strong> ' +
        'Every check reads your whole ServiceM8 list, not just what is new — but it only offers ' +
        'things changed there in the last 48 hours, so setting this up does not empty your ' +
        'backlog into your plan. An older job you do want will appear as soon as anything ' +
        'about it changes in ServiceM8.</div>';
    }

    out += '<div class="tut-note"><strong>A read-only key is enough.</strong> Nothing here ever ' +
      'writes to ServiceM8 — jobs, notes and tasks there are only ever read. Your key is stored ' +
      'against your sync code and used only by this site\'s own server. It is never sent back to ' +
      'the app and never appears in the page source. To be rid of it, remove it here and delete ' +
      'it in ServiceM8 as well.</div>';
    return out;
  }

  function renderMenuNotifications() {
    var reason = pushBlockedReason();

    var intro = '<p class="sync-desc">Short, factual nudges — never more than one of each per day, ' +
      'and nothing at all on a day with nothing to say.</p>';

    // A browser that simply cannot do this. Nothing to work towards, so no checklist.
    if (reason === "unsupported") {
      return intro +
        '<div class="tut-note" style="margin-top:16px"><strong>Not available in this browser.</strong><br>' +
        'Notifications need to be set up on your phone. On an iPhone, open the site in ' +
        '<strong>Safari</strong>, add it to your Home Screen, then come back to this page.</div>';
    }

    // Everything else is a step on the same path, so show the whole path.
    var body = intro + setupChecklist(reason);

    if (reason === "needs-install") {
      return body + '<div class="tut-note">Once the app is on your Home Screen, open it from there and ' +
        'come back to this page to finish.</div>';
    }
    if (reason === "needs-sync") {
      return body +
        '<button class="btn-primary" data-action="menu-page" data-page="sync">Set up sync</button>' +
        '<div class="tut-note">Generate a code, then come straight back here.</div>';
    }
    if (reason === "denied") {
      return body +
        '<div class="tut-note"><strong>Permission was turned down.</strong><br>' +
        'Allow it again under Settings → Notifications → Only This on your phone, then reopen this page.</div>';
    }

    if (!push.enabled) {
      return body +
        '<button class="btn-primary" data-action="enable-notifications" ' +
        (pushBusy ? 'disabled' : '') + '>' + (pushBusy ? 'Setting up…' : 'Allow notifications') + '</button>' +
        (pushError === "failed" ? '<p class="sync-warning" style="margin-top:12px">That did not work. Check you are online and try again.</p>' : '') +
        (pushError === "denied" ? '<p class="sync-warning" style="margin-top:12px">Permission was declined. You can allow it later in your phone\'s settings.</p>' : '') +
        '<div class="tut-note">Nothing is sent until you pick which reminders you want, on the next screen.</div>';
    }

    var rows = NOTIFY_TYPES.map(function (t) {
      var on = !!push.types[t.id];
      return '<div class="setting-row">' +
        '<div class="setting-text"><div class="setting-name">' + t.label +
        ' <span class="notify-at">' + t.at + '</span></div>' +
        '<div class="setting-desc">' + t.blurb + '</div></div>' +
        '<button class="switch ' + (on ? 'on' : '') + '" data-action="toggle-notify" data-key="' + t.id + '" ' +
        'role="switch" aria-checked="' + on + '" aria-label="' + t.label + '"><span class="knob"></span></button>' +
        '</div>';
    }).join('');

    return '<p class="sync-desc">Notifications are on for this device. Pick the ones you want.</p>' +
      '<div style="margin-top:18px">' + rows + '</div>' +
      '<div class="menu-divider"></div>' +
      '<div class="menu-section-label">Which list to include</div>' +
      '<div class="segmented">' +
      ["both", "work", "personal"].map(function (w) {
        var label = w === "both" ? "Both" : w === "work" ? "Work" : "Personal";
        return '<button class="' + (push.lists === w ? "active" : "") + '" data-action="set-notify-lists" data-mode="' + w + '">' + label + '</button>';
      }).join('') +
      '</div>' +
      '<div class="menu-divider"></div>' +
      '<button class="btn-secondary" data-action="disable-notifications">Turn notifications off</button>';

  // ---- The guide ----
  // Six chapters, walked a step at a time, each step showing a mock of the real screen
  // with the part under discussion lit up. The mocks are driven by a set of demo
  // settings you can flip inside the guide, so the app never looks like it only
  // works one way.

  function p(text) { return '<p class="tut-p">' + text + '</p>'; }
  function note(text) { return '<div class="tut-note">' + text + '</div>'; }
  function hint(text) { return '<p class="demo-hint">' + text + '</p>'; }
  function jumpTo(page, label) {
    return '<button class="btn-secondary" data-action="guide-jump" data-page="' + page + '" ' +
      'style="margin-top:14px">' + label + ' →</button>';
  }

  // A cross-reference to another chapter and step. Following one leaves a way back.
  function seeAlso() {
    var links = Array.prototype.slice.call(arguments);
    return '<div class="see-also-wrap"><div class="see-also-label">See also</div>' +
      links.map(function (l) {

          '<span class="sa-chapter">' + GUIDE[c].title + '</span></span>' +

  }

     silently wrong the moment a step is inserted above it — it still points somewhere,
     just at the wrong page. Adding "Sharing with others" to the menu chapter did
     exactly that to two references and a test. */
  var MENU_OPEN = 0, MENU_PROFILE = 1, MENU_TASKS = 2, MENU_APPEARANCE = 3,

  function mock(inner, spot) {
    return '<div class="mock' + (spot ? ' spotlight' : '') + '">' + inner + '</div>';
  }
  function part(key, html, spot) {
    return '<div class="mock-el' + (spot === key ? ' spot' : '') + '">' + html + '</div>';
  }

  function mkDots(active) {
    var out = '';
    for (var i = 1; i <= 5; i++) {
      out += '<span class="mk-dot' + (i === active ? ' on p' + i : '') + '">' + i + '</span>';
    }

  }
  function mkTask(text, pr, checks) {
    return '<div class="mk-task">' +
