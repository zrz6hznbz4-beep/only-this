     The container page is an overlay rather than a view, for the same reason Notes is:
     it is somewhere you dip into and come back from, and making it a view would mean
     the header, the focus machinery, the shared board and the scroll keys all having
     to learn about it. */
  var openContainerId = null;   // which container's page is showing
  var showDetails = false;      // its details panel, closed each time you open one
  var openContactId = null;     // which of the other people is being edited
  var editingNameId = null;     // the heading being renamed, task or container
  var draftIsContainer = false; // the Task / Customer-or-job toggle on the add box
  var draftContainerId = null;  // where a newly typed task will be filed
  var draftContainerOff = false; // you said "not for them" about this draft
  var insidePickerOpen = false; // the tucked-away "Inside" picker on a task
  var insideSearch = "";
  var containerNoteDraft = "";
  var showAddKeys = false;      // the shortcut list behind the ? on the add bar
  var sentenceDots = false;     // the sentence's priority word, opened into dots
  var lastAddSig = null;        // what the add bar last said, so typing rarely redraws
  var supplierPickerFor = null; // task id whose supplier is being chosen by hand
  var supplierSearch = "";
  var openSupplierId = null;    // which supplier is expanded on the suppliers page
  var refocusId = null;         // one field to put the cursor back in after a redraw
  var lastFocusKey = null;
  var lastScreenKey = null;
  var SYNC_ENDPOINT = "/api/sync";
  var syncCode = (function () {
    try { return localStorage.getItem("onlyThisSyncCode") || null; } catch (e) { return null; }
  })();
  var syncStatus = "idle"; // idle | syncing | synced | error
  var menuOpen = false;
  var menuPage = "root";
  var push = loadPush();
  var importText = "";
  var importPreview = null;
  var importError = null;
  var importDone = false;
  var exportCopied = false;
  var exportError = false;
  // Guide state. The demos are throwaway copies that never touch the real list.
  var GUIDE_DONE_KEY = "onlyThisGuideDone";
  var guideChapter = null;
  var guideStep = 0;
  var guideExpanded = null;
  var guideDone = loadGuideDone();
  // The guide's own copy of the task settings, so you can see both ways of working
  // without changing anything on your real list.
  var demoSettings = { repeats: true, completeFromPlan: true, groupedPlan: true };
  var guideReturn = null; // where a cross-reference was followed from
  var showHeld = false;
  var inboxPending = [];
  var inboxBusy = false;
  var suggestPriority = 3;
  var suggestSkipped = {};
  var sm8Status = null;
  var sm8Staff = null;
  var sm8KeyDraft = "";
  var sm8Busy = false;
  var sm8Error = null;
  var sm8Checking = false;   // a check-now is in flight
  var sm8RunNote = null;     // what the last check-now found, in plain words
  var draftAssignee = null;  // who a newly typed task is for; null means anyone
  var personDraft = "";      // the name being typed on the sharing page
  var personError = null;
  var sm8Probe = null;       // raw counts straight from ServiceM8, when asked for
  var sm8Probing = false;
  var sm8ProbeCopied = false;
  var demoFolded = false;
  var demoTicked = false;
  var demoSteps = [];
  var DEMO_TASKS = [
    { text: "Quote the Henderson job", p: 1 },
    { text: "Call the supplier back", p: 2 },
    { text: "Order the wall brackets", p: 2 },
  ];
  var demoQueue = DEMO_TASKS.slice();
  var demoDone = [];
  var DEMO_SWEEP = ["Reply to Dave", "Bin the old quotes", "Text the fitter", "Check the van tax"];
  var demoSweep = DEMO_SWEEP.slice();
  var pushSub = null;
  var pushBusy = false;
  var pushError = null;
  var syncCodeDraft = "";
  var syncPushTimer = null;
  var syncPushPending = false;
  var refocusSubtask = false;

  function storageKey() { return "onlyThisTasks_" + profile; }

  // ---- Per-profile settings ----
  // Work and personal keep entirely separate settings. Defaults reproduce how the app
  // behaved before there were any settings, so nothing changes until you change it.
  function defaultSettings(p) {
    return {
      containers: false,         // customers and jobs — off until the work has that shape
      addStyle: "original",      // how the add bar behaves: original | reveal | sentence
      repeats: p === "personal", // repeats have always been a personal-view thing
      completeFromPlan: true,
      snoozeMode: "queue",       // "queue" = send to the back, "time" = come back later
      morningRecap: true,
      groupedPlan: true,         // priorities folded into drawers on the plan
      holds: false,              // off unless you need it — most people never will
      holdDays: 3,               // how long before a held task is worth chasing
      theme: "original",
    };
  }
  function loadSettings(p) {
    var base = defaultSettings(p);
    try {
      var raw = localStorage.getItem(SETTINGS_KEY + "_" + p);
      if (!raw) return base;
      var saved = JSON.parse(raw) || {};
      Object.keys(base).forEach(function (k) {
        if (saved[k] !== undefined) base[k] = saved[k];
      });
      return base;
    } catch (e) { return base; }
  }
  function saveSettings() {
    try { localStorage.setItem(SETTINGS_KEY + "_" + profile, JSON.stringify(settings)); } catch (e) {}
  }
  function setSetting(key, value) {
    settings[key] = value;
    saveSettings();
    if (key === "theme") applyTheme();
    render();
  }
  function toggleSetting(key) { setSetting(key, !settings[key]); }
  var THEME_BG = {
    original: "#181C19", linen: "#F4F0E6", mist: "#E9EEF2", ember: "#211A18", deep: "#0C1016",
  };
  // ---- Moving your data between devices ----
  // On iOS a Home Screen app gets its own storage, separate from Safari's, so the
  // tasks you can see in the browser genuinely are not there in the installed app.
  // This is the plain-text way across; sync is the automatic one.
  var DATA_VERSION = 1;

  function readList(name) {
    try {
      var raw = localStorage.getItem("onlyThisTasks_" + name);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) return { tasks: parsed, completions: [] }; // very old format
      // The customers and jobs travel with the list, or a moved device arrives with
      // every task filed under a name that no longer exists.
      return { tasks: parsed.tasks || [], completions: parsed.completions || [],
               containers: parsed.containers || [] };
    } catch (e) { return null; }
  }
  function readSettings(name) {
    try { return JSON.parse(localStorage.getItem(SETTINGS_KEY + "_" + name) || "null"); } catch (e) { return null; }
  }

  function buildExport() {
    return {
      onlyThis: DATA_VERSION,
      exportedAt: Date.now(),
      profile: profile,
      lists: { work: readList("work"), personal: readList("personal") },
      settings: { work: readSettings("work"), personal: readSettings("personal") },
      notify: { lists: push.lists, types: push.types },
      // Suppliers belong to the device rather than a list, so they travel beside them.
      suppliers: readSuppliers(),
      suppliersOn: suppliersOn(),
      syncCode: syncCode || null,
    };
  }
  function exportString() { return JSON.stringify(buildExport()); }

  function describeData(data) {
    var tasks = 0, done = 0, lists = [];
    ["work", "personal"].forEach(function (k) {
      var d = data.lists && data.lists[k];
      if (!d) return;
      var openCount = (d.tasks || []).filter(function (t) { return t.status !== "done"; }).length;
      tasks += openCount;
      done += (d.completions || []).length;
      if ((d.tasks || []).length || (d.completions || []).length) lists.push(k);
    });
    return {
      tasks: tasks, done: done,
      lists: lists.length ? lists.join(" and ") : "none",
      hasSettings: !!(data.settings && (data.settings.work || data.settings.personal)),
      syncCode: data.syncCode || null,
    };
  }

  /* Copy, with the older-Safari case handled by selecting a box instead so a long-press
     "Copy" still works. `boxId` is optional — without one, a refusal is simply silent
     rather than pretending it worked. */
  function copyToClipboard(text, done, boxId) {
    function fallback() {
      try {
        var box = boxId && document.getElementById(boxId);
        if (box) { box.focus(); box.select(); }
      } catch (e) {}
      if (done) done();
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done || function () {}).catch(fallback);
        return;
      }
    } catch (e) {}
    fallback();
  }

  function copyExport() {
    var text = exportString();
    var done = function () {
      exportCopied = true;
      render();
      setTimeout(function () { exportCopied = false; render(); }, 2500);
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(selectFallback);
        return;
      }
    } catch (e) {}
    selectFallback();

    function selectFallback() {
      // Older Safari: select the box so a long-press "Copy" works.
      try {
        var box = document.getElementById("exportBox");
        if (box) { box.focus(); box.select(); }
        exportCopied = false;
        exportError = true;
        render();
      } catch (e) {}
    }
  }

  function validateImport(raw) {
    var data = JSON.parse(raw); // throws on nonsense
    if (!data || typeof data !== "object") throw new Error("shape");
    // Only blame the version if this is recognisably our data in the first place —
    // otherwise "wrong version" is a misleading thing to tell someone.
    if (data.onlyThis === undefined) throw new Error("shape");
    if (data.onlyThis !== DATA_VERSION) throw new Error("version");
    if (!data.lists || typeof data.lists !== "object") throw new Error("shape");
    ["work", "personal"].forEach(function (k) {
      var d = data.lists[k];
      if (d === null || d === undefined) return;
      if (!Array.isArray(d.tasks) || !Array.isArray(d.completions)) throw new Error("shape");
    });
    return data;
  }

  function checkImport() {
    var raw = (importText || "").trim();
    importPreview = null;
    if (!raw) { importError = "empty"; render(); return; }
    try {
      importPreview = validateImport(raw);
      importError = null;
    } catch (e) {
      importPreview = null;
      importError = (e && e.message === "version") ? "version" : "invalid";
    }
    render();
  }

  function applyImport() {
    var data = importPreview;
    if (!data) return;

    ["work", "personal"].forEach(function (k) {
      var d = data.lists[k];
      if (!d) return;
      try {
        localStorage.setItem("onlyThisTasks_" + k, JSON.stringify({
          tasks: d.tasks || [], completions: d.completions || [], containers: d.containers || [],
        }));
      } catch (e) {}
      var s = data.settings && data.settings[k];
      if (s) { try { localStorage.setItem(SETTINGS_KEY + "_" + k, JSON.stringify(s)); } catch (e) {} }
    });

    if (Array.isArray(data.suppliers)) {
      writeSuppliers(data.suppliers);
      suppliersList = readSuppliers();
      if (data.suppliersOn) setSuppliersOn(true);
    }

    // Notification choices travel, but not the subscription itself — that belongs to
    // the device it was created on, so this one has to ask permission for itself.
    if (data.notify) {
      try {
        localStorage.setItem(PUSH_KEY, JSON.stringify({
          enabled: false, lists: data.notify.lists || "both", types: data.notify.types || {},
        }));
      } catch (e) {}
    }

    if (data.syncCode) {
      syncCode = data.syncCode;
      try { localStorage.setItem("onlyThisSyncCode", syncCode); } catch (e) {}
    }

    // Reload everything from the newly written storage.
    settings = loadSettings(profile);
    var fresh = load();
    tasks = fresh.tasks;
    completions = fresh.completions;
    people = fresh.people;
    deleted = fresh.deleted;
    containers = fresh.containers;
    seedPrints();
    push = loadPush();
    pushSub = null;

    // What we just pasted in is the truth — make sure it is pushed outward, not overwritten.
    try { localStorage.removeItem("onlyThisLastSyncedAt"); } catch (e) {}
    markLocalChanged();

    applyTheme();
    rolloverOverdue();

    importText = ""; importPreview = null; importError = null;
    menuOpen = false; menuPage = "root";
    view = "plan"; planDate = todayStr();
    S.currentTaskId = null; expandedGroups = null;
    showLater = false; showCompleted = false;
    importDone = true;
    render();
    if (syncCode) scheduleSyncPush();
    setTimeout(function () { importDone = false; render(); }, 4000);
  }

  // ---- The ServiceM8 connection ----
  // The API key travels one way only: into the server, never back out. The app is
  // told whether a key exists, never what it is.
  var SM8_ENDPOINT = "/api/sm8";

  function sm8Load() {
    if (!syncCode) { sm8Status = null; return; }
    fetch(SM8_ENDPOINT + "?code=" + encodeURIComponent(syncCode))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (data) { sm8Status = data; if (menuOpen) render(); }
      })
      .catch(function () {});
  }

  function sm8Post(body, after) {
    if (!syncCode) return;
    sm8Busy = true; sm8Error = null; render();
    fetch(SM8_ENDPOINT, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(Object.assign({ code: syncCode }, body)),
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        sm8Busy = false;
        if (after) after(data);
        else if (data && data.hasKey !== undefined) sm8Status = data;
        render();
      })
      .catch(function () {
        sm8Busy = false;
        sm8Error = "Could not reach the server. Check you are online.";
        render();
      });
  }

  function sm8SaveKey() {
    var key = (sm8KeyDraft || "").trim();
    if (!key) { sm8Error = "Paste the key first."; render(); return; }
    // Check it before saving, so a mistyped key is caught here rather than silently
    // producing nothing for the next fortnight.
    sm8Post({ action: "test", apiKey: key }, function (res) {
      if (!res || !res.ok) {
        sm8Error = (res && res.error) || "That key did not work.";
        render();
        return;
      }
      sm8Staff = res.staff || [];
      sm8KeyDraft = "";
      sm8Post({ apiKey: key });
    });
  }

  function sm8Test() {
    sm8Post({ action: "test" }, function (res) {
      if (!res || !res.ok) { sm8Error = (res && res.error) || "Could not check."; render(); return; }
      sm8Staff = res.staff || [];
      render();
    });
  }

  function sm8PickStaff(uuid) {
    sm8Staff = null;
    sm8Post({ staffUuid: uuid });
  }

  function sm8ToggleSource(which) {
    if (!sm8Status) return;
    var list = (sm8Status.sources || []).slice();
    var i = list.indexOf(which);
    if (i === -1) list.push(which); else list.splice(i, 1);
    if (!list.length) list = ["tasks"]; // watching nothing would just be a broken setup
    sm8Post({ sources: list });
  }

  function sm8Forget() {
    sm8Staff = null;
    sm8KeyDraft = "";
    sm8Post({ action: "forget" });
  }

  /* Check now — the same run the schedule does, on demand.

     Worth the code: "nothing has appeared" has several very different causes, and
     without this you cannot tell them apart without waiting a quarter of an hour
     between guesses. The reply says which one it was. */
  function sm8RunResult(res) {
    if (!res || !res.ok) {
      return { bad: true, text: (res && res.error) || "Could not run the check." };
    }
    if (res.problems && res.problems.length) {
      return { bad: true, text: "ServiceM8 refused part of it — " + res.problems.join("; ") };
    }
    if (res.added > 0) {
      return {
        text: res.added + (res.added === 1 ? " new thing" : " new things") +
          " to look at, waiting on the plan.",
        // Held back on purpose — worth saying, or it looks like things went missing.
        why: res.held > 0
          ? res.held + " more are waiting their turn. Only a few arrive at a time so a " +
            "big ServiceM8 list cannot bury your plan — the rest come with the next checks."
          : null,
      };
    }
    if (res.waiting > 0) {
      return { text: "Nothing new. " + res.waiting +
        (res.waiting === 1 ? " offer is" : " offers are") + " already waiting on the plan." };
    }
    if (res.found > 0) {
      return { text: "Found " + res.found + ", but you have already seen " +
        (res.found === 1 ? "it" : "them all") + ". Nothing gets offered twice." };
    }
    return {
      text: "Connected fine, nothing to offer.",
      why: sm8WhyNothing(res.report),
      // Actual records, so you can hold them up against ServiceM8 rather than take
      // my word for what it says.
      rows: sm8Sample(res.report),
    };
  }

  /* Ask ServiceM8 the same question several ways and show what each returns.

     For when the app's account of itself has stopped being believable. It is the
     honest way to hand the raw data to somebody helping: the counts and records come
     back, the API key stays on the server and is never part of the reply. */
  function sm8RunProbe() {
    if (!syncCode || sm8Probing) return;
    sm8Probing = true; sm8Probe = null; sm8ProbeCopied = false; render();
    fetch(SM8_ENDPOINT, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ code: syncCode, action: "probe" }),
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        sm8Probing = false;
        if (!res || !res.ok) { sm8Error = (res && res.error) || "Could not read ServiceM8."; }
        else sm8Probe = res.probe;
        render();
      })
      .catch(function () {
        sm8Probing = false;
        sm8Error = "Could not reach the server.";
        render();
      });
  }

  function sm8ProbeText() {
    if (!sm8Probe) return "";
    return "ServiceM8 probe — " + sm8Probe.takenAt + "\n\n" + JSON.stringify(sm8Probe, null, 2);
  }

  function sm8CopyProbe() {
    copyToClipboard(sm8ProbeText(), function () {
      sm8ProbeCopied = true;
      render();
      setTimeout(function () { sm8ProbeCopied = false; render(); }, 3000);
    });
  }

  /* What it can actually see. If these names match your list in ServiceM8 but the
     owner is wrong, the reading is wrong; if the names are unfamiliar, it is looking
     at a different set of tasks than the one you are. Either way you know which. */
  function sm8Sample(report) {
    var sample = report && report.tasks && report.tasks.sample;
    if (!sample || !sample.length) return null;
    return sample.map(function (s) { return s.title + " — " + s.owner; });
  }

  /* Nothing found is the answer that needs the most explaining, because it has several
     causes that look identical from outside. The run reports where things dropped out;
     this turns that into the one sentence that tells you what to change. */
  function sm8WhyNothing(report) {
    var t = report && report.tasks;
    // A number from an older or half-deployed server may simply not be there. Saying
    // "undefined open" would undermine the one thing this text exists to do.
    function num(v) { return typeof v === "number" && isFinite(v) ? v : null; }

    if (t && typeof t === "object" && num(t.kept) !== null) {
      var kept = num(t.kept);        // open tasks of mine, straight from ServiceM8
      var open = num(t.open);        // open tasks belonging to anybody — only looked up on a miss
      var owners = Array.isArray(t.byOwner) ? t.byOwner : [];
      var staffCount = num(t.staffCount);

      /* The query was refused, so this fell back to reading everything it could — which
         on a big account is a slice rather than the lot. Say so, because an answer from
         a partial read should not be trusted the way a filtered one can be. */
      var caveat = t.filterRejected
        ? " ServiceM8 would not accept the narrowed query, so this read what it could and " +
          "the answer may be incomplete."
        : "";

      if (kept > 0) {
        return kept + (kept === 1 ? " open task is" : " open tasks are") + " yours, but " +
          (kept === 1 ? "it was" : "they were") + " last changed more than two days ago." + caveat;
      }

      if (open === 0) {
        return "Nothing is open in ServiceM8 at the moment — not for you, and not for " +
          "anybody else either." + caveat;
      }

      if (open !== null) {
        /* The saved UUID is not a staff member at all. Worth its own sentence, because
           no amount of reassigning work in ServiceM8 would ever make it match. */
        if (!t.you && staffCount) {
          return open + " open " + (open === 1 ? "task" : "tasks") + " in ServiceM8, none " +
            "assigned to you — and the staff member saved here is not in ServiceM8's list " +
            "of " + staffCount + " people at all. Pick yourself again in step 2." + caveat;
        }
        var s = open + " open " + (open === 1 ? "task" : "tasks") + " in ServiceM8, none " +
          "assigned to you.";
        if (t.you) s += " You are set as " + t.you + ".";
        if (owners.length) {
          s += " They belong to " +
            listWords(owners.map(function (o) { return o.name + " (" + o.count + ")"; })) + ".";
        }
        return s + caveat;
      }

      return "Nothing of yours is open in ServiceM8 right now." + caveat;
    }

    var n = report && report.notes;
    if (n && n.noNames) return "Notes are being watched, but no names have been set to look for.";
    return "Only things changed in ServiceM8 in the last two days count.";
  }

  // "Dave", "Dave and Sam", "Dave, Sam and Jo"
  function listWords(items) {
    if (!items || !items.length) return "";   // an empty list is nothing, not " and undefined"
    if (items.length === 1) return items[0];
    return items.slice(0, -1).join(", ") + " and " + items[items.length - 1];
  }

  function sm8CheckNow() {
    if (!syncCode || sm8Checking) return;
    sm8Checking = true; sm8RunNote = null; sm8Error = null; render();
    fetch(SM8_ENDPOINT, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ code: syncCode, action: "run" }),
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        sm8Checking = false;
        sm8RunNote = sm8RunResult(res);
        if (res && res.hasKey !== undefined) sm8Status = res;
        render();
        // Pull the queue straight away, so anything found is on the plan by the time
        // you close the menu rather than up to a minute later.
        if (res && res.added > 0) fetchInbox();
      })
      .catch(function () {
        sm8Checking = false;
        sm8RunNote = { bad: true, text: "Could not reach the server. Check you are online." };
        render();
      });
  }

  // ---- Suggestions from ServiceM8 ----
  // Nothing is ever added to your list without being offered first, and offers only
  // appear on the plan — never over the top of a focus card. Anything that arrives
  // while you are working simply waits.
  var INBOX_ENDPOINT = "/api/inbox";

  function fetchInbox() {
    // Whether offers happen at all is decided on the server, per sync code. If nothing
    // is set up there, this simply comes back empty — no second switch needed here.
    if (!syncCode) return;
    if (inboxBusy) return;
    inboxBusy = true;
    fetch(INBOX_ENDPOINT + "?code=" + encodeURIComponent(syncCode))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        inboxBusy = false;
        if (!data || !Array.isArray(data.pending)) return;
        var before = inboxPending.length;
        inboxPending = data.pending;
        // Only redraw if something actually changed, and never mid-focus.
        if (inboxPending.length !== before && view === "plan" && !isTypingNow()) render();
      })
      .catch(function () { inboxBusy = false; });
  }

  function currentSuggestion() {
    return inboxPending.length ? inboxPending[0] : null;
  }

  function resolveSuggestion(id) {
    inboxPending = inboxPending.filter(function (s) { return s.id !== id; });
    suggestPriority = 3;
    suggestSkipped = {};
    if (!syncCode) return;
    fetch(INBOX_ENDPOINT, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ code: syncCode, id: id }),
    }).catch(function () {});
  }

  function acceptSuggestion() {
    var s = currentSuggestion();
    if (!s) return;
    var steps = (s.subtasks || []).filter(function (_, i) { return !suggestSkipped[i]; });
    var t = {
      id: uid(),
      text: s.title,
      priority: suggestPriority,
      date: todayStr(),
      status: "pending",
      snoozedUntil: null,
      order: nextOrder(),
      quick: false,
      repeat: null,
      // The link back to the job goes in the notes, so it is one tap away later.
      notes: [s.context, s.url].filter(Boolean).join("\n"),
      subtasks: steps.map(function (text) {
        return { id: uid(), text: text, priority: 3, quick: false, status: "pending" };
      }),
      fromSource: s.source || null,

  function nextSubtask() {
    var parent = tasks.find(function (t) { return t.id === S.currentTaskId; });
    if (!parent) { backToMainTask(); return; }
    var pending = pendingSubtasks(parent);
    var picked = pickByPriority(pending);
    if (!picked) { backToMainTask(); return; }
    S.currentSubtaskId = picked.id;
    S.subtaskJustDone = false;
    render();
  }
  function markParentDoneFromSubtasks() {
    markDone();
  }
  function addSubtask() {
    var parent = tasks.find(function (t) { return t.id === notesTaskId; });
    if (!parent) return;
    var text = (draftSubtaskText || "").trim();
    if (!text) return;
    var newSub = { id: uid(), text: text, priority: draftSubtaskPriority, quick: draftSubtaskQuick, status: "pending" };
    tasks = tasks.map(function (t) { return t.id === parent.id ? Object.assign({}, t, { subtasks: (t.subtasks || []).concat([newSub]) }) : t; });
    draftSubtaskText = "";
    draftSubtaskQuick = false;
    refocusSubtask = true; // keep the keyboard up so you can add several in a row
    save(); render();
  }
  function toggleSubtaskStatus(parentId, subId) {
    tasks = tasks.map(function (t) {
      if (t.id !== parentId) return t;
      var newSubs = (t.subtasks || []).map(function (s) {
        if (s.id !== subId) return s;
        var nowDone = s.status !== "done";
        if (nowDone) recordCompletion(s.text, "step", t.text);
        return Object.assign({}, s, { status: nowDone ? "done" : "pending" });
      });
      return Object.assign({}, t, { subtasks: newSubs });
    });
    save(); render();
  }
  function changeSubtaskPriority(parentId, subId, p) {
    tasks = tasks.map(function (t) {
      if (t.id !== parentId) return t;
      var newSubs = (t.subtasks || []).map(function (s) { return s.id === subId ? Object.assign({}, s, { priority: p }) : s; });
      return Object.assign({}, t, { subtasks: newSubs });
    });
    save(); render();
  }
  function toggleSubtaskQuick(parentId, subId) {
    tasks = tasks.map(function (t) {
      if (t.id !== parentId) return t;
      var newSubs = (t.subtasks || []).map(function (s) { return s.id === subId ? Object.assign({}, s, { quick: !s.quick }) : s; });
      return Object.assign({}, t, { subtasks: newSubs });
    });
    save(); render();
  }
  function removeSubtask(parentId, subId) {
    tasks = tasks.map(function (t) {
      if (t.id !== parentId) return t;
      return Object.assign({}, t, { subtasks: (t.subtasks || []).filter(function (s) { return s.id !== subId; }) });
    });
    save(); render();
  }
  function cycleDraftSubtaskPriority(p) { draftSubtaskPriority = p; render(); }
  function toggleDraftSubtaskQuick() { draftSubtaskQuick = !draftSubtaskQuick; render(); }

  function openSnooze() {
    var cur = tasks.find(function (t) { return t.id === S.currentTaskId; });
    if (!cur) return;
    S.snoozePriority = cur.priority;
    S.snoozeExhausted = false;
    S.snoozeOpen = true;
    render();
  }
  function closeSnooze() { S.snoozeOpen = false; S.snoozeExhausted = false; render(); }

  // Time-based snooze: hide the task until a chosen moment.
  function confirmSnoozeAt(ts) {
    if (!ts || isNaN(ts)) return;
    tasks = tasks.map(function (t) {
      return t.id === S.currentTaskId
        ? Object.assign({}, t, { priority: S.snoozePriority, snoozedUntil: ts, date: dateStrOf(ts) })
        : t;
    });
    S.focusFront = S.focusFront.filter(function (id) { return id !== S.currentTaskId; });
    S.currentTaskId = null;
    S.snoozeOpen = false;
    S.snoozeExhausted = false;
    save(); render();
  }

  // "Not now" sends the task to the back of a priority list rather than hiding it for a while.
  // If nothing else sits at the chosen priority, it drops down a level so you don't just see it
  // again immediately. If there is genuinely nothing else due, we offer to end focus instead.
  function backOfQueueTarget(cur, wantedP) {
    var others = eligibleTasks().filter(function (t) { return t.id !== cur.id; });
    if (others.length === 0) return null;
    var p = Math.min(5, Math.max(1, wantedP));
    while (p < 5 && !others.some(function (t) { return t.priority === p; })) p++;
    return p;
  }
  function confirmSnooze() {
    var cur = tasks.find(function (t) { return t.id === S.currentTaskId; });
    if (!cur) { S.snoozeOpen = false; render(); return; }
    var target = backOfQueueTarget(cur, S.snoozePriority);
    if (target === null) {
      // Last one standing — nothing to fall behind.
      S.snoozeExhausted = true;
      render();
      return;
    }
    var backOrder = nextOrder();
    tasks = tasks.map(function (t) {
      return t.id === cur.id
        ? Object.assign({}, t, { priority: target, order: backOrder, snoozedUntil: null })
        : t;
    });
    // Remember it was pushed away, so a later reshuffle doesn't drag it back to the middle.
    S.focusFront = S.focusFront.filter(function (id) { return id !== cur.id; });
    if (S.focusSnoozed.indexOf(cur.id) === -1) S.focusSnoozed.push(cur.id);
    S.currentTaskId = null;
    S.snoozeOpen = false;
    S.snoozeExhausted = false;
    save(); render();
  }

  /* Fill a person's sweep queue from their own work. Quick jobs first; when those run
     out the repeats take over, so one mode covers both sweeps without a third button. */
  function startSweepFor(personId) {
    useSession(personId);
    var quick = quickEligibleTasks();
    S.quickQueue = shuffle(quick.map(function (t) { return t.id; }));
    S.dailyQueue = settings.repeats
      ? shuffle(dailyEligibleTasks().map(function (t) { return t.id; })) : [];
  }

  function enterQuick() {
    var pool = quickEligibleTasks();
    S.quickQueue = pool.map(function (t) { return t.id; }).sort(function () { return Math.random() - 0.5; });
    view = "quick"; render();
  }
  function quickDone() {
    var id = S.quickQueue[0];
    var cur = tasks.find(function (t) { return t.id === id; });
    if (cur) recordCompletion(cur.text);
    tasks = tasks.map(function (t) { return t.id === id ? Object.assign({}, t, { status: "done" }) : t; });
    S.quickQueue = S.quickQueue.slice(1);
    save(); render();
  }
  function quickSkip() {
    if (S.quickQueue.length > 1) S.quickQueue = S.quickQueue.slice(1).concat([S.quickQueue[0]]);
    render();
  }

  function enterDailies() {
    var pool = dailyEligibleTasks();
    S.dailyQueue = pool.map(function (t) { return t.id; }).sort(function () { return Math.random() - 0.5; });
    view = "dailies"; render();
  }
  function dailyDone() {
    var id = S.dailyQueue[0];
    var cur = tasks.find(function (t) { return t.id === id; });
    if (cur) {
      recordCompletion(cur.text);
      var nextDate = addDaysStr(cur.repeat === "daily" ? 1 : 7);
      tasks = tasks.map(function (t) {
        return t.id === cur.id
          ? Object.assign({}, t, { date: nextDate, priority: randomMidPriority(), snoozedUntil: null, status: "pending" })
          : t;
      });
    }
    S.dailyQueue = S.dailyQueue.slice(1);
    save(); render();
  }
  function dailySkip() {
    if (S.dailyQueue.length > 1) S.dailyQueue = S.dailyQueue.slice(1).concat([S.dailyQueue[0]]);
    render();
  }

  function backToPlan() {
    view = "plan";
    render();
    fetchInbox(); // anything that arrived while you were working shows up now
  }

  function openNotes(id) {
    notesTaskId = id;
    draftSubtaskText = "";
    draftSubtaskPriority = 3;
    draftSubtaskQuick = false;
    render();
  }
  function closeNotes() {
    notesTaskId = null;
    flushPendingSyncPush();
    render();
  }

  // ---- Render: pieces ----
  function greeting() {
    var h = new Date().getHours();
    if (h < ROLLOVER_HOUR) return "Still up";
    if (h < 5) return "Early start";
    if (h < 12) return "Good morning";
    if (h < 18) return "Good afternoon";
    return "Good evening";
  }

  // A line that actually tells you something, rather than restating the rules.
  function planSubtitle() {
    var today = todayStr();
    if (planDate !== today) {
      var ahead = tasks.filter(function (t) { return t.date === planDate && t.status !== "done"; }).length;
      var when = fmtDate(planDate).toLowerCase();
      if (ahead === 0) return "Nothing lined up for " + when + " yet.";
      return ahead + (ahead === 1 ? " task" : " tasks") + " lined up for " + when + ".";
    }

    var left = eligibleTasks().length;
    var done = completedOnDate(today).length;
    var carried = rolledOverToday().length;
    var hello = greeting();

    var waiting = settings.holds ? heldTasks().length : 0;
    var waitNote = waiting ? " " + waiting + " on hold." : "";

    /* On a shared list the counts are about you, so say so — "9 to go" meaning nine of
       yours out of thirty on the board is a different fact and worth not confusing.
       Work nobody has claimed is named separately, because it belongs to no count and
       would otherwise be invisible until somebody went looking. */
    /* On the team board the interesting numbers are per person and what nobody has
       taken — "9 to go" says nothing about whether one of them is buried. */
    if (sharing()) {
      var spare = unassignedTasks().length;
      var spareNote = spare ? " " + spare + " for anyone." : "";
      var each = pair().map(function (p) {
        return firstNameOf(p.name) + " " + tasksFor(p.id).length;
      }).join(", ");
      if (left === 0 && done === 0) return hello + ". Nothing on the board yet." + spareNote;
      if (left === 0) return hello + ". Board clear — " + done + " done today." + waitNote;
      return hello + ". " + each + "." + spareNote + waitNote;
    }

    // Held work is mentioned wherever there is any, so "all clear" is never a lie.
    if (left === 0 && done === 0) return hello + ". Nothing planned yet." + waitNote;
    if (left === 0) return hello + ". All clear — " + done + " done today." + waitNote;
    if (done === 0 && carried > 0) return hello + ". " + carried + " carried over, " + left + " to go." + waitNote;
    if (done === 0) return hello + ". " + left + (left === 1 ? " task to go." : " tasks to go.") + waitNote;
    return hello + ". " + done + " done, " + left + " to go." + waitNote;
  }

  function focusSubtitle() {
    if (sharing()) return "One each. Tap a card to see its notes.";
    return "One task. Nothing else on screen.";
  }

  function renderHeader() {
    var subtitle = view === "plan" ? planSubtitle()
      : view === "focus" ? focusSubtitle()
      : view === "quick" ? "A quick sweep through the small stuff."
      : view === "dailies" ? "Knocking out the repeats."
      : "Where yesterday left off.";

    // Equal-width slots either side keep the title optically centred.
    return '<header class="header">' +
      '<div class="header-slot left"></div>' +
      '<div class="header-center"><div class="logo">Only This</div><div class="subtitle">' + subtitle + '</div></div>' +
      '<div class="header-slot right">' +
      '<button class="burger" data-action="open-menu" aria-label="Menu"><span></span><span></span><span></span></button>' +
      '</div>' +
      '</header>';
  }

  function priorityDots(selected, actionName, idAttr) {
    var out = '<div class="priority-picker">';
    for (var p = 1; p <= 5; p++) {
      var active = selected === p;
      var style = active ? ('background:' + PRIORITY_COLORS[p] + ';border-color:' + PRIORITY_COLORS[p]) : '';
      out += '<button class="p-dot ' + (active ? 'active' : '') + '" style="' + style + '" data-action="' + actionName + '" ' + (idAttr ? 'data-id="' + idAttr + '" ' : '') + 'data-p="' + p + '">' + p + '</button>';
    }
    out += '</div>';
    return out;
  }

  function hasNotesOrSubs(t) {
    return (t.notes && t.notes.trim()) || (t.subtasks && t.subtasks.length > 0);
  }
  function stepsTag(t) {
    var pending = (t.subtasks || []).filter(function (s) { return s.status !== "done"; }).length;
    return pending > 0 ? '<span class="steps-tag">' + pending + (pending === 1 ? ' step' : ' steps') + '</span>' : '';
  }

  /* One circle where a task has an owner; two initials where it has not.

     A tick can only say "done", and for work nobody owns the useful part is which of
     them did it — that is the whole reason the Completed tray carries initials. So the
     Anyone column asks with the smallest thing that can: two letters. */
  function checkBtn(t) {
    if (!settings.completeFromPlan) return '';
    if (sharing() && isAnyone(activeSide)) {
      return '<span class="tick-pair">' + pair().map(function (person) {
        return '<button class="tick-who" data-action="team-did" data-key="' + person.id +
          '" data-id="' + t.id + '" title="' + escapeHtml(firstNameOf(person.name)) + ' did it">' +
          escapeHtml(initialsOf(person.name)) + '</button>';
      }).join('') + '</span>';
    }
    return '<button class="task-check" data-action="complete-task" data-id="' + t.id + '" title="Mark done">○</button>';
  }

  function snoozedTag(t) {
    return (t.snoozedUntil && t.snoozedUntil > Date.now())
      ? '<span class="snoozed-tag">⏰ ' + fmtWhen(t.snoozedUntil) + '</span>' : '';
  }

  /* Who a task is for, asked at the moment it is written.

     Deliberately at the point of adding rather than afterwards. Sorting out who does
     what later means a pile of unassigned work and somebody having to go through it;
     asked here it is one tap while the job is still in your head. The choice sticks
     for the next task, because work arrives in runs for the same person. */
  function whoRowHtml() {
    if (!sharing()) return '';
    return '<div class="who-row"><span class="who-label">For</span>' +
      pair().map(function (person) {
        return '<button class="who-pick' + (draftAssignee === person.id ? ' on' : '') + '" ' +
          'data-action="set-draft-assignee" data-key="' + person.id + '">' +
          escapeHtml(firstNameOf(person.name)) + '</button>';
      }).join('') +
      '<button class="who-pick' + (!draftAssignee ? ' on' : '') + '" ' +
      'data-action="set-draft-assignee" data-key="anyone">Anyone</button>' +
      '</div>';
  }

  function renderTaskRow(t) {
    if (editingPriorityId === t.id) {
      return '<div class="task-row" data-task-row="' + t.id + '">' +
        '<span class="task-text">' + escapeHtml(t.text) + '</span>' + snoozedTag(t) +
        priorityDots(t.priority, "set-priority", t.id) +
        '</div>';
    }
    return '<div class="task-row" data-task-row="' + t.id + '">' +
      checkBtn(t) +
      '<span class="task-text">' + escapeHtml(t.text) + '</span>' + snoozedTag(t) + stepsTag(t) +
      '<button class="icon-btn ' + (t.quick ? 'lit' : '') + '" data-action="toggle-quick" data-id="' + t.id + '" title="Under a few minutes">⚡</button>' +
      '<button class="icon-btn ' + (hasNotesOrSubs(t) ? 'lit' : '') + '" data-action="open-notes" data-id="' + t.id + '" title="Notes">🗒</button>' +
      /* Every one of these rows sits under a "Priority N" heading, so a badge reading
         the same number is that heading again on every line. It comes off on the shared
         list, where a column is already busy; Work and Personal keep it exactly as it
         was. The picker itself is on the task's own sheet either way. */
      (sharing() ? '' :
        '<button class="p-badge" style="background:' + PRIORITY_COLORS[t.priority] + ';border-color:' + PRIORITY_COLORS[t.priority] + '" data-action="edit-priority" data-id="' + t.id + '">' + t.priority + '</button>') +
      '<button class="icon-btn danger" data-action="remove-task" data-id="' + t.id + '">×</button>' +
      '</div>';
  }

  function renderRepeatingRow(t) {
    var label = t.repeat === "daily" ? "Daily" : "Weekly";
    return '<div class="task-row" data-task-row="' + t.id + '">' +
      checkBtn(t) +
      '<span class="task-text">' + escapeHtml(t.text) + '</span>' + stepsTag(t) +
      '<button class="icon-btn ' + (hasNotesOrSubs(t) ? 'lit' : '') + '" data-action="open-notes" data-id="' + t.id + '" title="Notes">🗒</button>' +
      '<button class="repeat-tag" data-action="cycle-task-repeat" data-id="' + t.id + '" title="Change repeat">🔁 ' + label + '</button>' +
      '<button class="icon-btn danger" data-action="remove-task" data-id="' + t.id + '">×</button>' +
      '</div>';
  }

  /* ---- Customers and jobs ------------------------------------------------

     A container is anything work sits under. Usually a customer, but a running job —
     an insurance claim, an install that keeps coming back — is the same shape: a name
     that outlives the individual tasks and collects them. Nothing here knows the
     difference, which is the point.

     A container is never itself something to do. That single rule is why this could be
     added without touching focus mode, the sweeps, the notifications or the ServiceM8
     inbox: they all run on `tasks`, and `tasks` still means exactly what it did. */

  /* Not on the shared board.

     Two people working side by side get a column each, and a column is already a
     grouping — folding a second one inside it would mean a customer's row sitting in
     one person's column while their other task sits in the other's. That needs
     thinking about properly rather than falling out of a flag, so for now the shared
     screen keeps listing tasks as it always has. Anything already filed keeps its
     customer; it simply is not what the shared board is arranged by. */
  function containersOn() { return !!settings.containers && !sharing(); }

  function containerById(id) {
    for (var i = 0; i < containers.length; i++) if (containers[i].id === id) return containers[i];
    return null;
  }
  function containerName(id) {
    var c = containerById(id);
    return c ? c.text : null;
  }
  // Every task filed under one, done or not — the container page shows both.
  function tasksIn(id) {
    return tasks.filter(function (t) { return t.containerId === id; });
  }
  function openTasksIn(id) {
    return tasksIn(id).filter(function (t) { return t.status !== "done"; });
  }
  /* What the plan is actually made of when this is on: containers that have something
     outstanding today, and tasks that belong to nobody. A container with nothing due is
     not work — it is a name waiting for work, and it waits in Standing. */
  function containersWithWork(planList) {
    var ids = {};
    planList.forEach(function (t) { if (t.containerId) ids[t.containerId] = true; });
    return containers.filter(function (c) { return ids[c.id]; });
  }
  function standingContainers(planList) {
    var busy = {};
    (planList || []).forEach(function (t) { if (t.containerId) busy[t.containerId] = true; });
    return containers.filter(function (c) { return !busy[c.id]; });
  }
  // A container is as urgent as the most urgent thing inside it.
  function containerUrgency(list) {
    var best = 5;
    list.forEach(function (t) { if ((t.priority || 3) < best) best = t.priority || 3; });
    return best;
  }

  function addContainer(text) {
    var name = (text || "").trim();
    if (!name) return null;
    var c = { id: uid(), text: name, createdAt: Date.now() };
    containers.push(c);
    save();
    return c;
  }

  /* Deleting a container must not take the work with it. The tasks are let go rather
     than removed — they reappear on the plan as tasks of their own, which is visible
     and recoverable. Silently deleting a customer's six outstanding jobs would not be. */
  function deleteContainer(id) {
    var c = containerById(id);
    if (!c) return;
    tasks = tasks.map(function (t) {
      return t.containerId === id ? Object.assign({}, t, { containerId: null }) : t;
    });
    containers = containers.filter(function (x) { return x.id !== id; });
    deleted.push({ id: id, at: Date.now() });
    if (openContainerId === id) openContainerId = null;
    save();
  }

  function setTaskContainer(taskId, containerId) {
    tasks = tasks.map(function (t) {
      return t.id === taskId ? Object.assign({}, t, { containerId: containerId || null }) : t;
    });
    insidePickerOpen = false; insideSearch = "";
    save();
  }

  /* Does what you have typed name a container that already exists?

     Matching only against names you have actually created keeps this honest — it can
     never invent a customer, and never files something under a name you have not seen. */
  function matchContainerName(text) {
    var low = (text || "").toLowerCase();
    for (var i = 0; i < containers.length; i++) {
      var name = containers[i].text || "";
      if (name.length > 3 && low.indexOf(name.toLowerCase()) !== -1) return containers[i];
    }
    return null;
  }
  // Take the name back out of the title, since the page it lands on is headed with it.
  function stripContainerName(text, name) {
    var out = String(text).replace(new RegExp(name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i"), "").trim();
    out = out.replace(/\s+(for|to|about|with|re)\s*$/i, "").trim();
    out = out.replace(/^(for|to|about|with|re)\s+/i, "").trim();
    return out.replace(/\s{2,}/g, " ") || text;
  }

  /* "Work through Eric's 3" reads well for a person and badly for a four-word job
     name, so the possessive is only used where the name is short enough to be one. */
  function shortLabel(name) {
    var words = String(name || "").trim().split(/\s+/);
    return words.length <= 2 ? words[0] : null;
  }
  /* Two letters. First and last reads right for a person — Eric Merrall is EM — but
     gives the wrong pair for a long job name, so over two words takes the first two. */
  function containerInitials(name) {
    var parts = String(name || "?").trim().split(/\s+/);
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[1][0]).toUpperCase();
  }

  /* ---- dated updates ---- */

  /* A task is something to do; an update is something that happened. A claim that
     drags on for six weeks is mostly the second kind — who said what, when, and what
     they promised. The date is stamped rather than typed, because it is the part you
     need later and the part you would never bother writing. */
  function notesOf(c) {
    return (c.notes || []).slice().sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
  }
  function addContainerNote(id, text) {
    var c = containerById(id);
    var body = (text || "").trim();
    if (!c || !body) return;
    if (!c.notes) c.notes = [];
    c.notes.push({ id: uid(), text: body, ts: Date.now() });
    save();
  }
  function removeContainerNote(containerId, noteId) {
    var c = containerById(containerId);
    if (!c) return;
    c.notes = (c.notes || []).filter(function (n) { return n.id !== noteId; });
    save();
  }

  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  /* Dates as people say them. "Yesterday · 16:20" carries more than 03/09/2026, and
     past the first week the time of day stops mattering and the date starts to. */
  function noteWhen(ts) {
    var d = new Date(ts), now = new Date();
    var midnight = function (x) { return new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(); };
    var days = Math.round((midnight(now) - midnight(d)) / 86400000);
    var clock = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
    if (days <= 0) return "Today · " + clock;
    if (days === 1) return "Yesterday · " + clock;
    if (days < 7) return days + " days ago";
    var stamp = d.getDate() + " " + MONTHS[d.getMonth()];
    return d.getFullYear() === now.getFullYear() ? stamp : stamp + " " + d.getFullYear();
  }

  /* ---- the other people on a job ---- */

  /* A cinema install is rarely one person: the customer, the electrician who ran the
     cable, the builder whose plaster you are waiting on. They are all "the number for
     the Meridian job", and the difference between them is a word, not a screen each. */
  function contactsOf(c) { return (c && c.contacts) || []; }
  function addContainerContact(id) {
    var c = containerById(id);
    if (!c) return null;
    if (!c.contacts) c.contacts = [];
    var p = { id: uid(), name: "" };
    c.contacts.push(p);
    openContactId = p.id;
    save();
    return p;
  }
  function setContactField(containerId, contactId, field, value) {
    var c = containerById(containerId);
    var p = c && contactsOf(c).filter(function (x) { return x.id === contactId; })[0];
    if (!p) return;
    var v = String(value == null ? "" : value).trim();
    if (v) p[field] = v; else delete p[field];
    save();
  }
  function removeContainerContact(containerId, contactId) {
    var c = containerById(containerId);
    if (!c) return;
    c.contacts = contactsOf(c).filter(function (p) { return p.id !== contactId; });
    openContactId = null;
    save();
  }
  /* Blank means absent, not empty string — so a cleared field stops showing on the
     collapsed line rather than leaving a stray separator behind it. */
  function setContainerField(id, field, value) {
    var c = containerById(id);
    if (!c) return;
    var v = String(value == null ? "" : value).trim();
    if (v) c[field] = v; else delete c[field];
    save();
  }

  /* ---- renaming ---- */

  /* Names are typed in a hurry and are wrong surprisingly often — a typo, a surname
     you learn later, a job that turns out to be a claim. Double-click the heading and
     it becomes a field; enter keeps it, escape throws the edit away, and clicking off
     it keeps it, because losing an edit you thought you had made is worse than a
     rename you can see and undo. A blank name would leave a row you could never find
     again, so an empty box counts as a cancel. */
  /* Adding from inside a customer's page. It inherits the customer and today's date —
     you are standing in their file, so there is nothing to choose. */
  /* Original has a field of its own down there; the other two share the one bar at the
     top of the page, which means sharing the draft with it as well. */
  function addContainerTask(cid) {
    var original = addStyle() === "original";
    var d = draftParts();
    var box = document.getElementById("containerTaskInput");
    var text = original ? (box ? (box.value || "").trim() : "") : d.title;
    if (!text || !containerById(cid)) return;
    tasks.push({
      id: uid(), text: text, priority: original ? 3 : d.priority, date: planDate, status: "pending",
      snoozedUntil: null, order: nextOrder(), quick: original ? false : d.quick, repeat: null,
      notes: "", subtasks: [], assignee: null, containerId: cid,
    });
    if (original) refocusId = "containerTaskInput";
    else { clearDraft(); refocusId = "taskInput"; }
    save(); render();
  }
  function addNoteFromBox(cid) {
    var original = addStyle() === "original";
    addContainerNote(cid, original ? containerNoteDraft : draftParts().title);
    if (original) { containerNoteDraft = ""; refocusId = "containerNoteInput"; }
    else { clearDraft(); refocusId = "taskInput"; }
    render();
  }
  function stripShortcut(text, re) {
    return String(text || "").replace(re, " ").replace(/\s{2,}/g, " ");
  }
  function clearDraft() {
    draftText = ""; draftQuick = false; draftRepeat = null;
    draftIsContainer = false; sentenceDots = false; lastAddSig = null;
    draftContainerId = null; draftContainerOff = false;
  }
  /* Everything from one supplier, in a row — the same shape as the quick sweep, and
     the reason the batch exists at all. */
  function enterSupplierBatch(id) {
    var batch = supplierBatches(eligibleForAnyone()).filter(function (b) { return b.supplier.id === id; })[0];
    if (!batch) return;
    useSession("solo");
    S.focusFront = batch.list.map(function (t) { return t.id; });
    S.currentTaskId = null;
    view = "focus";
    render();
  }

  function renameTo(id, text) {
    // Only the edit that is actually open may be applied. See the focusout handler.
    if (editingNameId !== id) return;
    var name = (text || "").trim();
    if (name) {
      var c = containerById(id);
      if (c) c.text = name;
      else tasks = tasks.map(function (t) { return t.id === id ? Object.assign({}, t, { text: name }) : t; });
    }
    editingNameId = null;
    save();
  }

  /* ---- Suppliers ---------------------------------------------------------

     You never order "Henley Audio" — you order an Ortofon cartridge. So the match is
     made on the brand and resolved through to whoever sells it. Same rule as the
     container matcher: only names actually entered, so it can never invent a supplier
     or send an order somewhere out of enthusiasm.

     There are no passwords in here. The URL and the username are the parts that are
     annoying to remember; the password is the part a phone's keychain already handles,
     and keeping one would mean a plaintext password in browser storage riding through
     the sync blob to a server. */

  var SUPPLIER_METHODS = { phone: "Phone", email: "Email", portal: "Portal" };

  // Alphabetical, always. A list you scan for a name should be in the order you look.
  function suppliersByName() {
    return suppliers().slice().sort(function (a, b) {
      return String(a.name || "").toLowerCase().localeCompare(String(b.name || "").toLowerCase());
    });
  }
  /* Searching the brands as well as the name is the point: you know you need an
     Ortofon stylus long before you remember that Henley sell them. */
  function findSuppliers(q) {
    var query = String(q || "").trim().toLowerCase();
    var list = suppliersByName();
    if (!query) return list;
    return list.filter(function (s) {
      if (String(s.name || "").toLowerCase().indexOf(query) !== -1) return true;
      return (s.brands || []).some(function (b) { return String(b).toLowerCase().indexOf(query) !== -1; });
    });
  }

  /* Reaching for a supplier on a task that is not an order would be noise, so the
     strip only appears where ordering is plausible — the words say so, or you did. */
  function isOrderish(t) {
    if (!t) return false;
    return /(^|\s)(order|re-?order|source|buy)\b/i.test(t.text || "");
  }
  // Whole words only. "Regatta banner" must never reach Rega.
  function brandHit(low, term) {
    var w = String(term || "").trim().toLowerCase();
    if (w.length < 3) return null;
    var at = low.indexOf(w);
    while (at > -1) {
      var before = low.charAt(at - 1), after = low.charAt(at + w.length);
      if (!/[a-z0-9]/.test(before) && !/[a-z0-9]/.test(after)) return w;
      at = low.indexOf(w, at + 1);
    }
    return null;
  }
  /* Returns the supplier and, where it was found by brand, which brand gave it away —
     because "via Ortofon" is what tells you at a glance whether the guess is right. */
  function supplierFor(t) {
    if (!suppliersOn() || !t || t.supplierOff) return null;
    if (t.supplierId) {
      var picked = supplierById(t.supplierId);
      if (picked && !picked.removed) return { supplier: picked, via: null };
    }
    if (!isOrderish(t)) return null;
    var low = " " + String(t.text || "").toLowerCase() + " ";
    var best = null;
    suppliers().forEach(function (s) {
      [s.name].concat(s.brands || []).forEach(function (term) {
        var hit = brandHit(low, term);
        // Longest match wins, so "Pro-Ject" beats a supplier who also lists "Pro".
        if (hit && (!best || hit.length > best.hit.length)) {
          best = { supplier: s, via: term === s.name ? null : term, hit: hit };
        }
      });
    });
    return best;
  }

  /* A guess, offered for correction — never applied on its own. The first capitalised
     word that is not a verb, not the customer's name and not already known. */
  var NOT_A_BRAND = ["order", "reorder", "source", "buy", "chase", "call", "email",
    "ring", "get", "the", "for", "from", "and", "with", "about", "some", "another"];
  function guessBrand(t, supplier) {
    var parent = t.containerId ? String(containerName(t.containerId) || "").toLowerCase() : "";
    var known = (supplier.brands || []).map(function (b) { return String(b).toLowerCase(); });
    var words = String(t.text || "").replace(/[^\w\s-]/g, " ").split(/\s+/).filter(Boolean);
    for (var i = 0; i < words.length; i++) {
      var w = words[i], low = w.toLowerCase();
      if (w.length < 3) continue;
      if (NOT_A_BRAND.indexOf(low) !== -1) continue;
      if (known.indexOf(low) !== -1) continue;
      if (parent && parent.indexOf(low) !== -1) continue;
      if (!/^[A-Z]/.test(w)) continue;
      return w;
    }
    return "";
  }

  function addSupplier() {
    var s = { id: uid(), name: "", brands: [], method: "phone", addedAt: Date.now() };
    suppliersList.push(s);
    openSupplierId = s.id;
    saveSuppliers();
    return s;
  }
  function setSupplierField(id, field, value) {
    var s = supplierById(id);
    if (!s) return;
    if (field === "brands") {
      s.brands = String(value || "").split(",").map(function (b) { return b.trim(); }).filter(Boolean);
    } else {
      var v = String(value == null ? "" : value).trim();
      if (v) s[field] = v; else delete s[field];
    }
    saveSuppliers();
  }
  /* Flagged rather than spliced out, so the other device cannot bring it back. */
  function removeSupplier(id) {
    var s = supplierById(id);
    if (!s) return;
    s.removed = true;
    s.brands = [];
    // Anything filed here by hand goes back to unmatched rather than pointing at nothing.
    tasks = tasks.map(function (t) {
      return t.supplierId === id ? Object.assign({}, t, { supplierId: null }) : t;
    });
    openSupplierId = null;
    saveSuppliers();
    save();
  }
  function setTaskSupplier(taskId, supplierId) {
    tasks = tasks.map(function (t) {
      if (t.id !== taskId) return t;
      return supplierId
        ? Object.assign({}, t, { supplierId: supplierId, supplierOff: false })
        : Object.assign({}, t, { supplierId: null, supplierOff: true });
    });
    supplierPickerFor = null;
    save();
  }
  /* Learning by use rather than by a data-entry evening: you linked this by hand, so
     the brand that would have found it next time is remembered. The hand-made link is
     then dropped, because the strip you see afterwards should be the one the matcher
     produced — that is the thing worth being sure about. */
  function rememberBrand(taskId, word) {
    var t = tasks.filter(function (x) { return x.id === taskId; })[0];
    var brand = (word || "").trim();
    var s = t && t.supplierId ? supplierById(t.supplierId) : null;
    if (!brand || !s) return;
    if (!s.brands) s.brands = [];
    var known = s.brands.some(function (b) { return b.toLowerCase() === brand.toLowerCase(); });
    if (!known) s.brands.push(brand);
    saveSuppliers();
    tasks = tasks.map(function (x) { return x.id === taskId ? Object.assign({}, x, { supplierId: null }) : x; });
    save();
  }

  /* The sharper cut on the plan. "3 to order" is still three different phone calls;
     "2 from Henley Audio" is one basket. */
  function supplierBatches(list) {
    if (!suppliersOn()) return [];
    var byId = {};
    (list || []).forEach(function (t) {
      var m = supplierFor(t);
      if (m) (byId[m.supplier.id] = byId[m.supplier.id] || []).push(t);
    });
    return Object.keys(byId).filter(function (id) { return byId[id].length > 1; })
      .map(function (id) { return { supplier: supplierById(id), list: byId[id] }; });
  }

  /* ---- How you add things ------------------------------------------------

     Three shapes for the same bar, chosen per list in Task settings.

     ORIGINAL   Everything on show all the time. What the app has always done, and
                the default — nobody should find their add bar rearranged.
     REVEAL     One bar when idle; the controls appear once there is something to
                add. No tap is added, the screen is only quiet when unused.
     SENTENCE   One line you read rather than operate, and which hears !1, !! and
                @name while you type.

     The parsing belongs to the sentence alone. In the other two a bang is just a
     bang, because somebody who never asked for shortcuts should never be surprised
     by one. */
  function addStyle() {
    var s = settings.addStyle;
    return s === "reveal" || s === "sentence" ? s : "original";
  }

  var SHORTCUT_HELP = [
    ["!1", "priority — !1 to !5"],
    ["!!", "quick, under a few minutes"],
  ];

  function parseShortcuts(raw) {
    var title = String(raw || ""), priority = null, quick = false, containerId = null;

    var withoutQuick = title.replace(/(^|\s)!!(?=\s|$)/g, " ");
    if (withoutQuick !== title) quick = true;
    title = withoutQuick;

    title = title.replace(/(^|\s)!([1-5])(?=\s|$)/g, function (_, s, n) {
      priority = Number(n);
      return " ";
    });

    /* @eric matches on any word of a name, so @merrall works as well as @eric. An
       unrecognised one is left exactly as typed — it is far more likely to be an
       email address than a customer you have not made yet. */
    if (containersOn()) {
      title = title.replace(/(^|\s)@([\w-]+)/g, function (whole, s, word) {
        var hit = containers.filter(function (c) {
          return String(c.text).toLowerCase().split(/\s+/).some(function (w) {
            return w.indexOf(word.toLowerCase()) === 0;
          });
        })[0];
        if (!hit) return whole;
        containerId = hit.id;
        return " ";
      });
    }

    return {
      title: title.replace(/\s{2,}/g, " ").trim(),
      priority: priority, quick: quick, containerId: containerId,
    };
  }

  /* What is actually about to be added, whichever bar is in use. One place, so the
     sentence cannot ever show something different from what the Add button does. */
  function draftParts() {
    var raw = draftText || "";
    if (addStyle() !== "sentence") {
      var suggested = containersOn() && !draftContainerId && !draftContainerOff
        && raw.trim().length > 2 ? matchContainerName(raw) : null;
      return {
        title: raw.trim(), priority: draftPriority, quick: draftQuick,
        containerId: draftContainerId, suggestion: suggested,
      };
    }
    var r = parseShortcuts(raw);
    var named = containersOn() && !draftContainerOff && !r.containerId && !draftContainerId
      && r.title.length > 2 ? matchContainerName(r.title) : null;
    var filed = draftContainerOff ? null : (r.containerId || draftContainerId || (named ? named.id : null));
    return {
      /* The name still comes out of the title even when you have unfiled it — you
         wrote "for Eric" as a sentence, not as part of what the task is called. */
      title: named ? stripContainerName(r.title, named.text) : r.title,
      priority: r.priority || draftPriority,
      quick: r.quick || draftQuick,
      containerId: filed,
      suggestion: null,
    };
  }

  /* Typing normally must not redraw the page, or the cursor jumps to the end of the
     line mid-word. So the bar only redraws when what it SAYS would change — which is
     the rare keystroke that completes a !2 or an @eric, not the other twenty. */
  function addSignature() {
    var d = draftParts();
    return [addStyle(), d.title.length > 0, draftIsContainer, d.priority, d.quick,
      d.containerId || "-", d.suggestion ? d.suggestion.id : "-", draftAssignee || "-"].join("|");
  }

  function addFieldHtml(placeholder, withQ) {
    return '<div class="add-field">' +
      '<input id="taskInput" class="task-input' + (withQ ? ' has-q' : '') + '" placeholder="' +
      escapeHtml(placeholder) + '" value="' + escapeHtml(draftText) + '" />' +
      (withQ
        ? '<button class="q-mark' + (showAddKeys ? ' on' : '') + '" data-action="toggle-add-keys" ' +
          'aria-label="Shortcuts">?</button>'
        : '') +
      '</div>' + (withQ && showAddKeys ? shortcutHelpHtml() : '');
  }

  function shortcutHelpHtml() {
    var rows = SHORTCUT_HELP.slice();
    if (containersOn()) rows.push(["@" + shortcutExample(), "file it under a customer or job"]);
    return '<div class="keys">' +
      rows.map(function (r) {
        return '<div class="key-row"><code>' + escapeHtml(r[0]) + '</code><span>' + r[1] + '</span></div>';
      }).join('') +
      '<div class="key-note">Anywhere in the line. They come out of the title when it is saved.' +
      (containersOn()
        ? ' Or just write the name — <em>“order a belt for ' + escapeHtml(exampleContainerName()) +
          '”</em> files itself.'
        : '') + '</div></div>';
  }
  // Teach it with a name you actually have, rather than one invented for a manual.
  function exampleContainerName() {
    return containers.length ? containers[0].text : "Eric Merrall";
  }
  function shortcutExample() {
    return String(exampleContainerName()).split(/\s+/)[0].toLowerCase();
  }

  function draftPriorityDots(action) {
    var d = draftParts();
    return [1, 2, 3, 4, 5].map(function (p) {
      var active = d.priority === p;
      return '<button class="p-dot ' + (active ? 'active' : '') + '" style="' +
        (active ? 'background:' + PRIORITY_COLORS[p] + ';border-color:' + PRIORITY_COLORS[p] : '') +
        '" data-action="' + action + '" data-p="' + p + '">' + p + '</button>';
    }).join('');
  }

  /* Reveal has no Task/Customer toggle sitting there when idle, so the way to make a
     customer has to appear with everything else — as an offer about the words you have
     actually typed, rather than a control you have to know to reach for first.

     It stands down when the bar already has something to say: a recognised name is the
     more useful line, and two quiet lines are no longer quiet. */
  function makeContainerOfferHtml() {
    if (!containersOn() || draftIsContainer) return '';
    var d = draftParts();
    if (!d.title || d.containerId || d.suggestion) return '';
    return '<button class="inside-suggest" data-action="set-draft-kind" data-kind="container">' +
      '↳ Or make “<strong>' + escapeHtml(d.title) + '</strong>” a customer or job</button>';
  }

  /* The sentence. Not a control panel — a line you read, one line high whatever it
     says, with every underlined word the control for that part. */
  function sentenceHtml(forContainer) {
    var d = draftParts();
    var h = '<div class="sentence">Adding ' +
      (containersOn() || forContainer
        ? '<button class="s-word" data-action="flip-draft-kind">' +
          (draftIsContainer ? (forContainer ? 'an update' : 'a customer or job') : 'a task') + '</button>'
        : '<span class="s-plain">a task</span>');

    if (!draftIsContainer) {
      h += ', ';
      h += sentenceDots
        ? '<span class="s-dots">' + draftPriorityDots("set-sentence-priority") + '</span>'
        : '<button class="s-word" style="color:' + PRIORITY_COLORS[d.priority] +
          '" data-action="open-sentence-dots">priority ' + d.priority + '</button>';

      h += '<button class="s-word' + (d.quick ? '' : ' off') + '" data-action="flip-draft-quick">' +
        (d.quick ? ', quick' : ', not quick') + '</button>';

      if (containersOn() && !forContainer) {
        h += d.containerId
          ? '<button class="s-word" data-action="unfile-draft">, for ' +
            escapeHtml(containerName(d.containerId) || '') + '</button>'
          : '<button class="s-word off" data-action="cycle-draft-container">, for nobody</button>';
      }
      if (sharing()) {
        h += '<button class="s-word' + (draftAssignee ? '' : ' off') + '" data-action="cycle-draft-assignee">, ' +
          (draftAssignee ? escapeHtml(firstNameOf(personName(draftAssignee) || '')) + '’s' : 'anyone’s') +
          '</button>';
      }
    }
    return h + '<button class="btn-add s-go" data-action="add-task">Add</button></div>';
  }

  /* ---- The plan, collapsed by customer ----

     Two different questions, two different answers.

     WHAT CAN I DO NEXT is a task — a loose one, or one filed under a customer. Focus
     mode and the sweeps run on that, unchanged, because a container is never a thing
     you do.

     WHAT IS ON THE PLAN is one line per customer plus the loose tasks. That is the
     only place the two answers differ, and it is the whole point of the mode. */
  function entriesFor(planList) {
    var out = [], byContainer = {};
    planList.forEach(function (t) {
      if (t.containerId && containerById(t.containerId)) {
        (byContainer[t.containerId] = byContainer[t.containerId] || []).push(t);
      } else {
        out.push({ kind: "task", task: t, id: t.id, priority: t.priority || 3 });
      }
    });
    Object.keys(byContainer).forEach(function (id) {
      var inside = byContainer[id].sort(byPriorityThenOrder);
      out.push({
        kind: "container", container: containerById(id), id: id,
        tasks: inside, priority: containerUrgency(inside),
      });
    });
    return out.sort(function (a, b) {
      if (a.priority !== b.priority) return a.priority - b.priority;
      // Customers above loose tasks at the same priority — they are the bigger thing.
      if (a.kind !== b.kind) return a.kind === "container" ? -1 : 1;
      return byPriorityThenOrder(a.task || a.tasks[0], b.task || b.tasks[0]);
    });
  }
  function entryLabel(e) {
    return e.kind === "container" ? e.container.text : e.task.text;
  }
  function firstNonEmptyOf(list, priorityOf) {
    for (var p = 1; p <= 5; p++) {
      for (var i = 0; i < list.length; i++) if (priorityOf(list[i]) === p) return p;
    }
    return null;
  }

  function addPlaceholder() {
    return draftIsContainer
      ? 'A customer, or a job like “Meridian DPD claim”'
      : 'Add a task for ' + fmtDate(planDate);
  }

  function planAddBox(normalControlsHtml, repeatPillHtml) {
    var style = addStyle();
    var d = draftParts();

    if (style === "sentence") {
      return '<div class="add-box sentence-box">' + addFieldHtml(addPlaceholder(), true) +
        (d.title ? sentenceHtml(false) : '') + '</div>';
    }

    // Reveal keeps every control the original has — it only waits until they apply.
    var showControls = style === "original" || !!d.title;
    var h = '<div class="add-box">' + addFieldHtml(addPlaceholder(), false);
    if (!showControls) return h + '</div>';

    h += kindRowHtml() + insideChipHtml();
    h += draftIsContainer
      ? '<div class="add-row"><button class="btn-add" data-action="add-task">Add</button></div>'
      : '<div class="add-row">' + normalControlsHtml + repeatPillHtml +
        '<button class="btn-add" data-action="add-task">Add</button></div>' + whoRowHtml();
    if (style === "reveal") h += makeContainerOfferHtml();
    return h + '</div>';
  }

  /* Task or customer, decided as you type rather than afterwards.

     "Repairs room" is a job to do; "Douglas Grant" is a name to hang work on. They are
     typed into the same box in the same second, so the choice belongs there — not in a
     separate screen for making customers, which nobody would ever open. */
  function kindRowHtml() {
    if (!containersOn()) return '';
    return '<div class="kind-row"><span class="segmented small">' +
      '<button class="' + (!draftIsContainer ? "active" : "") + '" data-action="set-draft-kind" data-kind="task">Task</button>' +
      '<button class="' + (draftIsContainer ? "active" : "") + '" data-action="set-draft-kind" data-kind="container">Customer or job</button>' +
      '</span></div>';
  }
  /* The offer to file it, made only when the name is already on the list. Shown as a
     suggestion you accept rather than something that happens to you. */
  function insideChipHtml() {
    if (!containersOn() || draftIsContainer) return '';
    if (draftContainerId) {
      var c = containerById(draftContainerId);
      if (!c) return '';
      return '<div class="kind-row"><button class="inside-chip" data-action="clear-draft-container">' +
        'in ' + escapeHtml(c.text) + ' ✕</button></div>';
    }
    var m = (draftText || "").trim().length > 2 ? matchContainerName(draftText) : null;
    if (!m) return '';
    return '<button class="inside-suggest" data-action="accept-draft-container" data-id="' + m.id + '">' +
      '↳ Put inside <strong>' + escapeHtml(m.text) + '</strong></button>';
  }

  function renderPlanEntry(e) {
    if (e.kind === "task") return renderTaskRow(e.task);
    var c = e.container;
    var next = e.tasks[0];
    var more = e.tasks.length - 1;
    return '<div class="task-row container-row" data-action="open-container" data-id="' + c.id + '">' +
      '<span class="c-dot">' + escapeHtml(containerInitials(c.text)) + '</span>' +
      '<span class="task-text">' + escapeHtml(c.text) +
      '<span class="c-next">' + escapeHtml(next.text) +
      (more > 0 ? ' <span class="c-more">+' + more + ' more</span>' : '') + '</span></span>' +
      (sharing() ? '' :
        '<span class="p-badge" style="background:' + PRIORITY_COLORS[e.priority] +
        ';border-color:' + PRIORITY_COLORS[e.priority] + '">' + e.priority + '</span>') +
      '<span class="chev">›</span>' +
      '</div>';
  }

  // ---- Folded priority groups ----
  function firstNonEmptyPriority(list) {
    for (var p = 1; p <= 5; p++) {
      if (list.some(function (t) { return t.priority === p; })) return p;
    }
    return null;
  }
  function groupIsOpen(key, isDefault) {
    if (expandedGroups === null) return isDefault;
    return !!expandedGroups[key];
  }
  function toggleGroup(key) {
    if (expandedGroups === null) {
      // First interaction: keep whatever was already showing, then apply the tap.
      expandedGroups = {};
      var today = todayStr();
      var planTasks = tasks.filter(function (t) { return t.date === planDate && t.status !== "done"; });
      var auto = firstNonEmptyPriority(settings.repeats ? planTasks.filter(function (t) { return !t.repeat; }) : planTasks);
      if (auto) expandedGroups["p" + auto] = true;
    }
    expandedGroups[key] = !expandedGroups[key];
    render();
  }

  function foldedGroup(key, name, colour, items, renderRow, openByDefault, labelOf) {
    var open = groupIsOpen(key, openByDefault);
    // Collapsed groups show a glimpse of what is inside, so the page still tells you something.
    var first = labelOf ? labelOf(items[0]) : items[0].text;
    var peek = open ? '<span class="g-count">' + items.length + '</span>'
      : '<span class="g-peek">' + escapeHtml(first) +
        (items.length > 1 ? ' +' + (items.length - 1) : '') + '</span>';
    return '<div class="group folded">' +
      '<button class="group-toggle" data-action="toggle-group" data-group="' + key + '" aria-expanded="' + open + '">' +
      '<span class="g-chev">' + (open ? '▾' : '▸') + '</span>' +
      '<span class="g-dot" style="background:' + colour + '"></span>' +
      '<span class="g-name" style="color:' + colour + '">' + name + '</span>' +
      peek +
      '</button>' +
      (open ? '<div class="group-body">' + items.map(renderRow).join('') + '</div>' : '') +
      '</div>';
  }

  /* The plan, built as named parts.

     Two screens want these pieces now: the ordinary plan, and the shared board where
     the same date row, add box and drawers sit around two columns instead of one list.
     Returning the parts rather than one string means there is still only one of each. */
  function planParts() {
    var today = todayStr(), tomorrow = addDaysStr(1);
    var repeatsOn = !!settings.repeats;
    var elig = eligibleForAnyone();
    var quickElig = quickEligibleTasks();
    var dailyElig = repeatsOn ? dailyEligibleTasks() : [];
    var planTasksAll = tasks.filter(function (t) {
      return t.date === planDate && t.status !== "done" && !isHeld(t);
    });
    var planTasks = repeatsOn ? planTasksAll.filter(function (t) { return !t.repeat; }) : planTasksAll;
    var repeatingTasks = repeatsOn ? planTasksAll.filter(function (t) { return !!t.repeat; }) : [];
    var nowTs = Date.now();
    var later = tasks.filter(function (t) {
      return t.status !== "done" && !isHeld(t) && (t.date > today || (t.snoozedUntil && t.snoozedUntil > nowTs));
    }).sort(function (a, b) {
      var aKey = a.snoozedUntil || 0, bKey = b.snoozedUntil || 0;
      if (aKey !== bKey) return aKey - bKey;
      return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
    });
    var anySnoozed = later.some(function (t) { return t.snoozedUntil && t.snoozedUntil > nowTs; });

    var grouped = !!settings.groupedPlan;

    /* With customers and jobs on, the plan is built from entries rather than tasks:
       one line per customer with something outstanding, plus the tasks that belong to
       nobody. The first version of this listed every task under its customer, which
       turned nine lines into twenty and made the plan feel like a wall — the plan is
       for taking in the shape of the day, and the doing happens a screen further in. */
    var planEntries = containersOn() ? entriesFor(planTasks) : null;
    var entryPriority = function (e) { return e.priority; };
    var firstOpen = containersOn()
      ? firstNonEmptyOf(planEntries, entryPriority)
      : firstNonEmptyPriority(planTasks);

    var groupsHtml = "", anyTasks = false;
    for (var p = 1; p <= 5; p++) {
      var group, renderRow;
      if (containersOn()) {
        group = planEntries.filter(function (e) { return e.priority === p; });
        renderRow = renderPlanEntry;
      } else {
        group = planTasks.filter(function (t) { return t.priority === p; }).sort(byPriorityThenOrder);
        renderRow = renderTaskRow;
      }
      if (group.length === 0) continue;
      anyTasks = true;
      groupsHtml += grouped
        ? foldedGroup("p" + p, "Priority " + p, PRIORITY_COLORS[p], group, renderRow,
            firstOpen === p, containersOn() ? entryLabel : null)
        : '<div class="group"><div class="group-label" style="color:' + PRIORITY_COLORS[p] + '">Priority ' + p + '</div>' +
          group.map(renderRow).join('') + '</div>';
    }

    var repeatingHtml = "";
    if (repeatingTasks.length > 0) {
      anyTasks = true;
      repeatingHtml = grouped
        ? foldedGroup("rep", "🔁 Repeating", "var(--text-dim)", repeatingTasks, renderRepeatingRow, false)
        : '<div class="group"><div class="group-label" style="color:var(--text-dim)">🔁 Repeating</div>' +
          repeatingTasks.map(renderRepeatingRow).join('') + '</div>';
    }

    if (!anyTasks) {
      groupsHtml = '<div class="empty-state">Nothing scheduled for ' + fmtDate(planDate).toLowerCase() + ' yet.</div>';
    }

    var laterHtml = "";
