  /* ---- Theme system ----------------------------------------------------
     Everything visual comes from one of these. A theme overrides variables;
     it never rewrites a layout rule.

       --bg / --text / --text-dim / --text-faint   the page itself
       --surface / --surface-2                     panels and boxes
       --line / --line-strong / --line-soft        borders and dividers
       --paper / --ink / --ink-dim                 the focus card and inputs
       --on-sage / --on-amber / --on-paper         text sitting on a fill
       --p1..--p5                                  priority ramp, 1 hottest

     Colour alone could not make a theme look like a different app. What
     actually distinguishes Material from iOS from Spotify is corner radius,
     type, weight, letter-spacing and how much shadow there is — so those are
     variables too, and the defaults below are exactly the original look:

       --font-ui / --font-display                  type
       --r-xl .. --r-2xs, --r-pill                 corner radius
       --btn-weight / --btn-track / --btn-case     how buttons carry themselves
       --card-shadow / --card-border               how much a card lifts
       --logo-weight / --logo-track                the masthead
     -------------------------------------------------------------------- */

    --font-ui: 'Inter', sans-serif;
    --font-display: 'Fraunces', serif;
    --r-xl: 16px; --r-lg: 14px; --r-md: 12px; --r-sm: 10px; --r-xs: 9px;

    --btn-track: 0.01em;

    --card-border: 1px solid transparent;
    --logo-weight: 500;
    --logo-track: -0.01em;
    --logo-case: none;
  }

    --p4-tint: rgba(0,106,106,0.07);

    --on-amber: #1C1503;
    --on-paper: #101820;
    --shadow-strong: rgba(0,0,0,0.55);
    --shadow-mid: rgba(0,0,0,0.42);
    --shadow-soft: rgba(0,0,0,0.32);
    --p1: #B45E56;
    --p2: #BE7A57;
    --p3: #C9A24E;
    --p4: #7AA3A6;
    --p5: #5D9AA6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    font-family: var(--font-ui);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom);
  }
  #app {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(20px, env(safe-area-inset-top)) 20px 40px;
  }
  /* Width.

     540px is right for a phone and right for one card on a laptop — a line of text
     much longer than that is harder to read, not easier. So the ordinary views only
     grow a little on a big screen.

     The shared list is a different problem: it is two columns, each of which has to
     hold a card or a list of rows with buttons on them. At 540px total they get about
     250px each, which is where "Pack clothes" starts breaking mid-word. It gets the
     room it actually needs instead. */
  .wrap { width: 100%; max-width: 540px; }
  @media (min-width: 860px) { .wrap { max-width: 620px; } }

  /* The shared screen widens the moment it splits, not later. Growing it only at
     900px left a stretch of laptop and tablet widths where there were two columns
     inside a phone-width page — about 260px each, which is where a task title starts
     breaking mid-word. */
  @media (min-width: 700px) { .wrap.wide { max-width: 96vw; } }
  @media (min-width: 1240px) { .wrap.wide { max-width: 1180px; } }
  @media (min-width: 1500px) { .wrap.wide { max-width: 1320px; } }
  @media (min-width: 900px) {
    .wrap.wide .team-split { gap: 22px; }
    .wrap.wide .team-list { max-height: 62vh; }
  }

  .header { margin-bottom: 32px; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .header-slot { flex: 0 0 auto; width: 44px; display: flex; align-items: center; padding-top: 4px; }
  .header-slot.right { justify-content: flex-end; }
  .header-center { flex: 1; text-align: center; }
  .profile-btn {
    background: transparent; border: 1px solid var(--line); color: var(--text-dim);
    border-radius: var(--r-xs); padding: 6px 11px; font-size: 0.74rem; cursor: pointer; white-space: nowrap;
  }
  .burger {
    background: transparent; border: none; cursor: pointer; padding: 6px 2px;
    display: flex; flex-direction: column; gap: 4px; width: 34px; align-items: flex-end;
  }
  .burger span { display: block; height: 1.5px; width: 20px; background: var(--text-dim); border-radius: 2px; }
  .burger span:nth-child(2) { width: 14px; }

  /* ---- Menu ---- */
  .menu-list { display: flex; flex-direction: column; gap: 2px; }
  .menu-item {
    width: 100%; background: transparent; border: none; border-radius: var(--r-sm);
    color: var(--text); text-align: left; padding: 15px 14px; font-size: 0.94rem;
    cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .menu-item:hover { background: var(--surface); }
  .menu-item .chev { color: var(--text-faint); font-size: 0.9rem; }
  .menu-sub { font-size: 0.76rem; color: var(--text-dim); display: block; margin-top: 3px; }
  .menu-item-label { display: flex; flex-direction: column; }
  .menu-divider { height: 1px; background: var(--line-soft); margin: 12px 2px; }
  .menu-section-label {
    font-size: 0.7rem; color: var(--text-faint); letter-spacing: 0.06em;
    text-transform: uppercase; margin: 4px 0 8px 14px;
  }
  .segmented { display: flex; gap: 6px; background: var(--surface); border-radius: var(--r-md); padding: 5px; }
  .segmented button {
    flex: 1; background: transparent; border: none; border-radius: var(--r-xs); cursor: pointer;
    padding: 11px 0; font-size: 0.88rem; color: var(--text-dim); font-family: var(--font-ui);
  }
  .segmented button.active { background: var(--paper); color: var(--ink); font-weight: 600; }

  /* Toggle rows */
  .setting-row {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 14px 2px; border-bottom: 1px solid var(--line-soft);
  }
  .setting-row:last-of-type { border-bottom: none; }
  .setting-text { flex: 1; }
  .setting-name { font-size: 0.9rem; color: var(--text); }
  .setting-desc { font-size: 0.76rem; color: var(--text-dim); margin-top: 4px; line-height: 1.45; }
  /* Copy / paste data */
  .data-box {
    width: 100%; height: 92px; resize: none; margin-bottom: 12px;
    background: var(--surface); color: var(--text-dim); border: 1px solid var(--line-soft);
    border-radius: var(--r-sm); padding: 12px; outline: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.72rem; line-height: 1.5; word-break: break-all;
  }
  .data-box:focus { border-color: var(--line); color: var(--text); }
  .data-summary { font-size: 0.78rem; color: var(--text-dim); margin: 0 2px 10px; }
  .data-box::placeholder { color: var(--text-faint); }

  /* Notification setup checklist */
  .setup-steps { list-style: none; padding: 0; margin: 18px 0 20px; display: flex; flex-direction: column; gap: 2px; }
  .setup-step { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: var(--r-sm); }
  .setup-step.current { background: var(--surface); }
  .step-mark {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; margin-top: 1px;
    border: 1px solid var(--line); color: var(--text-dim); font-size: 0.72rem; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .setup-step.done .step-mark { background: var(--sage); border-color: var(--sage); color: var(--on-sage); }
  .setup-step.current .step-mark { border-color: var(--amber); color: var(--amber); }
  .step-body { display: flex; flex-direction: column; }
  .step-name { font-size: 0.88rem; color: var(--text); }
  .setup-step.done .step-name { color: var(--text-dim); }
  .step-note { font-size: 0.78rem; color: var(--text-dim); margin-top: 5px; line-height: 1.55; }
  .notify-at {
    font-size: 0.7rem; color: var(--text-faint); border: 1px solid var(--line-soft);
    border-radius: var(--r-2xs); padding: 1px 6px; margin-left: 6px; white-space: nowrap;
  }
  .switch {
    flex-shrink: 0; width: 46px; height: 27px; border-radius: var(--r-lg); cursor: pointer;
    background: var(--surface-2); border: 1px solid var(--line); position: relative;
    transition: background 0.16s ease, border-color 0.16s ease; padding: 0;
  }
  .switch .knob {
    position: absolute; top: 2px; left: 2px; width: 21px; height: 21px; border-radius: 50%;
    background: var(--text-dim); transition: transform 0.16s ease, background 0.16s ease;
  }
  .switch.on { background: var(--sage); border-color: var(--sage); }
  .switch.on .knob { transform: translateX(19px); background: var(--on-sage); }

  /* Theme picker */
  .theme-grid { display: flex; flex-direction: column; gap: 10px; }
  .theme-option {
    display: flex; align-items: center; gap: 14px; width: 100%; cursor: pointer;
    background: transparent; border: 1px solid var(--line-soft); border-radius: var(--r-md);
    padding: 12px 14px; font-family: var(--font-ui); text-align: left;
  }
  .theme-option.active { border-color: var(--sage); background: var(--sage-tint); }
  .theme-swatch { display: flex; flex-shrink: 0; border-radius: var(--r-xs); overflow: hidden; border: 1px solid var(--line-soft); }
  .theme-swatch i { display: block; width: 17px; height: 34px; }
  /* The swatch borrows its own theme's corner radius, so the row shows the shape as
     well as the palette — which is half of what distinguishes these. The name is set
     in that theme's own face for the same reason. */
  .theme-name {
    font-size: 0.9rem; color: var(--text);
    font-family: var(--font-ui); font-weight: var(--logo-weight);
    letter-spacing: var(--logo-track);
  }
  .theme-note { font-size: 0.74rem; color: var(--text-dim); margin-top: 2px; }
  .theme-tick { margin-left: auto; color: var(--sage); font-size: 0.95rem; }

  /* Guide — contents list */
  .guide-list { display: flex; flex-direction: column; gap: 6px; margin-top: 16px; }
  .guide-item {
    display: flex; align-items: center; gap: 13px; width: 100%; text-align: left;
    background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-md);
    padding: 13px 14px; cursor: pointer; font-family: var(--font-ui);
  }
  .guide-item:hover { border-color: var(--line); }
  .guide-num {
    flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
    background: var(--surface-2); border: 1px solid var(--line-soft); color: var(--text-dim);
    font-size: 0.74rem; font-weight: 600; display: flex; align-items: center; justify-content: center;
  }
  .guide-item-text { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  .guide-item-title { font-size: 0.9rem; color: var(--text); }
  .guide-item-sub { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; }
  .guide-item.done { border-color: var(--line-soft); }
  .guide-num.done { background: var(--sage); border-color: var(--sage); color: var(--on-sage); }

  /* Expanded step list under a finished chapter */
  .guide-steps {
    display: flex; flex-direction: column; gap: 1px;
    margin: 2px 0 8px 13px; padding-left: 13px; border-left: 1px solid var(--line-soft);
  }
  .guide-steplink {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: transparent; border: none; cursor: pointer; padding: 9px 8px;
    border-radius: var(--r-xs); font-family: var(--font-ui);
    font-size: 0.81rem; color: var(--text-dim);
  }
  .guide-steplink:hover { background: var(--surface); color: var(--text); }
  .gs-n {
    flex-shrink: 0; width: 18px; height: 18px; border-radius: 50%;
    background: var(--surface-2); color: var(--text-faint);
    font-size: 0.62rem; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }

  /* Cross-references between chapters */
  .see-also-wrap {
    margin: 18px 0 4px; padding-top: 14px; border-top: 1px solid var(--line-soft);
    display: flex; flex-direction: column; gap: 5px;
  }
  .see-also-label {
    font-size: 0.66rem; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--text-faint); margin-bottom: 3px;
  }
  .see-also {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-sm);
    padding: 10px 12px; cursor: pointer; font-family: var(--font-ui);
  }
  .see-also:hover { border-color: var(--line); }
  .sa-text { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  .sa-title { font-size: 0.82rem; color: var(--text); }
  .sa-chapter { font-size: 0.7rem; color: var(--text-faint); margin-top: 2px; }
  .sa-arrow { color: var(--text-faint); font-size: 0.8rem; flex-shrink: 0; }

  .guide-return {
    display: inline-block; background: var(--amber-tint); border: 1px solid var(--amber-line);
    color: var(--amber); border-radius: var(--r-xs); padding: 7px 12px; margin-bottom: 14px;
    font-size: 0.76rem; cursor: pointer; font-family: var(--font-ui);
  }

  /* Between chapters */
  .chapter-end { text-align: center; padding: 26px 0 20px; }
  .ce-tick {
    width: 46px; height: 46px; border-radius: 50%; margin: 0 auto 14px;
    background: var(--sage); color: var(--on-sage);
    font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
  }
  .ce-title { font-family: var(--font-display); font-size: 1.25rem; color: var(--text); }
  .ce-sub { font-size: 0.78rem; color: var(--text-dim); margin-top: 5px; }
  .ce-next {
    background: var(--surface); border: 1px solid var(--line-soft);
    border-radius: var(--r-md); padding: 15px; margin-bottom: 14px;
  }
  .ce-next-label {
    font-size: 0.66rem; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--text-faint); margin-bottom: 6px;
  }
  .ce-next-title { font-size: 0.98rem; color: var(--text); }
  .ce-next-sub { font-size: 0.77rem; color: var(--text-dim); margin-top: 3px; line-height: 1.5; }

  /* Pickable segmented control inside a demo */
  .mk-seg.pick span { cursor: pointer; }
  .mk-switch.act { cursor: pointer; border: none; padding: 0; background: var(--surface-2); }
  .mk-switch.act.on { background: var(--sage); }
  .mk-switch.act::after { background: var(--text-dim); }
  .mk-switch.act.on::after { background: var(--on-sage); }
  .mk-switch.act:not(.on)::after { right: auto; left: 2px; }
  .mk-flatlabel {
    font-size: 0.6rem; font-weight: 700; letter-spacing: 0.05em;
    margin: 9px 0 2px; text-transform: uppercase;
  }

  /* Guide — chapter navigation */
  .guide-nav { display: flex; gap: 8px; margin-top: 26px; }
  .guide-nav button {
    flex: 1; background: transparent; border: 1px solid var(--line); color: var(--text);
    border-radius: var(--r-sm); padding: 12px 0; font-size: 0.84rem; cursor: pointer;
    font-family: var(--font-ui);
  }
  .guide-nav button.primary { background: var(--sage); border-color: var(--sage); color: var(--on-sage); font-weight: 600; }
  .guide-nav button:disabled { opacity: 0.35; cursor: default; }
  .guide-progress { font-size: 0.72rem; color: var(--text-faint); text-align: center; margin-top: 14px; }

  /* Guide — interactive demo blocks */
  .demo {
    border: 1px dashed var(--line); border-radius: var(--r-lg); padding: 15px;
    margin: 14px 0 4px; background: var(--surface);
  }
  .demo-label {
    font-size: 0.68rem; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--amber); font-weight: 700; margin-bottom: 11px;
  }
  .demo-hint { font-size: 0.76rem; color: var(--text-dim); margin: 11px 0 0; line-height: 1.5; }
  .demo-reset {
    background: transparent; border: none; color: var(--text-faint); font-size: 0.75rem;
    cursor: pointer; padding: 8px 0 0; text-decoration: underline;
  }

  /* Guide — fake task row */
  .fake-row {
    display: flex; align-items: center; gap: 10px; background: var(--bg);
    border: 1px solid var(--line-soft); border-radius: var(--r-sm); padding: 9px 12px;
  }
  .fake-row.ticked { border-color: var(--sage); background: var(--sage-tint); }
  .fake-check {
    width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; cursor: pointer;
    border: 1px solid var(--line-strong); background: transparent; color: var(--sage);
    display: flex; align-items: center; justify-content: center; font-size: 0.8rem; padding: 0;
  }
  .fake-row.ticked .fake-check { background: var(--sage); border-color: var(--sage); color: var(--on-sage); }
  .fake-text { flex: 1; font-size: 0.87rem; color: var(--text); }
  .fake-row.ticked .fake-text { text-decoration: line-through; color: var(--text-dim); }
  .fake-badge {
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; color: var(--on-paper);
    font-size: 0.68rem; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }

  /* Guide — fake focus card and queue */
  .fake-card {
    background: var(--paper); border-radius: var(--r-lg); padding: 22px 18px; text-align: center;
    box-shadow: 0 10px 22px var(--shadow-soft);
  }
  .fake-card .fc-tag { font-size: 0.64rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
  .fake-card .fc-text {
    font-family: var(--font-display); font-size: 1.15rem; color: var(--ink); margin: 7px 0 0; line-height: 1.35;
  }
  .fake-actions { display: flex; gap: 8px; margin-top: 11px; }
  .fake-actions button {
    flex: 1; border-radius: var(--r-xs); padding: 10px 0; font-size: 0.8rem; cursor: pointer;
    font-family: var(--font-ui); border: 1px solid var(--line);
    background: transparent; color: var(--text);
  }
  .fake-actions button.go { background: var(--sage); border-color: var(--sage); color: var(--on-sage); font-weight: 600; }
  .queue-strip { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .queue-chip {
    font-size: 0.7rem; padding: 5px 9px; border-radius: var(--r-2xs);
    border: 1px solid var(--line-soft); color: var(--text-dim); white-space: nowrap;
  }
  .queue-chip.now { border-color: var(--sage); color: var(--text); background: var(--sage-tint); }
  .queue-chip.gone { opacity: 0.45; text-decoration: line-through; }

  /* Guide — mock screens. Built from the same colours as the real thing, so the
     shapes are recognisable, with everything but the described part dimmed back. */
  .mock {
    background: var(--bg); border: 1px solid var(--line-soft);
    border-radius: var(--r-lg); padding: 13px; margin: 14px 0 4px;
  }
  .mock.spotlight .mock-el { opacity: 0.26; transition: opacity 0.2s ease; }
  .mock-el { margin-bottom: 9px; border-radius: var(--r-xs); }
  .mock-el:last-child { margin-bottom: 0; }
  .mock.spotlight .mock-el.spot { opacity: 1; box-shadow: 0 0 0 2px var(--amber); }
  .mock-el.spot { position: relative; }

  .mk-logo { font-family: var(--font-display); font-size: 1rem; color: var(--text); text-align: center; }
  .mk-sub { font-size: 0.68rem; color: var(--text-dim); text-align: center; margin-top: 2px; }
  .mk-pill {
    display: inline-block; font-size: 0.66rem; color: var(--text-dim);
    border: 1px solid var(--line); border-radius: var(--r-2xs); padding: 4px 9px; margin-right: 5px;
  }
  .mk-pill.on { background: var(--paper); color: var(--ink); border-color: var(--paper); font-weight: 600; }
  .mk-input {
    background: var(--paper); color: var(--ink); border-radius: var(--r-2xs);
    padding: 8px 10px; font-size: 0.72rem; margin-bottom: 7px;
  }
  .mk-addrow { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .mk-label { font-size: 0.62rem; color: var(--text-dim); margin-right: 2px; }
  .mk-dot {
    width: 19px; height: 19px; border-radius: 50%; border: 1px solid var(--line-strong);
    color: var(--text-dim); font-size: 0.6rem; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .mk-dot.on { color: var(--on-paper); border-color: transparent; }
  .mk-quick {
    font-size: 0.62rem; color: var(--text-dim); border: 1px solid var(--line-strong);
    border-radius: var(--r-2xs); padding: 4px 7px;
  }
  .mk-addbtn {
    margin-left: auto; background: var(--sage); color: var(--on-sage);
    font-size: 0.66rem; font-weight: 600; border-radius: var(--r-2xs); padding: 5px 13px;
  }
  .mk-drawer {
    display: flex; align-items: center; gap: 7px; padding: 7px 3px;
    border-bottom: 1px solid var(--line-soft);
  }
  .mk-chev { font-size: 0.6rem; color: var(--text-faint); }
  .mk-band { width: 7px; height: 7px; border-radius: 50%; }
  .mk-drawer-name { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.05em; }
  .mk-peek { margin-left: auto; font-size: 0.66rem; color: var(--text-faint); }
  .mk-task {
    display: flex; align-items: center; gap: 8px; padding: 7px 9px; margin: 6px 0;
    border: 1px solid var(--line-soft); border-radius: var(--r-xs);
  }
  .mk-check {
    width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
    border: 1px solid var(--line-strong); color: var(--sage); font-size: 0.62rem;
    display: flex; align-items: center; justify-content: center; background: transparent; padding: 0;
  }
  .mk-check.act { cursor: pointer; }
  .mk-task-text { flex: 1; font-size: 0.74rem; color: var(--text); }
  .mk-badge {
    width: 17px; height: 17px; border-radius: 50%; color: var(--on-paper);
    font-size: 0.58rem; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }
  .mk-line { font-size: 0.68rem; color: var(--text-dim); padding: 5px 3px; }
  .mk-begin {
    background: var(--amber); color: var(--on-amber); text-align: center;
    border-radius: var(--r-xs); padding: 10px 0; font-size: 0.76rem; font-weight: 600;
  }
  .mk-sweepbtn {
    border: 1px solid var(--amber-line); color: var(--amber); text-align: center;
    border-radius: var(--r-xs); padding: 10px 0; font-size: 0.76rem; font-weight: 600;
  }
  .mk-sweepbtn.rep { border-color: var(--p4-line); color: var(--p4); }

  .mk-stack { position: relative; }
  .mk-card {
    background: var(--paper); border-radius: var(--r-md); padding: 18px 15px; text-align: center;
    box-shadow: 0 8px 18px var(--shadow-soft); position: relative;
  }
  .mk-card.small { padding: 14px 12px; }
  .mk-note { position: absolute; top: 8px; right: 10px; font-size: 0.7rem; opacity: 0.35; }
  .mk-ptag { font-size: 0.58rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
  .mk-cardtext {
    font-family: var(--font-display); font-size: 1rem; color: var(--ink);
    margin-top: 5px; line-height: 1.3;
  }
  .mk-steps { font-size: 0.62rem; color: var(--ink-dim); margin-top: 6px; }
  .mk-count { font-size: 0.64rem; color: var(--text-dim); text-align: center; margin-top: 8px; }
  .mk-primary {
    background: var(--sage); color: var(--on-sage); text-align: center;
    border-radius: var(--r-xs); padding: 10px 0; font-size: 0.76rem; font-weight: 700;
  }
  .mk-secondary {
    border: 1px solid var(--line); color: var(--text); text-align: center;
    border-radius: var(--r-xs); padding: 9px 0; font-size: 0.74rem;
  }
  .mk-link { text-align: center; font-size: 0.7rem; color: var(--text-dim); padding: 3px 0; }
  .mk-pair { display: flex; gap: 6px; }
  .mk-pair .mock-el { flex: 1; margin-bottom: 0; }
  .mk-chips { display: flex; gap: 5px; justify-content: center; margin-top: 9px; }
  .mk-chip {
    border: 1px solid var(--ink-line); border-radius: var(--r-pill); color: var(--ink-dim);
    font-size: 0.6rem; padding: 3px 9px;
  }

  .mk-seclabel {
    font-size: 0.6rem; color: var(--text-faint); letter-spacing: 0.06em;
    text-transform: uppercase; margin-bottom: 6px;
  }
  .mk-seg { display: flex; gap: 5px; background: var(--surface); border-radius: var(--r-xs); padding: 4px; }
  .mk-seg span, .mk-seg button {
    flex: 1; text-align: center; font-size: 0.7rem; color: var(--text-dim);
    padding: 7px 0; border-radius: var(--r-2xs);
    background: transparent; border: none; font-family: var(--font-ui);
  }
  .mk-seg span.on, .mk-seg button.on { background: var(--paper); color: var(--ink); font-weight: 600; }
  .mk-seg.pick button { cursor: pointer; }
  /* Menu rows dim individually — a lit child inside a dimmed parent can never be
     brighter than the parent, so the dimming has to be applied per row. */
  .mk-menuitem {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 8px; border-radius: var(--r-xs); transition: opacity 0.2s ease;
  }
  .mk-menuitem.dim, .mk-seclabel.dim, .mk-seg.dim { opacity: 0.26; }
  .mk-menuitem.spot { box-shadow: 0 0 0 2px var(--amber); opacity: 1; }
  .mk-seg.spot { box-shadow: 0 0 0 2px var(--amber); }
  .mk-menuname { font-size: 0.76rem; color: var(--text); display: block; }
  .mk-menusub { font-size: 0.63rem; color: var(--text-dim); display: block; margin-top: 1px; }
  .mk-setting {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 2px 3px;
  }
  .mk-setname { font-size: 0.75rem; color: var(--text); }
  .mk-switch {
    width: 32px; height: 19px; border-radius: var(--r-sm); background: var(--sage);
    position: relative; flex-shrink: 0;
  }
  .mk-switch::after {
    content: ""; position: absolute; top: 2px; right: 2px; width: 15px; height: 15px;
    border-radius: 50%; background: var(--on-sage);
  }
  .mk-setnote { font-size: 0.66rem; color: var(--text-dim); padding: 0 2px 8px; border-bottom: 1px solid var(--line-soft); }

  .mk-split { display: flex; gap: 10px; margin: 14px 0 4px; }
  .mk-half {
    flex: 1; background: var(--bg); border: 1px solid var(--line-soft);
    border-radius: var(--r-md); padding: 12px; text-align: center;
  }
  .mk-half-title { font-size: 0.66rem; color: var(--text-dim); margin-bottom: 9px; }
  .mk-half-note { font-size: 0.63rem; color: var(--text-faint); margin-top: 9px; }
  .mk-ghost { height: 9px; border-radius: 4px; background: var(--line-soft); margin-bottom: 5px; }

  /* Guide — priority band diagram */
  .bands { margin: 14px 0 4px; display: flex; flex-direction: column; gap: 7px; }
  .band-row {
    display: flex; align-items: center; gap: 9px; padding: 8px 10px;
    border: 1px solid var(--line-soft); border-radius: var(--r-xs); flex-wrap: wrap;
  }
  .band-row.picked { border-color: var(--amber); background: var(--amber-tint); }
  .band-label { font-size: 0.64rem; font-weight: 700; flex-shrink: 0; }
  .band-items { display: flex; gap: 5px; flex-wrap: wrap; flex: 1; }
  .band-chip {
    font-size: 0.68rem; padding: 4px 8px; border-radius: var(--r-2xs);
    border: 1px solid var(--line-soft); color: var(--text-dim); white-space: nowrap;
    display: inline-block; margin-bottom: 4px;
  }
  .band-chip.first { border-color: var(--amber); color: var(--text); }
  .band-arrow { font-size: 0.63rem; color: var(--amber); white-space: nowrap; }

  /* Guide — numbered rule list */
  .steps-num { display: flex; flex-direction: column; gap: 11px; margin: 13px 0 4px; }
  .sn { display: flex; gap: 11px; align-items: flex-start; font-size: 0.83rem; color: var(--text-dim); line-height: 1.55; }
  .sn strong { color: var(--text); font-weight: 600; }
  .sn-n {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; margin-top: 1px;
    background: var(--surface-2); border: 1px solid var(--line-soft); color: var(--text-dim);
    font-size: 0.68rem; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }

  .p1 { color: var(--p1); } .p2 { color: var(--p2); } .p3 { color: var(--p3); }
  .p4 { color: var(--p4); } .p5 { color: var(--p5); }
  .mk-band.p1, .mk-dot.on.p1, .mk-badge.p1 { background: var(--p1); }
  .mk-band.p2, .mk-dot.on.p2, .mk-badge.p2 { background: var(--p2); }
  .mk-band.p3, .mk-dot.on.p3, .mk-badge.p3 { background: var(--p3); }
  .mk-band.p4, .mk-dot.on.p4, .mk-badge.p4 { background: var(--p4); }
  .mk-band.p5, .mk-dot.on.p5, .mk-badge.p5 { background: var(--p5); }

  /* Guide — screen map */
  .map { background: var(--bg); border: 1px solid var(--line-soft); border-radius: var(--r-md); padding: 13px; }
  .map-part {
    display: flex; align-items: center; gap: 9px; padding: 8px 9px;
    border: 1px solid var(--line-soft); border-radius: var(--r-xs); margin-bottom: 6px;
    font-size: 0.78rem; color: var(--text-dim);
  }
  .map-pin {
    flex-shrink: 0; width: 19px; height: 19px; border-radius: 50%;
    background: var(--amber); color: var(--on-amber);
    font-size: 0.65rem; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }
  .map-key { display: flex; flex-direction: column; gap: 9px; margin-top: 13px; }
  .map-key-row { display: flex; gap: 9px; align-items: flex-start; font-size: 0.8rem; color: var(--text-dim); line-height: 1.5; }
  .map-key-row strong { color: var(--text); font-weight: 600; }

  /* Guide — notification mock-ups */
  .notif {
    background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: var(--r-md);
    padding: 11px 13px; margin-bottom: 8px;
  }
  .notif-top { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
  .notif-app { font-size: 0.66rem; color: var(--text-faint); letter-spacing: 0.04em; }
  .notif-time { margin-left: auto; font-size: 0.66rem; color: var(--text-faint); }
  .notif-title { font-size: 0.83rem; color: var(--text); font-weight: 600; }
  .notif-body { font-size: 0.79rem; color: var(--text-dim); margin-top: 2px; line-height: 1.45; }

  /* Guide — day timeline */
  .timeline { display: flex; flex-direction: column; gap: 0; margin: 6px 0; }
  .tl-row { display: flex; gap: 12px; align-items: flex-start; }
  .tl-time { font-size: 0.72rem; color: var(--text-faint); width: 54px; flex-shrink: 0; text-align: right; padding-top: 1px; }
  .tl-line { width: 1px; background: var(--line); flex-shrink: 0; position: relative; }
  .tl-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); margin-left: -3px; }
  .tl-dot.key { background: var(--amber); width: 9px; height: 9px; margin-left: -4px; }
  .tl-text { font-size: 0.8rem; color: var(--text-dim); padding-bottom: 16px; line-height: 1.5; }
  .tl-text strong { color: var(--text); font-weight: 600; }

  /* Tutorial */
  .tut-section { margin-bottom: 24px; }
  .tut-h {
    font-family: var(--font-display); font-size: 1.05rem; color: var(--text);
    margin: 0 0 8px 0; display: flex; align-items: center; gap: 9px;
  }
  .tut-p { font-size: 0.87rem; color: var(--text-dim); line-height: 1.65; margin: 0 0 9px 0; }
  .tut-p strong { color: var(--text); font-weight: 600; }
  .tut-note {
    font-size: 0.83rem; color: var(--text-dim); line-height: 1.6;
    background: var(--surface); border-radius: var(--r-sm); padding: 12px 14px; margin: 10px 0 0 0;
  }
  /* min-height:0 matters — without it a flex child refuses to shrink below its
     content height and scrolls nowhere. */
  .overlay-scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 24px; }
  .logo {
    font-family: var(--font-display); font-weight: var(--logo-weight); font-size: 1.7rem;
    letter-spacing: var(--logo-track); text-transform: var(--logo-case); color: var(--text);
  }
  .subtitle { font-size: 0.8rem; color: var(--text-dim); margin-top: 4px; letter-spacing: 0.02em; }

  button { font-family: var(--font-ui); }
  input, textarea { font-family: var(--font-ui); }

  /* Plan view */
  .date-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .date-pill {
    background: transparent; color: var(--text-dim);
    border: 1px solid var(--line); border-radius: var(--r-xs);
    padding: 7px 14px; font-size: 0.82rem; cursor: pointer;
  }
  .date-pill.active { background: var(--paper); color: var(--ink); font-weight: 600; border-color: var(--text); }
  .date-input {
    background: transparent; color: var(--text-dim);
    border: 1px solid var(--line); border-radius: var(--r-xs);
    padding: 6px 10px; font-size: 0.8rem;
  }

  .add-box { background: var(--surface); border-radius: var(--r-md); padding: 14px; margin-bottom: 20px; }
  .task-input {
    width: 100%; background: var(--paper); color: var(--ink); border: none;
    border-radius: var(--r-sm); padding: 12px 14px; font-size: 0.92rem; outline: none; margin-bottom: 10px;
  }
  .add-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .priority-picker { display: flex; align-items: center; gap: 6px; }
  .priority-label { font-size: 0.75rem; color: var(--text-dim); margin-right: 4px; }
  .p-dot {
    width: 32px; height: 32px; border-radius: 50%;
    border: 1px solid var(--line-strong); background: transparent;
    color: var(--text-dim); font-weight: 700; font-size: 0.8rem; cursor: pointer;
  }
  .p-dot.active { color: var(--on-paper); }
  .quick-toggle {
    background: transparent; border: 1px solid var(--line-strong); color: var(--text-dim);
    border-radius: var(--r-xs); padding: 6px 10px; font-size: 0.78rem; cursor: pointer;
  }
  .quick-toggle.active { background: var(--amber); border-color: var(--amber); color: var(--on-amber); font-weight: 600; }
  .repeat-toggle {
    background: transparent; border: 1px solid var(--line-strong); color: var(--text-dim);
    border-radius: var(--r-xs); padding: 6px 10px; font-size: 0.78rem; cursor: pointer;
  }
  .repeat-toggle.active { background: var(--p4); border-color: var(--p4); color: var(--on-sage); font-weight: 600; }
  .repeat-tag {
    background: transparent; border: 1px solid var(--line-strong); color: var(--text-dim);
    border-radius: var(--r-xs); padding: 4px 9px; font-size: 0.72rem; cursor: pointer; white-space: nowrap; flex-shrink: 0;
  }
  .btn-add {
    background: var(--sage); color: var(--on-sage); border: none; border-radius: var(--r-sm);
    padding: 9px 20px; font-weight: 600; font-size: 0.85rem; cursor: pointer;
  }

  .group { margin-bottom: 14px; }
  .group-label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; margin-bottom: 6px; text-transform: uppercase; }

  /* Collapsed priority groups — the tidy version of the plan */
  .group.folded { margin-bottom: 0; }
  .group-toggle {
    width: 100%; display: flex; align-items: center; gap: 10px;
    background: transparent; border: none; border-bottom: 1px solid var(--line-soft);
    cursor: pointer; padding: 12px 4px; color: var(--text);
    font-family: var(--font-ui); text-align: left;
  }
  .group-toggle .g-chev { font-size: 0.7rem; color: var(--text-faint); width: 9px; flex-shrink: 0; }
  .group-toggle .g-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .group-toggle .g-name { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
  .group-toggle .g-count { margin-left: auto; font-size: 0.78rem; color: var(--text-dim); }
  .group-toggle .g-peek {
    font-size: 0.78rem; color: var(--text-faint); margin-left: auto; max-width: 52%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .group-body { padding: 10px 0 4px; }

  .task-row {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--line-soft); border-radius: var(--r-sm);
    padding: 9px 12px; margin-bottom: 6px;
    background: var(--bg);
    position: relative;
    touch-action: pan-y;
    will-change: transform;
  }
  .task-row.swipe-armed { border-color: var(--sage); background: var(--sage-tint-strong); }

  /* Completion flourish — the check fills and pops, a ring rides out from it,
     a few sparks scatter, then the row strikes through and slips away. */
  @keyframes ot-pop { 0% { transform: scale(1); } 45% { transform: scale(1.32); } 100% { transform: scale(1); } }
  @keyframes ot-ring { 0% { transform: scale(0.5); opacity: 0.55; } 100% { transform: scale(2.7); opacity: 0; } }
  @keyframes ot-spark {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx, 0), var(--dy, 0)) scale(0.25); opacity: 0; }
  }
  .task-row.completing { border-color: var(--sage); background: var(--sage-tint-strong); }
  .task-row.completing .task-text { color: var(--text-faint); text-decoration: line-through; }
  .task-row.completing .task-check {
    background: var(--sage); border-color: var(--sage); color: var(--on-sage);
    animation: ot-pop 0.36s cubic-bezier(0.3, 1.4, 0.5, 1) both;
    font-size: 0;
  }
  .task-row.completing .task-check::after { content: "✓"; font-size: 0.78rem; font-weight: 700; }
  .task-row.leaving { transform: translateX(14%); opacity: 0; transition: transform 0.2s ease, opacity 0.2s ease; }
  /* The ghost that swoops from the row down into the Completed drawer. */
  .fly-task {
    position: fixed; z-index: 80; pointer-events: none;
    background: var(--sage); color: var(--on-sage);
    border-radius: var(--r-sm); padding: 8px 12px;
    font-family: var(--font-ui); font-size: 0.84rem; font-weight: 600;
    box-shadow: 0 12px 26px var(--shadow-strong);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: transform 0.52s cubic-bezier(0.45, 0, 0.25, 1), opacity 0.52s ease;
  }
  .burst { position: absolute; left: 24px; top: 50%; width: 0; height: 0; pointer-events: none; }
  .burst-ring {
    position: absolute; left: -11px; top: -11px; width: 22px; height: 22px;
    border-radius: 50%; border: 2px solid var(--sage);
    animation: ot-ring 0.42s ease-out forwards;
  }
  .burst .spark {
    position: absolute; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px;
    border-radius: 50%; animation: ot-spark 0.38s ease-out forwards;
  }
  @media (prefers-reduced-motion: reduce) {
    .task-row.completing .task-check { animation: none; }
    .burst { display: none; }
    .task-row.leaving { transition: none; }
    .fly-task { display: none; }
    .done-count.bump { animation: none; }
  }
  .task-check {
    background: transparent; border: 1px solid var(--line-strong); color: var(--sage);
    border-radius: 50%; width: 24px; height: 24px; flex-shrink: 0; cursor: pointer; font-size: 0.8rem;
    display: flex; align-items: center; justify-content: center; padding: 0; line-height: 1;
  }
  .task-check:hover { border-color: var(--sage); background: var(--sage-tint); }
  .swipe-hint { font-size: 0.7rem; color: var(--text-faint); margin: 0 0 10px 2px; }
  .task-text { flex: 1; min-width: 0; font-size: 0.9rem; overflow-wrap: break-word; }
  .icon-btn {
    background: transparent; border: none; cursor: pointer; font-size: 0.85rem;
    padding: 0 2px; opacity: 0.25; flex-shrink: 0;
  }
  .icon-btn.lit { opacity: 1; }
  .icon-btn.danger { color: var(--rust); font-size: 1rem; opacity: 1; }
  /* A button and a span have different default insides, so the same badge drawn as
     each came out two different sizes on the plan. Centring it explicitly means the
     element it happens to be made of stops mattering. */
  .p-badge {
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid;
    color: var(--on-paper); font-weight: 700; font-size: 0.72rem; cursor: pointer; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0; box-sizing: border-box; line-height: 1; font-family: inherit;
  }

  .empty-state {
    text-align: center; color: var(--text-dim); font-size: 0.86rem; padding: 30px 12px;
    border: 1px dashed var(--line); border-radius: var(--r-md);
  }

  .later-section { margin-top: 8px; margin-bottom: 20px; }
  .later-toggle { background: transparent; border: none; color: var(--text-dim); font-size: 0.78rem; cursor: pointer; padding: 0; }
  .later-list { margin-top: 8px; }
  .later-row {
    display: flex; align-items: center; gap: 10px; font-size: 0.82rem; color: var(--text-dim);
    padding: 6px 0; border-top: 1px solid var(--line-soft);
  }
  .later-text { flex: 1; }
  .later-text.strike { text-decoration: line-through; opacity: 0.7; }
  .done-check { color: var(--sage); font-size: 0.78rem; }
  .snoozed-tag { font-size: 0.7rem; color: var(--text-dim); white-space: nowrap; }

  /* On hold */
  .stale-pip {
    margin-left: 8px; font-size: 0.68rem; color: var(--amber);
    border: 1px solid var(--amber-line); border-radius: var(--r-2xs); padding: 1px 7px;
  }
  .held-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 0; border-top: 1px solid var(--line-soft);
  }
  .held-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .held-text { font-size: 0.85rem; color: var(--text-dim); }
  .held-row.stale .held-text { color: var(--text); }
  .held-meta { font-size: 0.72rem; color: var(--text-faint); margin-top: 2px; }
  .held-row.stale .held-meta { color: var(--amber); }
  .held-release {
    flex-shrink: 0; background: transparent; border: 1px solid var(--line);
    color: var(--text-dim); border-radius: var(--r-xs); padding: 5px 11px;
    font-size: 0.74rem; cursor: pointer; font-family: var(--font-ui);
  }
  .held-release:hover { border-color: var(--sage); color: var(--sage); }
  /* The ServiceM8 setup page */
  .sm8-set {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--sage-tint); border: 1px solid var(--line-soft);
    border-radius: var(--r-sm); padding: 11px 13px; margin-bottom: 12px;
    font-size: 0.82rem; color: var(--text-dim); line-height: 1.5;
  }
  .sm8-tick { color: var(--sage); flex-shrink: 0; }
  .sm8-staff { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
  .sm8-person {
    background: transparent; border: 1px solid var(--line); color: var(--text-dim);
    border-radius: var(--r-pill); padding: 7px 13px; font-size: 0.78rem; cursor: pointer;
    font-family: var(--font-ui);
  }
  .sm8-person.on { background: var(--sage); border-color: var(--sage); color: var(--on-sage); font-weight: 600; }
  #sm8Key { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.78rem; }

  /* An offer from ServiceM8, sitting at the top of the plan */
  .suggest {
    border: 1px solid var(--amber-line); background: var(--amber-tint);
    border-radius: var(--r-lg); padding: 15px; margin-bottom: 18px;
  }
  .suggest-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 9px; }
  .suggest-kind {
    font-size: 0.66rem; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--amber); font-weight: 700;
  }
  .suggest-more { margin-left: auto; font-size: 0.7rem; color: var(--text-faint); }
  .suggest-title { font-family: var(--font-display); font-size: 1.02rem; color: var(--text); line-height: 1.35; }
  .suggest-context { font-size: 0.75rem; color: var(--text-dim); margin-top: 4px; }
  .suggest-steps { margin-top: 12px; }
  .suggest-steps-label {
    font-size: 0.66rem; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--text-faint); margin-bottom: 6px;
  }
  .suggest-step {
    display: flex; align-items: flex-start; gap: 9px; width: 100%; text-align: left;
    background: transparent; border: none; cursor: pointer; padding: 5px 0;
    font-family: var(--font-ui);
  }
  .ss-box {
    flex-shrink: 0; width: 17px; height: 17px; border-radius: 5px; margin-top: 1px;
    border: 1px solid var(--line-strong); color: var(--on-sage);
    font-size: 0.62rem; display: flex; align-items: center; justify-content: center;
  }
  .ss-box.on { background: var(--sage); border-color: var(--sage); }
  .ss-text { font-size: 0.8rem; color: var(--text); line-height: 1.45; }
  .ss-text.off { color: var(--text-faint); text-decoration: line-through; }
  .suggest-priority {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    margin: 14px 0 12px;
  }
  .suggest .action-pair .btn-set-wide { flex: 1; margin-bottom: 0; }
  .suggest .action-pair .btn-secondary { flex: 0 0 40%; }

  .chased-note {
    font-size: 0.78rem; color: var(--amber); background: var(--amber-tint);
    border: 1px solid var(--amber-line); border-radius: var(--r-sm);
    padding: 10px 13px; margin-bottom: 14px; line-height: 1.5;
  }
  /* Focus actions: one primary, then two matching blocks. */
  .action-pair { display: flex; gap: 8px; width: 100%; }
  .action-pair .btn-secondary { flex: 1; min-width: 0; font-size: 0.84rem; }
  .action-links {
    display: flex; gap: 16px; width: 100%;
    justify-content: center; flex-wrap: wrap; margin-top: 4px;
  }
  .action-links .subtask-link { width: auto; padding: 10px 0 0; white-space: nowrap; }

  /* Steps and notes belong to the task, so they sit on the card. */
  .card-chips { display: flex; gap: 7px; justify-content: center; margin-top: 13px; flex-wrap: wrap; }
  .card-chip {
    background: transparent; border: 1px solid var(--ink-line); border-radius: var(--r-pill);
    color: var(--ink-dim); font-family: var(--font-ui); font-size: 0.72rem;
    padding: 5px 12px; cursor: pointer; white-space: nowrap;
  }
  .card-chip:hover { border-color: var(--ink-dim); color: var(--ink); }
  .card-chip.lit { border-color: var(--ink-dim); color: var(--ink); }

  .panel-or {
    text-align: center; font-size: 0.72rem; color: var(--text-faint);
    margin: 12px 0 10px;
  }
  .snooze-options { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .snooze-opt {
    background: transparent; border: 1px solid var(--line-strong); color: var(--text);
    border-radius: var(--r-xs); padding: 8px 12px; font-size: 0.82rem; cursor: pointer;
  }
  .snooze-custom-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .dt-input { flex: 1; background: var(--paper); color: var(--ink); border: none; border-radius: var(--r-xs); padding: 9px 10px; font-size: 0.82rem; }
  .btn-set { background: var(--amber); color: var(--on-amber); border: none; border-radius: var(--r-xs); padding: 0 16px; font-weight: 600; cursor: pointer; }
  .completed-section { margin-top: 0; }
  .done-count { display: inline-block; font-variant-numeric: tabular-nums; }
  @keyframes ot-count-bump {
    0% { transform: scale(1); }
    30% { transform: scale(1.8); color: var(--sage); }
    60% { transform: scale(0.92); }
    100% { transform: scale(1); }
  }
  .done-count.bump { animation: ot-count-bump 0.55s cubic-bezier(0.3, 1.5, 0.5, 1) both; }

  .btn-quick-clear {
    width: 100%; background: transparent; border: 1px solid var(--amber-line); color: var(--amber);
    border-radius: var(--r-md); padding: 12px 0; font-weight: 600; font-size: 0.88rem; cursor: pointer; margin-bottom: 10px;
  }
  .btn-begin, .btn-primary {
    width: 100%; background: var(--amber); color: var(--on-amber); border: none; border-radius: var(--r-md);
    padding: 15px 0; font-weight: var(--btn-weight); font-size: 0.98rem; cursor: pointer;
    letter-spacing: var(--btn-track); text-transform: var(--btn-case);
  }
  .btn-begin:disabled { background: var(--line-soft); color: var(--text-dim); cursor: not-allowed; }
  .shift-link {
    width: 100%; background: transparent; border: none; color: var(--text-dim);
    border-radius: var(--r-sm); padding: 12px 0 0 0; font-size: 0.8rem; cursor: pointer;
  }
  .wrap-card { width: 100%; padding: 34px 28px; margin-bottom: 16px; align-items: stretch; }
  .wrap-stat-block { text-align: center; }
  .wrap-stat-num { font-family: var(--font-display); font-weight: 500; font-size: 2.6rem; color: var(--ink); line-height: 1; }
  .wrap-stat-label { font-size: 0.85rem; color: var(--ink-dim); margin-top: 6px; }
  .wrap-reflection { font-family: var(--font-display); font-size: 1.05rem; color: var(--ink); margin-top: 14px; }
  .wrap-list { list-style: none; padding: 0; margin: 22px 0 0 0; width: 100%; }
  .wrap-list-item {
    font-size: 0.86rem; color: var(--ink-dim); padding: 7px 0;
    border-top: 1px solid var(--ink-line); display: flex; align-items: center; gap: 8px;
  }
  .wrap-check { color: var(--sage); }
  .wrap-strike { text-decoration: line-through; }
  .moving-box { width: 100%; background: var(--surface); border-radius: var(--r-lg); padding: 18px 20px; margin-bottom: 22px; }
  .moving-label { font-size: 0.78rem; color: var(--text-dim); margin-bottom: 10px; }
  .moving-row { display: flex; align-items: center; gap: 10px; font-size: 0.86rem; padding: 5px 0; }
  .moving-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .moving-text { flex: 1; }

  .steps-wrap-box { width: 100%; background: var(--p4-tint); border: 1px solid var(--p4-line); border-radius: var(--r-lg); padding: 18px 20px; margin-bottom: 16px; }
  .steps-wrap-header { font-size: 0.78rem; color: var(--p4); font-weight: 600; margin-bottom: 10px; letter-spacing: 0.01em; }
  .wrap-list.steps { margin-top: 0; }
  .wrap-list.steps .wrap-list-item { align-items: flex-start; border-top-color: var(--p4-line); color: var(--text-dim); }
  .wrap-list.steps .wrap-check { color: var(--p4); margin-top: 1px; }
  .wrap-step-text-wrap { display: flex; flex-direction: column; gap: 2px; }
  .wrap-step-parent { font-size: 0.72rem; color: var(--text-faint); }

  /* Focus / Quick views */
  .center-col { display: flex; flex-direction: column; align-items: center; width: 100%; }
  .back-link {
    align-self: flex-start; background: transparent; border: none; color: var(--text-dim);
    font-size: 0.8rem; cursor: pointer; padding: 0 0 18px 0;
  }
  .stack-wrap { position: relative; width: 100%; margin-bottom: 26px; }
  .stack-layer { position: absolute; height: 190px; border-radius: var(--r-xl); }
  .card {
    background: var(--paper); border-radius: var(--r-xl);
    box-shadow: var(--card-shadow); border: var(--card-border);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 36px 30px; position: relative;
  }
  .focus-card { min-height: 190px; width: 100%; }
  .empty-card { min-height: unset; padding: 40px 28px; margin-bottom: 20px; width: 100%; box-shadow: none; }
  .quick-card { min-height: 130px; width: 100%; padding: 26px; margin-bottom: 20px; box-shadow: 0 10px 24px var(--shadow-soft); }
  .notes-corner {
    position: absolute; top: 14px; right: 16px; background: transparent; border: none;
    cursor: pointer; font-size: 0.95rem; opacity: 0.28;
  }
  .notes-corner.lit { opacity: 0.8; }
  .priority-tag { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.05em; margin-bottom: 10px; text-transform: uppercase; }
  .quick-tag { font-size: 0.68rem; font-weight: 700; color: var(--amber); letter-spacing: 0.05em; margin-bottom: 8px; text-transform: uppercase; }
  .task-display {
    font-family: var(--font-display); font-weight: 500; font-size: clamp(1.4rem, 4.5vw, 1.9rem);
    color: var(--ink); text-align: center; line-height: 1.35; margin: 0;
  }
  .task-display.small { font-size: clamp(1.15rem, 4vw, 1.4rem); }
  .empty-title { font-family: var(--font-display); font-size: 1.25rem; color: var(--ink); margin: 0; text-align: center; }
  .empty-sub { font-size: 0.85rem; color: var(--ink-dim); margin-top: 10px; text-align: center; }
  .due-count { font-size: 0.78rem; color: var(--text-dim); margin-bottom: 20px; letter-spacing: 0.03em; }

  .btn-primary { margin-bottom: 10px; background: var(--sage); color: var(--on-sage); font-weight: 700; font-size: 1rem; padding: 16px 0; }
  .btn-secondary {
    width: 100%; background: transparent; border: 1px solid var(--line); color: var(--text);
    border-radius: var(--r-sm); padding: 12px 0; font-size: 0.88rem; cursor: pointer;
    letter-spacing: var(--btn-track); text-transform: var(--btn-case);
  }
  .btn-secondary:disabled { color: var(--text-faint); cursor: default; }

  .snooze-panel { width: 100%; background: var(--surface-2); border-radius: var(--r-md); padding: 16px; }
  .snooze-label { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 8px; }
  .snooze-panel .priority-picker { margin-bottom: 16px; }
  .snooze-note { font-size: 0.74rem; color: var(--text-dim); line-height: 1.5; margin: 0 0 14px 0; }
  .add-panel .task-input { margin-bottom: 14px; }
  .add-panel .priority-picker { margin-bottom: 14px; }
  .add-panel .snooze-note { margin: 8px 0 0 0; }
  .add-panel .snooze-note.last { margin-bottom: 14px; }
  .add-panel .sync-divider { margin: 16px 0 14px; }
  .add-panel .btn-secondary { margin-bottom: 0; }
  .btn-set-wide {
    width: 100%; background: var(--amber); color: var(--on-amber); border: none; border-radius: var(--r-sm);
    padding: 12px 0; font-weight: var(--btn-weight); font-size: 0.88rem; cursor: pointer;
    margin-bottom: 10px; letter-spacing: var(--btn-track); text-transform: var(--btn-case);
  }
  .cancel-link { background: transparent; border: none; color: var(--text-dim); font-size: 0.8rem; cursor: pointer; padding: 0; }

  /* Morning recap */
  .recap-kicker { font-size: 0.72rem; color: var(--text-dim); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 14px; align-self: flex-start; }
  .moving-box.rolled { border: 1px solid var(--amber-line); background: var(--amber-tint); }
  .moving-box.rolled .moving-label { color: var(--amber); font-weight: 600; }

  /* Notes overlay */
  .overlay {
    position: fixed; inset: 0; background: var(--bg); z-index: 50;
    display: flex; flex-direction: column;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
  }
  .overlay-inner { width: 100%; max-width: 540px; margin: 0 auto; display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .overlay-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px; gap: 12px; }
  .overlay-heading { flex: 1; min-width: 0; }
  .back-circle {
    background: transparent; border: 1px solid var(--line); color: var(--text);
    border-radius: 50%; width: 34px; height: 34px; flex-shrink: 0; cursor: pointer;
    font-size: 1.15rem; line-height: 1; padding: 0 3px 2px 0;
  }
  .overlay-kicker { font-size: 0.7rem; color: var(--text-dim); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 6px; }
  .overlay-title { font-family: var(--font-display); font-size: 1.2rem; color: var(--text); line-height: 1.3; padding-right: 16px; }
  .close-circle {
    background: transparent; border: 1px solid var(--line); color: var(--text);
    border-radius: 50%; width: 34px; height: 34px; flex-shrink: 0; cursor: pointer; font-size: 1rem;
  }
  .notes-textarea {
    flex: 1; width: 100%; background: var(--paper); color: var(--ink); border: none;
    border-radius: var(--r-lg); padding: 20px; font-size: 0.95rem; line-height: 1.6; outline: none; resize: none;
    min-height: 200px;
  }

  /* How you add things */
  .add-field { position: relative; }
  .task-input.has-q { padding-right: 44px; }
  .q-mark {
    position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
    width: 24px; height: 24px; border-radius: 50%; border: 1px solid rgba(36,40,33,0.25);
    background: none; color: rgba(36,40,33,0.55); font-family: inherit; font-size: 0.75rem;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0;
  }
  .q-mark.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .keys { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 11px 13px; margin-top: 9px; }
  .key-row { display: flex; gap: 10px; align-items: baseline; font-size: 0.78rem; padding: 3px 0; }
  .key-row code {
    font-family: ui-monospace, Menlo, monospace; font-size: 0.75rem; color: var(--text);
    background: var(--surface-2); border-radius: 4px; padding: 2px 6px; min-width: 62px; text-align: center;
  }
  .key-row span { color: var(--text-dim); }
  .key-note { font-size: 0.75rem; color: var(--text-dim); line-height: 1.5; margin-top: 8px; }
  .key-note em { color: var(--text); font-style: normal; }
  .sentence-box { padding-bottom: 12px; }
  .sentence {
    display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
    margin-top: 10px; font-size: 0.82rem; color: var(--text-dim); padding-left: 3px;
  }
  .s-plain { color: var(--text); }
  .s-word {
    background: none; border: none; font-family: inherit; font-size: 0.82rem; cursor: pointer;
    color: var(--text); padding: 3px 2px; border-bottom: 1px dashed var(--line);
  }
  .s-word.off { color: var(--text-dim); border-bottom-color: var(--line-soft); }
  .s-dots { display: inline-flex; gap: 3px; }
  .s-go { margin-left: auto; }
  .add-spacer { flex: 1; }
  .btn-secondary.small { padding: 8px 14px; font-size: 0.8rem; width: auto; }

  /* Customers and jobs */
  .container-row { cursor: pointer; }
  .c-dot {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; background: var(--surface-2);
    color: var(--text-dim); font-size: 0.6rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .c-next { display: block; font-size: 0.76rem; color: var(--text-dim); margin-top: 3px; }
  .c-more { color: var(--text-dim); opacity: 0.7; }
  .chev { color: var(--text-dim); flex-shrink: 0; }
  .c-sub { font-size: 0.82rem; color: var(--text-dim); margin-bottom: 14px; }
  .c-foot { margin-top: 30px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .danger-text { color: var(--danger, #B0644A); }
  .standing-list { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0 2px; }
  .standing-name {
    border: 1px dashed var(--line); border-radius: 999px; padding: 6px 12px;
    font-size: 0.78rem; color: var(--text-dim); background: none; font-family: inherit; cursor: pointer;
  }
  .kind-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .segmented.small button { font-size: 0.72rem; padding: 5px 11px; }
  .inside-chip {
    background: var(--sage); color: var(--on-sage); border: none; border-radius: 999px;
    padding: 5px 11px; font-family: inherit; font-size: 0.74rem; font-weight: 600; cursor: pointer;
  }
  .inside-suggest {
    display: block; width: 100%; margin-top: 9px; text-align: left;
    border: 1px dashed var(--line); border-radius: var(--r-sm); padding: 9px 11px;
    background: none; font-family: inherit; color: var(--text-dim); font-size: 0.78rem; cursor: pointer;
  }
  .inside-suggest strong { color: var(--text); }
  .value-btn {
    margin-left: auto; background: none; border: none; color: var(--text);
    font-family: inherit; font-size: 0.86rem; cursor: pointer; padding: 4px 0;
  }
  .faint { color: var(--text-dim); opacity: 0.75; }
  .detail-row.wrap { flex-wrap: wrap; align-items: flex-start; }
  .inside-picker { flex: 1; min-width: 200px; }
  .card-kicker {
    display: block; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-dim); margin-bottom: 8px;
  }

  /* The details panel */
  .details-bar {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: none; border: none; color: var(--text-dim); font-family: inherit;
    font-size: 0.82rem; cursor: pointer; padding: 8px 0;
  }
  .details-hint {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--text-dim); opacity: 0.75; font-size: 0.78rem; text-align: right;
  }
  .details-box { border: 1px solid var(--line); border-radius: var(--r-md); padding: 4px 14px 14px; }
  .field-row { display: flex; align-items: flex-start; gap: 12px; padding: 8px 0; flex-wrap: wrap; }
  .field-row .detail-label { min-width: 56px; padding-top: 9px; }
  .field-input {
    flex: 1; min-width: 140px; background: var(--surface); color: var(--text);
    border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 10px;
    font-family: inherit; font-size: 0.85rem; outline: none; line-height: 1.45;
  }
  .field-input:focus { border-color: var(--sage); }
  textarea.field-input { resize: vertical; min-height: 42px; }
  .pill-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .pill-link {
    display: inline-block; text-decoration: none; border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 11px; font-size: 0.74rem; color: var(--text-dim);
  }
  .link-btn {
    background: none; border: none; color: var(--text-dim); font-family: inherit;
    font-size: 0.78rem; cursor: pointer; padding: 8px 0; text-align: left;
  }
  .contact-line { display: flex; align-items: center; gap: 8px; padding: 7px 0; flex-wrap: wrap; }
  .contact-name {
    flex: 1; min-width: 120px; background: none; border: none; color: var(--text);
    font-family: inherit; font-size: 0.86rem; cursor: pointer; text-align: left; padding: 0;
  }
  .contact-fields { padding: 2px 0 10px; }

  /* Renaming a heading in place */
  .renameable { cursor: text; }
  .rename-input {
    width: 100%; background: var(--paper); color: var(--ink); border: none;
    border-radius: var(--r-sm); padding: 9px 12px; font-family: var(--font-display);
    font-size: 1.2rem; outline: none;
  }

  /* Dated updates */
  .note-input {
    width: 100%; background: var(--surface); color: var(--text); border: 1px solid var(--line);
    border-radius: var(--r-sm); padding: 9px 12px; font-family: inherit; font-size: 0.88rem;
    line-height: 1.5; outline: none; resize: vertical; min-height: 46px;
  }
  .note-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; }
  .note { border-left: 2px solid var(--line); padding: 1px 0 1px 12px; margin: 13px 0; }
  .note-meta {
    display: flex; align-items: center; gap: 8px; font-size: 0.66rem; color: var(--text-dim);
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .note-x { margin-left: auto; }
  .note-text { font-size: 0.88rem; line-height: 1.5; color: var(--text-dim); margin-top: 5px; white-space: pre-wrap; }
  .empty-state.small { padding: 8px 0; font-size: 0.82rem; }

  /* Suppliers */
  .supplier-strip {
    border: 1px solid var(--line); border-left: 2px solid var(--sage);
    border-radius: var(--r-md); padding: 11px 13px; margin: 12px 0;
  }
  .supplier-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.9rem; color: var(--text); }
  .via { color: var(--text-dim); font-size: 0.76rem; }
  .supplier-meta { color: var(--text-dim); font-size: 0.78rem; margin-top: 5px; line-height: 1.5; }
  .supplier-card { border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; margin-bottom: 8px; }
  .supplier-head {
    display: flex; align-items: center; gap: 10px; width: 100%; background: none;
    border: none; color: var(--text); font-family: inherit; cursor: pointer; text-align: left; padding: 0;
  }
  .supplier-name { flex: 1; min-width: 0; font-size: 0.95rem; }
  .supplier-brands { display: block; font-size: 0.76rem; color: var(--text-dim); margin-top: 3px; }
  .supplier-body { margin-top: 6px; }
  .btn-quick-clear.supplier-batch { border-color: var(--sage); }

  /* Subtasks (within Notes overlay) */
  .subtasks-section { margin-bottom: 18px; }
  .subtasks-label { font-size: 0.72rem; color: var(--text-dim); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 10px; }
  .subtasks-list { margin-bottom: 10px; }
  .subtask-row {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border-radius: var(--r-sm); padding: 8px 10px; margin-bottom: 6px;
  }
  .subtask-row.done { opacity: 0.5; }
  .subtask-check {
    background: transparent; border: 1px solid var(--line-strong); color: var(--sage);
    border-radius: 50%; width: 22px; height: 22px; flex-shrink: 0; cursor: pointer; font-size: 0.75rem;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .subtask-text { flex: 1; font-size: 0.86rem; color: var(--text); word-break: break-word; }
  .subtask-text.strike { text-decoration: line-through; }
  .priority-picker.sub { display: flex; gap: 3px; }
  .p-dot.mini { width: 22px; height: 22px; font-size: 0.65rem; }
  .add-subtask-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .subtask-input {
    flex: 1; min-width: 120px; background: var(--surface); color: var(--text); border: 1px solid var(--line);
    border-radius: var(--r-sm); padding: 9px 12px; font-size: 0.86rem; outline: none;
  }

  /* Focus-mode subtask flow */
  .subtask-link {
    width: 100%; background: transparent; border: none; color: var(--text-dim);
    font-size: 0.82rem; cursor: pointer; padding: 10px 0 0 0;
  }
  .steps-hint { font-size: 0.72rem; color: var(--ink-dim); margin: 8px 0 0 0; }
  .steps-tag { font-size: 0.7rem; color: var(--text-dim); white-space: nowrap; }
  .breadcrumb { align-self: flex-start; font-size: 0.76rem; color: var(--text-dim); margin-bottom: 10px; }
  .subtask-card { width: 100%; padding: 30px 26px; margin-bottom: 20px; box-shadow: 0 12px 28px var(--shadow-mid); }

  /* Sync */
  .sync-body { display: flex; flex-direction: column; gap: 12px; }
  .sync-desc { font-size: 0.86rem; color: var(--text-dim); line-height: 1.5; margin: 0; }
  .sync-code-display {
    font-family: var(--font-display); font-size: 2rem; letter-spacing: 0.12em; text-align: center;
    background: var(--paper); color: var(--ink); border-radius: var(--r-lg); padding: 20px 10px;

      { id: "nightplay", name: "Nightplay", note: "Spotify — black and green" },

      { id: "graphite", name: "Graphite", note: "Linear — dark and precise" },
    ] },
  ];

  // and work done at 12:30am still counts toward the day you were in.

  var SWIPE_THRESHOLD = 90;

     On the Team list they are the two people working from it. */
  var people = loadedData.people;
  var deleted = loadedData.deleted;
  /* Customers and jobs — the things work sits under.

     They are a list of their own rather than a kind of task, because a container is

  }
  function personName(id) {

  }

  // Initials for the little chip on a task row — two letters at most, so it stays small.

          people[i].updatedAt = Date.now();
          save();

        return people[i].id;
      }

    var now = Date.now();

    return p.id;
  }

  /* Removing somebody is marked rather than erased, so a device that has not synced

  }
  var view = "plan";
  var planDate = todayStr();
  var draftPriority = 3;
  var draftQuick = false;
  var draftRepeat = null; // null | "daily" | "weekly"
  var draftText = "";
  var notesTaskId = null;
  var editingPriorityId = null;
