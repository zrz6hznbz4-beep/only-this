  function reflectionLine(count) {
    if (count === 0) return "A quiet one — that's alright too.";
    if (count <= 2) return "A couple of things off your plate.";
    if (count <= 5) return "Nice work today.";
    if (count <= 9) return "That's a proper day's work.";
    return "That's a lot cleared today — well done.";
  }

  // Shown once on the first open of a new day: what you finished yesterday,
  // and what rolled forward automatically overnight.
  function renderRecap() {
    var yesterday = addDaysStr(-1);
    var doneYesterday = completionsOn(yesterday).filter(function (c) { return c.type !== "step"; });
    var stepsYesterday = completionsOn(yesterday).filter(function (c) { return c.type === "step"; });
    var carried = rolledOverToday();

    var listHtml = doneYesterday.length > 0
      ? '<ul class="wrap-list">' + doneYesterday.map(function (t) {
          return '<li class="wrap-list-item"><span class="wrap-check">✓</span><span class="wrap-strike">' + escapeHtml(t.text) + '</span></li>';
        }).join('') + '</ul>'
      : '';

    var stepsHtml = "";
    if (stepsYesterday.length > 0) {
      stepsHtml = '<div class="steps-wrap-box">' +
        '<div class="steps-wrap-header">🔹 ' + stepsYesterday.length + (stepsYesterday.length === 1 ? ' step chipped away' : ' steps chipped away') + '</div>' +
        '<ul class="wrap-list steps">' + stepsYesterday.map(function (c) {
          return '<li class="wrap-list-item"><span class="wrap-check">✓</span>' +
            '<span class="wrap-step-text-wrap"><span class="wrap-strike">' + escapeHtml(c.text) + '</span>' +
            (c.parentText ? '<span class="wrap-step-parent">within ' + escapeHtml(c.parentText) + '</span>' : '') +
            '</span></li>';
        }).join('') + '</ul>' +
        '</div>';
    }

    var carriedHtml = "";
    if (carried.length > 0) {
      carriedHtml = '<div class="moving-box rolled">' +
        '<div class="moving-label">Carried over to today (' + carried.length + ')</div>' +
        carried.map(function (t) {
          return '<div class="moving-row"><span class="moving-dot" style="background:' + PRIORITY_COLORS[t.priority] + '"></span>' +
            '<span class="moving-text">' + escapeHtml(t.text) + '</span></div>';
        }).join('') + '</div>';
    }

    return '<div class="center-col">' +
      '<div class="recap-kicker">Yesterday — ' + fmtDate(yesterday) + '</div>' +
      '<div class="card wrap-card">' +
      '<div class="wrap-stat-block">' +
      '<div class="wrap-stat-num">' + doneYesterday.length + '</div>' +
      '<div class="wrap-stat-label">' + (doneYesterday.length === 1 ? "task done yesterday" : "tasks done yesterday") + '</div>' +
      '<div class="wrap-reflection">' + reflectionLine(doneYesterday.length) + '</div>' +
      '</div>' + listHtml +
      '</div>' +
      stepsHtml +
      carriedHtml +
      '<button class="btn-primary" data-action="dismiss-recap">Start today →</button>' +
      '</div>';
  }

  function renderSubtaskRow(parentId, s) {
    var done = s.status === "done";
    return '<div class="subtask-row ' + (done ? 'done' : '') + '">' +
      '<button class="subtask-check" data-action="toggle-subtask" data-parent="' + parentId + '" data-id="' + s.id + '">' + (done ? '✓' : '○') + '</button>' +
      '<span class="subtask-text ' + (done ? 'strike' : '') + '">' + escapeHtml(s.text) + '</span>' +
      (!done ? priorityDotsSub(s.priority, parentId, s.id) : '') +
      (!done ? '<button class="icon-btn ' + (s.quick ? 'lit' : '') + '" data-action="toggle-subtask-quick" data-parent="' + parentId + '" data-id="' + s.id + '" title="Under a few minutes">⚡</button>' : '') +
      '<button class="icon-btn danger" data-action="remove-subtask" data-parent="' + parentId + '" data-id="' + s.id + '">×</button>' +
      '</div>';
  }

  function priorityDotsSub(selected, parentId, subId) {
    var out = '<div class="priority-picker sub">';
    for (var p = 1; p <= 5; p++) {
      var active = selected === p;
      var style = active ? ('background:' + PRIORITY_COLORS[p] + ';border-color:' + PRIORITY_COLORS[p]) : '';
      out += '<button class="p-dot mini ' + (active ? 'active' : '') + '" style="' + style + '" data-action="set-subtask-priority" data-parent="' + parentId + '" data-id="' + subId + '" data-p="' + p + '">' + p + '</button>';
    }
    out += '</div>';
    return out;
  }

  function renderNotesOverlay() {
    var task = tasks.find(function (t) { return t.id === notesTaskId; });
    if (!task) return '';
    var subs = task.subtasks || [];
    var pending = subs.filter(function (s) { return s.status !== "done"; });
    var done = subs.filter(function (s) { return s.status === "done"; });

    var subtasksHtml = '<div class="subtasks-section">' +
      '<div class="subtasks-label">Steps' + (subs.length > 0 ? ' (' + pending.length + ' left)' : '') + '</div>' +
      (pending.length + done.length > 0 ? '<div class="subtasks-list">' + pending.map(function (s) { return renderSubtaskRow(task.id, s); }).join('') + done.map(function (s) { return renderSubtaskRow(task.id, s); }).join('') + '</div>' : '') +
      '<div class="add-subtask-row">' +
      '<input id="subtaskInput" class="subtask-input" placeholder="Add a smaller step" value="' + escapeHtml(draftSubtaskText) + '" />' +
      priorityDotsDraftSub() +
      '<button class="quick-toggle ' + (draftSubtaskQuick ? 'active' : '') + '" data-action="toggle-draft-subtask-quick">⚡</button>' +
      '<button class="btn-add" data-action="add-subtask">Add</button>' +
      '</div></div>';

    return '<div class="overlay"><div class="overlay-inner">' +
      '<div class="overlay-header"><div><div class="overlay-kicker">Notes</div>' +
      '<div class="overlay-title">' + escapeHtml(task.text) + '</div></div>' +
      '<button class="close-circle" data-action="close-notes">×</button></div>' +
      subtasksHtml +
      '<textarea id="notesTextarea" data-id="' + task.id + '" class="notes-textarea" placeholder="Anything worth jotting down for this one — links, context, next steps…">' + escapeHtml(task.notes || "") + '</textarea>' +
      '<button class="btn-primary" data-action="close-notes">Done</button>' +
      '</div></div>';
  }

  function priorityDotsDraftSub() {
    var out = '<div class="priority-picker sub">';
    for (var p = 1; p <= 5; p++) {
      var active = draftSubtaskPriority === p;
      var style = active ? ('background:' + PRIORITY_COLORS[p] + ';border-color:' + PRIORITY_COLORS[p]) : '';
      out += '<button class="p-dot mini ' + (active ? 'active' : '') + '" style="' + style + '" data-action="select-draft-subtask-priority" data-p="' + p + '">' + p + '</button>';
    }
    out += '</div>';
    return out;
  }

  function switchRow(name, desc, key) {

    return '<div class="menu-section-label">Viewing</div>' +
      '<div class="segmented">' +

      '<div class="menu-divider"></div>' +
      '<div class="menu-section-label">' + profileName(profile) + ' settings</div>' +
      '<div class="menu-list">' +
      menuItem("Task settings", "What this view can do", "tasks") +

      '</div>' +

      '<div class="setting-row" style="border:none">' +

      '<button class="switch ' + (teamListOn() ? 'on' : '') + '" data-action="toggle-team-list" ' +

      '<div class="menu-divider"></div>' +

      '<div class="menu-list">' +
      menuItem("Notifications", notifySummary(), "notifications") +

      '<div class="menu-list">' +

      menuItem("How this works", "A quick tour of the app", "tutorial") +

  function notifySummary() {
    if (pushBlockedReason() === "needs-install") return "Add to Home Screen first";
    if (pushBlockedReason() === "needs-sync") return "Needs sync set up";
    if (!push.enabled) return "Off";
    var on = NOTIFY_TYPES.filter(function (t) { return push.types[t.id]; }).length;
    return on === 0 ? "On, none selected" : on + (on === 1 ? " type" : " types") + " on";

      '<span class="chev">›</span></button>';

  function renderMenuTasks() {
    var scope = profileName(profile).toLowerCase();
    return '<p class="sync-desc">These apply to your <strong>' + scope + '</strong> list only. ' +
      'The other one keeps its own settings.</p>' +
      '<div style="margin-top:18px">' +

      switchRow("Complete from the plan", "Tap the circle or swipe a task right to finish it without entering focus.", "completeFromPlan") +
      switchRow("Fold priorities away", "Show each priority as a drawer you open, instead of every task at once. Keeps the plan short.", "groupedPlan") +
      switchRow("Start today page", "The morning summary of yesterday. Tasks roll over to the next day either way — this only decides whether you see the page.", "morningRecap") +
      switchRow("Put tasks on hold", "For anything blocked on someone else — waiting on a price, a measurement, a call back. Held tasks leave your queue and wait in their own drawer.", "holds") +
      '</div>' +

      '<div class="menu-section-label">When you tap “Not now”</div>' +
      '<div class="segmented">' +

      '</div>' +
      '<p class="setting-desc" style="margin-top:10px">' +

      '</p>';
  }

  /* The whole path to working notifications, with your position on it marked.
     Showing every step at every stage means you always know how much is left,
     rather than clearing one hurdle only to be shown another. */
  function setupChecklist(reason) {
    var steps = [];
    if (isIOS()) {
      steps.push({
        name: "Add Only This to your Home Screen",
        note: "Tap the Share button in Safari, choose <strong>Add to Home Screen</strong>, then open the app from the new icon. Safari will not allow notifications in an ordinary tab.",
        done: isStandalone(),
      });
    }
    steps.push({
      name: "Turn on sync",
      note: "The reminders are put together on the server, so it needs to be able to see your list.",
      done: !!syncCode,
    });
    steps.push({
      name: "Allow notifications",
      note: "Your phone will ask for permission. You then choose which reminders you actually want.",
      done: !!push.enabled && reason !== "denied",
    });

    var firstOpen = -1;
    for (var i = 0; i < steps.length; i++) { if (!steps[i].done) { firstOpen = i; break; } }

    return '<ol class="setup-steps">' + steps.map(function (s, i) {
      var state = s.done ? "done" : (i === firstOpen ? "current" : "");
      return '<li class="setup-step ' + state + '">' +
        '<span class="step-mark">' + (s.done ? "✓" : (i + 1)) + '</span>' +
        '<span class="step-body"><span class="step-name">' + s.name + '</span>' +
        (state === "current" ? '<span class="step-note">' + s.note + '</span>' : '') +
        '</span></li>';
    }).join('') + '</ol>';
  }

  function renderMenuData() {
    var mine = describeData(buildExport());
    var payload = exportString();

      '<p class="sync-desc">A plain-text copy of everything. Useful for moving to the Home Screen app ' +

    if (importDone) {
      out += '<div class="tut-note" style="border:1px solid var(--sage)"><strong>Data loaded.</strong> ' +

    out += '<div class="menu-section-label" style="margin-left:2px">Copy from this device</div>' +
      '<div class="data-summary">' + mine.tasks + (mine.tasks === 1 ? ' open task' : ' open tasks') +
      ' · ' + mine.done + ' completed · ' + size + 'KB</div>' +
      '<textarea id="exportBox" class="data-box" readonly onclick="this.select()">' + escapeHtml(payload) + '</textarea>' +
      '<button class="btn-primary" data-action="copy-data">' + (exportCopied ? '✓ Copied' : 'Copy to clipboard') + '</button>' +
      (exportError
        ? '<p class="sync-desc" style="margin-top:10px">Your browser would not copy it automatically. ' +
          'The text above is selected — press and hold, then choose Copy.</p>'
        : '') +
      '<div class="menu-divider"></div>';

    out += '<div class="menu-section-label" style="margin-left:2px">Paste from another device</div>';

    if (importPreview) {
      var it = describeData(importPreview);
      out += '<div class="tut-note"><strong>Ready to load.</strong><br>' +
        it.tasks + (it.tasks === 1 ? ' open task' : ' open tasks') + ' · ' + it.done + ' completed · ' +
        'lists: ' + it.lists +
        (it.hasSettings ? '<br>Settings and colours included.' : '') +
        (it.syncCode ? '<br>Sync code ' + escapeHtml(it.syncCode) + ' will be used here too.' : '') +
        '</div>' +
        '<p class="sync-warning">This replaces everything currently on this device. There is no undo, ' +
        'so make sure you have copied this device\'s data first if it has anything worth keeping.</p>' +
        '<button class="btn-primary" data-action="apply-import">Replace my data</button>' +
        '<button class="btn-secondary" data-action="cancel-import">Cancel</button>';
    } else {
      out += '<textarea id="importBox" class="data-box" placeholder="Paste the copied text here">' +

        '<button class="btn-secondary" data-action="check-import">Check this data</button>' +

        (importError === "version" ? '<p class="sync-warning">That copy came from a different version of the app. ' +
          'Update both devices to the same version and copy it again.</p>' : '');
    }

    out += '<div class="tut-note">Prefer it automatic? <strong>Sync between devices</strong> keeps two devices ' +
      'in step continuously, rather than copying across once.</div>';
    return out;
  }

  function renderMenuRoster() {

      'side by side.</p>';

    if (list.length) {
      out += '<div class="person-list">' + list.map(function (p, i) {

          return t.assignee === p.id && t.status !== "done";
        }).length;

        out += '<p class="setting-desc" style="margin-top:10px">Waiting for the first check.</p>';

      out += '<div class="tut-note" style="margin-top:14px"><strong>It looks back two days.</strong> ' +

        'about it changes in ServiceM8.</div>';

      'writes to ServiceM8 — jobs, notes and tasks there are only ever read. Your key is stored ' +
      'against your sync code and used only by this site\'s own server. It is never sent back to ' +

  // ---- The guide ----
  // Six chapters, walked a step at a time, each step showing a mock of the real screen

      'style="margin-top:14px">' + label + ' →</button>';

  function seeAlso() {

          '<span class="sa-chapter">' + GUIDE[c].title + '</span></span>' +
          '<span class="sa-arrow">↗</span></button>';
      }).join('') + '</div>';
  }

     silently wrong the moment a step is inserted above it — it still points somewhere,
     just at the wrong page. Adding "Sharing with others" to the menu chapter did

  var MENU_OPEN = 0, MENU_PROFILE = 1, MENU_TASKS = 2, MENU_APPEARANCE = 3,

  function bandDiagram(rows, arrowAt) {
    return '<div class="bands">' + rows.map(function (r, i) {
      return '<div class="band-row' + (i === arrowAt ? ' picked' : '') + '">' +
        '<span class="band-label p' + r.p + '">P' + r.p + '</span>' +
        '<span class="band-items">' + r.items.map(function (t, j) {
          return '<span class="band-chip' + (i === arrowAt && j === 0 ? ' first' : '') + '">' +
            escapeHtml(t) + '</span>';
        }).join('') + '</span>' +
        (i === arrowAt ? '<span class="band-arrow">← next</span>' : '') + '</div>';
    }).join('') + '</div>';
  }

    { label: "Smaller rules", body: function () {

        '<div class="steps-num">' +
        '<div class="sn"><span class="sn-n">🔁</span><span>Finishing a repeating task does not close it — ' +

  var GUIDE = [

  // ---------- progress ----------
  function loadGuideDone() {
    try { return JSON.parse(localStorage.getItem(GUIDE_DONE_KEY) || "[]") || []; } catch (e) { return []; }
  }
  function markChapterDone(c) {
    if (guideDone.indexOf(c) !== -1) return;
    guideDone.push(c);
    try { localStorage.setItem(GUIDE_DONE_KEY, JSON.stringify(guideDone)); } catch (e) {}
  }

  // ---------- navigation ----------
  function guideTitle() {
    return guideChapter === null ? "How this works" : GUIDE[guideChapter].title;
  }
  function guideStepCount() { return GUIDE[guideChapter].steps.length; }
  function atChapterEnd() { return guideChapter !== null && guideStep >= guideStepCount(); }
  function guideNext() {
    if (guideStep + 1 <= guideStepCount()) return [guideChapter, guideStep + 1]; // last hop = the end card
    return null;
  }
  function guidePrev() {
    if (guideStep > 0) return [guideChapter, guideStep - 1];
    if (guideChapter > 0) return [guideChapter - 1, GUIDE[guideChapter - 1].steps.length];
    return null;
  }
  function navButton(target, label, primary) {
    if (!target) return '<button disabled>' + label + '</button>';
    return '<button' + (primary ? ' class="primary"' : '') + ' data-action="guide-goto" ' +
      'data-c="' + target[0] + '" data-s="' + target[1] + '">' + label + '</button>';
  }

  // Shown between chapters, so finishing one is a moment rather than a jump cut.
  function renderChapterEnd() {
    var c = guideChapter;
    var next = GUIDE[c + 1];
    return '<div class="chapter-end">' +
      '<div class="ce-tick">✓</div>' +
      '<div class="ce-title">' + GUIDE[c].title + '</div>' +
      '<div class="ce-sub">Chapter ' + (c + 1) + ' of ' + GUIDE.length + ' finished</div>' +
      '</div>' +
      (next
        ? '<div class="ce-next"><div class="ce-next-label">Up next</div>' +
          '<div class="ce-next-title">' + next.title + '</div>' +
          '<div class="ce-next-sub">' + next.sub + ' · ' + next.steps.length +
          (next.steps.length === 1 ? ' step' : ' steps') + '</div></div>' +
          '<button class="btn-primary" data-action="guide-goto" data-c="' + (c + 1) + '" data-s="0">' +
          'Start chapter ' + (c + 2) + ' →</button>' +
          '<button class="btn-secondary" data-action="guide-contents">Back to contents</button>'
        : '<div class="ce-next"><div class="ce-next-label">That is everything</div>' +
          '<div class="ce-next-sub">Every chapter stays open — dip back into any step whenever you like.</div></div>' +
          '<button class="btn-primary" data-action="guide-contents">Back to contents</button>') +
      '<div class="guide-nav" style="margin-top:14px">' +
      navButton(guidePrev(), "← Back to last step", false) + '</div>';
  }

  function renderMenuTutorial() {
    if (guideChapter === null) {
      return '<p class="sync-desc">Six chapters, walked a step at a time. Most steps show the real ' +
        'screen with the piece being described lit up.</p>' +
        '<div class="guide-list">' + GUIDE.map(function (c, i) {
          var done = guideDone.indexOf(i) !== -1;
          var open = guideExpanded === i;
          var head = '<button class="guide-item' + (done ? ' done' : '') + '" data-action="' +
            (done ? 'guide-expand' : 'guide-goto') + '" data-c="' + i + '" data-s="0">' +
            '<span class="guide-num' + (done ? ' done' : '') + '">' + (done ? '✓' : (i + 1)) + '</span>' +
            '<span class="guide-item-text"><span class="guide-item-title">' + c.title + '</span>' +
            '<span class="guide-item-sub">' + c.sub + ' · ' + c.steps.length +
            (c.steps.length === 1 ? ' step' : ' steps') + '</span></span>' +
            '<span class="chev">' + (done ? (open ? '▾' : '▸') : '›') + '</span></button>';
          if (!done || !open) return head;
          return head + '<div class="guide-steps">' + c.steps.map(function (st, si) {
            return '<button class="guide-steplink" data-action="guide-goto" data-c="' + i + '" data-s="' + si + '">' +
              '<span class="gs-n">' + (si + 1) + '</span>' + st.label + '</button>';
          }).join('') + '</div>';
        }).join('') + '</div>' +
        (guideDone.length
          ? '<button class="demo-reset" data-action="guide-reset" style="margin-top:14px">Clear my progress</button>'
          : '');
    }

    if (atChapterEnd()) return renderChapterEnd();

    // If you got here by following a reference, offer the way back first.
    var returnPill = "";
    if (guideReturn && !(guideReturn.c === guideChapter && guideReturn.s === guideStep)) {
      var rc = GUIDE[guideReturn.c];
      var rs = rc.steps[guideReturn.s];
      returnPill = '<button class="guide-return" data-action="guide-goto" ' +
        'data-c="' + guideReturn.c + '" data-s="' + guideReturn.s + '">' +
        '← Back to ' + escapeHtml(rs ? rs.label : rc.title) + '</button>';
    }

    var next = guideNext();
    var isLastStep = guideStep === guideStepCount() - 1;
    return returnPill + GUIDE[guideChapter].steps[guideStep].body() +
      '<div class="guide-nav">' +
      navButton(guidePrev(), "← Back", false) +
      navButton(next, isLastStep ? "Finish chapter →" : "Next →", true) +
      '</div>' +
      '<div class="guide-progress">Chapter ' + (guideChapter + 1) + ' of ' + GUIDE.length +
      ' · step ' + (guideStep + 1) + ' of ' + guideStepCount() + '</div>';
  }

  function renderMenuSync() {
    var body;
    if (syncCode) {
      body = '<div class="sync-code-display">' + syncCode + '</div>' +

        '<div class="sync-status-line">' + syncStatusLabel() + '</div>' +
        '<button class="btn-secondary" data-action="unlink-sync">Unlink this device</button>';
    } else {
      body = '<p class="sync-desc">Link this device to another so your tasks stay the same on both. First time setting this up? Generate a code here, then enter that same code on your other device.</p>' +
        '<button class="btn-primary" data-action="start-new-sync">Generate a new code</button>' +
        '<div class="sync-divider">or</div>' +
        '<input id="syncCodeInput" class="task-input" placeholder="Enter a code from your other device" value="' + escapeHtml(syncCodeDraft) + '" style="text-transform:uppercase" />' +
        '<button class="btn-secondary" data-action="connect-sync-code">Connect</button>' +
        '<p class="sync-warning">Connecting to an existing code replaces this device\'s tasks with whatever is already synced under that code — best done before adding much here.</p>';
    }
    return '<div class="sync-body">' + body + '</div>';
  }

  var MENU_PAGES = {
    root:       { kicker: "Menu",       title: "Only This",              body: renderMenuRoot },
    tasks:      { kicker: "Settings",   title: "Task settings",          body: renderMenuTasks },
    coworkers:  { kicker: "Team list",  title: "Who works from this",    body: renderMenuRoster },
    appearance: { kicker: "Settings",   title: "Appearance",             body: renderMenuAppearance },
    notifications: { kicker: "Settings", title: "Notifications",         body: renderMenuNotifications },
    data:       { kicker: "Devices",    title: "Copy or move your data", body: renderMenuData },
    sync:       { kicker: "Devices",    title: "Keep this in sync",      body: renderMenuSync },
    advanced:   { kicker: "Setup",      title: "Advanced setup",         body: renderMenuAdvanced },
    sm8:        { kicker: "Advanced",   title: "ServiceM8",              body: renderMenuServiceM8 },
    tutorial:   { kicker: "Guide",      title: guideTitle,               body: renderMenuTutorial },
  };

  function renderMenuOverlay() {
    if (!menuOpen) return '';
    var page = MENU_PAGES[menuPage] || MENU_PAGES.root;
    var isRoot = menuPage === "root";
    // Sub-pages get a back arrow, but close is always one tap away.
    var inChapter = menuPage === "tutorial" && guideChapter !== null;
    var back = isRoot ? ''
      : inChapter
        ? '<button class="back-circle" data-action="guide-contents" aria-label="Back to contents">‹</button>'
        : '<button class="back-circle" data-action="menu-page" data-page="root" aria-label="Back">‹</button>';
    return '<div class="overlay"><div class="overlay-inner">' +
      '<div class="overlay-header">' + back +
      '<div class="overlay-heading"><div class="overlay-kicker">' + page.kicker + '</div>' +
      '<div class="overlay-title">' + (typeof page.title === "function" ? page.title() : page.title) + '</div></div>' +
      '<button class="close-circle" data-action="close-menu" aria-label="Close">×</button></div>' +
      '<div class="overlay-scroll">' + page.body() + '</div>' +
      '</div></div>';
  }

  /* Rebuilding the whole page throws away where you had scrolled to. Toggling something
     in place should not fling you back to the top — but genuinely moving somewhere new
     should start at the top. So: keep the position while the screen you are on is the
     same, reset it when you actually navigate. */
  function screenKey() {
    return [view, planDate, menuOpen ? menuPage : "-", guideChapter, guideStep,
      notesTaskId || "-", assignFor || "-"].join("|");
  }
  function readScroll() {
    var out = { win: 0, panel: 0 };
    try {
      out.win = window.pageYOffset || window.scrollY || 0;
      var panel = document.querySelector && document.querySelector(".overlay-scroll");
      if (panel) out.panel = panel.scrollTop || 0;
    } catch (e) {}
    return out;
  }
  function restoreScroll(saved, sameScreen) {
    try {
      var panel = document.querySelector && document.querySelector(".overlay-scroll");
      if (sameScreen) {
        if (panel && saved.panel) panel.scrollTop = saved.panel;
        if (saved.win && window.scrollTo) window.scrollTo(0, saved.win);
      } else if (panel) {
        panel.scrollTop = 0;
      }
    } catch (e) {}
  }

  function render() {
    var body = view === "focus" ? renderFocus()
      : view === "quick" ? renderQuick()
      : view === "dailies" ? renderDailies()
      : view === "recap" ? renderRecap()
      : renderPlan();
    var html = '<div class="wrap">' + renderHeader() + body + '</div>' +
      renderNotesOverlay() + renderAssignSheet() + renderMenuOverlay();

    var key = screenKey();
    var saved = readScroll();
    document.getElementById("app").innerHTML = html;
    restoreScroll(saved, key === lastScreenKey);
    lastScreenKey = key;

    // Adding a subtask re-renders the notes sheet; put the cursor back where it was.
    if (refocusSubtask) {
      refocusSubtask = false;
      var subEl = document.getElementById("subtaskInput");
      if (subEl) { subEl.focus(); return; }
    }

    if (view === "plan") {
      var fkey = view + "|" + planDate;
      if (fkey !== lastFocusKey) {
        lastFocusKey = fkey;
        var el = document.getElementById("taskInput");
        if (el) el.focus();
      }
    } else if (view === "focus" && addOpen) {
      if (lastFocusKey !== "focus|add") {
        lastFocusKey = "focus|add";
        var addEl = document.getElementById("focusAddInput");
        if (addEl) addEl.focus();
      }
    } else {
      lastFocusKey = null;
    }
  }

  // ---- Event delegation ----
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.dataset.action;
    var id = el.dataset.id;
    var p = el.dataset.p !== undefined ? Number(el.dataset.p) : undefined;

    switch (action) {
      case "set-plan-date": planDate = el.dataset.date; render(); break;
      case "select-draft-priority": draftPriority = p; render(); break;
      case "set-draft-assignee":
        draftAssignee = el.dataset.key === "anyone" ? null : el.dataset.key;
        render();
        break;
      case "toggle-draft-quick": draftQuick = !draftQuick; render(); break;
      case "add-task": addTask(); break;
      case "remove-task": removeTask(id); break;
      case "edit-priority": editingPriorityId = id; render(); break;
      case "set-priority": changePriority(id, p); break;
      case "toggle-quick": toggleQuickFlag(id); break;
      case "dismiss-recap": dismissRecap(); break;
      case "complete-task": completeWithFlourish(id, el.closest(".task-row")); break;
      case "switch-profile": switchProfile(el.dataset.profile); break;
      case "toggle-team-list": {
        var turningOff = teamListOn();
        setTeamListOn(!turningOff);
        /* Switching it off leaves the list and its people exactly where they are — it
           only stops showing them. Turning it back on finds everything as it was. */
        if (turningOff && profile === "team") switchProfile("work");
        else render();
        break;
      }
      case "cycle-draft-repeat": cycleDraftRepeat(); break;
      case "cycle-task-repeat": cycleTaskRepeat(id); break;
      case "enter-dailies": enterDailies(); break;
      case "daily-done": dailyDone(); break;
      case "daily-skip": dailySkip(); break;
      case "open-notes": openNotes(id); break;
      case "close-notes": closeNotes(); break;
      case "toggle-later": showLater = !showLater; render(); break;
      case "toggle-group": toggleGroup(el.dataset.group); break;
      case "toggle-completed": showCompleted = !showCompleted; render(); break;
      case "toggle-held": showHeld = !showHeld; render(); break;
      case "open-hold": openHold(); break;
      case "close-hold": closeHold(); break;
      case "confirm-hold": confirmHold(); break;
      case "clear-chase": holdChase = ""; render(); break;
      case "release-task": releaseTask(id); break;
      case "accept-suggestion": acceptSuggestion(); break;
      case "dismiss-suggestion": dismissSuggestion(); break;
      case "set-suggest-priority": suggestPriority = p; render(); break;
      case "sm8-save-key": sm8SaveKey(); break;
      case "add-person": {
        // personDraft is kept current by the input listener, the same way the task box
        // and the sync code box work. Reading the field itself would be a second source
        // of truth for the same value.
        if (!String(personDraft || "").trim()) { personError = "Type a name first."; render(); break; }
        addPerson(personDraft);
        personDraft = ""; personError = null;
        render();
        break;
      }
      case "remove-person": {
        var freed = removePerson(el.dataset.key);
        personError = freed ? freed + (freed === 1 ? " task is" : " tasks are") +
          " now unassigned — nothing was deleted." : null;
        render();
        break;
      }
      case "team-done": {
        /* Only this column moves on. The other person's card stays exactly where it
           was — having it change because somebody else finished something would be
           the quickest way to make a shared screen unusable. */
        applyCompletion(el.dataset.id, el.dataset.key);
        delete teamCurrent[el.dataset.key];
        save(); render();
        break;
      }
      case "team-skip": {
        // To the back of that person's own queue, nobody else's.
        var skipped = tasks.filter(function (x) { return x.id === el.dataset.id; })[0];
        if (skipped) { skipped.order = nextOrder(); save(); }
        delete teamCurrent[el.dataset.key];
        render();
        break;
      }
      case "set-team-mode":
        setMode(el.dataset.key, el.dataset.mode);
        render();
        break;
      case "team-tick": {
        // Ticked straight off the list, in whatever order she felt like doing them.
        applyCompletion(el.dataset.id, el.dataset.key);
        save(); render();
        break;
      }
      case "team-did": {
        /* Straight to done. Nothing is assigned on the way — an unclaimed task that
           somebody has just finished never needed an owner. */
        applyCompletion(el.dataset.id, el.dataset.key);
        save(); render();
        break;
      }
      case "hand-back": {
        /* Put a task back in the shared band rather than on the other person —
           deciding somebody else should do your work is not this button's job. */
        var back = tasks.filter(function (x) { return x.id === el.dataset.id; })[0];
        if (back) { back.assignee = null; save(); }
        render();
        break;
      }
      case "open-assign": assignFor = el.dataset.id; render(); break;
      case "close-assign": assignFor = null; render(); break;
      case "assign-to": {
        var t = tasks.filter(function (x) { return x.id === assignFor; })[0];
        if (t) {
          var to = el.dataset.key || null;
          t.assignee = to === "none" ? null : to;
          save();
        }
        assignFor = null;
        render();
        break;
      }
      case "sm8-check-now": sm8CheckNow(); break;
      case "sm8-probe": sm8RunProbe(); break;
      case "sm8-copy-probe": sm8CopyProbe(); break;
      case "sm8-test": sm8Test(); break;
      case "sm8-pick-staff": sm8PickStaff(el.dataset.key); break;
      case "sm8-toggle-source": sm8ToggleSource(el.dataset.key); break;
      case "sm8-toggle-enabled":
        sm8Post({ enabled: !(sm8Status && sm8Status.enabled) }, function (data) {
          if (data && data.hasKey !== undefined) sm8Status = data;
          if (data && data.enabled) fetchInbox();
          render();
        });
        break;
      case "sm8-save-names":
        var nameEl = document.getElementById("sm8Names");
        sm8Post({ names: nameEl ? nameEl.value : "" });
        break;
      case "sm8-forget": sm8Forget(); break;
      case "toggle-suggest-step":
        suggestSkipped[p] = !suggestSkipped[p];
        render();
        break;
      case "begin-focus": enterFocus(); break;
      case "enter-quick": enterQuick(); break;
      case "back-to-plan": backToPlan(); break;
      case "mark-done": markDone(); break;
      case "open-snooze": openSnooze(); break;
      case "close-snooze": closeSnooze(); break;
      case "select-snooze-priority": snoozePriority = p; render(); break;
      case "confirm-snooze": confirmSnooze(); break;
      case "confirm-snooze-at":
        if (el.dataset.custom) {
          var dt = document.getElementById("snoozeCustomDT");
          if (dt && dt.value) confirmSnoozeAt(new Date(dt.value).getTime());
        } else {
          confirmSnoozeAt(Number(el.dataset.ts));
        }
        break;
      case "open-focus-add": openFocusAdd(); break;
      case "close-focus-add": closeFocusAdd(); render(); break;
      case "select-add-priority": addPriority = p; render(); break;
      case "add-focus-now": addFocusNow(); break;
      case "add-focus-later": addFocusLater(); break;
      case "quick-done": quickDone(); break;
      case "quick-skip": quickSkip(); break;
      case "enter-subtask-mode": enterSubtaskMode(); break;
      case "subtask-done": subtaskDone(); break;
      case "next-subtask": nextSubtask(); break;
      case "back-to-main-task": backToMainTask(); break;
      case "mark-parent-from-subtasks": markParentDoneFromSubtasks(); break;
      case "add-subtask": addSubtask(); break;
      case "toggle-subtask": toggleSubtaskStatus(el.dataset.parent, id); break;
      case "toggle-subtask-quick": toggleSubtaskQuick(el.dataset.parent, id); break;
      case "remove-subtask": removeSubtask(el.dataset.parent, id); break;
      case "set-subtask-priority": changeSubtaskPriority(el.dataset.parent, id, p); break;
      case "select-draft-subtask-priority": cycleDraftSubtaskPriority(p); break;
      case "toggle-draft-subtask-quick": toggleDraftSubtaskQuick(); break;
      case "open-menu": menuOpen = true; menuPage = "root"; render(); break;
      case "close-menu": menuOpen = false; menuPage = "root"; render(); break;
      case "menu-page":
        menuPage = el.dataset.page;
        if (menuPage === "sm8" || menuPage === "advanced") {
          sm8Error = null; sm8RunNote = null; sm8Probe = null; sm8Load();
        }
        if (menuPage !== "data") { importPreview = null; importError = null; exportError = false; }
        if (menuPage === "tutorial") { guideChapter = null; guideStep = 0; guideExpanded = null; }
        render();
        break;
      case "toggle-setting": toggleSetting(el.dataset.key); break;
      case "set-snooze-mode": setSetting("snoozeMode", el.dataset.mode); break;
      case "set-hold-days": setSetting("holdDays", Number(el.dataset.mode)); break;
      case "set-theme": setSetting("theme", el.dataset.theme); break;
      case "enable-notifications": enableNotifications(); break;
      case "disable-notifications": disableNotifications(); break;
      case "toggle-notify": toggleNotifyType(el.dataset.key); break;
      case "set-notify-lists": setNotifyLists(el.dataset.mode); break;
      case "copy-data": copyExport(); break;
      case "check-import": checkImport(); break;
      case "apply-import": applyImport(); break;
      case "cancel-import": importPreview = null; importError = null; render(); break;
      case "guide-goto":
        guideReturn = null;
        guideChapter = Number(el.dataset.c);
        guideStep = Number(el.dataset.s) || 0;
        if (guideStep >= GUIDE[guideChapter].steps.length) markChapterDone(guideChapter);
        render();
        break;
      case "guide-see":
        // Following a reference — leave a way back to the step you were reading.
        guideReturn = { c: guideChapter, s: guideStep };
        guideChapter = Number(el.dataset.c);
        guideStep = Number(el.dataset.s) || 0;
        render();
        break;
      case "guide-contents": guideChapter = null; guideStep = 0; guideReturn = null; render(); break;
      case "guide-expand":
        guideExpanded = (guideExpanded === Number(el.dataset.c)) ? null : Number(el.dataset.c);
        render();
        break;
      case "guide-set":
        demoSettings[el.dataset.key] = el.dataset.val === "1";
        render();
        break;
      case "guide-reset":
        guideDone = []; guideExpanded = null;
        try { localStorage.removeItem(GUIDE_DONE_KEY); } catch (e) {}
        render();
        break;
      case "guide-jump": guideChapter = null; guideStep = 0; menuPage = el.dataset.page; render(); break;
      case "guide-fold": demoFolded = !demoFolded; render(); break;
      case "guide-tick": demoTicked = !demoTicked; render(); break;
      case "guide-step":
        var si = demoSteps.indexOf(p);
        if (si === -1) demoSteps.push(p); else demoSteps.splice(si, 1);
        render();
        break;
      case "guide-focus-done":
        if (demoQueue.length) demoDone.push(demoQueue.shift());
        render();
        break;
      case "guide-focus-later":
        if (demoQueue.length > 1) demoQueue.push(demoQueue.shift());
        render();
        break;
      case "guide-focus-reset":
        demoQueue = DEMO_TASKS.slice(); demoDone = [];
        render();
        break;
      case "guide-sweep-done": demoSweep.shift(); render(); break;
      case "guide-sweep-skip":
        if (demoSweep.length > 1) demoSweep.push(demoSweep.shift());
        render();
        break;
      case "guide-sweep-reset": demoSweep = DEMO_SWEEP.slice(); render(); break;
      case "start-new-sync": startNewSync(); break;
      case "connect-sync-code": connectWithCode(); break;
      case "unlink-sync": unlinkSync(); break;
      case "sync-now": syncNow(); break;
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target && e.target.id === "taskInput") addTask();
    if (e.key === "Enter" && e.target && e.target.id === "focusAddInput") addFocusNow();
    if (e.key === "Enter" && e.target && e.target.id === "holdInput") confirmHold();
    if (e.key === "Enter" && e.target && e.target.id === "subtaskInput") addSubtask();
    if (e.key === "Enter" && e.target && e.target.id === "syncCodeInput") connectWithCode();
  });

  document.addEventListener("change", function (e) {
    if (e.target && e.target.id === "planDateCustom") { planDate = e.target.value; render(); }
    if (e.target && e.target.id === "holdChaseDate") { holdChase = e.target.value; render(); }
  });

  document.addEventListener("input", function (e) {
    if (e.target && e.target.id === "taskInput") {
      draftText = e.target.value; // no render here — preserves cursor position while typing
    }
    if (e.target && e.target.id === "subtaskInput") {
      draftSubtaskText = e.target.value; // no render here — preserves cursor position while typing
    }
    if (e.target && e.target.id === "focusAddInput") {
      addText = e.target.value; // no render here — preserves cursor position while typing
    }
    if (e.target && e.target.id === "importBox") {
      importText = e.target.value; // no render here — preserves cursor position while typing
    }
    if (e.target && e.target.id === "holdInput") {
      holdText = e.target.value; // no render here — preserves cursor position while typing
    }
    if (e.target && e.target.id === "sm8Key") {
      sm8KeyDraft = e.target.value; // no render here — preserves cursor position while typing
    }
    if (e.target && e.target.id === "personInput") {
      personDraft = e.target.value; // no render here — preserves cursor position while typing
    }
    if (e.target && e.target.id === "syncCodeInput") {
      syncCodeDraft = e.target.value; // no render here — preserves cursor position while typing
    }
    if (e.target && e.target.id === "notesTextarea") {
      var id = e.target.dataset.id;
      tasks = tasks.map(function (t) { return t.id === id ? Object.assign({}, t, { notes: e.target.value }) : t; });
      save(); // no render here — preserves cursor position while typing
    }
  });

  document.addEventListener("pointerdown", function (e) {
    if (!editingPriorityId) return;
    var row = e.target.closest("[data-task-row]");
    if (!row || row.getAttribute("data-task-row") !== editingPriorityId) {
      editingPriorityId = null;
      render();
    }
  });

  // ---- Swipe a task row right to complete it ----
  var swipe = null;

  function resetSwipeEl(el) {
    el.style.transition = "transform .18s ease";
    el.style.transform = "";
    el.classList.remove("swipe-armed");
  }

  document.addEventListener("pointerdown", function (e) {
    if (view !== "plan" || !settings.completeFromPlan) return;
    // The priority-editor handler above re-renders on outside taps, which would leave us
    // holding a detached row. Sit this one out.
    if (editingPriorityId || celebrating) return;
    var row = e.target.closest(".task-row[data-task-row]");
    if (!row) return;
    if (e.target.closest("button")) return; // let the buttons in the row do their own thing
    swipe = { id: row.getAttribute("data-task-row"), el: row, startX: e.clientX, startY: e.clientY, dx: 0, active: false };
  });

  document.addEventListener("pointermove", function (e) {
    if (!swipe) return;
    var dx = e.clientX - swipe.startX;
    var dy = e.clientY - swipe.startY;
    if (!swipe.active) {
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      if (Math.abs(dy) > Math.abs(dx)) { swipe = null; return; } // vertical — let the page scroll
      swipe.active = true;
      swipe.el.style.transition = "none";
    }
    if (dx < 0) dx = 0; // right-swipe only
    swipe.dx = dx;
    swipe.el.style.transform = "translateX(" + dx + "px)";
    swipe.el.classList.toggle("swipe-armed", dx >= SWIPE_THRESHOLD);
  });

  function endSwipe(cancelled) {
    if (!swipe) return;
    var s = swipe;
    swipe = null;
    if (!s.active) return;
    if (!cancelled && s.dx >= SWIPE_THRESHOLD) {
      // Same flourish as tapping, but the ghost launches from wherever the row was thrown to.
      var task = tasks.find(function (t) { return t.id === s.id; });
      celebrateRow(s.el);
      celebrating = s.id;
      var flew = flyToCompleted(s.el, task ? task.text : "");
      s.el.style.transition = "transform .2s ease, opacity .2s ease";
      s.el.style.transform = "translateX(115%)";
      s.el.style.opacity = "0";
      setTimeout(function () {
        celebrating = null;
        finishCompletion(s.id);
      }, flew ? 560 : 300);
    } else {
      resetSwipeEl(s.el);
    }
  }
  document.addEventListener("pointerup", function () { endSwipe(false); });
  document.addEventListener("pointercancel", function () { endSwipe(true); });

  // ---- Boot ----
  applyTheme();
  restorePushSubscription();
  releaseDueChases();
  rolloverOverdue();
  if (needsMigrationSave) { needsMigrationSave = false; save(); }
  maybeShowRecap();
  render();
  if (syncCode) { pullSync(true); fetchInbox(); sm8Load(); }
  setInterval(function () {
    if (isTypingNow() || swipe || celebrating) return; // don't yank the DOM out from under a gesture or a keystroke
    checkDayBoundary();
    render();
    if (syncCode && view === "plan") { pullSync(true); fetchInbox(); }
  }, 60000);

  // Coming back to the app after it has been backgrounded (phone in a pocket overnight)
  // is the most likely moment for the day to have turned.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") return;
    if (celebrating || isTypingNow()) return;
    checkDayBoundary();
    render();
    if (syncCode) { pullSync(true); fetchInbox(); sm8Load(); }
  });
})();
</script>
</body>
</html>
