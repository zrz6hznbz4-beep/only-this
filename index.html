<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Only This</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Only This" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#181C19" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="icon" href="/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* ---- Theme system ----------------------------------------------------
     Every colour on screen comes from one of these. A theme only overrides
     these variables; no layout or type changes between themes.

       --bg / --text / --text-dim / --text-faint   the page itself
       --surface / --surface-2                     panels and boxes
       --line / --line-strong / --line-soft        borders and dividers
       --paper / --ink / --ink-dim                 the focus card and inputs
       --on-sage / --on-amber / --on-paper         text sitting on a fill
       --p1..--p5                                  priority ramp, 1 hottest
     -------------------------------------------------------------------- */
  :root, [data-theme="original"] {
    --ink: #242821;
    --ink-dim: rgba(36,40,33,0.62);
    --ink-line: rgba(36,40,33,0.08);
    --paper: #F2EEE3;
    --paper-dim1: #DFDAC8;
    --paper-dim2: #CBC4AC;
    --bg: #181C19;
    --text: #F2EEE3;
    --text-dim: #CBC4AC;
    --text-faint: rgba(203,196,172,0.5);
    --surface: rgba(242,238,227,0.05);
    --surface-2: rgba(242,238,227,0.08);
    --line: rgba(203,196,172,0.33);
    --line-strong: rgba(203,196,172,0.4);
    --line-soft: rgba(203,196,172,0.18);
    --sage: #7E9A82;
    --sage-tint: rgba(126,154,130,0.16);
    --sage-tint-strong: rgba(126,154,130,0.22);
    --amber: #CE9B4C;
    --amber-line: rgba(206,155,76,0.4);
    --amber-tint: rgba(206,155,76,0.07);
    --rust: rgba(176,100,74,0.85);
    --p4-line: rgba(147,166,126,0.22);
    --p4-tint: rgba(147,166,126,0.08);
    --on-sage: #132016;
    --on-amber: #211705;
    --on-paper: #1B1F1D;
    --shadow-strong: rgba(0,0,0,0.38);
    --shadow-mid: rgba(0,0,0,0.3);
    --shadow-soft: rgba(0,0,0,0.25);
    --p1: #B0644A;
    --p2: #C4834B;
    --p3: #CE9B4C;
    --p4: #93A67E;
    --p5: #7E9A82;
  }

  /* Linen — the lightest. Warm paper, ink text, muted clay and olive. */
  [data-theme="linen"] {
    --ink: #2E2A24;
    --ink-dim: rgba(46,42,36,0.6);
    --ink-line: rgba(46,42,36,0.1);
    --paper: #FFFFFF;
    --paper-dim1: #EFE7D9;
    --paper-dim2: #E2D7C4;
    --bg: #F4F0E6;
    --text: #33302A;
    --text-dim: #736B5E;
    --text-faint: rgba(115,107,94,0.72);
    --surface: rgba(46,42,36,0.045);
    --surface-2: rgba(46,42,36,0.075);
    --line: rgba(46,42,36,0.2);
    --line-strong: rgba(46,42,36,0.3);
    --line-soft: rgba(46,42,36,0.11);
    --sage: #617B61;
    --sage-tint: rgba(97,123,97,0.15);
    --sage-tint-strong: rgba(97,123,97,0.22);
    --amber: #B4813A;
    --amber-line: rgba(180,129,58,0.42);
    --amber-tint: rgba(180,129,58,0.09);
    --rust: rgba(160,86,62,0.9);
    --p4-line: rgba(126,146,104,0.3);
    --p4-tint: rgba(126,146,104,0.1);
    --on-sage: #FFFFFF;
    --on-amber: #2A1D06;
    --on-paper: #2E2A24;
    --shadow-strong: rgba(70,60,45,0.16);
    --shadow-mid: rgba(70,60,45,0.12);
    --shadow-soft: rgba(70,60,45,0.09);
    --p1: #A0563E;
    --p2: #B4753C;
    --p3: #B4813A;
    --p4: #6F8259;
    --p5: #617B61;
  }

  /* Mist — light and cool. Soft blue-grey with sea-green accents. */
  [data-theme="mist"] {
    --ink: #1F2A31;
    --ink-dim: rgba(31,42,49,0.6);
    --ink-line: rgba(31,42,49,0.09);
    --paper: #FFFFFF;
    --paper-dim1: #E4EBF0;
    --paper-dim2: #D2DDE5;
    --bg: #E9EEF2;
    --text: #24313A;
    --text-dim: #5E6C77;
    --text-faint: rgba(94,108,119,0.72);
    --surface: rgba(31,42,49,0.045);
    --surface-2: rgba(31,42,49,0.075);
    --line: rgba(31,42,49,0.19);
    --line-strong: rgba(31,42,49,0.28);
    --line-soft: rgba(31,42,49,0.1);
    --sage: #487D78;
    --sage-tint: rgba(72,125,120,0.15);
    --sage-tint-strong: rgba(72,125,120,0.22);
    --amber: #B07C3C;
    --amber-line: rgba(176,124,60,0.42);
    --amber-tint: rgba(176,124,60,0.09);
    --rust: rgba(168,86,74,0.9);
    --p4-line: rgba(107,146,133,0.3);
    --p4-tint: rgba(107,146,133,0.1);
    --on-sage: #FFFFFF;
    --on-amber: #26190A;
    --on-paper: #1F2A31;
    --shadow-strong: rgba(40,60,72,0.16);
    --shadow-mid: rgba(40,60,72,0.12);
    --shadow-soft: rgba(40,60,72,0.09);
    --p1: #A8564A;
    --p2: #B06B4A;
    --p3: #B07C3C;
    --p4: #5C8279;
    --p5: #487D78;
  }

  /* Ember — dark and warm. Cocoa and firelight. */
  [data-theme="ember"] {
    --ink: #2B211C;
    --ink-dim: rgba(43,33,28,0.62);
    --ink-line: rgba(43,33,28,0.09);
    --paper: #F4E9DC;
    --paper-dim1: #DCCBB8;
    --paper-dim2: #C4AE97;
    --bg: #211A18;
    --text: #F2E6DA;
    --text-dim: #BCA795;
    --text-faint: rgba(188,167,149,0.5);
    --surface: rgba(244,233,220,0.05);
    --surface-2: rgba(244,233,220,0.085);
    --line: rgba(196,174,151,0.32);
    --line-strong: rgba(196,174,151,0.42);
    --line-soft: rgba(196,174,151,0.17);
    --sage: #C98A5E;
    --sage-tint: rgba(201,138,94,0.16);
    --sage-tint-strong: rgba(201,138,94,0.24);
    --amber: #DFA44A;
    --amber-line: rgba(223,164,74,0.4);
    --amber-tint: rgba(223,164,74,0.08);
    --rust: rgba(190,98,72,0.9);
    --p4-line: rgba(197,146,96,0.24);
    --p4-tint: rgba(197,146,96,0.09);
    --on-sage: #241510;
    --on-amber: #2A1B04;
    --on-paper: #241A14;
    --shadow-strong: rgba(0,0,0,0.45);
    --shadow-mid: rgba(0,0,0,0.35);
    --shadow-soft: rgba(0,0,0,0.28);
    --p1: #C2553F;
    --p2: #CE7444;
    --p3: #DFA44A;
    --p4: #C59260;
    --p5: #C98A5E;
  }

  /* Deep — the darkest. Near-black navy with cold teal. */
  [data-theme="deep"] {
    --ink: #101820;
    --ink-dim: rgba(16,24,32,0.62);
    --ink-line: rgba(16,24,32,0.09);
    --paper: #E8EFF6;
    --paper-dim1: #C7D4E0;
    --paper-dim2: #A6B7C7;
    --bg: #0C1016;
    --text: #E4ECF4;
    --text-dim: #93A5B6;
    --text-faint: rgba(147,165,182,0.48);
    --surface: rgba(232,239,246,0.045);
    --surface-2: rgba(232,239,246,0.08);
    --line: rgba(166,183,199,0.3);
    --line-strong: rgba(166,183,199,0.4);
    --line-soft: rgba(166,183,199,0.16);
    --sage: #5D9AA6;
    --sage-tint: rgba(93,154,166,0.16);
    --sage-tint-strong: rgba(93,154,166,0.24);
    --amber: #C9A24E;
    --amber-line: rgba(201,162,78,0.4);
    --amber-tint: rgba(201,162,78,0.08);
    --rust: rgba(180,94,86,0.9);
    --p4-line: rgba(122,163,166,0.24);
    --p4-tint: rgba(122,163,166,0.09);
    --on-sage: #071016;
    --on-amber: #1C1503;
    --on-paper: #101820;
    --shadow-strong: rgba(0,0,0,0.55);
    --shadow-mid: rgba(0,0,0,0.42);
    --shadow-soft: rgba(0,0,0,0.32);
    --p1: #B45E56;
    --p2: #BE7A57;
    --p3: #C9A24E;
    --p4: #7AA3A6;
    --p5: #5D9AA6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    font-family: 'Inter', sans-serif;
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom);
  }
  #app {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(20px, env(safe-area-inset-top)) 20px 40px;
  }
  .wrap { width: 100%; max-width: 540px; }

  .header { margin-bottom: 32px; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .header-slot { flex: 0 0 auto; width: 44px; display: flex; align-items: center; padding-top: 4px; }
  .header-slot.right { justify-content: flex-end; }
  .header-center { flex: 1; text-align: center; }
  .profile-btn {
    background: transparent; border: 1px solid var(--line); color: var(--text-dim);
    border-radius: 8px; padding: 6px 11px; font-size: 0.74rem; cursor: pointer; white-space: nowrap;
  }
  .burger {
    background: transparent; border: none; cursor: pointer; padding: 6px 2px;
    display: flex; flex-direction: column; gap: 4px; width: 34px; align-items: flex-end;
  }
  .burger span { display: block; height: 1.5px; width: 20px; background: var(--text-dim); border-radius: 2px; }
  .burger span:nth-child(2) { width: 14px; }

  /* ---- Menu ---- */
  .menu-list { display: flex; flex-direction: column; gap: 2px; }
  .menu-item {
    width: 100%; background: transparent; border: none; border-radius: 10px;
    color: var(--text); text-align: left; padding: 15px 14px; font-size: 0.94rem;
    cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .menu-item:hover { background: var(--surface); }
  .menu-item .chev { color: var(--text-faint); font-size: 0.9rem; }
  .menu-sub { font-size: 0.76rem; color: var(--text-dim); display: block; margin-top: 3px; }
  .menu-item-label { display: flex; flex-direction: column; }
  .menu-divider { height: 1px; background: var(--line-soft); margin: 12px 2px; }
  .menu-section-label {
    font-size: 0.7rem; color: var(--text-faint); letter-spacing: 0.06em;
    text-transform: uppercase; margin: 4px 0 8px 14px;
  }
  .segmented { display: flex; gap: 6px; background: var(--surface); border-radius: 12px; padding: 5px; }
  .segmented button {
    flex: 1; background: transparent; border: none; border-radius: 8px; cursor: pointer;
    padding: 11px 0; font-size: 0.88rem; color: var(--text-dim); font-family: 'Inter', sans-serif;
  }
  .segmented button.active { background: var(--paper); color: var(--ink); font-weight: 600; }

  /* Toggle rows */
  .setting-row {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 14px 2px; border-bottom: 1px solid var(--line-soft);
  }
  .setting-row:last-of-type { border-bottom: none; }
  .setting-text { flex: 1; }
  .setting-name { font-size: 0.9rem; color: var(--text); }
  .setting-desc { font-size: 0.76rem; color: var(--text-dim); margin-top: 4px; line-height: 1.45; }
  /* Copy / paste data */
  .data-box {
    width: 100%; height: 92px; resize: none; margin-bottom: 12px;
    background: var(--surface); color: var(--text-dim); border: 1px solid var(--line-soft);
    border-radius: 10px; padding: 12px; outline: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.72rem; line-height: 1.5; word-break: break-all;
  }
  .data-box:focus { border-color: var(--line); color: var(--text); }
  .data-summary { font-size: 0.78rem; color: var(--text-dim); margin: 0 2px 10px; }
  .data-box::placeholder { color: var(--text-faint); }

  /* Notification setup checklist */
  .setup-steps { list-style: none; padding: 0; margin: 18px 0 20px; display: flex; flex-direction: column; gap: 2px; }
  .setup-step { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 10px; }
  .setup-step.current { background: var(--surface); }
  .step-mark {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; margin-top: 1px;
    border: 1px solid var(--line); color: var(--text-dim); font-size: 0.72rem; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .setup-step.done .step-mark { background: var(--sage); border-color: var(--sage); color: var(--on-sage); }
  .setup-step.current .step-mark { border-color: var(--amber); color: var(--amber); }
  .step-body { display: flex; flex-direction: column; }
  .step-name { font-size: 0.88rem; color: var(--text); }
  .setup-step.done .step-name { color: var(--text-dim); }
  .step-note { font-size: 0.78rem; color: var(--text-dim); margin-top: 5px; line-height: 1.55; }
  .notify-at {
    font-size: 0.7rem; color: var(--text-faint); border: 1px solid var(--line-soft);
    border-radius: 6px; padding: 1px 6px; margin-left: 6px; white-space: nowrap;
  }
  .switch {
    flex-shrink: 0; width: 46px; height: 27px; border-radius: 14px; cursor: pointer;
    background: var(--surface-2); border: 1px solid var(--line); position: relative;
    transition: background 0.16s ease, border-color 0.16s ease; padding: 0;
  }
  .switch .knob {
    position: absolute; top: 2px; left: 2px; width: 21px; height: 21px; border-radius: 50%;
    background: var(--text-dim); transition: transform 0.16s ease, background 0.16s ease;
  }
  .switch.on { background: var(--sage); border-color: var(--sage); }
  .switch.on .knob { transform: translateX(19px); background: var(--on-sage); }

  /* Theme picker */
  .theme-grid { display: flex; flex-direction: column; gap: 10px; }
  .theme-option {
    display: flex; align-items: center; gap: 14px; width: 100%; cursor: pointer;
    background: transparent; border: 1px solid var(--line-soft); border-radius: 12px;
    padding: 12px 14px; font-family: 'Inter', sans-serif; text-align: left;
  }
  .theme-option.active { border-color: var(--sage); background: var(--sage-tint); }
  .theme-swatch { display: flex; flex-shrink: 0; border-radius: 8px; overflow: hidden; border: 1px solid var(--line-soft); }
  .theme-swatch i { display: block; width: 17px; height: 34px; }
  .theme-name { font-size: 0.9rem; color: var(--text); }
  .theme-note { font-size: 0.74rem; color: var(--text-dim); margin-top: 2px; }
  .theme-tick { margin-left: auto; color: var(--sage); font-size: 0.95rem; }

  /* Tutorial */
  .tut-section { margin-bottom: 24px; }
  .tut-h {
    font-family: 'Fraunces', serif; font-size: 1.05rem; color: var(--text);
    margin: 0 0 8px 0; display: flex; align-items: center; gap: 9px;
  }
  .tut-p { font-size: 0.87rem; color: var(--text-dim); line-height: 1.65; margin: 0 0 9px 0; }
  .tut-p strong { color: var(--text); font-weight: 600; }
  .tut-note {
    font-size: 0.83rem; color: var(--text-dim); line-height: 1.6;
    background: var(--surface); border-radius: 10px; padding: 12px 14px; margin: 10px 0 0 0;
  }
  /* min-height:0 matters — without it a flex child refuses to shrink below its
     content height and scrolls nowhere. */
  .overlay-scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 24px; }
  .logo { font-family: 'Fraunces', serif; font-weight: 500; font-size: 1.7rem; letter-spacing: -0.01em; color: var(--text); }
  .subtitle { font-size: 0.8rem; color: var(--text-dim); margin-top: 4px; letter-spacing: 0.02em; }

  button { font-family: 'Inter', sans-serif; }
  input, textarea { font-family: 'Inter', sans-serif; }

  /* Plan view */
  .date-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .date-pill {
    background: transparent; color: var(--text-dim);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 14px; font-size: 0.82rem; cursor: pointer;
  }
  .date-pill.active { background: var(--paper); color: var(--ink); font-weight: 600; border-color: var(--text); }
  .date-input {
    background: transparent; color: var(--text-dim);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 10px; font-size: 0.8rem;
  }

  .add-box { background: var(--surface); border-radius: 12px; padding: 14px; margin-bottom: 20px; }
  .task-input {
    width: 100%; background: var(--paper); color: var(--ink); border: none;
    border-radius: 10px; padding: 12px 14px; font-size: 0.92rem; outline: none; margin-bottom: 10px;
  }
  .add-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .priority-picker { display: flex; align-items: center; gap: 6px; }
  .priority-label { font-size: 0.75rem; color: var(--text-dim); margin-right: 4px; }
  .p-dot {
    width: 32px; height: 32px; border-radius: 50%;
    border: 1px solid var(--line-strong); background: transparent;
    color: var(--text-dim); font-weight: 700; font-size: 0.8rem; cursor: pointer;
  }
  .p-dot.active { color: var(--on-paper); }
  .quick-toggle {
    background: transparent; border: 1px solid var(--line-strong); color: var(--text-dim);
    border-radius: 8px; padding: 6px 10px; font-size: 0.78rem; cursor: pointer;
  }
  .quick-toggle.active { background: var(--amber); border-color: var(--amber); color: var(--on-amber); font-weight: 600; }
  .repeat-toggle {
    background: transparent; border: 1px solid var(--line-strong); color: var(--text-dim);
    border-radius: 8px; padding: 6px 10px; font-size: 0.78rem; cursor: pointer;
  }
  .repeat-toggle.active { background: var(--p4); border-color: var(--p4); color: var(--on-sage); font-weight: 600; }
  .repeat-tag {
    background: transparent; border: 1px solid var(--line-strong); color: var(--text-dim);
    border-radius: 8px; padding: 4px 9px; font-size: 0.72rem; cursor: pointer; white-space: nowrap; flex-shrink: 0;
  }
  .btn-add {
    background: var(--sage); color: var(--on-sage); border: none; border-radius: 10px;
    padding: 9px 20px; font-weight: 600; font-size: 0.85rem; cursor: pointer;
  }

  .group { margin-bottom: 14px; }
  .group-label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; margin-bottom: 6px; text-transform: uppercase; }

  /* Collapsed priority groups — the tidy version of the plan */
  .group.folded { margin-bottom: 0; }
  .group-toggle {
    width: 100%; display: flex; align-items: center; gap: 10px;
    background: transparent; border: none; border-bottom: 1px solid var(--line-soft);
    cursor: pointer; padding: 12px 4px; color: var(--text);
    font-family: 'Inter', sans-serif; text-align: left;
  }
  .group-toggle .g-chev { font-size: 0.7rem; color: var(--text-faint); width: 9px; flex-shrink: 0; }
  .group-toggle .g-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .group-toggle .g-name { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
  .group-toggle .g-count { margin-left: auto; font-size: 0.78rem; color: var(--text-dim); }
  .group-toggle .g-peek {
    font-size: 0.78rem; color: var(--text-faint); margin-left: auto; max-width: 52%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .group-body { padding: 10px 0 4px; }

  .task-row {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--line-soft); border-radius: 10px;
    padding: 9px 12px; margin-bottom: 6px;
    background: var(--bg);
    position: relative;
    touch-action: pan-y;
    will-change: transform;
  }
  .task-row.swipe-armed { border-color: var(--sage); background: var(--sage-tint-strong); }

  /* Completion flourish — the check fills and pops, a ring rides out from it,
     a few sparks scatter, then the row strikes through and slips away. */
  @keyframes ot-pop { 0% { transform: scale(1); } 45% { transform: scale(1.32); } 100% { transform: scale(1); } }
  @keyframes ot-ring { 0% { transform: scale(0.5); opacity: 0.55; } 100% { transform: scale(2.7); opacity: 0; } }
  @keyframes ot-spark {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx, 0), var(--dy, 0)) scale(0.25); opacity: 0; }
  }

  var planDate = todayStr();

  // ---- Notifications ----

  // ---- Cross-device sync ----

    try { personalRaw = JSON.parse(localStorage.getItem("onlyThisTasks_personal") || "null"); } catch (e) {}
    return {
      work: workRaw || { tasks: [], completions: [] },
      personal: personalRaw || { tasks: [], completions: [] },
      updatedAt: Date.now(),
    };
  }
  function applySyncPayload(data) {
    if (!data) return;
    try { localStorage.setItem("onlyThisTasks_work", JSON.stringify(data.work || { tasks: [], completions: [] })); } catch (e) {}
    try { localStorage.setItem("onlyThisTasks_personal", JSON.stringify(data.personal || { tasks: [], completions: [] })); } catch (e) {}
    try { localStorage.setItem("onlyThisLastSyncedAt", String(data.updatedAt || Date.now())); } catch (e) {}

    tasks = fresh.tasks;

  function switchProfile(p) {

    try { localStorage.setItem(PROFILE_KEY, profile); } catch (e) {}
    settings = loadSettings(profile);
    applyTheme();
    var data = load();
    tasks = data.tasks;
    completions = data.completions;
    view = "plan";
    planDate = todayStr();
    draftPriority = 3;
    draftQuick = false;
    draftRepeat = null;
    draftText = "";

  // Ordered: priority 1 first, and within a priority, oldest position first.
  // This ordering is what makes "send it to the back" meaningful.

    if (af !== -1 && bf !== -1) return af - bf;
    if (af !== -1) return -1;
    if (bf !== -1) return 1;
    return byPriorityThenOrder(a, b);

  }
  function quickEligibleTasks() {
    return eligibleTasks().filter(function (t) { return t.quick; });
  }

    if (list.length === 0) return null;
    var minP = Math.min.apply(null, list.map(function (t) { return t.priority; }));
    var pool = list.filter(function (t) { return t.priority === minP; });
    return pool[Math.floor(Math.random() * pool.length)];

    var elig = eligibleTasks();
    if (currentTaskId && elig.some(function (t) { return t.id === currentTaskId; })) return;

  // ---- Mutations ----
  function addTask() {

    if (!text) return;
    var isRepeating = draftRepeat === "daily" || draftRepeat === "weekly";
    tasks.push({
      id: uid(),
      text: text,
      priority: isRepeating ? randomMidPriority() : draftPriority,
      date: planDate,
      status: "pending",
      snoozedUntil: null,
      order: nextOrder(),
      quick: isRepeating ? false : draftQuick,
      repeat: isRepeating ? draftRepeat : null,
      notes: "",
      subtasks: [],
    });

    draftQuick = false;
    draftRepeat = null;

    tasks = tasks.map(function (t) {

    var pending = (t.subtasks || []).filter(function (s) { return s.status !== "done"; }).length;
    return pending > 0 ? '<span class="steps-tag">' + pending + (pending === 1 ? ' step' : ' steps') + '</span>' : '';
  }

  function checkBtn(t) {
    if (!settings.completeFromPlan) return '';
    return '<button class="task-check" data-action="complete-task" data-id="' + t.id + '" title="Mark done">○</button>';
  }

  function snoozedTag(t) {
    return (t.snoozedUntil && t.snoozedUntil > Date.now())
      ? '<span class="snoozed-tag">⏰ ' + fmtWhen(t.snoozedUntil) + '</span>' : '';
  }

  function renderTaskRow(t) {
    if (editingPriorityId === t.id) {
      return '<div class="task-row" data-task-row="' + t.id + '">' +
        '<span class="task-text">' + escapeHtml(t.text) + '</span>' + snoozedTag(t) +
        priorityDots(t.priority, "set-priority", t.id) +
        '</div>';
    }
    return '<div class="task-row" data-task-row="' + t.id + '">' +
      checkBtn(t) +
      '<span class="task-text">' + escapeHtml(t.text) + '</span>' + snoozedTag(t) + stepsTag(t) +
      '<button class="icon-btn ' + (t.quick ? 'lit' : '') + '" data-action="toggle-quick" data-id="' + t.id + '" title="Under a few minutes">⚡</button>' +
      '<button class="icon-btn ' + (hasNotesOrSubs(t) ? 'lit' : '') + '" data-action="open-notes" data-id="' + t.id + '" title="Notes">🗒</button>' +
      '<button class="p-badge" style="background:' + PRIORITY_COLORS[t.priority] + ';border-color:' + PRIORITY_COLORS[t.priority] + '" data-action="edit-priority" data-id="' + t.id + '">' + t.priority + '</button>' +
      '<button class="icon-btn danger" data-action="remove-task" data-id="' + t.id + '">×</button>' +
      '</div>';
  }

  function renderRepeatingRow(t) {
    var label = t.repeat === "daily" ? "Daily" : "Weekly";
    return '<div class="task-row" data-task-row="' + t.id + '">' +
      checkBtn(t) +
      '<span class="task-text">' + escapeHtml(t.text) + '</span>' + stepsTag(t) +
      '<button class="icon-btn ' + (hasNotesOrSubs(t) ? 'lit' : '') + '" data-action="open-notes" data-id="' + t.id + '" title="Notes">🗒</button>' +
      '<button class="repeat-tag" data-action="cycle-task-repeat" data-id="' + t.id + '" title="Change repeat">🔁 ' + label + '</button>' +
      '<button class="icon-btn danger" data-action="remove-task" data-id="' + t.id + '">×</button>' +
      '</div>';
  }

  // ---- Folded priority groups ----
  function firstNonEmptyPriority(list) {
    for (var p = 1; p <= 5; p++) {
      if (list.some(function (t) { return t.priority === p; })) return p;
    }
    return null;
  }
  function groupIsOpen(key, isDefault) {
    if (expandedGroups === null) return isDefault;
    return !!expandedGroups[key];
  }
  function toggleGroup(key) {
    if (expandedGroups === null) {
      // First interaction: keep whatever was already showing, then apply the tap.
      expandedGroups = {};
      var today = todayStr();
      var planTasks = tasks.filter(function (t) { return t.date === planDate && t.status !== "done"; });
      var auto = firstNonEmptyPriority(settings.repeats ? planTasks.filter(function (t) { return !t.repeat; }) : planTasks);
      if (auto) expandedGroups["p" + auto] = true;
    }
    expandedGroups[key] = !expandedGroups[key];
    render();
  }

  function foldedGroup(key, name, colour, items, renderRow, openByDefault) {
    var open = groupIsOpen(key, openByDefault);
    // Collapsed groups show a glimpse of what is inside, so the page still tells you something.
    var peek = open ? '<span class="g-count">' + items.length + '</span>'
      : '<span class="g-peek">' + escapeHtml(items[0].text) +
        (items.length > 1 ? ' +' + (items.length - 1) : '') + '</span>';
    return '<div class="group folded">' +
      '<button class="group-toggle" data-action="toggle-group" data-group="' + key + '" aria-expanded="' + open + '">' +
      '<span class="g-chev">' + (open ? '▾' : '▸') + '</span>' +
      '<span class="g-dot" style="background:' + colour + '"></span>' +
      '<span class="g-name" style="color:' + colour + '">' + name + '</span>' +
      peek +
      '</button>' +
      (open ? '<div class="group-body">' + items.map(renderRow).join('') + '</div>' : '') +
      '</div>';
  }

  function renderPlan() {
    var today = todayStr(), tomorrow = addDaysStr(1);
    var repeatsOn = !!settings.repeats;
    var elig = eligibleTasks();
    var quickElig = quickEligibleTasks();
    var dailyElig = repeatsOn ? dailyEligibleTasks() : [];
    var planTasksAll = tasks.filter(function (t) { return t.date === planDate && t.status !== "done"; });
    var planTasks = repeatsOn ? planTasksAll.filter(function (t) { return !t.repeat; }) : planTasksAll;
    var repeatingTasks = repeatsOn ? planTasksAll.filter(function (t) { return !!t.repeat; }) : [];
    var nowTs = Date.now();
    var later = tasks.filter(function (t) {
      return t.status !== "done" && (t.date > today || (t.snoozedUntil && t.snoozedUntil > nowTs));
    }).sort(function (a, b) {
      var aKey = a.snoozedUntil || 0, bKey = b.snoozedUntil || 0;
      if (aKey !== bKey) return aKey - bKey;
      return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
    });
    var anySnoozed = later.some(function (t) { return t.snoozedUntil && t.snoozedUntil > nowTs; });

    var grouped = !!settings.groupedPlan;
    var firstOpen = firstNonEmptyPriority(planTasks);

    var groupsHtml = "", anyTasks = false;
    for (var p = 1; p <= 5; p++) {
      var group = planTasks.filter(function (t) { return t.priority === p; }).sort(byPriorityThenOrder);
      if (group.length === 0) continue;
      anyTasks = true;
      groupsHtml += grouped
        ? foldedGroup("p" + p, "Priority " + p, PRIORITY_COLORS[p], group, renderTaskRow, firstOpen === p)
        : '<div class="group"><div class="group-label" style="color:' + PRIORITY_COLORS[p] + '">Priority ' + p + '</div>' +
          group.map(renderTaskRow).join('') + '</div>';
    }

    var repeatingHtml = "";
    if (repeatingTasks.length > 0) {
      anyTasks = true;
      repeatingHtml = grouped
        ? foldedGroup("rep", "🔁 Repeating", "var(--text-dim)", repeatingTasks, renderRepeatingRow, false)
        : '<div class="group"><div class="group-label" style="color:var(--text-dim)">🔁 Repeating</div>' +
          repeatingTasks.map(renderRepeatingRow).join('') + '</div>';
    }

    if (!anyTasks) {
      groupsHtml = '<div class="empty-state">Nothing scheduled for ' + fmtDate(planDate).toLowerCase() + ' yet.</div>';
    }

    var laterHtml = "";
    if (later.length > 0) {
      laterHtml = '<div class="later-section">' +
        '<button class="later-toggle" data-action="toggle-later">' + (showLater ? '▾' : '▸') + ' ' +
        (anySnoozed ? 'Scheduled &amp; snoozed' : 'Scheduled for later') + ' (' + later.length + ')</button>';
      if (showLater) {
        laterHtml += '<div class="later-list">' + later.map(function (t) {
          return '<div class="later-row"><span class="later-text">' + escapeHtml(t.text) + '</span><span>' +
            (t.snoozedUntil && t.snoozedUntil > nowTs ? 'back ' + fmtWhen(t.snoozedUntil) : fmtDate(t.date)) + '</span></div>';
        }).join('') + '</div>';
      }
      laterHtml += '</div>';
    }

    // Completed drawer — same shape as "Scheduled for later", and the landing spot
    // for the swoop animation when a task is checked off.
    var doneList = completedOnDate(planDate);
    var completedHtml = "";
    if (doneList.length > 0) {
      var whenLabel = planDate === today ? "today" : fmtDate(planDate).toLowerCase();
      completedHtml = '<div class="later-section completed-section">' +
        '<button class="later-toggle" id="completedToggle" data-action="toggle-completed">' +
        (showCompleted ? '▾' : '▸') + ' Completed ' + whenLabel + ' (' +
        '<span class="done-count' + (bumpCompleted ? ' bump' : '') + '">' + doneList.length + '</span>)</button>';
      if (showCompleted) {
        completedHtml += '<div class="later-list">' + doneList.map(function (c) {
          return '<div class="later-row"><span class="done-check">✓</span>' +
            '<span class="later-text strike">' + escapeHtml(c.text) + '</span>' +
            '<span>' + fmtTime(c.ts) + '</span></div>';
        }).join('') + '</div>';
      }
      completedHtml += '</div>';
    }

    var quickBtnHtml = quickElig.length > 0
      ? '<button class="btn-quick-clear" data-action="enter-quick">⚡ Clear the small stuff (' + quickElig.length + ')</button>'
      : '';
    var dailyBtnHtml = (repeatsOn && dailyElig.length > 0)
      ? '<button class="btn-quick-clear" data-action="enter-dailies">🔁 Complete the dailies (' + dailyElig.length + ')</button>'
      : '';


    var repeatPillHtml = "";
    var normalControlsHtml = "";
    if (repeatsOn) {
      var repeatLabel = draftRepeat === "daily" ? "🔁 Daily" : draftRepeat === "weekly" ? "🔁 Weekly" : "🔁 Repeat";
      repeatPillHtml = '<button class="repeat-toggle ' + (draftRepeat ? 'active' : '') + '" data-action="cycle-draft-repeat">' + repeatLabel + '</button>';
    }
    if (!draftRepeat) {
      normalControlsHtml = '<div class="priority-picker"><span class="priority-label">Priority</span>' +
        [1, 2, 3, 4, 5].map(function (p) {
          var active = draftPriority === p;
          var style = active ? ('background:' + PRIORITY_COLORS[p] + ';border-color:' + PRIORITY_COLORS[p]) : '';
          return '<button class="p-dot ' + (active ? 'active' : '') + '" style="' + style + '" data-action="select-draft-priority" data-p="' + p + '">' + p + '</button>';
        }).join('') +
        '</div>' +
        '<button class="quick-toggle ' + (draftQuick ? 'active' : '') + '" data-action="toggle-draft-quick">⚡ Quick</button>';
    }

    return '<div class="date-row">' +
      '<button class="date-pill ' + (planDate === today ? 'active' : '') + '" data-action="set-plan-date" data-date="' + today + '">Today</button>' +
      '<button class="date-pill ' + (planDate === tomorrow ? 'active' : '') + '" data-action="set-plan-date" data-date="' + tomorrow + '">Tomorrow</button>' +
      '<input type="date" id="planDateCustom" class="date-input" value="' + planDate + '" />' +
      '</div>' +
      '<div class="add-box">' +
      '<input id="taskInput" class="task-input" placeholder="Add a task for ' + fmtDate(planDate) + '" value="' + escapeHtml(draftText) + '" />' +
      '<div class="add-row">' +
      normalControlsHtml + repeatPillHtml +
      '<button class="btn-add" data-action="add-task">Add</button>' +
      '</div></div>' +
      (anyTasks && settings.completeFromPlan ? '<p class="swipe-hint">Tap ○ or swipe a task right to complete it.</p>' : '') +
      groupsHtml + repeatingHtml + laterHtml + completedHtml + quickBtnHtml + dailyBtnHtml +
      '<button class="btn-begin" data-action="begin-focus" ' + (elig.length === 0 ? 'disabled' : '') + '>' +
      (elig.length === 0 ? 'Nothing due right now' : 'Begin — ' + elig.length + ' due now') +
      '</button>';
  }

  // The original behaviour: pick a time and the task disappears until then.
  function renderSnoozeTimePanel() {
    var now = Date.now();
    var inHour = now + 60 * 60 * 1000;
    var threeHours = now + 3 * 60 * 60 * 1000;
    var fivePM = new Date(); fivePM.setHours(17, 0, 0, 0);
    var fivePMts = fivePM.getTime() > now ? fivePM.getTime() : fivePM.getTime() + 24 * 60 * 60 * 1000;
    var tmrwMorning = new Date(); tmrwMorning.setDate(tmrwMorning.getDate() + 1); tmrwMorning.setHours(8, 0, 0, 0);

    return '<div class="snooze-panel">' +
      '<div class="snooze-label">Priority when it comes back</div>' +
      priorityDots(snoozePriority, "select-snooze-priority") +
      '<div class="snooze-label">Show it again</div>' +
      '<div class="snooze-options">' +
      '<button class="snooze-opt" data-action="confirm-snooze-at" data-ts="' + inHour + '">In 1 hour</button>' +
      '<button class="snooze-opt" data-action="confirm-snooze-at" data-ts="' + threeHours + '">In 3 hours</button>' +
      '<button class="snooze-opt" data-action="confirm-snooze-at" data-ts="' + fivePMts + '">5pm today</button>' +
      '<button class="snooze-opt" data-action="confirm-snooze-at" data-ts="' + tmrwMorning.getTime() + '">Tomorrow morning</button>' +
      '</div>' +
      '<div class="snooze-custom-row">' +
      '<input type="datetime-local" id="snoozeCustomDT" class="dt-input" />' +
      '<button class="btn-set" data-action="confirm-snooze-at" data-custom="1">Set</button>' +
      '</div>' +
      '<button class="cancel-link" data-action="close-snooze">Cancel</button>' +
      '</div>';
  }

  function renderSnoozePanel() {
    if (settings.snoozeMode === "time") return renderSnoozeTimePanel();
    if (snoozeExhausted) {
      return '<div class="snooze-panel">' +
        '<div class="snooze-label">Nothing else is due.</div>' +
        '<p class="snooze-note">This is the only task left, so there is nothing for it to fall behind. ' +
        'You can call it here and come back to it later.</p>' +
        '<button class="btn-set-wide" data-action="back-to-plan">End focus →</button>' +
        '<button class="cancel-link" data-action="close-snooze">Stay on this task</button>' +
        '</div>';
    }

    var cur = tasks.find(function (t) { return t.id === currentTaskId; });
    var target = cur ? backOfQueueTarget(cur, snoozePriority) : null;
    var note = target === null
      ? 'Nothing else is due right now.'
      : (target !== snoozePriority
          ? 'Nothing else sits at priority ' + snoozePriority + ', so this drops to the back of priority ' + target + '.'
          : 'Goes to the back of priority ' + target + ' — you will see the rest of that list first.');

    return '<div class="snooze-panel">' +
      '<div class="snooze-label">Send it to the back of which list?</div>' +
      priorityDots(snoozePriority, "select-snooze-priority") +
      '<p class="snooze-note">' + note + '</p>' +
      '<button class="btn-set-wide" data-action="confirm-snooze">Send to the back</button>' +
      '<button class="cancel-link" data-action="close-snooze">Cancel</button>' +
      '</div>';
  }

  function renderFocusAddPanel() {
    var current = tasks.find(function (t) { return t.id === currentTaskId; });
    var nowPriority = inheritedPriority();
    var nowNote = 'Straight to the front. Takes priority ' + nowPriority +
      (current ? ', same as the one you are on.' : '.');
    var laterNote = current
      ? 'Keeps you on "' + escapeHtml(current.text) + '" and deals the rest again.'
      : 'Deals the queue again with this in it.';
    return '<div class="snooze-panel add-panel">' +
      '<div class="snooze-label">What just came up?</div>' +
      '<input id="focusAddInput" class="task-input" placeholder="Add a task" value="' + escapeHtml(addText) + '" />' +
      '<button class="btn-set-wide" data-action="add-focus-now">Do this one now</button>' +
      '<p class="snooze-note">' + nowNote + '</p>' +
      '<div class="sync-divider">or</div>' +
      '<div class="snooze-label">Slot it in at priority</div>' +
      priorityDots(addPriority, "select-add-priority") +
      '<button class="btn-secondary" data-action="add-focus-later">Do it later</button>' +
      '<p class="snooze-note last">' + laterNote + '</p>' +
      '<button class="cancel-link" data-action="close-focus-add">Cancel</button>' +
      '</div>';
  }

  function renderFocus() {
    pickCurrentFocus();
    var elig = eligibleTasks();
    var current = tasks.find(function (t) { return t.id === currentTaskId; });
    var backBtn = '<button class="back-link" data-action="back-to-plan">← Back to plan</button>';

    if (!current) {
      var nowT = Date.now();
      var laterList = tasks.filter(function (t) {
        return t.status !== "done" && (t.date > todayStr() || (t.snoozedUntil && t.snoozedUntil > nowT));
      }).sort(function (a, b) { return (a.snoozedUntil || 0) - (b.snoozedUntil || 0); });
      var next = laterList[0];
      return '<div class="center-col">' + backBtn +
        '<div class="card empty-card"><p class="empty-title">Nothing due right now.</p>' +
        (next ? '<p class="empty-sub">Next up: ' + escapeHtml(next.text) + ' — ' +
          (next.snoozedUntil && next.snoozedUntil > nowT ? fmtWhen(next.snoozedUntil) : fmtDate(next.date)) + '</p>' : '') +
        '</div>' +
        (addOpen ? renderFocusAddPanel()
          : '<button class="btn-primary" data-action="back-to-plan">Back to plan</button>' +
            '<button class="subtask-link" data-action="open-focus-add">+ Something just came up</button>') +
        '</div>';
    }

    if (inSubtaskMode) return renderSubtaskFocus(current, backBtn);

    var remainingBehind = Math.max(0, elig.length - 1);
    var stackLayers = Math.min(remainingBehind, 3);
    var stackHtml = "";
    for (var i = 0; i < stackLayers; i++) {
      stackHtml += '<div class="stack-layer" style="top:' + (-(i + 1) * 7) + 'px;left:' + ((i + 1) * 6) + 'px;right:' + (-(i + 1) * 6) + 'px;background:' + (i === stackLayers - 1 ? 'var(--paper-dim2)' : 'var(--paper-dim1)') + ';z-index:' + (-1 - i) + '"></div>';
    }

    var pending = pendingSubtasks(current);
    var subtaskBtnHtml = pending.length > 0
      ? '<button class="subtask-link" data-action="enter-subtask-mode">↳ Work on a step instead (' + pending.length + ')</button>'
      : '';

    var actionsHtml = snoozeOpen ? renderSnoozePanel()
      : addOpen ? renderFocusAddPanel()
      : '<button class="btn-primary" data-action="mark-done">Done — next one</button>' +
        '<button class="btn-secondary" data-action="open-snooze">Not now</button>' +
        subtaskBtnHtml +
        '<button class="subtask-link" data-action="open-focus-add">+ Something just came up</button>';

    var hasNotesOrSubs = (current.notes && current.notes.trim()) || (current.subtasks && current.subtasks.length > 0);

    return '<div class="center-col">' + backBtn +
      '<div class="stack-wrap">' + stackHtml +
      '<div class="card focus-card">' +
      '<button class="notes-corner ' + (hasNotesOrSubs ? 'lit' : '') + '" data-action="open-notes" data-id="' + current.id + '" title="Notes">🗒</button>' +
      '<span class="priority-tag" style="color:' + PRIORITY_COLORS[current.priority] + '">Priority ' + current.priority + '</span>' +
      '<p class="task-display">' + escapeHtml(current.text) + '</p>' +
      (pending.length > 0 ? '<p class="steps-hint">' + pending.length + (pending.length === 1 ? ' step inside' : ' steps inside') + '</p>' : '') +
      '</div></div>' +
      '<div class="due-count">' + elig.length + ' due now</div>' +
      actionsHtml + '</div>';
  }

  function renderSubtaskFocus(parent, backBtn) {
    var pending = pendingSubtasks(parent);

    if (subtaskJustDone) {
      var allClear = pending.length === 0;
      return '<div class="center-col">' + backBtn +
        '<div class="card empty-card">' +
        '<p class="empty-title">Step done.</p>' +
        (allClear ? '<p class="empty-sub">That was the last step for this one.</p>' : '<p class="empty-sub">' + pending.length + (pending.length === 1 ? ' step left.' : ' steps left.') + '</p>') +
        '</div>' +
        (pending.length > 0 ? '<button class="btn-primary" data-action="next-subtask">Next step →</button>' : '') +
        (allClear ? '<button class="btn-primary" data-action="mark-parent-from-subtasks">Mark "' + escapeHtml(parent.text) + '" done too →</button>' : '') +
        '<button class="btn-secondary" data-action="back-to-main-task">Back to main tasks →</button>' +
        '</div>';
    }

    var sub = (parent.subtasks || []).find(function (s) { return s.id === currentSubtaskId; });
    if (!sub) {
      inSubtaskMode = false;
      currentSubtaskId = null;
      return '<div class="center-col">' + backBtn +
        '<div class="card empty-card"><p class="empty-title">That step is gone.</p></div>' +
        '<button class="btn-primary" data-action="back-to-main-task">Back to main task</button></div>';
    }

    return '<div class="center-col">' + backBtn +
      '<div class="breadcrumb">Within: ' + escapeHtml(parent.text) + '</div>' +
      '<div class="card subtask-card">' +
      (sub.quick ? '<span class="quick-tag">⚡ Quick step</span>' : '<span class="priority-tag" style="color:' + PRIORITY_COLORS[sub.priority] + '">Priority ' + sub.priority + '</span>') +
      '<p class="task-display small">' + escapeHtml(sub.text) + '</p>' +
      '</div>' +
      '<button class="btn-primary" data-action="subtask-done">Done — this step</button>' +
      '<button class="btn-secondary" data-action="back-to-main-task">← Back to main task</button>' +
      '</div>';
  }

  function renderQuick() {
    var current = tasks.find(function (t) { return t.id === quickQueue[0]; });
    var backBtn = '<button class="back-link" data-action="back-to-plan">← Back to plan</button>';
    if (!current) {
      return '<div class="center-col"><div class="card empty-card"><p class="empty-title">Small stuff cleared.</p></div>' +
        '<button class="btn-primary" data-action="back-to-plan">Back to plan</button></div>';
    }
    return '<div class="center-col">' + backBtn +
      '<div class="card quick-card"><span class="quick-tag">⚡ Quick</span>' +
      '<p class="task-display small">' + escapeHtml(current.text) + '</p></div>' +
      '<div class="due-count">' + quickQueue.length + ' left in this sweep</div>' +
      '<button class="btn-primary" data-action="quick-done">Done — next one</button>' +
      '<button class="btn-secondary" data-action="quick-skip" ' + (quickQueue.length <= 1 ? 'disabled' : '') + '>Not now — send to the back</button>' +
      '</div>';
  }

  function renderDailies() {
    var current = tasks.find(function (t) { return t.id === dailyQueue[0]; });
    var backBtn = '<button class="back-link" data-action="back-to-plan">← Back to plan</button>';
    if (!current) {
      return '<div class="center-col"><div class="card empty-card"><p class="empty-title">Dailies cleared for today.</p></div>' +
        '<button class="btn-primary" data-action="back-to-plan">Back to plan</button></div>';
    }
    var label = current.repeat === "daily" ? "🔁 Daily" : "🔁 Weekly";
    return '<div class="center-col">' + backBtn +
      '<div class="card quick-card"><span class="quick-tag">' + label + '</span>' +
      '<p class="task-display small">' + escapeHtml(current.text) + '</p></div>' +
      '<div class="due-count">' + dailyQueue.length + ' left in this sweep</div>' +
      '<button class="btn-primary" data-action="daily-done">Done — next one</button>' +
      '<button class="btn-secondary" data-action="daily-skip" ' + (dailyQueue.length <= 1 ? 'disabled' : '') + '>Not now — send to the back</button>' +
      '</div>';
  }

  function reflectionLine(count) {
    if (count === 0) return "A quiet one — that's alright too.";
    if (count <= 2) return "A couple of things off your plate.";
    if (count <= 5) return "Nice work today.";
    if (count <= 9) return "That's a proper day's work.";
    return "That's a lot cleared today — well done.";
  }

  // Shown once on the first open of a new day: what you finished yesterday,
  // and what rolled forward automatically overnight.
  function renderRecap() {
    var yesterday = addDaysStr(-1);
    var doneYesterday = completionsOn(yesterday).filter(function (c) { return c.type !== "step"; });
    var stepsYesterday = completionsOn(yesterday).filter(function (c) { return c.type === "step"; });
    var carried = rolledOverToday();

    var listHtml = doneYesterday.length > 0
      ? '<ul class="wrap-list">' + doneYesterday.map(function (t) {
          return '<li class="wrap-list-item"><span class="wrap-check">✓</span><span class="wrap-strike">' + escapeHtml(t.text) + '</span></li>';
        }).join('') + '</ul>'
      : '';

    var stepsHtml = "";
    if (stepsYesterday.length > 0) {
      stepsHtml = '<div class="steps-wrap-box">' +
        '<div class="steps-wrap-header">🔹 ' + stepsYesterday.length + (stepsYesterday.length === 1 ? ' step chipped away' : ' steps chipped away') + '</div>' +
        '<ul class="wrap-list steps">' + stepsYesterday.map(function (c) {
          return '<li class="wrap-list-item"><span class="wrap-check">✓</span>' +
            '<span class="wrap-step-text-wrap"><span class="wrap-strike">' + escapeHtml(c.text) + '</span>' +
            (c.parentText ? '<span class="wrap-step-parent">within ' + escapeHtml(c.parentText) + '</span>' : '') +
            '</span></li>';
        }).join('') + '</ul>' +
        '</div>';
    }

    var carriedHtml = "";
    if (carried.length > 0) {
      carriedHtml = '<div class="moving-box rolled">' +
        '<div class="moving-label">Carried over to today (' + carried.length + ')</div>' +
        carried.map(function (t) {
          return '<div class="moving-row"><span class="moving-dot" style="background:' + PRIORITY_COLORS[t.priority] + '"></span>' +
            '<span class="moving-text">' + escapeHtml(t.text) + '</span></div>';
        }).join('') + '</div>';
    }

    return '<div class="center-col">' +
      '<div class="recap-kicker">Yesterday — ' + fmtDate(yesterday) + '</div>' +
      '<div class="card wrap-card">' +
      '<div class="wrap-stat-block">' +
      '<div class="wrap-stat-num">' + doneYesterday.length + '</div>' +
      '<div class="wrap-stat-label">' + (doneYesterday.length === 1 ? "task done yesterday" : "tasks done yesterday") + '</div>' +
      '<div class="wrap-reflection">' + reflectionLine(doneYesterday.length) + '</div>' +
      '</div>' + listHtml +
      '</div>' +
      stepsHtml +
      carriedHtml +
      '<button class="btn-primary" data-action="dismiss-recap">Start today →</button>' +
      '</div>';
  }

  function renderSubtaskRow(parentId, s) {
    var done = s.status === "done";
    return '<div class="subtask-row ' + (done ? 'done' : '') + '">' +
      '<button class="subtask-check" data-action="toggle-subtask" data-parent="' + parentId + '" data-id="' + s.id + '">' + (done ? '✓' : '○') + '</button>' +
      '<span class="subtask-text ' + (done ? 'strike' : '') + '">' + escapeHtml(s.text) + '</span>' +
      (!done ? priorityDotsSub(s.priority, parentId, s.id) : '') +
      (!done ? '<button class="icon-btn ' + (s.quick ? 'lit' : '') + '" data-action="toggle-subtask-quick" data-parent="' + parentId + '" data-id="' + s.id + '" title="Under a few minutes">⚡</button>' : '') +
      '<button class="icon-btn danger" data-action="remove-subtask" data-parent="' + parentId + '" data-id="' + s.id + '">×</button>' +
      '</div>';
  }

  function priorityDotsSub(selected, parentId, subId) {
    var out = '<div class="priority-picker sub">';
    for (var p = 1; p <= 5; p++) {
      var active = selected === p;
      var style = active ? ('background:' + PRIORITY_COLORS[p] + ';border-color:' + PRIORITY_COLORS[p]) : '';
      out += '<button class="p-dot mini ' + (active ? 'active' : '') + '" style="' + style + '" data-action="set-subtask-priority" data-parent="' + parentId + '" data-id="' + subId + '" data-p="' + p + '">' + p + '</button>';
    }
    out += '</div>';
    return out;
  }

  function renderNotesOverlay() {
    var task = tasks.find(function (t) { return t.id === notesTaskId; });
    if (!task) return '';
    var subs = task.subtasks || [];
    var pending = subs.filter(function (s) { return s.status !== "done"; });
    var done = subs.filter(function (s) { return s.status === "done"; });

    var subtasksHtml = '<div class="subtasks-section">' +
      '<div class="subtasks-label">Steps' + (subs.length > 0 ? ' (' + pending.length + ' left)' : '') + '</div>' +
      (pending.length + done.length > 0 ? '<div class="subtasks-list">' + pending.map(function (s) { return renderSubtaskRow(task.id, s); }).join('') + done.map(function (s) { return renderSubtaskRow(task.id, s); }).join('') + '</div>' : '') +
      '<div class="add-subtask-row">' +
      '<input id="subtaskInput" class="subtask-input" placeholder="Add a smaller step" value="' + escapeHtml(draftSubtaskText) + '" />' +
      priorityDotsDraftSub() +
      '<button class="quick-toggle ' + (draftSubtaskQuick ? 'active' : '') + '" data-action="toggle-draft-subtask-quick">⚡</button>' +
      '<button class="btn-add" data-action="add-subtask">Add</button>' +
      '</div></div>';

    return '<div class="overlay"><div class="overlay-inner">' +
      '<div class="overlay-header"><div><div class="overlay-kicker">Notes</div>' +
      '<div class="overlay-title">' + escapeHtml(task.text) + '</div></div>' +
      '<button class="close-circle" data-action="close-notes">×</button></div>' +
      subtasksHtml +
      '<textarea id="notesTextarea" data-id="' + task.id + '" class="notes-textarea" placeholder="Anything worth jotting down for this one — links, context, next steps…">' + escapeHtml(task.notes || "") + '</textarea>' +
      '<button class="btn-primary" data-action="close-notes">Done</button>' +
      '</div></div>';
  }

  function priorityDotsDraftSub() {
    var out = '<div class="priority-picker sub">';
    for (var p = 1; p <= 5; p++) {
      var active = draftSubtaskPriority === p;
      var style = active ? ('background:' + PRIORITY_COLORS[p] + ';border-color:' + PRIORITY_COLORS[p]) : '';
      out += '<button class="p-dot mini ' + (active ? 'active' : '') + '" style="' + style + '" data-action="select-draft-subtask-priority" data-p="' + p + '">' + p + '</button>';
    }
    out += '</div>';
    return out;
  }

  function switchRow(name, desc, key) {
    var on = !!settings[key];
    return '<div class="setting-row">' +
      '<div class="setting-text"><div class="setting-name">' + name + '</div>' +
      '<div class="setting-desc">' + desc + '</div></div>' +
      '<button class="switch ' + (on ? 'on' : '') + '" data-action="toggle-setting" data-key="' + key + '" ' +
      'role="switch" aria-checked="' + on + '" aria-label="' + name + '"><span class="knob"></span></button>' +
      '</div>';
  }

  function renderMenuRoot() {
    var themeName = (THEMES.filter(function (t) { return t.id === settings.theme; })[0] || THEMES[2]).name;
    return '<div class="menu-section-label">Viewing</div>' +
      '<div class="segmented">' +
      '<button class="' + (profile === "work" ? "active" : "") + '" data-action="switch-profile" data-profile="work">Work</button>' +
      '<button class="' + (profile === "personal" ? "active" : "") + '" data-action="switch-profile" data-profile="personal">Personal</button>' +
      '</div>' +
      '<div class="menu-divider"></div>' +
      '<div class="menu-section-label">' + (profile === "work" ? "Work" : "Personal") + ' settings</div>' +
      '<div class="menu-list">' +
      menuItem("Task settings", "What this view can do", "tasks") +
      menuItem("Appearance", themeName, "appearance") +
      '</div>' +
      '<div class="menu-divider"></div>' +
      '<div class="menu-section-label">This device</div>' +
      '<div class="menu-list">' +
      menuItem("Notifications", notifySummary(), "notifications") +
      menuItem("Sync between devices", syncCode ? "Linked — code " + syncCode : "Not set up", "sync") +
      menuItem("Copy or move your data", "Move everything to another device", "data") +
      '</div>' +
      '<div class="menu-divider"></div>' +
      '<div class="menu-list">' +
      menuItem("How this works", "A quick tour of the app", "tutorial") +
      '</div>';
  }

  function notifySummary() {
    if (pushBlockedReason() === "needs-install") return "Add to Home Screen first";
    if (pushBlockedReason() === "needs-sync") return "Needs sync set up";
    if (!push.enabled) return "Off";
    var on = NOTIFY_TYPES.filter(function (t) { return push.types[t.id]; }).length;
    return on === 0 ? "On, none selected" : on + (on === 1 ? " type" : " types") + " on";
  }

  function menuItem(label, sub, page) {
    return '<button class="menu-item" data-action="menu-page" data-page="' + page + '">' +
      '<span class="menu-item-label"><span>' + label + '</span><span class="menu-sub">' + escapeHtml(sub) + '</span></span>' +
      '<span class="chev">›</span></button>';
  }

  function renderMenuTasks() {
    var scope = profile === "work" ? "work" : "personal";
    return '<p class="sync-desc">These apply to your <strong>' + scope + '</strong> list only. ' +
      'The other one keeps its own settings.</p>' +
      '<div style="margin-top:18px">' +
      switchRow("Repeating tasks", "Adds a repeat option when creating a task, and a sweep for knocking out the day’s repeats.", "repeats") +
      switchRow("Complete from the plan", "Tap the circle or swipe a task right to finish it without entering focus.", "completeFromPlan") +
      switchRow("Fold priorities away", "Show each priority as a drawer you open, instead of every task at once. Keeps the plan short.", "groupedPlan") +
      switchRow("Start today page", "The morning summary of yesterday. Tasks roll over to the next day either way — this only decides whether you see the page.", "morningRecap") +
      '</div>' +
      '<div class="menu-divider"></div>' +
      '<div class="menu-section-label">When you tap “Not now”</div>' +
      '<div class="segmented">' +

      '</div>' +

  /* The whole path to working notifications, with your position on it marked.
     Showing every step at every stage means you always know how much is left,
     rather than clearing one hurdle only to be shown another. */
  function setupChecklist(reason) {
    var steps = [];
    if (isIOS()) {
      steps.push({
        name: "Add Only This to your Home Screen",
        note: "Tap the Share button in Safari, choose <strong>Add to Home Screen</strong>, then open the app from the new icon. Safari will not allow notifications in an ordinary tab.",
        done: isStandalone(),
      });
    }
    steps.push({
      name: "Turn on sync",
      note: "The reminders are put together on the server, so it needs to be able to see your list.",
      done: !!syncCode,
    });
    steps.push({
      name: "Allow notifications",
      note: "Your phone will ask for permission. You then choose which reminders you actually want.",
      done: !!push.enabled && reason !== "denied",
    });

    var firstOpen = -1;
    for (var i = 0; i < steps.length; i++) { if (!steps[i].done) { firstOpen = i; break; } }

    return '<ol class="setup-steps">' + steps.map(function (s, i) {
      var state = s.done ? "done" : (i === firstOpen ? "current" : "");
      return '<li class="setup-step ' + state + '">' +
        '<span class="step-mark">' + (s.done ? "✓" : (i + 1)) + '</span>' +
        '<span class="step-body"><span class="step-name">' + s.name + '</span>' +
        (state === "current" ? '<span class="step-note">' + s.note + '</span>' : '') +
        '</span></li>';
    }).join('') + '</ol>';
  }

  function renderMenuData() {
    var mine = describeData(buildExport());
    var payload = exportString();
    var size = Math.max(1, Math.round(payload.length / 1024));

    var out =
      '<p class="sync-desc">A plain-text copy of everything. Useful for moving to the Home Screen app ' +
      'on an iPhone, which keeps its own separate storage from Safari.</p>';

    if (importDone) {
      out += '<div class="tut-note" style="border:1px solid var(--sage)"><strong>Data loaded.</strong> ' +
        'Everything from the other device is now here.</div>';
    }

    out += '<div class="menu-section-label" style="margin-left:2px">Copy from this device</div>' +
      '<div class="data-summary">' + mine.tasks + (mine.tasks === 1 ? ' open task' : ' open tasks') +
      ' · ' + mine.done + ' completed · ' + size + 'KB</div>' +
      '<textarea id="exportBox" class="data-box" readonly onclick="this.select()">' + escapeHtml(payload) + '</textarea>' +
      '<button class="btn-primary" data-action="copy-data">' + (exportCopied ? '✓ Copied' : 'Copy to clipboard') + '</button>' +
      (exportError
        ? '<p class="sync-desc" style="margin-top:10px">Your browser would not copy it automatically. ' +
          'The text above is selected — press and hold, then choose Copy.</p>'
        : '') +
      '<div class="menu-divider"></div>';

    out += '<div class="menu-section-label" style="margin-left:2px">Paste from another device</div>';

    if (importPreview) {
      var it = describeData(importPreview);
      out += '<div class="tut-note"><strong>Ready to load.</strong><br>' +
        it.tasks + (it.tasks === 1 ? ' open task' : ' open tasks') + ' · ' + it.done + ' completed · ' +
        'lists: ' + it.lists +
        (it.hasSettings ? '<br>Settings and colours included.' : '') +
        (it.syncCode ? '<br>Sync code ' + escapeHtml(it.syncCode) + ' will be used here too.' : '') +
        '</div>' +
        '<p class="sync-warning">This replaces everything currently on this device. There is no undo, ' +
        'so make sure you have copied this device\'s data first if it has anything worth keeping.</p>' +
        '<button class="btn-primary" data-action="apply-import">Replace my data</button>' +
        '<button class="btn-secondary" data-action="cancel-import">Cancel</button>';
    } else {
      out += '<textarea id="importBox" class="data-box" placeholder="Paste the copied text here">' +
        escapeHtml(importText) + '</textarea>' +
        '<button class="btn-secondary" data-action="check-import">Check this data</button>' +
        (importError === "empty" ? '<p class="sync-warning">Nothing pasted yet.</p>' : '') +
        (importError === "invalid" ? '<p class="sync-warning">That does not look like Only This data. ' +
          'Make sure you copied the whole thing, from the first character to the last.</p>' : '') +
        (importError === "version" ? '<p class="sync-warning">That copy came from a different version of the app. ' +
          'Update both devices to the same version and copy it again.</p>' : '');
    }

    out += '<div class="tut-note">Prefer it automatic? <strong>Sync between devices</strong> keeps two devices ' +
      'in step continuously, rather than copying across once.</div>';
    return out;
  }

  function renderMenuNotifications() {
    var reason = pushBlockedReason();

    var intro = '<p class="sync-desc">Short, factual nudges — never more than one of each per day, ' +
      'and nothing at all on a day with nothing to say.</p>';

    // A browser that simply cannot do this. Nothing to work towards, so no checklist.
    if (reason === "unsupported") {
      return intro +
        '<div class="tut-note" style="margin-top:16px"><strong>Not available in this browser.</strong><br>' +
        'Notifications need to be set up on your phone. On an iPhone, open the site in ' +
        '<strong>Safari</strong>, add it to your Home Screen, then come back to this page.</div>';
    }

    // Everything else is a step on the same path, so show the whole path.
    var body = intro + setupChecklist(reason);

    if (reason === "needs-install") {
      return body + '<div class="tut-note">Once the app is on your Home Screen, open it from there and ' +
        'come back to this page to finish.</div>';
    }
    if (reason === "needs-sync") {
      return body +
        '<button class="btn-primary" data-action="menu-page" data-page="sync">Set up sync</button>' +
        '<div class="tut-note">Generate a code, then come straight back here.</div>';
    }
    if (reason === "denied") {
      return body +
        '<div class="tut-note"><strong>Permission was turned down.</strong><br>' +
        'Allow it again under Settings → Notifications → Only This on your phone, then reopen this page.</div>';
    }

    if (!push.enabled) {
      return body +
        '<button class="btn-primary" data-action="enable-notifications" ' +
        (pushBusy ? 'disabled' : '') + '>' + (pushBusy ? 'Setting up…' : 'Allow notifications') + '</button>' +
        (pushError === "failed" ? '<p class="sync-warning" style="margin-top:12px">That did not work. Check you are online and try again.</p>' : '') +
        (pushError === "denied" ? '<p class="sync-warning" style="margin-top:12px">Permission was declined. You can allow it later in your phone\'s settings.</p>' : '') +
        '<div class="tut-note">Nothing is sent until you pick which reminders you want, on the next screen.</div>';
    }

    var rows = NOTIFY_TYPES.map(function (t) {
      var on = !!push.types[t.id];
      return '<div class="setting-row">' +
        '<div class="setting-text"><div class="setting-name">' + t.label +
        ' <span class="notify-at">' + t.at + '</span></div>' +
        '<div class="setting-desc">' + t.blurb + '</div></div>' +
        '<button class="switch ' + (on ? 'on' : '') + '" data-action="toggle-notify" data-key="' + t.id + '" ' +
        'role="switch" aria-checked="' + on + '" aria-label="' + t.label + '"><span class="knob"></span></button>' +
        '</div>';
    }).join('');

    return '<p class="sync-desc">Notifications are on for this device. Pick the ones you want.</p>' +
      '<div style="margin-top:18px">' + rows + '</div>' +
      '<div class="menu-divider"></div>' +
      '<div class="menu-section-label">Which list to include</div>' +
      '<div class="segmented">' +
      ["both", "work", "personal"].map(function (w) {
        var label = w === "both" ? "Both" : w === "work" ? "Work" : "Personal";
        return '<button class="' + (push.lists === w ? "active" : "") + '" data-action="set-notify-lists" data-mode="' + w + '">' + label + '</button>';
      }).join('') +
      '</div>' +
      '<div class="menu-divider"></div>' +
      '<button class="btn-secondary" data-action="disable-notifications">Turn notifications off</button>';
  }

  function renderMenuAppearance() {
    return '<p class="sync-desc">Only the colours change. Your <strong>' + (profile === "work" ? "work" : "personal") +
      '</strong> list keeps this scheme; the other one keeps its own.</p>' +
      '<div class="theme-grid" style="margin-top:18px">' +
      THEMES.map(function (t) {
        var active = settings.theme === t.id;
        return '<button class="theme-option ' + (active ? 'active' : '') + '" data-action="set-theme" data-theme="' + t.id + '">' +
          '<span class="theme-swatch" data-theme="' + t.id + '">' +
          '<i style="background:var(--bg)"></i><i style="background:var(--paper)"></i>' +
          '<i style="background:var(--p1)"></i><i style="background:var(--p3)"></i><i style="background:var(--p5)"></i>' +
          '</span>' +
          '<span><span class="theme-name">' + t.name + '</span><span class="theme-note">' + t.note + '</span></span>' +
          (active ? '<span class="theme-tick">✓</span>' : '') +
          '</button>';
      }).join('') +
      '</div>';
  }

  function renderMenuTutorial() {
    var s = function (icon, title, paras) {
      return '<div class="tut-section"><h3 class="tut-h">' + icon + ' ' + title + '</h3>' +
        paras.map(function (p) { return '<p class="tut-p">' + p + '</p>'; }).join('') + '</div>';
    };
    return '<div class="tut-intro">' +
      '<p class="tut-p">The whole idea: you decide what matters once, then the app shows you ' +
      '<strong>one task at a time</strong> so you never have to look at the whole pile.</p></div>' +
      '<div class="menu-divider"></div>' +
      s("📝", "1. Plan the day", [
        "Type a task, give it a priority from <strong>1 to 5</strong>, and press Add. 1 is the most important, 5 the least.",
        "Tag anything that takes under a few minutes with <strong>⚡ Quick</strong>. The 🗒 button holds notes and lets you break a task into smaller steps.",
      ]) +
      s("🎯", "2. Press Begin", [
        "Focus mode shows a single task on a card and hides everything else. It always serves priority 1 tasks before priority 2, and so on — but which one it picks inside a priority is a fresh shuffle each time, so it never feels like the same list.",
        "<strong>Done</strong> completes it and deals the next. <strong>Not now</strong> pushes it aside — by default to the back of a priority list, so you get through everything else first.",
      ]) +
      s("➕", "3. When something crops up", [
        "In focus, <strong>+ Something just came up</strong> lets you add a task without losing your place. <em>Do this one now</em> puts it at the very front. <em>Do it later</em> keeps you on what you were doing and deals it into the queue.",
      ]) +
      s("✓", "4. Ticking things off", [
        "You don’t have to be in focus mode. On the plan, tap the circle next to a task or swipe it to the right, and it swoops into the <strong>Completed</strong> drawer at the bottom.",
        "⚡ <strong>Clear the small stuff</strong> runs a fast sweep through everything you tagged as quick.",
      ]) +
      s("🌙", "5. The day turns at 1am", [
        "Anything unfinished moves to the next day on its own — nothing is ever lost or needs tidying up at bedtime. Work you do after midnight still counts towards the day you were in.",
        "Next morning you get a short summary of what you finished and what carried over. You can turn that page off in Task settings; the rollover happens either way.",
      ]) +
      s("🔀", "6. Two separate lists", [
        "<strong>Work</strong> and <strong>Personal</strong> are completely independent — separate tasks, separate settings, separate colours. Switch between them at the top of this menu.",
      ]) +
      s("🔄", "7. Using more than one device", [
        "Open <strong>Sync between devices</strong>, generate a code, then enter that same code on your phone or laptop. Both then share the same lists from that point on.",
        "To move everything across once — for instance into the Home Screen app on an iPhone, which keeps its own separate storage — use <strong>Copy or move your data</strong> instead.",
      ]) +
      '<div class="tut-note">Nothing here is permanent. Every setting is in this menu, and you can change any of it whenever you like.</div>';
  }

  function renderMenuSync() {
    var body;
    if (syncCode) {
      body = '<div class="sync-code-display">' + syncCode + '</div>' +
        '<p class="sync-desc">Enter this exact code on your other device to link it to this same task list.</p>' +
        '<button class="btn-primary" data-action="sync-now">Sync now</button>' +
        '<div class="sync-status-line">' + syncStatusLabel() + '</div>' +
        '<button class="btn-secondary" data-action="unlink-sync">Unlink this device</button>';
    } else {
      body = '<p class="sync-desc">Link this device to another so your tasks stay the same on both. First time setting this up? Generate a code here, then enter that same code on your other device.</p>' +
        '<button class="btn-primary" data-action="start-new-sync">Generate a new code</button>' +
        '<div class="sync-divider">or</div>' +
        '<input id="syncCodeInput" class="task-input" placeholder="Enter a code from your other device" value="' + escapeHtml(syncCodeDraft) + '" style="text-transform:uppercase" />' +
        '<button class="btn-secondary" data-action="connect-sync-code">Connect</button>' +
        '<p class="sync-warning">Connecting to an existing code replaces this device\'s tasks with whatever is already synced under that code — best done before adding much here.</p>';
    }
    return '<div class="sync-body">' + body + '</div>';
