<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Only This</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Only This" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#181C19" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --ink: #242821;
    --paper: #F2EEE3;
    --paper-dim1: #DFDAC8;
    --paper-dim2: #CBC4AC;
    --bg: #181C19;
    --sage: #7E9A82;
    --amber: #CE9B4C;
    --rust: #B0644A;
    --p1: #B0644A;
    --p2: #C4834B;
    --p3: #CE9B4C;
    --p4: #93A67E;
    --p5: #7E9A82;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    font-family: 'Inter', sans-serif;
    color: var(--paper);
    min-height: 100vh;
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom);
  }
  #app {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(20px, env(safe-area-inset-top)) 20px 40px;
  }
  .wrap { width: 100%; max-width: 540px; }

  .header { margin-bottom: 32px; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .header-slot { flex: 0 0 auto; min-width: 60px; display: flex; align-items: center; }
  .header-slot.right { justify-content: flex-end; }
  .header-center { flex: 1; text-align: center; }
  .profile-btn {
    background: transparent; border: 1px solid rgba(203,196,172,0.33); color: var(--paper-dim2);
    border-radius: 8px; padding: 6px 11px; font-size: 0.74rem; cursor: pointer; white-space: nowrap;
  }
  .logo { font-family: 'Fraunces', serif; font-weight: 500; font-size: 1.7rem; letter-spacing: -0.01em; color: var(--paper); }
  .subtitle { font-size: 0.8rem; color: var(--paper-dim2); margin-top: 4px; letter-spacing: 0.02em; }

  button { font-family: 'Inter', sans-serif; }
  input, textarea { font-family: 'Inter', sans-serif; }

  /* Plan view */
  .date-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .date-pill {
    background: transparent; color: var(--paper-dim2);
    border: 1px solid rgba(203,196,172,0.33); border-radius: 8px;
    padding: 7px 14px; font-size: 0.82rem; cursor: pointer;
  }
  .date-pill.active { background: var(--paper); color: var(--ink); font-weight: 600; border-color: var(--paper); }
  .date-input {
    background: transparent; color: var(--paper-dim2);
    border: 1px solid rgba(203,196,172,0.33); border-radius: 8px;
    padding: 6px 10px; font-size: 0.8rem;
  }

  .add-box { background: rgba(242,238,227,0.05); border-radius: 12px; padding: 14px; margin-bottom: 20px; }
  .task-input {
    width: 100%; background: var(--paper); color: var(--ink); border: none;
    border-radius: 10px; padding: 12px 14px; font-size: 0.92rem; outline: none; margin-bottom: 10px;
  }
  .add-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .priority-picker { display: flex; align-items: center; gap: 6px; }
  .priority-label { font-size: 0.75rem; color: var(--paper-dim2); margin-right: 4px; }
  .p-dot {
    width: 32px; height: 32px; border-radius: 50%;
    border: 1px solid rgba(203,196,172,0.4); background: transparent;
    color: var(--paper-dim2); font-weight: 700; font-size: 0.8rem; cursor: pointer;
  }
  .p-dot.active { color: #1B1F1D; }
  .quick-toggle {
    background: transparent; border: 1px solid rgba(203,196,172,0.4); color: var(--paper-dim2);
    border-radius: 8px; padding: 6px 10px; font-size: 0.78rem; cursor: pointer;
  }
  .quick-toggle.active { background: var(--amber); border-color: var(--amber); color: #211705; font-weight: 600; }
  .repeat-toggle {
    background: transparent; border: 1px solid rgba(203,196,172,0.4); color: var(--paper-dim2);
    border-radius: 8px; padding: 6px 10px; font-size: 0.78rem; cursor: pointer;
  }
  .repeat-toggle.active { background: var(--p4); border-color: var(--p4); color: #132016; font-weight: 600; }
  .repeat-tag {
    background: transparent; border: 1px solid rgba(203,196,172,0.4); color: var(--paper-dim2);
    border-radius: 8px; padding: 4px 9px; font-size: 0.72rem; cursor: pointer; white-space: nowrap; flex-shrink: 0;
  }
  .btn-add {
    background: var(--sage); color: #182019; border: none; border-radius: 10px;
    padding: 9px 20px; font-weight: 600; font-size: 0.85rem; cursor: pointer;
  }

  .group { margin-bottom: 14px; }
  .group-label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; margin-bottom: 6px; text-transform: uppercase; }

  .task-row {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid rgba(203,196,172,0.18); border-radius: 10px;
    padding: 9px 12px; margin-bottom: 6px;
    background: var(--bg);
    position: relative;
    touch-action: pan-y;
    will-change: transform;
  }
  .task-row.swipe-armed { border-color: var(--sage); background: rgba(126,154,130,0.2); }

  /* Completion flourish — the check fills and pops, a ring rides out from it,
     a few sparks scatter, then the row strikes through and slips away. */
  @keyframes ot-pop { 0% { transform: scale(1); } 45% { transform: scale(1.32); } 100% { transform: scale(1); } }
  @keyframes ot-ring { 0% { transform: scale(0.5); opacity: 0.55; } 100% { transform: scale(2.7); opacity: 0; } }
  @keyframes ot-spark {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx, 0), var(--dy, 0)) scale(0.25); opacity: 0; }
  }
  .task-row.completing { border-color: var(--sage); background: rgba(126,154,130,0.22); }
  .task-row.completing .task-text { color: rgba(242,238,227,0.55); text-decoration: line-through; }
  .task-row.completing .task-check {
    background: var(--sage); border-color: var(--sage); color: #132016;
    animation: ot-pop 0.36s cubic-bezier(0.3, 1.4, 0.5, 1) both;
    font-size: 0;
  }
  .task-row.completing .task-check::after { content: "✓"; font-size: 0.78rem; font-weight: 700; }
  .task-row.leaving { transform: translateX(14%); opacity: 0; transition: transform 0.2s ease, opacity 0.2s ease; }
  /* The ghost that swoops from the row down into the Completed drawer. */
  .fly-task {
    position: fixed; z-index: 80; pointer-events: none;
    background: var(--sage); color: #132016;
    border-radius: 10px; padding: 8px 12px;
    font-family: 'Inter', sans-serif; font-size: 0.84rem; font-weight: 600;
    box-shadow: 0 12px 26px rgba(0,0,0,0.4);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: transform 0.52s cubic-bezier(0.45, 0, 0.25, 1), opacity 0.52s ease;
  }
  .burst { position: absolute; left: 24px; top: 50%; width: 0; height: 0; pointer-events: none; }
  .burst-ring {
    position: absolute; left: -11px; top: -11px; width: 22px; height: 22px;
    border-radius: 50%; border: 2px solid var(--sage);
    animation: ot-ring 0.42s ease-out forwards;
  }
  .burst .spark {
    position: absolute; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px;
    border-radius: 50%; animation: ot-spark 0.38s ease-out forwards;
  }
  @media (prefers-reduced-motion: reduce) {
    .task-row.completing .task-check { animation: none; }
    .burst { display: none; }
    .task-row.leaving { transition: none; }
    .fly-task { display: none; }
    .done-count.bump { animation: none; }
  }
  .task-check {
    background: transparent; border: 1px solid rgba(203,196,172,0.4); color: var(--sage);
    border-radius: 50%; width: 24px; height: 24px; flex-shrink: 0; cursor: pointer; font-size: 0.8rem;
    display: flex; align-items: center; justify-content: center; padding: 0; line-height: 1;
  }
  .task-check:hover { border-color: var(--sage); background: rgba(126,154,130,0.16); }
  .swipe-hint { font-size: 0.7rem; color: rgba(203,196,172,0.45); margin: 0 0 10px 2px; }
  .task-text { flex: 1; font-size: 0.9rem; word-break: break-word; }
  .icon-btn { background: transparent; border: none; cursor: pointer; font-size: 0.85rem; padding: 0 2px; opacity: 0.25; }
  .icon-btn.lit { opacity: 1; }
  .icon-btn.danger { color: rgba(176,100,74,0.8); font-size: 1rem; opacity: 1; }
  .p-badge {
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid;
    color: #1B1F1D; font-weight: 700; font-size: 0.72rem; cursor: pointer; flex-shrink: 0;
  }

  .empty-state {
    text-align: center; color: var(--paper-dim2); font-size: 0.86rem; padding: 30px 12px;
    border: 1px dashed rgba(203,196,172,0.33); border-radius: 12px;
  }

  .later-section { margin-top: 8px; margin-bottom: 20px; }
  .later-toggle { background: transparent; border: none; color: var(--paper-dim2); font-size: 0.78rem; cursor: pointer; padding: 0; }
  .later-list { margin-top: 8px; }
  .later-row {
    display: flex; align-items: center; gap: 10px; font-size: 0.82rem; color: var(--paper-dim2);
    padding: 6px 0; border-top: 1px solid rgba(203,196,172,0.13);
  }
  .later-text { flex: 1; }
  .later-text.strike { text-decoration: line-through; opacity: 0.7; }
  .done-check { color: var(--sage); font-size: 0.78rem; }
  .completed-section { margin-top: 0; }
  .done-count { display: inline-block; font-variant-numeric: tabular-nums; }
  @keyframes ot-count-bump {
    0% { transform: scale(1); }
    30% { transform: scale(1.8); color: var(--sage); }
    60% { transform: scale(0.92); }
    100% { transform: scale(1); }
  }
  .done-count.bump { animation: ot-count-bump 0.55s cubic-bezier(0.3, 1.5, 0.5, 1) both; }

  .btn-quick-clear {
    width: 100%; background: transparent; border: 1px solid rgba(206,155,76,0.53); color: var(--amber);
    border-radius: 12px; padding: 12px 0; font-weight: 600; font-size: 0.88rem; cursor: pointer; margin-bottom: 10px;
  }
  .btn-begin, .btn-primary {
    width: 100%; background: var(--amber); color: #211705; border: none; border-radius: 12px;
    padding: 15px 0; font-weight: 600; font-size: 0.98rem; cursor: pointer;
  }
  .btn-begin:disabled { background: rgba(203,196,172,0.2); color: var(--paper-dim2); cursor: not-allowed; }
  .shift-link {
    width: 100%; background: transparent; border: none; color: var(--paper-dim2);
    border-radius: 10px; padding: 12px 0 0 0; font-size: 0.8rem; cursor: pointer;
  }
  .wrap-card { width: 100%; padding: 34px 28px; margin-bottom: 16px; align-items: stretch; }
  .wrap-stat-block { text-align: center; }
  .wrap-stat-num { font-family: 'Fraunces', serif; font-weight: 500; font-size: 2.6rem; color: var(--ink); line-height: 1; }
  .wrap-stat-label { font-size: 0.85rem; color: rgba(36,40,33,0.6); margin-top: 6px; }
  .wrap-reflection { font-family: 'Fraunces', serif; font-size: 1.05rem; color: var(--ink); margin-top: 14px; }
  .wrap-list { list-style: none; padding: 0; margin: 22px 0 0 0; width: 100%; }
  .wrap-list-item {
    font-size: 0.86rem; color: rgba(36,40,33,0.7); padding: 7px 0;
    border-top: 1px solid rgba(36,40,33,0.08); display: flex; align-items: center; gap: 8px;
  }
  .wrap-check { color: var(--sage); }
  .wrap-strike { text-decoration: line-through; }
  .moving-box { width: 100%; background: rgba(242,238,227,0.05); border-radius: 14px; padding: 18px 20px; margin-bottom: 22px; }
  .moving-label { font-size: 0.78rem; color: var(--paper-dim2); margin-bottom: 10px; }
  .moving-row { display: flex; align-items: center; gap: 10px; font-size: 0.86rem; padding: 5px 0; }
  .moving-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .moving-text { flex: 1; }

  .steps-wrap-box { width: 100%; background: rgba(147,166,126,0.08); border: 1px solid rgba(147,166,126,0.25); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; }
  .steps-wrap-header { font-size: 0.78rem; color: var(--p4); font-weight: 600; margin-bottom: 10px; letter-spacing: 0.01em; }
  .wrap-list.steps { margin-top: 0; }
  .wrap-list.steps .wrap-list-item { align-items: flex-start; border-top-color: rgba(147,166,126,0.18); color: var(--paper-dim2); }
  .wrap-list.steps .wrap-check { color: var(--p4); margin-top: 1px; }
  .wrap-step-text-wrap { display: flex; flex-direction: column; gap: 2px; }
  .wrap-step-parent { font-size: 0.72rem; color: rgba(203,196,172,0.55); }

  /* Focus / Quick views */
  .center-col { display: flex; flex-direction: column; align-items: center; width: 100%; }
  .back-link {
    align-self: flex-start; background: transparent; border: none; color: var(--paper-dim2);
    font-size: 0.8rem; cursor: pointer; padding: 0 0 18px 0;
  }
  .stack-wrap { position: relative; width: 100%; margin-bottom: 26px; }
  .stack-layer { position: absolute; height: 190px; border-radius: 16px; }
  .card {
    background: var(--paper); border-radius: 16px; box-shadow: 0 18px 40px rgba(0,0,0,0.35);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 36px 30px; position: relative;
  }
  .focus-card { min-height: 190px; width: 100%; }
  .empty-card { min-height: unset; padding: 40px 28px; margin-bottom: 20px; width: 100%; box-shadow: none; }
  .quick-card { min-height: 130px; width: 100%; padding: 26px; margin-bottom: 20px; box-shadow: 0 10px 24px rgba(0,0,0,0.25); }
  .notes-corner {
    position: absolute; top: 14px; right: 16px; background: transparent; border: none;
    cursor: pointer; font-size: 0.95rem; opacity: 0.28;
  }
  .notes-corner.lit { opacity: 0.8; }
  .priority-tag { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.05em; margin-bottom: 10px; text-transform: uppercase; }
  .quick-tag { font-size: 0.68rem; font-weight: 700; color: var(--amber); letter-spacing: 0.05em; margin-bottom: 8px; text-transform: uppercase; }
  .task-display {
    font-family: 'Fraunces', serif; font-weight: 500; font-size: clamp(1.4rem, 4.5vw, 1.9rem);
    color: var(--ink); text-align: center; line-height: 1.35; margin: 0;
  }
  .task-display.small { font-size: clamp(1.15rem, 4vw, 1.4rem); }
  .empty-title { font-family: 'Fraunces', serif; font-size: 1.25rem; color: var(--ink); margin: 0; text-align: center; }
  .empty-sub { font-size: 0.85rem; color: rgba(36,40,33,0.6); margin-top: 10px; text-align: center; }
  .due-count { font-size: 0.78rem; color: var(--paper-dim2); margin-bottom: 20px; letter-spacing: 0.03em; }

  .btn-primary { margin-bottom: 10px; background: var(--sage); color: #132016; font-weight: 700; font-size: 1rem; padding: 16px 0; }
  .btn-secondary {
    width: 100%; background: transparent; border: 1px solid rgba(203,196,172,0.33); color: var(--paper);
    border-radius: 10px; padding: 12px 0; font-size: 0.88rem; cursor: pointer;
  }
  .btn-secondary:disabled { color: rgba(242,238,227,0.33); cursor: default; }

  .snooze-panel { width: 100%; background: rgba(242,238,227,0.08); border-radius: 12px; padding: 16px; }
  .snooze-label { font-size: 0.75rem; color: var(--paper-dim2); margin-bottom: 8px; }
  .snooze-panel .priority-picker { margin-bottom: 16px; }
  .snooze-note { font-size: 0.74rem; color: rgba(203,196,172,0.6); line-height: 1.5; margin: 0 0 14px 0; }
  .btn-set-wide {
    width: 100%; background: var(--amber); color: #211705; border: none; border-radius: 10px;
    padding: 12px 0; font-weight: 600; font-size: 0.88rem; cursor: pointer; margin-bottom: 10px;
  }
  .cancel-link { background: transparent; border: none; color: var(--paper-dim2); font-size: 0.8rem; cursor: pointer; padding: 0; }

  /* Morning recap */
  .recap-kicker { font-size: 0.72rem; color: var(--paper-dim2); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 14px; align-self: flex-start; }
  .moving-box.rolled { border: 1px solid rgba(206,155,76,0.3); background: rgba(206,155,76,0.07); }
  .moving-box.rolled .moving-label { color: var(--amber); font-weight: 600; }

  /* Notes overlay */
  .overlay {
    position: fixed; inset: 0; background: var(--bg); z-index: 50;
    display: flex; flex-direction: column;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
  }
  .overlay-inner { width: 100%; max-width: 540px; margin: 0 auto; display: flex; flex-direction: column; flex: 1; }
  .overlay-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px; }
  .overlay-kicker { font-size: 0.7rem; color: var(--paper-dim2); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 6px; }
  .overlay-title { font-family: 'Fraunces', serif; font-size: 1.2rem; color: var(--paper); line-height: 1.3; padding-right: 16px; }
  .close-circle {
    background: transparent; border: 1px solid rgba(203,196,172,0.33); color: var(--paper);
    border-radius: 50%; width: 34px; height: 34px; flex-shrink: 0; cursor: pointer; font-size: 1rem;
  }
  .notes-textarea {
    flex: 1; width: 100%; background: var(--paper); color: var(--ink); border: none;
    border-radius: 14px; padding: 20px; font-size: 0.95rem; line-height: 1.6; outline: none; resize: none;
    min-height: 200px;
  }

  /* Subtasks (within Notes overlay) */
  .subtasks-section { margin-bottom: 18px; }
  .subtasks-label { font-size: 0.72rem; color: var(--paper-dim2); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 10px; }
  .subtasks-list { margin-bottom: 10px; }
  .subtask-row {
    display: flex; align-items: center; gap: 8px;
    background: rgba(242,238,227,0.06); border-radius: 10px; padding: 8px 10px; margin-bottom: 6px;
  }
  .subtask-row.done { opacity: 0.5; }
  .subtask-check {
    background: transparent; border: 1px solid rgba(203,196,172,0.4); color: var(--sage);
    border-radius: 50%; width: 22px; height: 22px; flex-shrink: 0; cursor: pointer; font-size: 0.75rem;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .subtask-text { flex: 1; font-size: 0.86rem; color: var(--paper); word-break: break-word; }
  .subtask-text.strike { text-decoration: line-through; }
  .priority-picker.sub { display: flex; gap: 3px; }
  .p-dot.mini { width: 22px; height: 22px; font-size: 0.65rem; }
  .add-subtask-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .subtask-input {
    flex: 1; min-width: 120px; background: rgba(242,238,227,0.06); color: var(--paper); border: 1px solid rgba(203,196,172,0.33);
    border-radius: 10px; padding: 9px 12px; font-size: 0.86rem; outline: none;
  }

  /* Focus-mode subtask flow */
  .subtask-link {
    width: 100%; background: transparent; border: none; color: var(--paper-dim2);
    font-size: 0.82rem; cursor: pointer; padding: 10px 0 0 0;
  }
  .steps-hint { font-size: 0.72rem; color: rgba(36,40,33,0.55); margin: 8px 0 0 0; }
  .steps-tag { font-size: 0.7rem; color: var(--paper-dim2); white-space: nowrap; }
  .breadcrumb { align-self: flex-start; font-size: 0.76rem; color: var(--paper-dim2); margin-bottom: 10px; }
  .subtask-card { width: 100%; padding: 30px 26px; margin-bottom: 20px; box-shadow: 0 12px 28px rgba(0,0,0,0.3); }

  /* Sync */
  .sync-body { display: flex; flex-direction: column; gap: 12px; }
  .sync-desc { font-size: 0.86rem; color: var(--paper-dim2); line-height: 1.5; margin: 0; }
  .sync-code-display {
    font-family: 'Fraunces', serif; font-size: 2rem; letter-spacing: 0.12em; text-align: center;
    background: var(--paper); color: var(--ink); border-radius: 14px; padding: 20px 10px;
  }
  .sync-status-line { font-size: 0.78rem; color: var(--paper-dim2); text-align: center; }
  .sync-divider { text-align: center; font-size: 0.76rem; color: var(--paper-dim2); }
  .sync-warning { font-size: 0.76rem; color: rgba(206,155,76,0.9); line-height: 1.5; margin: 0; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  "use strict";

  var PRIORITY_COLORS = { 1: "var(--p1)", 2: "var(--p2)", 3: "var(--p3)", 4: "var(--p4)", 5: "var(--p5)" };
  var PROFILE_KEY = "onlyThisProfile";
  var RECAP_KEY = "onlyThisLastRecap";
  // The day rolls over at 1am, not midnight — anything still open at 1am moves to the new day,
  // and work done at 12:30am still counts toward the day you were in.
  var ROLLOVER_HOUR = 1;
  var SWIPE_THRESHOLD = 90;
  // Set by migrateTasks() when an older saved task needed upgrading. Declared up here because
  // load() runs before the state block below, and a later `var x = false` would clobber it.
  var needsMigrationSave = false;

  function uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }

  function ymd(d) {

    if (!picked) { backToMainTask(); return; }
    currentSubtaskId = picked.id;
    subtaskJustDone = false;
    render();
  }
  function markParentDoneFromSubtasks() {
    markDone();
  }
  function addSubtask() {
    var parent = tasks.find(function (t) { return t.id === notesTaskId; });
    if (!parent) return;
    var text = (draftSubtaskText || "").trim();
    if (!text) return;
    var newSub = { id: uid(), text: text, priority: draftSubtaskPriority, quick: draftSubtaskQuick, status: "pending" };
    tasks = tasks.map(function (t) { return t.id === parent.id ? Object.assign({}, t, { subtasks: (t.subtasks || []).concat([newSub]) }) : t; });
    draftSubtaskText = "";
    draftSubtaskQuick = false;
    save(); render();
  }
  function toggleSubtaskStatus(parentId, subId) {
    tasks = tasks.map(function (t) {
      if (t.id !== parentId) return t;
      var newSubs = (t.subtasks || []).map(function (s) {
        if (s.id !== subId) return s;
        var nowDone = s.status !== "done";
        if (nowDone) recordCompletion(s.text, "step", t.text);
        return Object.assign({}, s, { status: nowDone ? "done" : "pending" });
      });
      return Object.assign({}, t, { subtasks: newSubs });
    });
    save(); render();
  }
  function changeSubtaskPriority(parentId, subId, p) {
    tasks = tasks.map(function (t) {
      if (t.id !== parentId) return t;
      var newSubs = (t.subtasks || []).map(function (s) { return s.id === subId ? Object.assign({}, s, { priority: p }) : s; });
      return Object.assign({}, t, { subtasks: newSubs });
    });
    save(); render();
  }
  function toggleSubtaskQuick(parentId, subId) {
    tasks = tasks.map(function (t) {
      if (t.id !== parentId) return t;
      var newSubs = (t.subtasks || []).map(function (s) { return s.id === subId ? Object.assign({}, s, { quick: !s.quick }) : s; });
      return Object.assign({}, t, { subtasks: newSubs });
    });
    save(); render();
  }
  function removeSubtask(parentId, subId) {
    tasks = tasks.map(function (t) {
      if (t.id !== parentId) return t;
      return Object.assign({}, t, { subtasks: (t.subtasks || []).filter(function (s) { return s.id !== subId; }) });
    });
    save(); render();
  }
  function cycleDraftSubtaskPriority(p) { draftSubtaskPriority = p; render(); }
  function toggleDraftSubtaskQuick() { draftSubtaskQuick = !draftSubtaskQuick; render(); }

  function openSnooze() {
    var cur = tasks.find(function (t) { return t.id === currentTaskId; });
    if (!cur) return;
    snoozePriority = cur.priority;
    snoozeExhausted = false;
    snoozeOpen = true;
    render();
  }
  function closeSnooze() { snoozeOpen = false; snoozeExhausted = false; render(); }

  // "Not now" sends the task to the back of a priority list rather than hiding it for a while.
  // If nothing else sits at the chosen priority, it drops down a level so you don't just see it
  // again immediately. If there is genuinely nothing else due, we offer to end focus instead.
  function backOfQueueTarget(cur, wantedP) {
    var others = eligibleTasks().filter(function (t) { return t.id !== cur.id; });
    if (others.length === 0) return null;
    var p = Math.min(5, Math.max(1, wantedP));
    while (p < 5 && !others.some(function (t) { return t.priority === p; })) p++;
    return p;
  }
  function confirmSnooze() {
    var cur = tasks.find(function (t) { return t.id === currentTaskId; });
    if (!cur) { snoozeOpen = false; render(); return; }
    var target = backOfQueueTarget(cur, snoozePriority);
    if (target === null) {
      // Last one standing — nothing to fall behind.
      snoozeExhausted = true;
      render();
      return;
    }
    var backOrder = nextOrder();
    tasks = tasks.map(function (t) {
      return t.id === cur.id
        ? Object.assign({}, t, { priority: target, order: backOrder, snoozedUntil: null })
        : t;
    });
    currentTaskId = null;
    snoozeOpen = false;
    snoozeExhausted = false;
    save(); render();
  }

  function enterQuick() {
    var pool = quickEligibleTasks();
    quickQueue = pool.map(function (t) { return t.id; }).sort(function () { return Math.random() - 0.5; });
    view = "quick"; render();
  }
  function quickDone() {
    var id = quickQueue[0];
    var cur = tasks.find(function (t) { return t.id === id; });
    if (cur) recordCompletion(cur.text);
    tasks = tasks.map(function (t) { return t.id === id ? Object.assign({}, t, { status: "done" }) : t; });
    quickQueue = quickQueue.slice(1);
    save(); render();
  }
  function quickSkip() {
    if (quickQueue.length > 1) quickQueue = quickQueue.slice(1).concat([quickQueue[0]]);
    render();
  }

  function enterDailies() {
    var pool = dailyEligibleTasks();
    dailyQueue = pool.map(function (t) { return t.id; }).sort(function () { return Math.random() - 0.5; });
    view = "dailies"; render();
  }
  function dailyDone() {
    var id = dailyQueue[0];
    var cur = tasks.find(function (t) { return t.id === id; });
    if (cur) {
      recordCompletion(cur.text);
      var nextDate = addDaysStr(cur.repeat === "daily" ? 1 : 7);
      tasks = tasks.map(function (t) {
        return t.id === cur.id
          ? Object.assign({}, t, { date: nextDate, priority: randomMidPriority(), snoozedUntil: null, status: "pending" })
          : t;
      });
    }
    dailyQueue = dailyQueue.slice(1);
    save(); render();
  }
  function dailySkip() {
    if (dailyQueue.length > 1) dailyQueue = dailyQueue.slice(1).concat([dailyQueue[0]]);
    render();
  }

  function backToPlan() { view = "plan"; render(); }

  function openNotes(id) {
    notesTaskId = id;
    draftSubtaskText = "";
    draftSubtaskPriority = 3;
    draftSubtaskQuick = false;
    render();
  }
  function closeNotes() { notesTaskId = null; render(); }

  // ---- Render: pieces ----
  function renderHeader() {
    var subtitle = view === "plan" ? "Set priorities. 1 matters most, 5 least."
      : view === "focus" ? "One task. Nothing else on screen."
      : view === "quick" ? "A quick sweep through the small stuff."
      : view === "dailies" ? "Knocking out the repeats."
      : "Where yesterday left off.";

    var leftSlot = profile === "personal"
      ? '<button class="profile-btn" data-action="switch-profile" data-profile="work">← Work</button>'
      : '';
    var rightSlot = profile === "work"
      ? '<button class="profile-btn" data-action="switch-profile" data-profile="personal">Personal →</button>'
      : '';

    return '<header class="header">' +
      '<div class="header-slot left">' + leftSlot + '</div>' +
      '<div class="header-center"><div class="logo">Only This</div><div class="subtitle">' + subtitle + '</div></div>' +
      '<div class="header-slot right">' + rightSlot + '</div>' +
      '</header>';
  }

  function priorityDots(selected, actionName, idAttr) {
    var out = '<div class="priority-picker">';
    for (var p = 1; p <= 5; p++) {
      var active = selected === p;
      var style = active ? ('background:' + PRIORITY_COLORS[p] + ';border-color:' + PRIORITY_COLORS[p]) : '';
      out += '<button class="p-dot ' + (active ? 'active' : '') + '" style="' + style + '" data-action="' + actionName + '" ' + (idAttr ? 'data-id="' + idAttr + '" ' : '') + 'data-p="' + p + '">' + p + '</button>';
    }
    out += '</div>';
    return out;
  }

  function hasNotesOrSubs(t) {
    return (t.notes && t.notes.trim()) || (t.subtasks && t.subtasks.length > 0);
  }
  function stepsTag(t) {
    var pending = (t.subtasks || []).filter(function (s) { return s.status !== "done"; }).length;
    return pending > 0 ? '<span class="steps-tag">' + pending + (pending === 1 ? ' step' : ' steps') + '</span>' : '';
  }

  function checkBtn(t) {
    return '<button class="task-check" data-action="complete-task" data-id="' + t.id + '" title="Mark done">○</button>';
  }

  function renderTaskRow(t) {
    if (editingPriorityId === t.id) {
      return '<div class="task-row" data-task-row="' + t.id + '">' +
        '<span class="task-text">' + escapeHtml(t.text) + '</span>' +
        priorityDots(t.priority, "set-priority", t.id) +
        '</div>';
    }
    return '<div class="task-row" data-task-row="' + t.id + '">' +
      checkBtn(t) +
      '<span class="task-text">' + escapeHtml(t.text) + '</span>' + stepsTag(t) +
      '<button class="icon-btn ' + (t.quick ? 'lit' : '') + '" data-action="toggle-quick" data-id="' + t.id + '" title="Under a few minutes">⚡</button>' +
      '<button class="icon-btn ' + (hasNotesOrSubs(t) ? 'lit' : '') + '" data-action="open-notes" data-id="' + t.id + '" title="Notes">🗒</button>' +
      '<button class="p-badge" style="background:' + PRIORITY_COLORS[t.priority] + ';border-color:' + PRIORITY_COLORS[t.priority] + '" data-action="edit-priority" data-id="' + t.id + '">' + t.priority + '</button>' +
      '<button class="icon-btn danger" data-action="remove-task" data-id="' + t.id + '">×</button>' +
      '</div>';
  }

  function renderRepeatingRow(t) {
    var label = t.repeat === "daily" ? "Daily" : "Weekly";
    return '<div class="task-row" data-task-row="' + t.id + '">' +
      checkBtn(t) +
      '<span class="task-text">' + escapeHtml(t.text) + '</span>' + stepsTag(t) +
      '<button class="icon-btn ' + (hasNotesOrSubs(t) ? 'lit' : '') + '" data-action="open-notes" data-id="' + t.id + '" title="Notes">🗒</button>' +
      '<button class="repeat-tag" data-action="cycle-task-repeat" data-id="' + t.id + '" title="Change repeat">🔁 ' + label + '</button>' +
      '<button class="icon-btn danger" data-action="remove-task" data-id="' + t.id + '">×</button>' +
      '</div>';
  }

  function renderPlan() {
    var today = todayStr(), tomorrow = addDaysStr(1);
    var isPersonal = profile === "personal";
    var elig = eligibleTasks();
    var quickElig = quickEligibleTasks();
    var dailyElig = isPersonal ? dailyEligibleTasks() : [];
    var planTasksAll = tasks.filter(function (t) { return t.date === planDate && t.status !== "done"; });
    var planTasks = isPersonal ? planTasksAll.filter(function (t) { return !t.repeat; }) : planTasksAll;
    var repeatingTasks = isPersonal ? planTasksAll.filter(function (t) { return !!t.repeat; }) : [];
    var later = tasks.filter(function (t) {
      return t.status !== "done" && t.date > today;
    }).sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });

    var groupsHtml = "", anyTasks = false;
    for (var p = 1; p <= 5; p++) {
      var group = planTasks.filter(function (t) { return t.priority === p; }).sort(byPriorityThenOrder);
      if (group.length === 0) continue;
      anyTasks = true;
      groupsHtml += '<div class="group"><div class="group-label" style="color:' + PRIORITY_COLORS[p] + '">Priority ' + p + '</div>' +
        group.map(renderTaskRow).join('') + '</div>';
    }

    var repeatingHtml = "";
    if (repeatingTasks.length > 0) {
      anyTasks = true;
      repeatingHtml = '<div class="group"><div class="group-label" style="color:var(--paper-dim2)">🔁 Repeating</div>' +
        repeatingTasks.map(renderRepeatingRow).join('') + '</div>';
    }

    if (!anyTasks) {
      groupsHtml = '<div class="empty-state">Nothing scheduled for ' + fmtDate(planDate).toLowerCase() + ' yet.</div>';
    }

    var laterHtml = "";
    if (later.length > 0) {
      laterHtml = '<div class="later-section">' +
        '<button class="later-toggle" data-action="toggle-later">' + (showLater ? '▾' : '▸') + ' Scheduled for later (' + later.length + ')</button>';
      if (showLater) {
        laterHtml += '<div class="later-list">' + later.map(function (t) {
          return '<div class="later-row"><span class="later-text">' + escapeHtml(t.text) + '</span><span>' +
            fmtDate(t.date) + '</span></div>';
        }).join('') + '</div>';
      }
      laterHtml += '</div>';
    }

    // Completed drawer — same shape as "Scheduled for later", and the landing spot
    // for the swoop animation when a task is checked off.
    var doneList = completedOnDate(planDate);
    var completedHtml = "";
    if (doneList.length > 0) {
      var whenLabel = planDate === today ? "today" : fmtDate(planDate).toLowerCase();
      completedHtml = '<div class="later-section completed-section">' +
        '<button class="later-toggle" id="completedToggle" data-action="toggle-completed">' +
        (showCompleted ? '▾' : '▸') + ' Completed ' + whenLabel + ' (' +
        '<span class="done-count' + (bumpCompleted ? ' bump' : '') + '">' + doneList.length + '</span>)</button>';
      if (showCompleted) {
        completedHtml += '<div class="later-list">' + doneList.map(function (c) {
          return '<div class="later-row"><span class="done-check">✓</span>' +
            '<span class="later-text strike">' + escapeHtml(c.text) + '</span>' +
            '<span>' + fmtTime(c.ts) + '</span></div>';
        }).join('') + '</div>';
      }
      completedHtml += '</div>';
    }

    var quickBtnHtml = quickElig.length > 0
      ? '<button class="btn-quick-clear" data-action="enter-quick">⚡ Clear the small stuff (' + quickElig.length + ')</button>'
      : '';
    var dailyBtnHtml = (isPersonal && dailyElig.length > 0)
      ? '<button class="btn-quick-clear" data-action="enter-dailies">🔁 Complete the dailies (' + dailyElig.length + ')</button>'
      : '';

    var syncLabel = syncCode ? ("🔄 " + syncStatusLabel()) : "🔄 Set up sync between devices";
    var syncLinkHtml = '<button class="shift-link" data-action="open-sync">' + syncLabel + '</button>';

    var repeatPillHtml = "";
    var normalControlsHtml = "";
    if (isPersonal) {
      var repeatLabel = draftRepeat === "daily" ? "🔁 Daily" : draftRepeat === "weekly" ? "🔁 Weekly" : "🔁 Repeat";
      repeatPillHtml = '<button class="repeat-toggle ' + (draftRepeat ? 'active' : '') + '" data-action="cycle-draft-repeat">' + repeatLabel + '</button>';
    }
    if (!draftRepeat) {
      normalControlsHtml = '<div class="priority-picker"><span class="priority-label">Priority</span>' +
        [1, 2, 3, 4, 5].map(function (p) {
          var active = draftPriority === p;
          var style = active ? ('background:' + PRIORITY_COLORS[p] + ';border-color:' + PRIORITY_COLORS[p]) : '';
          return '<button class="p-dot ' + (active ? 'active' : '') + '" style="' + style + '" data-action="select-draft-priority" data-p="' + p + '">' + p + '</button>';
        }).join('') +
        '</div>' +
        '<button class="quick-toggle ' + (draftQuick ? 'active' : '') + '" data-action="toggle-draft-quick">⚡ Quick</button>';
    }

    return '<div class="date-row">' +
      '<button class="date-pill ' + (planDate === today ? 'active' : '') + '" data-action="set-plan-date" data-date="' + today + '">Today</button>' +
      '<button class="date-pill ' + (planDate === tomorrow ? 'active' : '') + '" data-action="set-plan-date" data-date="' + tomorrow + '">Tomorrow</button>' +
      '<input type="date" id="planDateCustom" class="date-input" value="' + planDate + '" />' +
      '</div>' +
      '<div class="add-box">' +
      '<input id="taskInput" class="task-input" placeholder="Add a task for ' + fmtDate(planDate) + '" value="' + escapeHtml(draftText) + '" />' +
      '<div class="add-row">' +
      normalControlsHtml + repeatPillHtml +
      '<button class="btn-add" data-action="add-task">Add</button>' +
      '</div></div>' +
      (anyTasks ? '<p class="swipe-hint">Tap ○ or swipe a task right to complete it.</p>' : '') +
      groupsHtml + repeatingHtml + laterHtml + completedHtml + quickBtnHtml + dailyBtnHtml +
      '<button class="btn-begin" data-action="begin-focus" ' + (elig.length === 0 ? 'disabled' : '') + '>' +
      (elig.length === 0 ? 'Nothing due right now' : 'Begin — ' + elig.length + ' due now') +
      '</button>' + syncLinkHtml;
  }

  function renderSnoozePanel() {
    if (snoozeExhausted) {
      return '<div class="snooze-panel">' +
        '<div class="snooze-label">Nothing else is due.</div>' +
        '<p class="snooze-note">This is the only task left, so there is nothing for it to fall behind. ' +
        'You can call it here and come back to it later.</p>' +
        '<button class="btn-set-wide" data-action="back-to-plan">End focus →</button>' +
        '<button class="cancel-link" data-action="close-snooze">Stay on this task</button>' +
        '</div>';
    }

    var cur = tasks.find(function (t) { return t.id === currentTaskId; });
    var target = cur ? backOfQueueTarget(cur, snoozePriority) : null;
    var note = target === null
      ? 'Nothing else is due right now.'
      : (target !== snoozePriority
          ? 'Nothing else sits at priority ' + snoozePriority + ', so this drops to the back of priority ' + target + '.'
          : 'Goes to the back of priority ' + target + ' — you will see the rest of that list first.');

    return '<div class="snooze-panel">' +
      '<div class="snooze-label">Send it to the back of which list?</div>' +
      priorityDots(snoozePriority, "select-snooze-priority") +
      '<p class="snooze-note">' + note + '</p>' +
      '<button class="btn-set-wide" data-action="confirm-snooze">Send to the back</button>' +
      '<button class="cancel-link" data-action="close-snooze">Cancel</button>' +
      '</div>';
  }

  function renderFocus() {
    pickCurrentFocus();
    var elig = eligibleTasks();
    var current = tasks.find(function (t) { return t.id === currentTaskId; });
    var backBtn = '<button class="back-link" data-action="back-to-plan">← Back to plan</button>';

    if (!current) {
      var laterList = tasks.filter(function (t) {
        return t.status !== "done" && t.date > todayStr();
      }).sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
      var next = laterList[0];
      return '<div class="center-col">' + backBtn +
        '<div class="card empty-card"><p class="empty-title">Nothing due right now.</p>' +
        (next ? '<p class="empty-sub">Next up: ' + escapeHtml(next.text) + ' — ' + fmtDate(next.date) + '</p>' : '') +
        '</div><button class="btn-primary" data-action="back-to-plan">Back to plan</button></div>';
    }

    if (inSubtaskMode) return renderSubtaskFocus(current, backBtn);

    var remainingBehind = Math.max(0, elig.length - 1);
    var stackLayers = Math.min(remainingBehind, 3);
    var stackHtml = "";
    for (var i = 0; i < stackLayers; i++) {
      stackHtml += '<div class="stack-layer" style="top:' + (-(i + 1) * 7) + 'px;left:' + ((i + 1) * 6) + 'px;right:' + (-(i + 1) * 6) + 'px;background:' + (i === stackLayers - 1 ? 'var(--paper-dim2)' : 'var(--paper-dim1)') + ';z-index:' + (-1 - i) + '"></div>';
    }

    var pending = pendingSubtasks(current);
    var subtaskBtnHtml = (!snoozeOpen && pending.length > 0)
      ? '<button class="subtask-link" data-action="enter-subtask-mode">↳ Work on a step instead (' + pending.length + ')</button>'
      : '';

    var actionsHtml = snoozeOpen ? renderSnoozePanel() :
      '<button class="btn-primary" data-action="mark-done">Done — next one</button>' +
      '<button class="btn-secondary" data-action="open-snooze">Not now</button>' +
      subtaskBtnHtml;

    var hasNotesOrSubs = (current.notes && current.notes.trim()) || (current.subtasks && current.subtasks.length > 0);

    return '<div class="center-col">' + backBtn +
      '<div class="stack-wrap">' + stackHtml +
      '<div class="card focus-card">' +
      '<button class="notes-corner ' + (hasNotesOrSubs ? 'lit' : '') + '" data-action="open-notes" data-id="' + current.id + '" title="Notes">🗒</button>' +
      '<span class="priority-tag" style="color:' + PRIORITY_COLORS[current.priority] + '">Priority ' + current.priority + '</span>' +
      '<p class="task-display">' + escapeHtml(current.text) + '</p>' +
      (pending.length > 0 ? '<p class="steps-hint">' + pending.length + (pending.length === 1 ? ' step inside' : ' steps inside') + '</p>' : '') +
      '</div></div>' +
      '<div class="due-count">' + elig.length + ' due now</div>' +
      actionsHtml + '</div>';
  }

  function renderSubtaskFocus(parent, backBtn) {
    var pending = pendingSubtasks(parent);

    if (subtaskJustDone) {
      var allClear = pending.length === 0;
      return '<div class="center-col">' + backBtn +
        '<div class="card empty-card">' +
        '<p class="empty-title">Step done.</p>' +
        (allClear ? '<p class="empty-sub">That was the last step for this one.</p>' : '<p class="empty-sub">' + pending.length + (pending.length === 1 ? ' step left.' : ' steps left.') + '</p>') +
        '</div>' +
        (pending.length > 0 ? '<button class="btn-primary" data-action="next-subtask">Next step →</button>' : '') +
        (allClear ? '<button class="btn-primary" data-action="mark-parent-from-subtasks">Mark "' + escapeHtml(parent.text) + '" done too →</button>' : '') +
        '<button class="btn-secondary" data-action="back-to-main-task">Back to main tasks →</button>' +
        '</div>';
    }

    var sub = (parent.subtasks || []).find(function (s) { return s.id === currentSubtaskId; });
    if (!sub) {
      inSubtaskMode = false;
      currentSubtaskId = null;
      return '<div class="center-col">' + backBtn +
        '<div class="card empty-card"><p class="empty-title">That step is gone.</p></div>' +
        '<button class="btn-primary" data-action="back-to-main-task">Back to main task</button></div>';
    }

    return '<div class="center-col">' + backBtn +
      '<div class="breadcrumb">Within: ' + escapeHtml(parent.text) + '</div>' +
      '<div class="card subtask-card">' +
      (sub.quick ? '<span class="quick-tag">⚡ Quick step</span>' : '<span class="priority-tag" style="color:' + PRIORITY_COLORS[sub.priority] + '">Priority ' + sub.priority + '</span>') +
      '<p class="task-display small">' + escapeHtml(sub.text) + '</p>' +
      '</div>' +
      '<button class="btn-primary" data-action="subtask-done">Done — this step</button>' +
      '<button class="btn-secondary" data-action="back-to-main-task">← Back to main task</button>' +
      '</div>';
  }

  function renderQuick() {
    var current = tasks.find(function (t) { return t.id === quickQueue[0]; });
    var backBtn = '<button class="back-link" data-action="back-to-plan">← Back to plan</button>';
    if (!current) {
      return '<div class="center-col"><div class="card empty-card"><p class="empty-title">Small stuff cleared.</p></div>' +
        '<button class="btn-primary" data-action="back-to-plan">Back to plan</button></div>';
    }
    return '<div class="center-col">' + backBtn +
      '<div class="card quick-card"><span class="quick-tag">⚡ Quick</span>' +
      '<p class="task-display small">' + escapeHtml(current.text) + '</p></div>' +
      '<div class="due-count">' + quickQueue.length + ' left in this sweep</div>' +
      '<button class="btn-primary" data-action="quick-done">Done — next one</button>' +
      '<button class="btn-secondary" data-action="quick-skip" ' + (quickQueue.length <= 1 ? 'disabled' : '') + '>Not now — send to the back</button>' +
      '</div>';
  }

  function renderDailies() {
    var current = tasks.find(function (t) { return t.id === dailyQueue[0]; });
    var backBtn = '<button class="back-link" data-action="back-to-plan">← Back to plan</button>';
    if (!current) {
      return '<div class="center-col"><div class="card empty-card"><p class="empty-title">Dailies cleared for today.</p></div>' +
        '<button class="btn-primary" data-action="back-to-plan">Back to plan</button></div>';
    }
    var label = current.repeat === "daily" ? "🔁 Daily" : "🔁 Weekly";
    return '<div class="center-col">' + backBtn +
      '<div class="card quick-card"><span class="quick-tag">' + label + '</span>' +
      '<p class="task-display small">' + escapeHtml(current.text) + '</p></div>' +
      '<div class="due-count">' + dailyQueue.length + ' left in this sweep</div>' +
      '<button class="btn-primary" data-action="daily-done">Done — next one</button>' +
      '<button class="btn-secondary" data-action="daily-skip" ' + (dailyQueue.length <= 1 ? 'disabled' : '') + '>Not now — send to the back</button>' +
      '</div>';
  }

  function reflectionLine(count) {
    if (count === 0) return "A quiet one — that's alright too.";
    if (count <= 2) return "A couple of things off your plate.";
    if (count <= 5) return "Nice work today.";
    if (count <= 9) return "That's a proper day's work.";
    return "That's a lot cleared today — well done.";
  }

  // Shown once on the first open of a new day: what you finished yesterday,
  // and what rolled forward automatically overnight.
  function renderRecap() {
    var yesterday = addDaysStr(-1);
    var doneYesterday = completionsOn(yesterday).filter(function (c) { return c.type !== "step"; });
    var stepsYesterday = completionsOn(yesterday).filter(function (c) { return c.type === "step"; });
    var carried = rolledOverToday();

    var listHtml = doneYesterday.length > 0
      ? '<ul class="wrap-list">' + doneYesterday.map(function (t) {
          return '<li class="wrap-list-item"><span class="wrap-check">✓</span><span class="wrap-strike">' + escapeHtml(t.text) + '</span></li>';
        }).join('') + '</ul>'
      : '';

    var stepsHtml = "";
    if (stepsYesterday.length > 0) {
      stepsHtml = '<div class="steps-wrap-box">' +
        '<div class="steps-wrap-header">🔹 ' + stepsYesterday.length + (stepsYesterday.length === 1 ? ' step chipped away' : ' steps chipped away') + '</div>' +
        '<ul class="wrap-list steps">' + stepsYesterday.map(function (c) {
          return '<li class="wrap-list-item"><span class="wrap-check">✓</span>' +
            '<span class="wrap-step-text-wrap"><span class="wrap-strike">' + escapeHtml(c.text) + '</span>' +
            (c.parentText ? '<span class="wrap-step-parent">within ' + escapeHtml(c.parentText) + '</span>' : '') +
            '</span></li>';
        }).join('') + '</ul>' +
        '</div>';
    }

    var carriedHtml = "";
    if (carried.length > 0) {
      carriedHtml = '<div class="moving-box rolled">' +
        '<div class="moving-label">Carried over to today (' + carried.length + ')</div>' +
        carried.map(function (t) {
          return '<div class="moving-row"><span class="moving-dot" style="background:' + PRIORITY_COLORS[t.priority] + '"></span>' +
            '<span class="moving-text">' + escapeHtml(t.text) + '</span></div>';
        }).join('') + '</div>';
    }

    return '<div class="center-col">' +
      '<div class="recap-kicker">Yesterday — ' + fmtDate(yesterday) + '</div>' +
      '<div class="card wrap-card">' +
      '<div class="wrap-stat-block">' +
      '<div class="wrap-stat-num">' + doneYesterday.length + '</div>' +
      '<div class="wrap-stat-label">' + (doneYesterday.length === 1 ? "task done yesterday" : "tasks done yesterday") + '</div>' +
      '<div class="wrap-reflection">' + reflectionLine(doneYesterday.length) + '</div>' +
      '</div>' + listHtml +
      '</div>' +
      stepsHtml +
      carriedHtml +
      '<button class="btn-primary" data-action="dismiss-recap">Start today →</button>' +
      '</div>';
  }

  function renderSubtaskRow(parentId, s) {
    var done = s.status === "done";
    return '<div class="subtask-row ' + (done ? 'done' : '') + '">' +
      '<button class="subtask-check" data-action="toggle-subtask" data-parent="' + parentId + '" data-id="' + s.id + '">' + (done ? '✓' : '○') + '</button>' +
      '<span class="subtask-text ' + (done ? 'strike' : '') + '">' + escapeHtml(s.text) + '</span>' +
      (!done ? priorityDotsSub(s.priority, parentId, s.id) : '') +
      (!done ? '<button class="icon-btn ' + (s.quick ? 'lit' : '') + '" data-action="toggle-subtask-quick" data-parent="' + parentId + '" data-id="' + s.id + '" title="Under a few minutes">⚡</button>' : '') +
      '<button class="icon-btn danger" data-action="remove-subtask" data-parent="' + parentId + '" data-id="' + s.id + '">×</button>' +
      '</div>';
  }

  function priorityDotsSub(selected, parentId, subId) {
    var out = '<div class="priority-picker sub">';
    for (var p = 1; p <= 5; p++) {
      var active = selected === p;
      var style = active ? ('background:' + PRIORITY_COLORS[p] + ';border-color:' + PRIORITY_COLORS[p]) : '';
      out += '<button class="p-dot mini ' + (active ? 'active' : '') + '" style="' + style + '" data-action="set-subtask-priority" data-parent="' + parentId + '" data-id="' + subId + '" data-p="' + p + '">' + p + '</button>';
    }
    out += '</div>';
    return out;
  }

  function renderNotesOverlay() {
    var task = tasks.find(function (t) { return t.id === notesTaskId; });
    if (!task) return '';
    var subs = task.subtasks || [];
    var pending = subs.filter(function (s) { return s.status !== "done"; });
    var done = subs.filter(function (s) { return s.status === "done"; });

    var subtasksHtml = '<div class="subtasks-section">' +
      '<div class="subtasks-label">Steps' + (subs.length > 0 ? ' (' + pending.length + ' left)' : '') + '</div>' +
      (pending.length + done.length > 0 ? '<div class="subtasks-list">' + pending.map(function (s) { return renderSubtaskRow(task.id, s); }).join('') + done.map(function (s) { return renderSubtaskRow(task.id, s); }).join('') + '</div>' : '') +
      '<div class="add-subtask-row">' +
      '<input id="subtaskInput" class="subtask-input" placeholder="Add a smaller step" value="' + escapeHtml(draftSubtaskText) + '" />' +
      priorityDotsDraftSub() +
      '<button class="quick-toggle ' + (draftSubtaskQuick ? 'active' : '') + '" data-action="toggle-draft-subtask-quick">⚡</button>' +
      '<button class="btn-add" data-action="add-subtask">Add</button>' +
      '</div></div>';

    return '<div class="overlay"><div class="overlay-inner">' +
      '<div class="overlay-header"><div><div class="overlay-kicker">Notes</div>' +
      '<div class="overlay-title">' + escapeHtml(task.text) + '</div></div>' +
      '<button class="close-circle" data-action="close-notes">×</button></div>' +
      subtasksHtml +
      '<textarea id="notesTextarea" data-id="' + task.id + '" class="notes-textarea" placeholder="Anything worth jotting down for this one — links, context, next steps…">' + escapeHtml(task.notes || "") + '</textarea>' +
      '<button class="btn-primary" data-action="close-notes">Done</button>' +
      '</div></div>';
  }

  function priorityDotsDraftSub() {
    var out = '<div class="priority-picker sub">';
    for (var p = 1; p <= 5; p++) {
      var active = draftSubtaskPriority === p;
      var style = active ? ('background:' + PRIORITY_COLORS[p] + ';border-color:' + PRIORITY_COLORS[p]) : '';
      out += '<button class="p-dot mini ' + (active ? 'active' : '') + '" style="' + style + '" data-action="select-draft-subtask-priority" data-p="' + p + '">' + p + '</button>';
    }
    out += '</div>';
    return out;
  }

  function renderSyncOverlay() {
    if (!syncOverlayOpen) return '';
    var body;
    if (syncCode) {
      body = '<div class="sync-code-display">' + syncCode + '</div>' +
        '<p class="sync-desc">Enter this exact code on your other device to link it to this same task list.</p>' +
        '<button class="btn-primary" data-action="sync-now">Sync now</button>' +
        '<div class="sync-status-line">' + syncStatusLabel() + '</div>' +
        '<button class="btn-secondary" data-action="unlink-sync">Unlink this device</button>';
    } else {
      body = '<p class="sync-desc">Link this device to another so your tasks stay the same on both. First time setting this up? Generate a code here, then enter that same code on your other device.</p>' +
        '<button class="btn-primary" data-action="start-new-sync">Generate a new code</button>' +
        '<div class="sync-divider">or</div>' +
        '<input id="syncCodeInput" class="task-input" placeholder="Enter a code from your other device" value="' + escapeHtml(syncCodeDraft) + '" style="text-transform:uppercase" />' +
        '<button class="btn-secondary" data-action="connect-sync-code">Connect</button>' +
        '<p class="sync-warning">Connecting to an existing code replaces this device\'s tasks with whatever is already synced under that code — best done before adding much here.</p>';
    }
    return '<div class="overlay"><div class="overlay-inner">' +
      '<div class="overlay-header"><div><div class="overlay-kicker">Sync devices</div>' +
      '<div class="overlay-title">Keep this in sync everywhere</div></div>' +
      '<button class="close-circle" data-action="close-sync">×</button></div>' +
      '<div class="sync-body">' + body + '</div>' +
      '</div></div>';
  }

  function render() {
    var body = view === "focus" ? renderFocus()
      : view === "quick" ? renderQuick()
      : view === "dailies" ? renderDailies()
      : view === "recap" ? renderRecap()
      : renderPlan();
    var html = '<div class="wrap">' + renderHeader() + body + '</div>' + renderNotesOverlay() + renderSyncOverlay();
    document.getElementById("app").innerHTML = html;

    if (view === "plan") {
      var key = view + "|" + planDate;
      if (key !== lastFocusKey) {
        lastFocusKey = key;
        var el = document.getElementById("taskInput");
        if (el) el.focus();
      }
    } else {
      lastFocusKey = null;
    }
  }

  // ---- Event delegation ----
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.dataset.action;
    var id = el.dataset.id;
    var p = el.dataset.p !== undefined ? Number(el.dataset.p) : undefined;

    switch (action) {
      case "set-plan-date": planDate = el.dataset.date; render(); break;
      case "select-draft-priority": draftPriority = p; render(); break;
      case "toggle-draft-quick": draftQuick = !draftQuick; render(); break;
      case "add-task": addTask(); break;
      case "remove-task": removeTask(id); break;
      case "edit-priority": editingPriorityId = id; render(); break;
      case "set-priority": changePriority(id, p); break;
      case "toggle-quick": toggleQuickFlag(id); break;
      case "dismiss-recap": dismissRecap(); break;
      case "complete-task": completeWithFlourish(id, el.closest(".task-row")); break;
      case "switch-profile": switchProfile(el.dataset.profile); break;
      case "cycle-draft-repeat": cycleDraftRepeat(); break;
      case "cycle-task-repeat": cycleTaskRepeat(id); break;
      case "enter-dailies": enterDailies(); break;
      case "daily-done": dailyDone(); break;
      case "daily-skip": dailySkip(); break;
      case "open-notes": openNotes(id); break;
      case "close-notes": closeNotes(); break;
      case "toggle-later": showLater = !showLater; render(); break;
      case "toggle-completed": showCompleted = !showCompleted; render(); break;
      case "begin-focus": enterFocus(); break;
      case "enter-quick": enterQuick(); break;
      case "back-to-plan": backToPlan(); break;
      case "mark-done": markDone(); break;
      case "open-snooze": openSnooze(); break;
      case "close-snooze": closeSnooze(); break;
      case "select-snooze-priority": snoozePriority = p; render(); break;
      case "confirm-snooze": confirmSnooze(); break;
      case "quick-done": quickDone(); break;
      case "quick-skip": quickSkip(); break;
      case "enter-subtask-mode": enterSubtaskMode(); break;
      case "subtask-done": subtaskDone(); break;
      case "next-subtask": nextSubtask(); break;
      case "back-to-main-task": backToMainTask(); break;
      case "mark-parent-from-subtasks": markParentDoneFromSubtasks(); break;
      case "add-subtask": addSubtask(); break;
      case "toggle-subtask": toggleSubtaskStatus(el.dataset.parent, id); break;
      case "toggle-subtask-quick": toggleSubtaskQuick(el.dataset.parent, id); break;
      case "remove-subtask": removeSubtask(el.dataset.parent, id); break;
      case "set-subtask-priority": changeSubtaskPriority(el.dataset.parent, id, p); break;
      case "select-draft-subtask-priority": cycleDraftSubtaskPriority(p); break;
      case "toggle-draft-subtask-quick": toggleDraftSubtaskQuick(); break;
      case "open-sync": syncOverlayOpen = true; render(); break;
      case "close-sync": syncOverlayOpen = false; render(); break;
      case "start-new-sync": startNewSync(); break;
      case "connect-sync-code": connectWithCode(); break;
      case "unlink-sync": unlinkSync(); break;
      case "sync-now": syncNow(); break;
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target && e.target.id === "taskInput") addTask();
    if (e.key === "Enter" && e.target && e.target.id === "subtaskInput") addSubtask();
    if (e.key === "Enter" && e.target && e.target.id === "syncCodeInput") connectWithCode();
  });

  document.addEventListener("change", function (e) {
    if (e.target && e.target.id === "planDateCustom") { planDate = e.target.value; render(); }
  });

  document.addEventListener("input", function (e) {
    if (e.target && e.target.id === "taskInput") {
      draftText = e.target.value; // no render here — preserves cursor position while typing
    }
    if (e.target && e.target.id === "subtaskInput") {
      draftSubtaskText = e.target.value; // no render here — preserves cursor position while typing
    }
    if (e.target && e.target.id === "syncCodeInput") {
      syncCodeDraft = e.target.value; // no render here — preserves cursor position while typing
    }
    if (e.target && e.target.id === "notesTextarea") {
      var id = e.target.dataset.id;
      tasks = tasks.map(function (t) { return t.id === id ? Object.assign({}, t, { notes: e.target.value }) : t; });
      save(); // no render here — preserves cursor position while typing
    }
  });

  document.addEventListener("pointerdown", function (e) {
    if (!editingPriorityId) return;
    var row = e.target.closest("[data-task-row]");
    if (!row || row.getAttribute("data-task-row") !== editingPriorityId) {
      editingPriorityId = null;
      render();
    }
  });

  // ---- Swipe a task row right to complete it ----
  var swipe = null;

  function resetSwipeEl(el) {
    el.style.transition = "transform .18s ease";
    el.style.transform = "";
    el.classList.remove("swipe-armed");
  }

  document.addEventListener("pointerdown", function (e) {
    if (view !== "plan") return;
    // The priority-editor handler above re-renders on outside taps, which would leave us
    // holding a detached row. Sit this one out.
    if (editingPriorityId || celebrating) return;
    var row = e.target.closest(".task-row[data-task-row]");
    if (!row) return;
    if (e.target.closest("button")) return; // let the buttons in the row do their own thing
    swipe = { id: row.getAttribute("data-task-row"), el: row, startX: e.clientX, startY: e.clientY, dx: 0, active: false };
  });

  document.addEventListener("pointermove", function (e) {
    if (!swipe) return;
    var dx = e.clientX - swipe.startX;
    var dy = e.clientY - swipe.startY;
    if (!swipe.active) {
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      if (Math.abs(dy) > Math.abs(dx)) { swipe = null; return; } // vertical — let the page scroll
      swipe.active = true;
      swipe.el.style.transition = "none";
    }
    if (dx < 0) dx = 0; // right-swipe only
    swipe.dx = dx;
    swipe.el.style.transform = "translateX(" + dx + "px)";
    swipe.el.classList.toggle("swipe-armed", dx >= SWIPE_THRESHOLD);
  });

  function endSwipe(cancelled) {
    if (!swipe) return;
    var s = swipe;
    swipe = null;
    if (!s.active) return;
    if (!cancelled && s.dx >= SWIPE_THRESHOLD) {
      // Same flourish as tapping, but the ghost launches from wherever the row was thrown to.
      var task = tasks.find(function (t) { return t.id === s.id; });
      celebrateRow(s.el);
      celebrating = s.id;
      var flew = flyToCompleted(s.el, task ? task.text : "");
      s.el.style.transition = "transform .2s ease, opacity .2s ease";
      s.el.style.transform = "translateX(115%)";
      s.el.style.opacity = "0";
      setTimeout(function () {
        celebrating = null;
        finishCompletion(s.id);
      }, flew ? 560 : 300);
    } else {
      resetSwipeEl(s.el);
    }
  }
  document.addEventListener("pointerup", function () { endSwipe(false); });
  document.addEventListener("pointercancel", function () { endSwipe(true); });

  // ---- Boot ----
  rolloverOverdue();
  if (needsMigrationSave) { needsMigrationSave = false; save(); }
  maybeShowRecap();
  render();
  if (syncCode) { pullSync(true); }
  setInterval(function () {
    var active = document.activeElement;
    var isTyping = active && (active.id === "taskInput" || active.id === "notesTextarea" || active.id === "subtaskInput" || active.id === "syncCodeInput");
    if (isTyping || swipe || celebrating) return; // don't yank the DOM out from under a gesture or a keystroke
    checkDayBoundary();
    render();
    if (syncCode && view === "plan") pullSync(true);
  }, 60000);

  // Coming back to the app after it has been backgrounded (phone in a pocket overnight)
  // is the most likely moment for the day to have turned.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") return;
    if (celebrating) return;
    checkDayBoundary();
    render();
    if (syncCode) pullSync(true);
  });
})();
</script>
</body>
</html>
